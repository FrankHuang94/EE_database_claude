# Glossary source. One entry per term; see tools/build_glossary.py for the schema.
# Keep definitions to one or two sentences; the chapter carries the full treatment.

# ---------------------------------------------------------------- 02-01
- term: Complex number
  definition: A number z = x + jy with real part x and imaginary part y (both real numbers), drawn as a point or arrow in the complex plane.
  chapter: "02-01"
  see_also: [Imaginary unit, Complex plane]
- term: Imaginary unit
  definition: The number j defined by j² = −1 (written i in mathematics; EE uses j because i denotes current). Multiplying by j rotates a complex number 90° counterclockwise.
  chapter: "02-01"
- term: Complex plane
  definition: The plane in which a complex number x + jy is plotted at horizontal coordinate x (real axis) and vertical coordinate y (imaginary axis).
  chapter: "02-01"
- term: Rectangular form
  definition: Writing a complex number by its components, z = x + jy. Convenient for addition and subtraction.
  chapter: "02-01"
  see_also: [Polar form]
- term: Polar form
  definition: Writing a complex number by its magnitude and angle, z = r∠θ = r(cos θ + j sin θ) = re^{jθ}. Convenient for multiplication, division, powers and roots.
  chapter: "02-01"
  see_also: [Rectangular form, Euler's formula]
- term: Magnitude
  definition: The length |z| = √(x² + y²) of a complex number's arrow (also called modulus or absolute value).
  chapter: "02-01"
- term: Angle (argument)
  definition: The direction ∠z of a complex number's arrow, measured counterclockwise from the positive real axis; computed with the quadrant-aware atan2(y, x). This curriculum reports principal values in (−180°, 180°].
  chapter: "02-01"
- term: Complex conjugate
  definition: For z = x + jy, the number z* = x − jy, its mirror image across the real axis. z z* = |z|², which is why conjugates are used to divide complex numbers.
  chapter: "02-01"
- term: De Moivre's theorem
  definition: (r∠θ)ⁿ = rⁿ∠nθ. Raising a complex number to a power raises its magnitude to that power and multiplies its angle.
  chapter: "02-01"
- term: Roots of unity
  definition: The N complex numbers e^{j2πk/N} (k = 0 … N−1) whose N-th power is 1, equally spaced on the unit circle. They are the twiddle factors of the FFT.
  chapter: "02-01"
- term: Euler's formula
  definition: e^{jθ} = cos θ + j sin θ for real θ. It connects exponentials and sinusoids and makes r∠θ and re^{jθ} the same number.
  chapter: "02-01"
- term: Complex exponential
  definition: A signal e^{st} with complex s = σ + jω. It rotates at ω rad/s while its magnitude grows (σ > 0), decays (σ < 0) or stays constant (σ = 0); its real part is a growing, decaying or steady sinusoid.
  chapter: "02-01"
- term: Sinusoid
  definition: A signal of the form A cos(ωt + φ), with amplitude A, angular frequency ω and phase φ. This curriculum always uses the cosine as the reference form.
  chapter: "02-01"
- term: Angular frequency
  definition: ω = 2πf, the rate of a sinusoid's phase advance in rad/s, where f is the frequency in hertz.
  chapter: "02-01"
- term: Phase
  definition: The angle φ in A cos(ωt + φ), fixing where in its cycle a sinusoid is at t = 0. A time delay t_d is a phase lag of ωt_d.
  chapter: "02-01"
- term: RMS value
  definition: Root-mean-square value, √(average of v²). For a sinusoid of amplitude V_m it is V_m/√2; it is the value that delivers the same average power to a resistor as a DC voltage of that size.
  chapter: "02-01"
- term: Phasor
  definition: The complex number V = V_m∠φ representing the sinusoid V_m cos(ωt + φ) at a known frequency ω, so that v(t) = Re{V e^{jωt}}. This curriculum uses peak-amplitude, cosine-reference phasors.
  chapter: "02-01"
  see_also: [Sinusoidal steady state, Impedance]
- term: Sinusoidal steady state
  definition: The response of a stable linear system to a sinusoidal input after transients have died out, a sinusoid at the input frequency whose amplitude and phase follow from phasor analysis.
  chapter: "02-01"
- term: Frequency response
  definition: The complex gain H(jω) of a linear system at angular frequency ω. Its magnitude scales a sinusoid's amplitude and its angle shifts the sinusoid's phase.
  chapter: "02-01"
  see_also: [Corner frequency]
- term: Corner frequency
  definition: For a single-pole response H = 1/(1 + jωτ), the frequency ω = 1/τ where |H| = 1/√2 (−3 dB) and the phase is −45°; commonly used to define bandwidth.
  chapter: "02-01"
- term: Impedance
  definition: The ratio Z = V/I of voltage phasor to current phasor for an element or network, in ohms. Resistor R, inductor jωL, capacitor 1/(jωC).
  chapter: "02-01"
  see_also: [Reactance, Phasor]
- term: Reactance
  definition: The imaginary part X of an impedance Z = R + jX, in ohms. Positive for inductors (ωL), negative for capacitors (−1/(ωC)).
  chapter: "02-01"
- term: Resonance
  definition: The condition in an LC-containing circuit where inductive and capacitive reactances cancel (ω₀ = 1/√(LC) in a series RLC), making the impedance purely resistive and the response peak.
  chapter: "02-01"
- term: I/Q (in-phase/quadrature)
  anchor: iq
  definition: Representation of a bandpass signal by two baseband components, in-phase (I) and quadrature (Q), which together form one complex sample stream I + jQ; the native signal format of modern radios.
  chapter: "02-01"
  see_also: [Error vector magnitude]
- term: Error vector magnitude
  definition: EVM, the RMS distance between transmitted (or received) constellation points and their ideal positions, relative to the signal, often quoted in dB. It sets the highest usable QAM order.
  chapter: "02-01"

# ---------------------------------------------------------------- 07-01
- term: Equivalent series resistance (ESR)
  definition: The resistance in series with a real capacitor's ideal capacitance (electrodes, terminations, dielectric loss); it dissipates ripple current as heat and sets the impedance at the self-resonant frequency.
  chapter: "07-01"
  see_also: [Equivalent series inductance (ESL), Self-resonant frequency]
- term: Equivalent series inductance (ESL)
  definition: The inductance in series with a real capacitor, set by its current loop through terminations and package; above the self-resonant frequency it dominates, so the part behaves as an inductor, and paralleling N parts divides it by N.
  chapter: "07-01"
  see_also: [Equivalent series resistance (ESR), Decoupling capacitor]
- term: DC-bias derating
  definition: The loss of capacitance of class II ceramic capacitors (X5R, X7R) under applied DC voltage, because their ferroelectric dielectric's permittivity falls with field; a part can deliver a fraction of its marked value at its working voltage.
  chapter: "07-01"
  see_also: [Multilayer ceramic capacitor (MLCC)]
- term: Saturation current
  definition: The current at which an inductor's core approaches saturation and its inductance has fallen by a stated percentage (set by the datasheet); beyond it the current rises much faster than v/L predicts.
  chapter: "07-01"
  see_also: [Saturation flux density]
- term: Decoupling capacitor
  definition: A capacitor placed close to a load to supply its fast current changes until the regulator responds, limiting the droop to ΔI·Δt/C and the spike to L·di/dt; its effectiveness at high frequency is limited by inductance more than by capacitance.
  chapter: "07-01"
  see_also: [Equivalent series inductance (ESL)]
- term: Volt-second balance
  definition: In a periodic steady state the average voltage across an inductor is zero (and the average current into a capacitor, charge balance), because its current (voltage) returns to the same value each period; the starting point for analyzing switching converters.
  chapter: "07-01"
  see_also: [Inductance]

# ---------------------------------------------------------------- 07-02
- term: Transient
  definition: The part of a circuit's response that dies out after a disturbance (such as a switching event), as the circuit moves from one steady state to another.
  chapter: "07-02"
  see_also: [Time constant]
- term: Natural response
  definition: The response of a circuit with no sources acting, driven only by the energy initially stored in its capacitors and inductors; for a first-order circuit, an exponential decay.
  chapter: "07-02"
- term: Step response
  definition: The response of a circuit to a source that switches from one constant value to another; for a first-order circuit, an exponential approach to the new final value.
  chapter: "07-02"
- term: Time constant
  definition: τ, the characteristic time of a first-order exponential response e^{−t/τ}; τ = R_Th·C for an RC circuit and τ = L/R_Th for an RL circuit. After one τ, 63.2 % of the change is complete.
  chapter: "07-02"
  see_also: [Thevenin resistance, Settling time]
- term: First-order circuit
  definition: A circuit whose behavior is described by a first-order differential equation, typically one with a single (equivalent) capacitor or inductor.
  chapter: "07-02"
- term: Continuity of capacitor voltage and inductor current
  definition: The rule that v_C and i_L cannot change instantaneously (it would take infinite current or voltage, and infinite power). Other circuit variables can jump at switching instants.
  chapter: "07-02"
- term: State variable
  definition: A variable that fully captures a circuit's stored energy and memory, namely capacitor voltages and inductor currents. Knowing them at one instant (plus the inputs) determines the future response.
  chapter: "07-02"
- term: Thevenin resistance
  definition: R_Th, the resistance seen looking into two terminals of a linear circuit with its independent sources turned off; it sets the time constant seen by a capacitor or inductor connected there.
  chapter: "07-02"
- term: Rise time
  definition: The time a response takes to go from 10 % to 90 % of its total change; τ·ln 9 ≈ 2.2τ for a single pole, so t_r ≈ 0.35/f_3dB.
  chapter: "07-02"
- term: Settling time
  definition: The time a response takes to come and stay within a specified error band of its final value; τ·ln(1/ε) for a first-order system, and (N+1)·ln 2 · τ to reach ½ LSB of an N-bit converter.
  chapter: "07-02"
- term: Propagation delay
  definition: The time from an input transition to the output crossing 50 % of its swing; for an RC model, τ·ln 2 ≈ 0.69τ. In digital timing, t_pd is the longest such delay from any input change until the output is final, and the delays along a path add (08-04).
  chapter: "07-02"
  see_also: [Contamination delay, Critical path]
- term: Dynamic power
  definition: Power consumed by charging and discharging capacitances in switching circuits, P = αCV²f, independent of the resistance of the charging path.
  chapter: "07-02"
  see_also: [Activity factor]
- term: Activity factor
  definition: α, the fraction of clock cycles in which a node makes a 0→1 transition; it scales the dynamic power αCV²f.
  chapter: "07-02"
- term: Adiabatic charging
  definition: Charging a capacitor with a slowly ramped or stepped source so that the voltage across the series resistance stays small, reducing the loss below ½CV² (to CV²/2N for N equal steps).
  chapter: "07-02"
- term: Inductive kick
  definition: The large voltage an inductor develops (v = L di/dt) when its current is interrupted abruptly; it can arc switch contacts or break down transistors unless a flyback path is provided.
  chapter: "07-02"
  see_also: [Flyback diode]
- term: Flyback diode
  definition: A diode placed across an inductive load so that, when the driving switch opens, the inductor's current circulates through the diode, clamping the switch voltage to about one diode drop above the supply. Also called a freewheeling diode.
  chapter: "07-02"
- term: Integrating factor
  definition: A multiplier (e^{t/τ} for τ x' + x = u) that turns the left side of a first-order linear ODE into an exact derivative, giving the general solution as an integral of the input.
  chapter: "07-02"
- term: Convolution
  definition: The operation y(t) = ∫ h(t−λ) u(λ) dλ that gives a linear time-invariant system's output from its input and impulse response; for a first-order low-pass, an exponentially weighted average of past inputs.
  chapter: "07-02"
- term: Dither
  definition: A small random signal added before a quantizer so that the quantization error stops tracking the signal. Triangular-PDF dither two steps wide makes the mean and power of the total error independent of the input, at the cost of tripling the error power.
  chapter: "03-04"
- term: Integrator (op-amp)
  definition: An op-amp circuit with a capacitor in the feedback path and a resistor at the input, giving v_out = −(1/RC)∫v_in dt; a resistor across the capacitor makes it a "leaky" integrator (a first-order low-pass).
  chapter: "07-02"
- term: Average (real) power
  definition: P = (V_m I_m/2) cos θ = V_rms I_rms cos θ (watts), the time average of p = vi for sinusoids; only resistance absorbs it, and it is the real part of complex power.
  chapter: "07-06"
- term: Complex power
  definition: S = V_rms I_rms* = ½ V I* = P + jQ (VA), whose real part is average power, imaginary part reactive power and magnitude apparent power; complex powers of all elements of a circuit sum to zero.
  chapter: "07-06"
  see_also: [Reactive power, Apparent power]
- term: Reactive power
  definition: Q = V_rms I_rms sin θ (var), the amplitude of the energy exchanged back and forth between source and reactive elements at twice the line frequency; positive for inductive loads, negative for capacitive.
  chapter: "07-06"
- term: Power-factor correction
  definition: Raising a load's power factor, by parallel capacitors that supply the lagging reactive current locally (C = P(tan θ₁ − tan θ₂)/(ωV_rms²)), or, for distorted currents, by an active converter stage that draws sinusoidal current.
  chapter: "07-06"
  see_also: [Power factor]
- term: Conjugate matching
  definition: Choosing a load impedance equal to the complex conjugate of the source's Thévenin impedance, which maximizes average power to the load (P_max = V_Th,rms²/(4R_Th)) at 50% efficiency.
  chapter: "07-06"
- term: Neper
  definition: The natural-logarithm unit of a logarithmic ratio, ln(F2/F1) Np for amplitudes and ½ ln(P2/P1) Np for powers; 1 Np = 20/ln 10 = 8.686 dB. Bode wrote his gain–phase relations in nepers and radians.
  chapter: "07-07"
  see_also: [Decibel]
- term: Bode plot
  definition: A pair of plots of a frequency response, magnitude in dB and phase in degrees, against frequency on a logarithmic axis; each real pole or zero contributes a straight-line asymptote of ∓20 dB/decade from its corner, so responses can be sketched by adding factors.
  chapter: "07-07"
  see_also: [Corner frequency, Asymptote, Frequency response]
- term: Group delay
  definition: τg = −d∠H/dω, the delay of the envelope of a narrowband signal passing through a system; constant group delay means a pulse keeps its shape. For a single pole it equals the time constant at low frequency.
  chapter: "07-07"
- term: Minimum-phase system
  definition: A stable system with no zeros in the right half-plane and no pure delay; its phase is fixed by its magnitude curve (Bode's gain–phase relation), so a steady slope of n × 20 dB/decade implies a phase near n × 90°.
  chapter: "07-07"
  see_also: [Right-half-plane zero, Bode plot]
- term: Gain–bandwidth product (GBW)
  definition: For a dominant-pole amplifier, the product of DC gain and bandwidth, A0·fa, equal to the unity-gain frequency; with feedback, closed-loop bandwidth ≈ GBW divided by the noise gain 1/β. Datasheets quote it as a typical value, sometimes at a stated gain.
  chapter: "07-07"
  see_also: [Loop gain]
- term: Phase margin
  definition: 180° plus the phase of the loop gain at the crossover frequency, where its magnitude is 1; the distance from oscillation. For a two-pole loop, 65.5° gives a maximally flat closed loop and about 52° a 1.25 dB peak with 16% overshoot.
  chapter: "07-07"
  see_also: [Loop gain, Bode plot]
- term: Loaded Q
  definition: The quality factor of a resonator as used, including the source and load resistances in parallel (or series) with its own losses; always below the unloaded Q, so the bandwidth f0/Q_L is wider than the resonator alone gives.
  chapter: "07-08"
  see_also: [Quality factor, Insertion loss]
- term: Insertion loss
  definition: The reduction in delivered signal caused by inserting a component (a filter) into a matched path, in dB; for one resonator between equal terminations it is −20 lg(1 − Q_L/Q_u), so low loss needs an unloaded Q far above the loaded Q the bandwidth demands.
  chapter: "07-08"
  see_also: [Loaded Q]
- term: Biquad
  definition: A second-order filter section with transfer-function denominator s² + (ω0/Q)s + ω0²; low-pass, high-pass, band-pass, notch and all-pass sections differ only in the numerator, and higher-order filters are cascades of biquads (plus a first-order section for odd order).
  chapter: "07-08"
- term: Sallen–Key filter
  definition: An active second-order section (Sallen and Key, 1955) with two resistors, two capacitors and a non-inverting amplifier of gain K; ω0 = 1/√(R1R2C1C2). At unity gain with equal resistors Q = ½√(C1/C2); with equal components Q = 1/(3 − K).
  chapter: "07-08"
  see_also: [Biquad]
- term: Notch filter
  definition: A band-stop filter whose response falls to zero at one frequency, from numerator zeros on the imaginary axis (s² + ω0²); used to remove a single interfering tone such as mains hum.
  chapter: "07-08"
- term: Impedance and frequency scaling
  definition: Turning a normalized filter prototype (1 Ω, 1 rad/s) into a design without changing its response shape; impedance scaling by k multiplies R and L by k and divides C by k, frequency scaling by k_f divides L and C by k_f.
  chapter: "07-08"
- term: Multiple-feedback (MFB) filter
  definition: An active filter section built around an op-amp as an inverting integrator, with feedback through both a resistor and a capacitor into a virtual ground; it inverts, has low sensitivity and avoids the Sallen–Key's high-frequency leakage.
  chapter: "07-08"
  see_also: [Sallen–Key filter]
- term: Dot convention
  definition: Schematic marks on one terminal of each coupled coil; a current entering one coil's dot induces a voltage positive at the other coil's dot, so the mutual term is +M di/dt when both currents enter (or leave) their dots and −M di/dt otherwise.
  chapter: "07-09"
  see_also: [Mutual inductance]
- term: Reflected impedance
  definition: The impedance a secondary circuit presents at the primary of coupled coils, (ωM)²/Z22 with Z22 the secondary loop impedance; its resistance is positive and its reactance has the opposite sign to Z22's. Through an ideal transformer a load reflects as (N1/N2)² Z_L.
  chapter: "07-09"
- term: Ideal transformer
  definition: A lossless, perfectly coupled transformer with infinite magnetizing inductance; V2/V1 = N2/N1, I2/I1 = N1/N2, complex power passes unchanged and impedances scale by the square of the turns ratio. It does not pass DC.
  chapter: "07-09"
  see_also: [Turns ratio, Reflected impedance]
- term: Turns ratio
  definition: N1:N2, the ratio of primary to secondary turns of a transformer; it sets the voltage ratio (directly), the current ratio (inversely) and the impedance ratio (squared).
  chapter: "07-09"
- term: Leakage inductance
  definition: The part of a winding's inductance whose flux does not link the other winding (k < 1); it appears in series in a transformer's equivalent circuit and causes load-dependent voltage drop.
  chapter: "07-09"
  see_also: [Coupling coefficient]
- term: Magnetizing inductance
  definition: The finite inductance of a transformer's core, appearing as a shunt branch in its equivalent circuit; it draws the magnetizing current needed to set up the flux even with no load.
  chapter: "07-09"
- term: Core loss
  definition: Power lost in a magnetic core to hysteresis and eddy currents, roughly constant at fixed voltage and frequency; it is the no-load loss of a transformer, measured by the open-circuit test, and rises with frequency.
  chapter: "07-09"
- term: Voltage regulation
  definition: The fractional change in a transformer's (or supply's) output voltage from no load to full load, about I(R_eq cos θ + X_eq sin θ)/V_rated for a lagging load.
  chapter: "07-09"
- term: Two-port network
  definition: A linear network with two terminal pairs (ports), each carrying equal and opposite currents, described by a 2 × 2 matrix relating its port voltages and currents at each frequency (z, y, h, ABCD or S parameters).
  chapter: "07-10"
- term: z-parameters
  definition: Open-circuit impedance parameters, V = z I; z11 and z22 are input and output impedances with the other port open, z12 and z21 transfer impedances. A reciprocal network has z12 = z21 and a T equivalent.
  chapter: "07-10"
  see_also: [Two-port network]
- term: y-parameters
  definition: Short-circuit admittance parameters, I = y V, the inverse of the z matrix; natural for transistors (y21 ≈ gm) and for parallel connections, where they add.
  chapter: "07-10"
  see_also: [Two-port network]
- term: h-parameters
  definition: Hybrid parameters with I1 and V2 as inputs; h11 input impedance (output shorted), h12 reverse voltage ratio, h21 forward current gain (β for a bipolar transistor, hfe), h22 output admittance (input open).
  chapter: "07-10"
  see_also: [Two-port network]
- term: ABCD parameters
  definition: Transmission parameters, V1 = A V2 − B I2 and I1 = C V2 − D I2, chosen so that cascaded two-ports multiply; a series impedance is [[1, Z], [0, 1]], a shunt admittance [[1, 0], [Y, 1]], and AD − BC = 1 for a reciprocal network.
  chapter: "07-10"
  see_also: [Two-port network]
- term: S-parameters
  definition: Scattering parameters relating reflected to incident waves at ports terminated in a reference impedance (usually 50 Ω); S11 is the input reflection coefficient and S21 the forward transmission. Reciprocal networks have S12 = S21; lossless ones conserve power.
  chapter: "07-10"
  see_also: [Reflection coefficient, Insertion loss, Return loss]
- term: Return loss
  definition: −20 lg|S11| (or |Γ|), in positive dB, the ratio of incident to reflected power at a port; 20 dB means 1% of the power is reflected.
  chapter: "07-10"
  see_also: [S-parameters, Reflection coefficient]
- term: Mismatch loss
  definition: −10 lg(1 − |Γ|²), the dB shortfall between the power a mismatched load receives and the source's available power.
  chapter: "07-10"
  see_also: [Return loss, Reflection coefficient]
- term: Voltage standing-wave ratio (VSWR)
  definition: (1 + |Γ|)/(1 − |Γ|), the ratio of the largest to the smallest voltage amplitude along a line feeding a mismatched load; for a resistive load it equals the ratio of the larger to the smaller resistance.
  chapter: "07-10"
  see_also: [Return loss, Mismatch loss]
- term: L-section match
  definition: A lossless two-element network (a series reactance next to the lower resistance and a shunt reactance across the higher) that transforms one resistance into another at one frequency; its Q is √(R_high/R_low − 1).
  chapter: "07-10"
  see_also: [Mismatch loss]
- term: Three-phase system
  definition: AC power as three sinusoidal voltages of equal amplitude 120° apart; a balanced three-phase load draws constant instantaneous power, needs 75% of the copper of single phase for the same power and loss, and produces rotating fields for motors.
  chapter: "07-11"
- term: Phase sequence
  definition: The order in which the three phase voltages reach their peaks; positive (abc) sequence has phase b lagging a by 120° and c lagging b by 120°. Reversing it reverses a three-phase motor.
  chapter: "07-11"
- term: Line and phase quantities
  definition: Line voltages are between lines and line currents flow in them; phase quantities belong to each source or load element. In Y, V_L = √3 V_p (leading by 30°) and I_L = I_p; in Δ, V_L = V_p and I_L = √3 I_p.
  chapter: "07-11"
- term: Wye (Y) connection
  definition: Three-phase sources or loads joined at a common star (neutral) point, each element between a line and the neutral; allows a four-wire system serving single-phase loads.
  chapter: "07-11"
- term: Delta connection
  definition: Three-phase sources or loads connected end to end in a loop, each element between two lines; no neutral. A balanced Δ of Z_Δ is equivalent to a Y of Z_Δ/3.
  chapter: "07-11"
- term: Per-phase equivalent
  definition: The single-phase circuit (one source phase voltage, one line impedance, one Y-equivalent load impedance) that represents a balanced three-phase system; the other phases follow by ∓120° shifts.
  chapter: "07-11"
- term: Neutral current
  definition: The phasor sum of the three line currents in a four-wire system; zero for balanced loads without triplen harmonics, nonzero for unbalanced loads.
  chapter: "07-11"
- term: Triplen harmonics
  definition: Harmonics of order 3, 6, 9, …; in a three-phase system they are in phase in all three lines, so they add in the neutral (three times the per-phase value) instead of cancelling.
  chapter: "07-11"
  see_also: [Neutral current, Total harmonic distortion (THD)]
- term: Two-wattmeter method
  definition: Measuring the total power of any three-wire system with two wattmeters whose current coils are in two lines and whose voltage coils return to the third; for a balanced load the readings also give Q = √3 (W2 − W1).
  chapter: "07-11"
- term: Admittance
  definition: Y = 1/Z = G + jB (siemens), the ratio of current phasor to voltage phasor; admittances in parallel add. Its real part, the conductance G = R/(R² + X²), is not 1/R unless the reactance is zero.
  chapter: "07-05"
  see_also: [Impedance, Susceptance]
- term: Susceptance
  definition: B, the imaginary part of an admittance (siemens); positive for a capacitor (ωC), negative for an inductor (−1/(ωL)).
  chapter: "07-05"
- term: Dissipation factor
  definition: D = tan δ = R/|X| = 1/Q, the ratio of a component's loss to its reactance at a stated frequency; for a capacitor with series resistance, D = ωC·ESR. Capacitor datasheets quote it at a test frequency such as 120 Hz or 1 kHz.
  chapter: "07-05"
- term: Series–parallel equivalent
  definition: The pair of two-element models (R_s + jX_s in series, or R_p ∥ jX_p) that have the same impedance at one frequency; R_p = R_s(1 + Q²) and X_p = X_s(1 + 1/Q²). LCR meters report capacitance and inductance in either model, and the two differ by the factor 1 + D².
  chapter: "07-05"
- term: Phasor diagram
  definition: A drawing of a circuit's voltage and current phasors as arrows in the complex plane; KVL makes the voltage arrows around a loop close into a polygon.
  chapter: "07-05"
- term: AC bridge
  definition: A four-arm bridge driven by a sinusoid whose detector nulls when Z₁Z₄ = Z₂Z₃; being one complex equation, balance gives two real conditions, such as an unknown inductance and its resistance (Maxwell bridge).
  chapter: "07-05"
- term: All-pass filter
  definition: A circuit with |H(jω)| = 1 at all frequencies but a frequency-dependent phase, such as (1 − jωRC)/(1 + jωRC) with phase −2 arctan(ωRC); it changes a waveform's shape without changing its amplitude spectrum.
  chapter: "07-05"
- term: AC analysis (SPICE)
  definition: A simulator analysis that linearizes the circuit at its DC operating point and solves its complex nodal equations at each frequency of a sweep, giving phasors; it ignores nonlinearity, clipping and transients.
  chapter: "07-05"
- term: LCR meter
  definition: An instrument that measures a component's complex impedance at a chosen test frequency and level and reports it through a two-element series or parallel model (Cs–Rs, Cp–Rp, Ls–Rs, Lp–Rp, D, Q).
  chapter: "07-05"
- term: Initial-condition source
  definition: In the s-domain model of a capacitor or inductor, the source that carries the stored energy into the analysis; L·i(0⁻) in series with sL (or i(0⁻)/s in parallel with 1/sL), and v(0⁻)/s in series with 1/sC (or C·v(0⁻) in parallel with sC). In time it is an impulse of flux linkage or charge.
  chapter: "07-04"
- term: Driving-point impedance
  definition: The ratio V(s)/I(s) at a single port of a network, with input and output at the same pair of terminals; its poles and zeros are the network's natural frequencies with that port open and shorted.
  chapter: "07-04"
  see_also: [Transfer function]
- term: Right-half-plane zero
  definition: A transfer-function zero with positive real part, typically from two signal paths of opposite sign (such as a Miller capacitor feeding the input forward around an inverting stage); it makes a step response start in the wrong direction and costs phase in a feedback loop.
  chapter: "07-04"
  see_also: [Poles and zeros]
- term: ESR zero
  definition: The zero at s = −1/(R_ESR·C) created by a capacitor's equivalent series resistance; above f = 1/(2π·R_ESR·C) the capacitor looks resistive. Some older linear regulators relied on it for stability, which ties their stability to a window of ESR.
  chapter: "07-04"
- term: Zero-state response
  definition: The part of a linear circuit's response caused by its inputs alone, with all initial conditions zero; in the s-domain H(s)X(s).
  chapter: "07-04"
  see_also: [Zero-input response]
- term: Zero-input response
  definition: The part of a linear circuit's response caused by its initial stored energy alone, with all inputs zero; it contains only the circuit's natural modes.
  chapter: "07-04"
- term: Stability (of a circuit)
  definition: The property that every bounded input gives a bounded output; for a linear circuit, every pole of its transfer functions lies in the open left half-plane. Passive RLC circuits cannot be unstable; circuits with gain can.
  chapter: "07-04"
- term: Positive-real function
  definition: A function Z(s) that is real for real s and has Re Z ≥ 0 whenever Re s ≥ 0; exactly the driving-point impedances realizable from passive R, L, C (and transformers), as shown by Brune (1931).
  chapter: "07-04"
- term: Wien-bridge oscillator
  definition: An oscillator in which a series RC and a parallel RC divide an amplifier's output and feed it back; its poles are s² + (3 − K)ω₀s + ω₀² = 0, so it oscillates at ω₀ = 1/RC when the gain K reaches 3.
  chapter: "07-04"
- term: Second-order circuit
  definition: A circuit whose behavior is described by a second-order differential equation, typically one with two independent storage elements (a capacitor and an inductor, or two capacitors that cannot be combined); its natural response has two characteristic roots.
  chapter: "07-03"
- term: State equations
  definition: A circuit's first-order differential equations written for its state variables (capacitor voltages and inductor currents), ẋ = Ax + g·u; the eigenvalues of the state matrix A are the circuit's natural frequencies.
  chapter: "07-03"
  see_also: [State variable]
- term: Ringing
  definition: A decaying oscillation after a switching edge, caused by energy sloshing between an inductance and a capacitance; its frequency is about 1/(2π√(LC)) and its decay is set by how resistance compares with √(L/C).
  chapter: "07-03"
- term: Snubber
  definition: A network, usually a resistor in series with a capacitor, placed across a ringing switch or tank to damp it; the rule of thumb is R ≈ √(L/C) of the parasitic tank and C several times its capacitance, at a cost of C·V²·f_sw in power.
  chapter: "07-03"
- term: Hot-plug overshoot
  definition: The voltage spike, up to nearly twice the supply, when a supply is connected through cable inductance to low-loss (ceramic) input capacitors that form a lightly damped series RLC; cured with a lossy bulk capacitor or other damping.
  chapter: "07-03"
- term: Differentiator (op-amp)
  definition: An op-amp circuit with a capacitor at the input and a resistor in the feedback path, giving v_out = −RC dv_in/dt; a resistor in series with the capacitor caps its gain for fast changes, turning a step's impulse into a finite exponential spike.
  chapter: "07-02"
- term: Sample-and-hold
  definition: A circuit that connects a capacitor to a signal through a switch (sample), then disconnects it to hold the voltage while it is converted; its settling and kT/C noise limit ADC accuracy.
  chapter: "07-02"
- term: Least significant bit (LSB)
  definition: The smallest step an N-bit converter resolves, full scale / 2^N; errors and noise are often expressed in LSBs.
  chapter: "07-02"
- term: kT/C noise
  anchor: ktc-noise
  definition: The thermal noise sampled onto a capacitor through any resistance, with RMS value √(kT/C), about 64 µV for 1 pF at 300 K; independent of the resistance.
  chapter: "07-02"
- term: Repeater
  definition: A buffer inserted along a long on-chip wire to break it into shorter segments, converting delay that grows with the square of length into delay that grows linearly.
  chapter: "07-02"

# ---------------------------------------------------------------- 00-02
- term: Abstraction
  definition: A simplified description of a system level that exposes a contract (inputs, outputs, assumptions) and hides internal detail, so that the level above can be designed without the detail.
  chapter: "00-02"
- term: Lumped-matter discipline
  definition: The conditions under which fields can be replaced by voltages and currents in lumped elements obeying KVL and KCL, chiefly that the circuit is small compared with the signal wavelength (or line delay is short compared with edge time).
  chapter: "00-02"
  see_also: [Transmission line, Wavelength]
- term: Wavelength
  definition: The distance λ = v/f a wave travels in one period, where v is the propagation speed and f the frequency.
  chapter: "00-02"
- term: Transmission line
  definition: A pair of conductors along which signals travel as waves with finite speed, so that voltage and current vary with position and reflections occur at impedance changes.
  chapter: "00-02"
  see_also: [Characteristic impedance, Reflection coefficient]
- term: Characteristic impedance
  definition: Z0, the ratio of voltage to current for a single wave traveling along a transmission line (typically 50 Ω for coaxial cable and RF systems). For a lumped LC tank the analogous quantity is √(L/C), which sets the voltage swing per ampere of current step and the damping needed.
  chapter: "00-02"
- term: Reflection coefficient
  definition: Γ = (R − Z0)/(R + Z0), the ratio of reflected to incident wave voltage at a termination R on a line of characteristic impedance Z0; +1 for an open, −1 for a short, 0 for a matched load.
  chapter: "00-02"
- term: Static discipline
  definition: The rule defining valid digital levels with separate output (V_OL, V_OH) and input (V_IL, V_IH) thresholds, so that every gate restores clean levels and leaves noise margins.
  chapter: "00-02"
  see_also: [Noise margin]
- term: Noise margin
  definition: The amount of noise a digital connection can tolerate, NM_L = V_IL − V_OL and NM_H = V_OH − V_IH.
  chapter: "00-02"
- term: Regeneration
  definition: Restoring a signal to clean logic levels at each stage, so that noise does not accumulate along a chain; the key advantage of digital over analog processing.
  chapter: "00-02"
- term: Q-function
  definition: Q(x), the probability that a standard normal random variable exceeds x; it gives error probabilities for decisions in Gaussian noise and falls off extremely fast (Q(6) ≈ 1e-9).
  chapter: "00-02"
- term: Level shifter
  definition: A circuit that translates logic levels between two voltage domains so that families with incompatible thresholds can communicate.
  chapter: "00-02"
- term: Instruction-set architecture (ISA)
  definition: The contract between hardware and software, namely the instructions, registers, memory model and exceptions a program can rely on, independent of how a processor implements them.
  chapter: "00-02"
- term: Process design kit (PDK)
  definition: The files a foundry gives designers to use its process, including device models, design rules, layer definitions and often standard-cell libraries, abstracting the fab's recipes.
  chapter: "00-02"
- term: Reticle limit
  definition: The largest area one lithography exposure can print, 26 mm × 33 mm ≈ 858 mm² on standard scanners (half that with High-NA EUV); it caps the size of a single die without stitching.
  chapter: "00-02"
  see_also: [Chiplet]
- term: Chiplet
  definition: A die designed to be combined with other dies inside one package, so that a system can exceed the reticle limit or mix processes; chiplets communicate over die-to-die links.
  chapter: "00-02"
- term: Side channel
  definition: An unintended leak of information through physical behavior such as timing, power consumption or electromagnetic emission, which can reveal secrets that the logical abstraction hides.
  chapter: "00-02"

# ---------------------------------------------------------------- 00-04
- term: SPICE
  definition: Simulation Program with Integrated Circuit Emphasis, the standard family of circuit simulators that solve a netlist's nodal equations for DC, AC and transient behavior; ngspice is an open-source version.
  chapter: "00-04"
  see_also: [Netlist, Modified nodal analysis]
- term: Netlist
  definition: A text description of a circuit listing each element, its value and the nodes it connects; the input to a circuit simulator (node 0 is ground).
  chapter: "00-04"
- term: Operating point
  definition: The DC voltages and currents of a circuit with its sources at their DC values (capacitors open, inductors shorted); also called the bias point.
  chapter: "00-04"
- term: AC analysis
  definition: A simulation of a circuit's small-signal sinusoidal response versus frequency, computed with phasors after linearizing around the operating point.
  chapter: "00-04"
- term: Transient analysis
  definition: A simulation of a circuit's voltages and currents versus time for arbitrary input waveforms, computed step by step with numerical integration.
  chapter: "00-04"
- term: Modified nodal analysis
  definition: The formulation SPICE uses, namely KCL at every node plus extra equations for voltage sources, giving a linear system G·v = i (re-linearized each iteration for nonlinear devices).
  chapter: "00-04"
- term: Newton–Raphson method
  definition: An iterative root-finding method, x_{k+1} = x_k − g(x_k)/g′(x_k), that circuit simulators use to solve nonlinear equations; it converges quadratically near a solution but can overshoot far from it.
  chapter: "00-04"
- term: Hardware description language (HDL)
  definition: A language such as Verilog, SystemVerilog or VHDL for describing digital hardware structure and behavior, used for simulation and synthesis.
  chapter: "00-04"
- term: Testbench
  definition: Simulation-only code that instantiates a design, applies inputs and checks outputs; the executable form of a design's specification.
  chapter: "00-04"
  see_also: [Self-checking testbench]
- term: Self-checking testbench
  definition: A testbench that compares the design's outputs with independently computed expected values and reports pass or fail automatically, rather than relying on a human reading waveforms.
  chapter: "00-04"
- term: Functional coverage
  definition: A measure of which specified behaviors, input combinations or corner cases a verification run has actually exercised; used to decide when verification is complete.
  chapter: "00-04"
- term: Formal verification
  definition: Using mathematical proof (model checking, equivalence checking) to show that a design satisfies a property for all possible inputs, instead of testing examples.
  chapter: "00-04"
- term: Machine epsilon
  definition: The gap between 1 and the next representable floating-point number, 2^−52 ≈ 2.22×10^−16 for IEEE 754 double precision; the relative precision of a computation.
  chapter: "00-04"
- term: Catastrophic cancellation
  definition: The loss of significant digits when subtracting two nearly equal floating-point numbers; avoided by algebraic rearrangement or series expansion.
  chapter: "00-04"
- term: Electronic design automation (EDA)
  definition: The software used to design and verify chips and boards, covering simulation, synthesis, place-and-route, timing and verification; dominated commercially by Synopsys, Cadence and Siemens EDA.
  chapter: "00-04"

# ---------------------------------------------------------------- 00-03
- term: Retrieval practice
  definition: Learning by actively recalling information (self-testing, solving problems) rather than re-reading it; the "testing effect" is among the most robust findings in learning science.
  chapter: "00-03"
- term: Spacing effect
  definition: The finding that practice distributed over time produces more durable learning than the same practice massed together; the best gap grows with how long the material must be retained.
  chapter: "00-03"
  see_also: [Spaced repetition]
- term: Interleaving
  definition: Mixing different problem types within a practice session, which forces choosing the method and improves later performance even though it feels harder during practice.
  chapter: "00-03"
- term: Illusion of competence
  definition: The mistaken feeling of mastery produced by recognizing familiar material (for example, while re-reading a solution), as opposed to being able to recall and apply it unaided.
  chapter: "00-03"
- term: Spaced repetition
  definition: A review method, often implemented in flashcard software such as Anki, that schedules each item at expanding intervals just before it would be forgotten.
  chapter: "00-03"
- term: Dimensional analysis
  definition: Checking that every term of an equation has the same physical units (and that arguments of exp, log and trig functions are dimensionless) to catch errors and derive relationships.
  chapter: "00-03"
- term: SI base units
  definition: The seven base units of the International System of Units (kg, m, s, A, K, mol, cd), from which all others, including V, Ω, F and H, are derived.
  chapter: "00-03"
- term: Fermi estimate
  definition: An order-of-magnitude estimate built from rounded assumptions and simple multiplication, used to sanity-check calculations and claims.
  chapter: "00-03"
- term: Error log
  definition: A running record of every mistake, its cause and the rule that prevents it, used to target review and to avoid repeating errors.
  chapter: "00-03"

# ---------------------------------------------------------------- 00-01
- term: Electrical engineering
  definition: The discipline of using electricity and electromagnetism to move and convert energy and to sense, move, store and process information.
  chapter: "00-01"
- term: Energy per bit
  definition: The energy (typically pJ/bit) consumed to move, store or process one bit; power = energy per bit × data rate. A key efficiency metric for links, memories and accelerators.
  chapter: "00-01"
- term: Watt-hour
  definition: A unit of energy equal to one watt for one hour, 3600 J; battery energy in Wh = capacity in Ah × voltage.
  chapter: "00-01"
- term: Performance, power, area (PPA)
  definition: The three primary metrics traded off in chip design, almost always considered together with cost and schedule.
  chapter: "00-01"
- term: Landauer limit
  definition: The minimum energy to erase one bit of information, kT ln 2 (about 2.9×10^−21 J at 300 K); practical logic uses orders of magnitude more.
  chapter: "00-01"
- term: Shannon capacity
  definition: The maximum error-free data rate of a channel with bandwidth B and signal-to-noise ratio SNR, C = B log2(1 + SNR).
  chapter: "00-01"
- term: Decibel
  definition: A logarithmic ratio, 10·log10 of a power ratio (or 20·log10 of an amplitude ratio for equal impedances); 3 dB ≈ 2× power, 10 dB = 10× power.
  chapter: "00-01"
- term: Fabless
  definition: A chip company that designs chips but outsources manufacturing to foundries (and assembly and test to OSATs).
  chapter: "00-01"
  see_also: [Foundry]
- term: Foundry
  definition: A company that manufactures chips designed by its customers, supplying them with a process and its PDK.
  chapter: "00-01"
- term: Integrated device manufacturer (IDM)
  definition: A chip company that both designs and manufactures its own chips in its own fabs.
  chapter: "00-01"
- term: OSAT
  definition: Outsourced semiconductor assembly and test, a company that packages and tests chips for others.
  chapter: "00-01"
- term: Total addressable market (TAM)
  definition: The total revenue opportunity for a product if it won every possible customer; credible only when rebuilt bottom-up from units, attach rates and prices.
  chapter: "00-01"

# ---------------------------------------------------------------- 00-05
- term: Tapeout
  definition: The milestone at which a chip's final design database is sent to manufacturing to make masks; after it, design changes require new masks and another fab cycle.
  chapter: "00-05"
  see_also: [Respin]
- term: RTL
  definition: Register-transfer level, the description of digital logic in an HDL (Verilog/SystemVerilog) as registers and the logic between them, from which synthesis produces gates.
  chapter: "00-05"
- term: Design verification
  definition: The engineering function (and activity) of demonstrating, before tapeout, that a design's RTL implements its specification, using simulation, coverage, formal methods and emulation.
  chapter: "00-05"
- term: Physical design
  definition: Converting synthesized logic into a manufacturable layout (floorplanning, placement, clock-tree synthesis, routing) and closing timing, power and design-rule signoff.
  chapter: "00-05"
- term: Design for test (DFT)
  definition: Design features (scan chains, built-in self-test, test access) that make manufactured chips testable for defects at low cost.
  chapter: "00-05"
- term: Stepping
  definition: A silicon revision of a chip (e.g., A0, A1, B0); commonly the number changes for metal-only revisions and the letter for full-layer revisions, though conventions vary.
  chapter: "00-05"
- term: Respin
  definition: A new manufacturing pass of a chip with corrected masks after a bug or shortfall is found in silicon, either metal-only or full-layer.
  chapter: "00-05"
- term: Engineering change order (ECO)
  definition: A late design change made with minimal disruption, often by rewiring spare gates through metal-layer changes only.
  chapter: "00-05"
- term: First-silicon success
  definition: A chip's first manufactured version (A0) being functionally correct and shippable without a respin; reported for a minority of IC/ASIC projects in industry surveys.
  chapter: "00-05"
- term: Wafer cycle time
  definition: The time a wafer spends in the fab from start to finish, roughly 1–1.5 days per mask layer and 14–20 weeks for advanced processes.
  chapter: "00-05"
- term: Non-recurring engineering (NRE)
  definition: One-time costs of developing a product (design labor, EDA tools, IP licenses, masks, prototypes), as opposed to per-unit manufacturing cost.
  chapter: "00-05"
- term: Emulation
  definition: Running a chip design on specialized hardware (emulators or FPGA prototypes) thousands to millions of times faster than simulation, so software can run before tapeout.
  chapter: "00-05"
- term: Triangular distribution
  definition: A probability distribution defined by a minimum, most-likely and maximum value, with mean (a + m + b)/3; a simple model of skewed task-duration risk.
  chapter: "00-05"

# ---------------------------------------------------------------- 01-01
- term: Function
  definition: A rule that assigns exactly one output to each allowed input; in engineering both input and output usually carry units (for example voltage as a function of time).
  chapter: "01-01"
  see_also: [Domain and range, Inverse function]
- term: Domain and range
  definition: The domain is the set of allowed inputs of a function; the range is the set of outputs it can produce.
  chapter: "01-01"
- term: Inverse function
  definition: The function that undoes a one-to-one function, so that f⁻¹(f(x)) = x; for example ln undoes exp. Solving an equation for a variable applies an inverse.
  chapter: "01-01"
- term: Power law
  definition: A relation y = kxⁿ; doubling x multiplies y by 2ⁿ, and on log-log axes it is a straight line with slope n.
  chapter: "01-01"
  see_also: [Log-log plot]
- term: Exponential function
  definition: The function eˣ (e ≈ 2.71828), whose rate of change equals its value; physical decays are written y₀e^(−t/τ) with time constant τ.
  chapter: "01-01"
  see_also: [Natural logarithm, Half-life]
- term: Natural logarithm
  definition: ln y, the inverse of eˣ, defined for y > 0; it turns products into sums, ln(ab) = ln a + ln b.
  chapter: "01-01"
- term: Half-life
  definition: The time for an exponentially decaying quantity to halve, τ ln 2 ≈ 0.693τ; for growth the same expression is the doubling time.
  chapter: "01-01"
- term: dBm
  definition: Power expressed in decibels relative to 1 mW, 10·log10(P / 1 mW); 0 dBm = 1 mW and 30 dBm = 1 W.
  chapter: "01-01"
  see_also: [Decibel]
- term: Radian
  definition: The angle that subtends an arc equal to the radius; 2π rad = 360° and 1 rad ≈ 57.30°. Calculus formulas for sin and cos hold only in radians.
  chapter: "01-01"
- term: Semilog plot
  definition: A graph with one logarithmic axis (usually the vertical); an exponential function plots as a straight line on it.
  chapter: "01-01"
- term: Log-log plot
  definition: A graph with both axes logarithmic; a power law y = kxⁿ plots as a straight line of slope n.
  chapter: "01-01"
- term: Thermal voltage
  definition: V_T = kT/q, the voltage scale of thermal energy per unit charge; about 25.85 mV at 300 K. It sets the ~60 mV/decade slope of diode and subthreshold transistor currents.
  chapter: "01-01"
- term: Dynamic voltage and frequency scaling (DVFS)
  definition: Lowering supply voltage and clock frequency together when full performance is not needed; because dynamic power scales roughly as V²f, power falls roughly as the cube of voltage.
  chapter: "01-01"
- term: Link margin
  definition: Received power minus receiver sensitivity, in dB; the extra loss a radio link can tolerate before it fails.
  chapter: "01-01"

# ---------------------------------------------------------------- 01-02
- term: Limit
  definition: The value L that f(x) approaches as x approaches a (without equaling a), written lim_{x→a} f(x) = L; the value f(a) itself plays no role.
  chapter: "01-02"
  see_also: [One-sided limit, Continuity]
- term: One-sided limit
  definition: A limit taken from one side only, x → a⁻ (from below) or x → a⁺ (from above). Circuit analysis writes v(0⁻) and v(0⁺) for the values just before and just after a switching instant.
  chapter: "01-02"
- term: Indeterminate form
  definition: An expression such as 0/0, ∞/∞ or ∞ − ∞ whose form alone does not determine a limit; it must be resolved by algebra, standard limits or L'Hôpital's rule.
  chapter: "01-02"
- term: Squeeze theorem
  definition: If g(x) ≤ f(x) ≤ h(x) near a and g and h share the limit L, then f also tends to L. Used to prove sin θ/θ → 1.
  chapter: "01-02"
- term: Continuity
  definition: f is continuous at a if f(a) is defined, the limit at a exists, and the two are equal; informally, the graph can be drawn without lifting the pen.
  chapter: "01-02"
- term: Removable discontinuity
  definition: A point where a function's limit exists but its value is missing or different; redefining the value as the limit removes it (for example sin x/x at 0).
  chapter: "01-02"
- term: Jump discontinuity
  definition: A point where both one-sided limits exist but differ, as for the unit step at t = 0 or a capacitor's current at a switching instant.
  chapter: "01-02"
- term: Intermediate value theorem
  definition: A continuous function on [a, b] takes every value between f(a) and f(b); in particular, a sign change guarantees a root in between.
  chapter: "01-02"
  see_also: [Bisection method]
- term: Bisection method
  definition: Root finding by repeatedly halving a bracket that contains a sign change; after n steps the bracket width is (b − a)/2ⁿ, about 3.3 steps per decimal digit, and it cannot fail once a bracket is found.
  chapter: "01-02"
- term: Asymptote
  definition: A line that a curve approaches in a limit, horizontal (x → ∞), vertical (f → ±∞ at a finite x) or slanted; Bode-plot straight lines are asymptotes of a frequency response.
  chapter: "01-02"
- term: Difference quotient
  definition: The slope (f(a + h) − f(a))/h of the secant line through two nearby points; its limit as h → 0 is the derivative.
  chapter: "01-02"
- term: Unit step function
  definition: u(t), equal to 0 for t < 0 and 1 for t ≥ 0; it models a switch closing at t = 0 and has a jump discontinuity there.
  chapter: "01-02"
- term: Sinc function
  definition: sin(x)/x (sometimes normalized as sin(πx)/(πx)); its removable discontinuity at 0 is filled with the limit 1. It appears throughout sampling and Fourier analysis.
  chapter: "01-02"
- term: Amdahl's law
  definition: Speedup on N processors is 1/((1 − p) + p/N) when a fraction p of the work parallelizes; as N → ∞ it approaches 1/(1 − p), so the serial fraction caps scaling.
  chapter: "01-02"

# ---------------------------------------------------------------- 01-03
- term: Derivative
  definition: The instantaneous rate of change f'(a) = lim_{h→0} (f(a + h) − f(a))/h, the slope of the tangent line; its units are the output's units per input unit.
  chapter: "01-03"
  see_also: [Difference quotient, Differentiable]
- term: Differentiable
  definition: Having a derivative at a point; differentiability implies continuity, but not conversely (|x| is continuous with a corner at 0).
  chapter: "01-03"
- term: Power rule
  definition: d/dx xⁿ = n xⁿ⁻¹, valid for every real exponent n (for x > 0).
  chapter: "01-03"
- term: Product rule
  definition: (fg)' = f'g + fg'; the derivative of a product has one term for each factor's change.
  chapter: "01-03"
- term: Quotient rule
  definition: (f/g)' = (f'g − fg')/g², valid where g ≠ 0.
  chapter: "01-03"
- term: Chain rule
  definition: (f(g(x)))' = f'(g(x))·g'(x); rates of nested quantities multiply, as in d/dt sin(ωt) = ω cos(ωt).
  chapter: "01-03"
- term: Implicit differentiation
  definition: Differentiating both sides of an equation that defines y in terms of x, treating y as a function of x; used to differentiate ln x, arctan x and curves such as circles.
  chapter: "01-03"
- term: Second derivative
  definition: The derivative of the derivative, f''(x) or d²y/dx²; it measures curvature (concavity) and, for position, acceleration.
  chapter: "01-03"
- term: Elasticity (sensitivity)
  definition: The dimensionless ratio of relative changes, S = d ln y / d ln x = (x/y)(dy/dx); for y = kxⁿ it equals n. Engineers call it sensitivity, economists elasticity.
  chapter: "01-03"
- term: Slew rate
  definition: The maximum rate of change dv/dt an amplifier's output can produce, usually in V/µs; it limits the full-power bandwidth to SR/(2πV_p).
  chapter: "01-03"
- term: Small-signal conductance
  definition: The slope dI/dV of a nonlinear device's I–V curve at its operating point; for a diode g_d ≈ I/V_T, so r_d = V_T/I ≈ 26 Ω at 1 mA.
  chapter: "01-03"
- term: Central difference
  definition: The numerical derivative (f(x + h) − f(x − h))/(2h), whose truncation error falls as h² rather than h.
  chapter: "01-03"

# ---------------------------------------------------------------- 01-04
- term: Critical point
  definition: A point where f'(x) = 0 or f' does not exist; interior maxima and minima occur only at critical points (Fermat's theorem).
  chapter: "01-04"
- term: Second derivative test
  definition: At a critical point, f'' < 0 indicates a local maximum and f'' > 0 a local minimum; f'' = 0 is inconclusive. The size of f'' measures how sharp the optimum is.
  chapter: "01-04"
- term: Mean value theorem
  definition: For f continuous on [a, b] and differentiable inside, f'(c) = (f(b) − f(a))/(b − a) for some c in (a, b); hence a bound on |f'| bounds the change of f.
  chapter: "01-04"
- term: Maximum power transfer
  definition: A source of resistance R_s delivers the most power to a load R_L = R_s, namely V_s²/(4R_s); when R_s is a physical series resistance the efficiency is then only 50 %. Used for weak signals (RF, sensors), never for power delivery.
  chapter: "01-04"
- term: Linearization
  definition: Replacing a function near a point by its tangent line, L(x) = f(a) + f'(a)(x − a); the error grows as the square of the distance from a.
  chapter: "01-04"
  see_also: [Small-signal model]
- term: Small-signal model
  definition: A linear model of a nonlinear device valid for small deviations about a DC operating point, built from slopes such as g_d = dI/dV or a transistor's g_m.
  chapter: "01-04"
- term: Root sum of squares (RSS)
  definition: Combining independent error contributions as the square root of the sum of their squares; less pessimistic than adding them worst-case.
  chapter: "01-04"
- term: Newton's method
  definition: Root finding by repeatedly solving the tangent-line approximation, x_{k+1} = x_k − f(x_k)/f'(x_k); converges quadratically near a simple root but can diverge from a poor start.
  chapter: "01-04"
  see_also: [Newton–Raphson method, Quadratic convergence]
- term: Quadratic convergence
  definition: Convergence in which each error is proportional to the square of the previous one, so the number of correct digits roughly doubles per step.
  chapter: "01-04"
- term: Related rates
  definition: Rates of change linked by differentiating a relationship among quantities with respect to time, for example i = V dC/dt for a moving-plate capacitor.
  chapter: "01-04"
- term: L'Hopital's rule
  definition: For 0/0 or ∞/∞ forms, lim f/g = lim f'/g' when the latter exists (named for L'Hôpital); other indeterminate forms are first rewritten as quotients.
  chapter: "01-04"
- term: Minimum-energy point
  definition: The supply voltage at which a digital circuit's energy per operation is smallest, where falling switching energy balances rising leakage energy; typically a few hundred millivolts in subthreshold CMOS.
  chapter: "01-04"

# ---------------------------------------------------------------- 01-05
- term: Riemann sum
  definition: An approximation of accumulated quantity, Σ f(x_k*) Δx, from samples of f on a partition; left, right, midpoint and trapezoid are common choices.
  chapter: "01-05"
  see_also: [Definite integral]
- term: Definite integral
  definition: The limit of Riemann sums ∫_a^b f(x) dx, equal to the signed area under f; its units are those of f times those of x.
  chapter: "01-05"
- term: Antiderivative
  definition: A function F with F' = f; any two differ by a constant, written ∫ f dx = F + C.
  chapter: "01-05"
- term: Fundamental theorem of calculus
  definition: Part 1, the accumulated area ∫_a^x f has derivative f(x); part 2, ∫_a^b f = F(b) − F(a) for any antiderivative F. Integration and differentiation are inverse operations.
  chapter: "01-05"
- term: Accumulation function
  definition: A(x) = ∫_a^x f(t) dt, the running total of f from a fixed start; for a current it is the charge delivered so far.
  chapter: "01-05"
- term: Average value
  definition: (1/(b − a)) ∫_a^b f dx, the height of the rectangle with the same area; over one period it is a signal's DC value.
  chapter: "01-05"
- term: Trapezoidal rule
  definition: Numerical integration joining samples with straight lines; its error falls as the square of the step. SPICE's default transient integration method.
  chapter: "01-05"
- term: Ampere-hour
  definition: A unit of charge, 1 Ah = 3600 C, used for battery capacity; 1 mAh = 3.6 C.
  chapter: "01-05"
- term: Coulomb counting
  definition: Estimating a battery's state of charge by integrating measured current over time; offsets accumulate, so gauges recalibrate at known states.
  chapter: "01-05"
- term: Integrator
  definition: A circuit or algorithm whose output is the running integral of its input, such as an op-amp with capacitive feedback, v_out = −(1/RC)∫ v_in dt, or a digital accumulator.
  chapter: "01-05"
  see_also: [Integrator (op-amp)]
- term: Dual-slope ADC
  definition: An integrating converter that integrates the input for a fixed time and times the de-integration with a reference; its result is independent of R and C, and integrating over whole mains periods rejects hum.
  chapter: "01-05"

# ---------------------------------------------------------------- 01-06
- term: Substitution (integration)
  definition: Evaluating ∫ f(g(x)) g'(x) dx as ∫ f(u) du with u = g(x), the chain rule in reverse; for definite integrals the limits change to g(a) and g(b).
  chapter: "01-06"
- term: Integration by parts
  definition: ∫ u dv = uv − ∫ v du, the product rule in reverse; used for products such as x e^x, ln x and e^(ax) cos bx.
  chapter: "01-06"
- term: Partial fractions
  definition: Writing a proper rational function as a sum of simple terms, one per factor of the denominator; in circuit analysis each term is a natural mode (pole) of the response.
  chapter: "01-06"
- term: Orthogonality
  definition: The property that sinusoids of different integer frequencies multiply to zero average over a common period; it makes Fourier coefficients computable and harmonic powers additive.
  chapter: "01-06"
- term: Fourier coefficient
  definition: The amplitude of one harmonic in a periodic signal, b_n = (2/T)∫ x(t) sin(nωt) dt (and a_n with cosine), found by orthogonality.
  chapter: "01-06"
- term: Total harmonic distortion (THD)
  definition: The RMS of all harmonics above the fundamental divided by the fundamental's amplitude; a ±1 square wave has THD of 48 %.
  chapter: "01-06"
- term: Improper integral
  definition: An integral over an infinite interval or of an unbounded integrand, defined as a limit; it converges if the limit is finite (for example ∫₁^∞ x^(−p) dx converges only for p > 1).
  chapter: "01-06"
- term: Equivalent noise bandwidth (ENBW)
  definition: The width of an ideal brick-wall filter passing the same white-noise power as a real filter, ∫₀^∞ |H(f)|² df divided by the passband gain; (π/2) f_c for one pole.
  chapter: "01-06"
- term: Elmore delay
  definition: The first moment (time centroid) of a network's impulse response, computed directly from its resistances and capacitances; a fast, somewhat pessimistic interconnect delay estimate.
  chapter: "01-06"
- term: Simpson's rule
  definition: Numerical integration fitting parabolas through triples of samples, with weights h/3 × (1, 4, 2, 4, …, 4, 1); its error falls as h⁴.
  chapter: "01-06"
- term: Gibbs phenomenon
  definition: The persistent overshoot, about 9 % of the jump, of truncated Fourier series near a discontinuity; it narrows but does not shrink as harmonics are added.
  chapter: "01-06"
- term: Flicker (1/f) noise
  definition: Noise whose power spectral density falls as 1/f, so every decade of frequency carries equal power; dominant at low frequencies in MOSFETs.
  chapter: "01-06"

# ---------------------------------------------------------------- 01-07
- term: Crest factor
  definition: Peak value divided by RMS value; √2 for a sine, 1 for a square wave, √3 for a triangle. Instruments and amplifiers specify the crest factor they can handle.
  chapter: "01-07"
- term: Form factor
  definition: RMS value divided by the rectified average; π/(2√2) ≈ 1.111 for a sine. Average-responding meters assume this value.
  chapter: "01-07"
- term: Apparent power
  definition: S = V_rms·I_rms, in volt-amperes; real power is S times the power factor. Wiring and transformers must be sized for S.
  chapter: "01-07"
  see_also: [Power factor]
- term: Power factor
  definition: Real power divided by apparent power; cos φ for sinusoids with phase difference φ, and lower still when the current is distorted.
  chapter: "01-07"
- term: True-RMS meter
  definition: A meter that computes the square root of the mean square of the signal, reading correctly for any waveform within its bandwidth and crest-factor limits, unlike average-responding meters calibrated for sines.
  chapter: "01-07"
  see_also: [RMS value, Form factor]
- term: Electron-volt
  definition: The energy an electron gains (or the work done on it) crossing 1 V, exactly 1.602176634×10⁻¹⁹ J since 2019; the natural unit for band gaps, photon energies and per-electron energies. Also written electronvolt.
  chapter: "01-07"
- term: Probability density function
  definition: A non-negative function f(x) with total area 1, whose area over an interval is the probability of landing in it; the density itself is not a probability and can exceed 1.
  chapter: "01-07"
- term: Mean time between failures (MTBF)
  definition: The reciprocal of a constant failure rate, 1/λ; a fleet statistic (failures per unit-hour), not an expected lifetime of an individual unit.
  chapter: "01-07"
- term: Quantization noise
  definition: The rounding error of an ADC, modeled as uniform over ±½ LSB, with RMS Δ/√12 ≈ 0.29 LSB; it sets the ideal SNR of 6.02N + 1.76 dB.
  chapter: "01-07"
- term: Effective number of bits (ENOB)
  definition: (SINAD − 1.76)/6.02, the resolution of an ideal ADC with the same measured signal-to-noise-and-distortion ratio as a real one.
  chapter: "01-07"

# ---------------------------------------------------------------- 01-08
- term: Sequence
  definition: An ordered list a₁, a₂, a₃, …; it converges to L if its terms approach L as n grows.
  chapter: "01-08"
- term: Series
  definition: An infinite sum Σ a_k, defined as the limit of its partial sums; it converges if that limit is finite.
  chapter: "01-08"
- term: Geometric series
  definition: Σ a r^k, which sums to a/(1 − r) for |r| < 1 and diverges otherwise; models reflections, feedback loops, digital filters and annuities.
  chapter: "01-08"
- term: Harmonic series
  definition: Σ 1/k, which diverges (slowly, like ln n) even though its terms shrink to zero.
  chapter: "01-08"
- term: Ratio test
  definition: A series converges if |a_{k+1}/a_k| tends to a limit below 1 and diverges if above 1; suited to factorials and powers.
  chapter: "01-08"
- term: Power series
  definition: Σ c_k (x − a)^k; it converges inside a radius of convergence, where it can be differentiated and integrated term by term.
  chapter: "01-08"
- term: Radius of convergence
  definition: The distance from a power series' center within which it converges; it equals the distance to the nearest singularity, including complex ones.
  chapter: "01-08"
- term: Taylor series
  definition: f(x) = Σ f^(k)(a)(x − a)^k / k!, the power series matching every derivative of f at a (a Maclaurin series when a = 0).
  chapter: "01-08"
  see_also: [Lagrange remainder]
- term: Lagrange remainder
  definition: The error of a degree-n Taylor polynomial, f^(n+1)(ξ)(x − a)^(n+1)/(n + 1)! for some ξ between a and x; bounding f^(n+1) bounds the error.
  chapter: "01-08"
- term: Binomial series
  definition: (1 + x)^α = 1 + αx + α(α − 1)x²/2! + …, valid for |x| < 1 and any real α; the source of (1 + x)^n ≈ 1 + nx.
  chapter: "01-08"
- term: Loop gain
  definition: The product Aβ of forward gain and feedback fraction around a feedback loop; the closed-loop gain error is about 1/(Aβ).
  chapter: "01-08"
- term: Harmonic distortion
  definition: Output at integer multiples of an input sinusoid's frequency, produced by nonlinearity; HD2 ≈ (a₂/2a₁)A and HD3 ≈ (a₃/4a₁)A² from the Taylor coefficients.
  chapter: "01-08"
  see_also: [Total harmonic distortion (THD)]

# ---------------------------------------------------------------- 01-09
- term: Partial derivative
  definition: The rate of change of a function of several variables with respect to one of them, all others held fixed, ∂f/∂x; a sensitivity.
  chapter: "01-09"
- term: Level curve
  definition: The set of points where a function of two variables takes a constant value; a contour line. The gradient is perpendicular to it.
  chapter: "01-09"
- term: Total differential
  definition: df = (∂f/∂x)dx + (∂f/∂y)dy + …, the linear approximation of a change in f from small changes in all its inputs; the basis of small-signal models and tolerance analysis.
  chapter: "01-09"
- term: Transconductance
  definition: g_m = ∂I_out/∂V_in, the change in a device's output current per unit change of its controlling voltage; for a square-law MOSFET g_m = 2I_D/(V_GS − V_TH).
  chapter: "01-09"
- term: Intrinsic gain
  definition: g_m·r_o, the largest voltage gain a single transistor can provide, set by its transconductance and output resistance.
  chapter: "01-09"
  see_also: [Transconductance]
- term: Gradient
  definition: The vector of partial derivatives ∇f; it points in the direction of steepest increase, its length is that steepest rate, and it is perpendicular to level curves.
  chapter: "01-09"
- term: Directional derivative
  definition: The rate of change of f along a unit vector u, D_u f = ∇f · u.
  chapter: "01-09"
- term: Gradient descent
  definition: Minimizing a function by repeated steps x ← x − η∇f; stable only for step sizes below 2 divided by the largest curvature, and slow when the condition number is large. The workhorse of neural-network training.
  chapter: "01-09"
- term: Hessian
  definition: The matrix of second partial derivatives of a function; its determinant and signs classify critical points as minima, maxima or saddles.
  chapter: "01-09"
- term: Lagrange multiplier
  definition: The factor λ in ∇f = λ∇g at a constrained optimum; it equals the rate of change of the optimal value with the constraint level, a shadow price.
  chapter: "01-09"
- term: Water-filling
  definition: The capacity-maximizing allocation of power across channels of different noise, P_i = max(0, μ − N_i), with a common level μ set by the total power.
  chapter: "01-09"
- term: Bandgap reference
  definition: A circuit that adds a junction voltage (falling about 2 mV/K) to a voltage proportional to absolute temperature so that the temperature coefficients cancel; its output sits near the silicon bandgap, about 1.2 V.
  chapter: "01-09"
- term: Double integral
  definition: The integral of a function over a two-dimensional region, ∬ f dA; it sums a density (power per area, charge per area) over the region to give a total.
  chapter: "01-10"
- term: Fubini's theorem
  definition: For well-behaved integrands, a double integral can be evaluated as two nested single integrals in either order; reversing the order can turn an impossible integral into an easy one.
  chapter: "01-10"
  see_also: [Double integral]
- term: Jacobian
  definition: The determinant of the matrix of partial derivatives of a change of variables; its magnitude is the local area or volume scale factor, r for polar and ρ² sin φ for spherical coordinates.
  chapter: "01-10"
- term: Vector field
  definition: A rule that assigns a vector to every point in space, such as an electric field E(x, y, z) or a current density J.
  chapter: "01-10"
- term: Line integral
  definition: The integral of a vector field's component along a path, ∫ F · dr; for a force it is work, for an electric field it is (minus) the voltage difference.
  chapter: "01-10"
  see_also: [Vector field]
- term: Conservative field
  definition: A vector field whose line integrals depend only on the endpoints, equivalently the gradient of a potential, equivalently curl-free on a region without holes; electrostatic fields are conservative, which is what makes voltage well defined.
  chapter: "01-10"
  see_also: [Line integral, Curl]
- term: Flux
  definition: The surface integral of a vector field's normal component, ∬ F · dA, measuring how much of the field passes through a surface.
  chapter: "01-10"
- term: Divergence
  definition: ∇ · F, the net outflow of a vector field per unit volume at a point; a source density. Gauss's law states ∇ · E = ρ/ε₀.
  chapter: "01-10"
  see_also: [Flux]
- term: Curl
  definition: ∇ × F, the circulation of a vector field per unit area at a point, as a vector along the axis of rotation; magnetic fields have curl where current flows.
  chapter: "01-10"
- term: Divergence theorem
  definition: The total outward flux of a field through a closed surface equals the integral of its divergence over the enclosed volume; it turns local source density into a global balance.
  chapter: "01-10"
  see_also: [Divergence, Flux]
- term: Stokes' theorem
  definition: The circulation of a field around a closed loop equals the flux of its curl through any surface bounded by the loop; Green's theorem is its flat, two-dimensional case.
  chapter: "01-10"
  see_also: [Curl]
- term: Gauss's law
  definition: The electric flux out of any closed surface equals the enclosed charge divided by ε₀; with symmetry it gives fields of spheres, lines and planes in one line.
  chapter: "01-10"
  see_also: [Divergence theorem]
- term: Skin effect
  definition: The crowding of AC current toward a conductor's surface, within a skin depth δ = √(ρ/(πfμ)) (about 0.21 mm in copper at 100 kHz), which raises resistance at high frequency.
  chapter: "01-10"
- term: Dies per wafer
  definition: The number of whole dies that fit on a round wafer, approximated by πd²/(4A) − πd/√(2A); the subtracted edge-loss term grows in relative size as dies get larger.
  chapter: "01-10"
- term: Hyperbolic functions
  definition: cosh x = (e^x + e^−x)/2, sinh x = (e^x − e^−x)/2 and tanh = sinh/cosh, linked by cosh² − sinh² = 1; they describe catenaries, overdamped responses, transmission-line input impedance and the differential pair's tanh transfer curve.
  chapter: "01-01"
- term: Logarithmic differentiation
  definition: Differentiating ln y instead of y, which turns products, quotients and variable exponents into sums; for example (x^x)' = x^x(1 + ln x).
  chapter: "01-03"
- term: Trigonometric substitution
  definition: Replacing x by a sin θ, a tan θ or a sec θ so that a Pythagorean identity collapses √(a² − x²), a² + x² or √(x² − a²); the reference triangle converts the answer back to x.
  chapter: "01-06"
- term: Completing the square
  definition: Rewriting x² + px + q as (x + p/2)² + (q − p²/4); it turns an irreducible quadratic into an arctangent integral, and in the Laplace domain into a damped sinusoid.
  chapter: "01-06"
- term: Arc length
  definition: The length of a curve, L = ∫√(1 + f'(x)²) dx, built from the element ds = √(dx² + dy²).
  chapter: "01-07"
- term: Centroid
  definition: The balance point of a region or distribution, its first moment divided by its area (or total weight); the mean of a density and the Elmore delay are centroids.
  chapter: "01-07"
  see_also: [Elmore delay]
- term: Integral test
  definition: For a positive decreasing f with a_k = f(k), Σ a_k converges exactly when ∫ f dx does, and the tail after n terms lies between ∫ from n+1 to ∞ and ∫ from n to ∞ of f.
  chapter: "01-08"
- term: Limit comparison test
  definition: If a_k, b_k > 0 and a_k/b_k tends to a finite positive limit, the series Σ a_k and Σ b_k converge or diverge together.
  chapter: "01-08"
- term: Dot product
  definition: a·b = a₁b₁ + a₂b₂ + a₃b₃ = |a||b|cos θ; it measures how far two vectors point the same way and is zero for perpendicular vectors.
  chapter: "01-09"
- term: Cross product
  definition: a × b, a vector perpendicular to both a and b, of length |a||b|sin θ (the area of their parallelogram), directed by the right-hand rule.
  chapter: "01-10"
- term: Mean time to failure (MTTF)
  definition: The expected lifetime of a non-repairable component, 1/λ for a constant failure rate λ; MTBF is the analogous figure for repairable systems, and the two are often used loosely as synonyms.
  chapter: "01-07"
  see_also: [Mean time between failures (MTBF)]
- term: Ordinary differential equation
  definition: An equation relating an unknown function of one variable to its derivatives; its order is that of the highest derivative. A first-order ODE y' = f(t, y) describes any system with a single store of charge, flux, heat or money.
  chapter: "02-02"
- term: Initial-value problem
  definition: A differential equation together with the value of the unknown at a starting time, y(t₀) = y₀, which fixes the arbitrary constant of the general solution.
  chapter: "02-02"
- term: Direction field
  definition: A plot of short segments with slope f(t, y) at a grid of points for y' = f(t, y); solutions run tangent to the segments, so the field shows their behavior before any algebra.
  chapter: "02-02"
- term: Equilibrium solution
  definition: A constant solution y* of an autonomous equation y' = f(y), where f(y*) = 0; it is stable if f'(y*) < 0, with local time constant −1/f'(y*), and unstable if f'(y*) > 0.
  chapter: "02-02"
- term: Phase line
  definition: A one-dimensional picture of an autonomous equation y' = f(y), marking the equilibria and arrows showing where y rises or falls between them.
  chapter: "02-02"
  see_also: [Equilibrium solution]
- term: Separable equation
  definition: A first-order equation y' = a(t)b(y), solved by integrating dy/b(y) = a(t) dt; constant solutions where b(y) = 0 must be checked separately.
  chapter: "02-02"
- term: Logistic equation
  definition: N' = rN(1 − N/K), growth proportional to the current base and to the remaining room; its S-shaped solution models adoption, epidemics and populations, rising fastest at N = K/2.
  chapter: "02-02"
- term: Discount factor
  definition: D(t) = exp(−∫ r dt), the present value of one unit due at time t; it is exactly the integrating factor of the balance equation B' − r(t)B = deposits.
  chapter: "02-02"
  see_also: [Integrating factor]
- term: Method of undetermined coefficients
  definition: Finding a particular solution of a linear ODE by guessing the input's form (constant, polynomial, exponential, sinusoid) with unknown coefficients and matching; multiply the guess by t when it already solves the homogeneous equation.
  chapter: "02-02"
- term: Steady-state response
  definition: The part of a stable linear system's response that remains after the transient decays, set by the input alone; for a sinusoidal input it is the phasor answer.
  chapter: "02-02"
  see_also: [Transient]
- term: Existence and uniqueness theorem
  definition: A linear first-order IVP with continuous coefficients has exactly one solution on the whole interval of continuity; a nonlinear one y' = f(t, y) has a unique local solution when f and ∂f/∂y are continuous (Picard–Lindelöf).
  chapter: "02-02"
- term: Finite-time blow-up
  definition: A solution of a nonlinear ODE reaching infinity at a finite time although the equation is smooth, as for y' = y² with y = 1/(1 − t); it signals superlinear positive feedback.
  chapter: "02-02"
- term: Bernoulli equation
  definition: y' + p(t)y = q(t)yⁿ, made linear by the substitution v = y^(1−n); the logistic equation is the case n = 2.
  chapter: "02-02"
- term: Euler's method
  definition: The simplest numerical ODE solver, y_{n+1} = y_n + h f(t_n, y_n); first-order accurate, and on y' = −y/τ stable only for steps h < 2τ. Its implicit (backward) form is stable for any step.
  chapter: "02-02"
- term: Stiff system
  definition: A system of differential equations whose time constants span many orders of magnitude, so explicit methods need steps set by the fastest one; circuit simulators therefore use implicit methods.
  chapter: "02-02"
  see_also: [Euler's method]
- term: Thermal resistance
  definition: R_th (K/W), the temperature rise per watt of heat flowing along a path; with heat capacity C_th it forms a thermal time constant R_th C_th, the thermal analog of an RC circuit.
  chapter: "02-02"
- term: Thermal runaway
  definition: Positive feedback in which rising temperature raises power dissipation (for example leakage), which raises temperature further; it runs away when the loop gain R_th·dP/dT reaches 1.
  chapter: "02-02"
  see_also: [Thermal resistance]
- term: Characteristic equation
  definition: The polynomial equation obtained by substituting y = e^{st} into a linear constant-coefficient ODE, such as s² + 2αs + ω₀² = 0; its roots set the decay rates and oscillation frequencies of every natural response.
  chapter: "02-03"
- term: Natural frequency
  definition: ω₀ = 1/√(LC) (rad/s), the frequency at which a second-order system would oscillate with no damping; for a mass on a spring, √(k/m).
  chapter: "02-03"
- term: Neper frequency
  definition: α (1/s), the decay rate of a second-order system's envelope e^{−αt}; R/(2L) for a series RLC and 1/(2RC) for a parallel RLC.
  chapter: "02-03"
- term: Damping ratio
  definition: 'ζ = α/ω₀, the single number that classifies a second-order system: underdamped (ζ < 1, rings), critically damped (ζ = 1) or overdamped (ζ > 1); overshoot depends only on ζ.'
  chapter: "02-03"
- term: Quality factor
  definition: Q = 1/(2ζ) = ω₀ × energy stored / power dissipated; the amplitude decays by a factor e in Q/π cycles, and Q also sets the sharpness of resonance.
  chapter: "02-03"
  see_also: [Damping ratio]
- term: Underdamped
  definition: A second-order system with ζ < 1, whose complex characteristic roots −α ± jω_d give a sinusoidal response inside a decaying envelope.
  chapter: "02-03"
- term: Critically damped
  definition: A second-order system with ζ = 1, whose repeated root gives the response (c₁ + c₂t)e^{−αt}; the boundary between ringing and creeping, though not the fastest to settle within a tolerance band.
  chapter: "02-03"
- term: Overdamped
  definition: A second-order system with ζ > 1, whose two real negative roots give a sum of decaying exponentials with no overshoot; more damping makes it slower.
  chapter: "02-03"
- term: Damped natural frequency
  definition: ω_d = ω₀√(1 − ζ²), the frequency at which an underdamped system actually rings.
  chapter: "02-03"
  see_also: [Natural frequency]
- term: Reduction of order
  definition: Finding a second solution of a linear ODE by writing y = u(t)y₁(t) with a known solution y₁; for a repeated characteristic root it gives te^{−αt}.
  chapter: "02-03"
- term: Wronskian
  definition: W = y₁y₂′ − y₁′y₂; two solutions of a second-order linear ODE are independent, and can match any initial conditions, exactly when W ≠ 0.
  chapter: "02-03"
- term: Overshoot
  definition: The amount by which a step response exceeds its final value, as a fraction of the step; exp(−πζ/√(1 − ζ²)) for a second-order system (16.3% at ζ = 0.5, 4.3% at ζ = 0.707).
  chapter: "02-03"
- term: Target impedance
  definition: The highest impedance a power-delivery network may present to the load, V_DD × allowed ripple / current step; designers keep the network's impedance below it across frequency.
  chapter: "02-03"
  see_also: [Power delivery network]
- term: Power delivery network
  definition: The regulators, board and package wiring, and decoupling capacitors that carry current from the supply to the transistors; its inductance and the die's capacitance form a resonant tank that causes supply droop on load steps.
  chapter: "02-03"
- term: Particular solution
  definition: Any one solution of a forced (nonhomogeneous) linear ODE; the general solution is a particular solution plus the general homogeneous solution.
  chapter: "02-04"
- term: Exponential response formula
  definition: For p(D)y = e^{st} with p(s) ≠ 0, a particular solution is y = e^{st}/p(s); when s is a simple root of p, y = t e^{st}/p'(s) instead (the resonant case).
  chapter: "02-04"
- term: Complex replacement
  definition: Solving an ODE with input cos ωt by solving it with input e^{jωt} and taking the real part; valid because the equation has real coefficients. It is the proof behind phasor analysis.
  chapter: "02-04"
  see_also: [Phasor]
- term: Half-power bandwidth
  definition: The width ω₂ − ω₁ of the band over which a resonant response stays within 1/√2 of its peak (half the power); for a second-order band-pass it equals ω₀/Q exactly, with ω₁ω₂ = ω₀².
  chapter: "02-04"
  see_also: [Quality factor]
- term: Beats
  definition: The slow swelling and fading of a sum of two sinusoids of nearly equal frequency, or of an undamped system forced near its natural frequency; the envelope varies at half the difference frequency.
  chapter: "02-04"
- term: Variation of parameters
  definition: A general method for particular solutions of linear ODEs, y_p = u₁y₁ + u₂y₂ with u₁′ = −y₂g/W and u₂′ = y₁g/W (W the Wronskian); it works for any continuous input.
  chapter: "02-04"
  see_also: [Wronskian]
- term: Butterworth response
  definition: The maximally flat filter response; a second-order Butterworth section has ζ = 0.707 (Q = 0.707), no peak, and −3.01 dB at its natural frequency.
  chapter: "02-04"


# ---------------------------------------------------------------- 02-05
- term: Laplace transform
  definition: F(s) = ∫ f(t) e^(−st) dt from 0⁻ to ∞, with s = σ + jω complex; it turns differentiation into multiplication by s (minus initial conditions), so linear constant-coefficient ODEs become algebra.
  chapter: "02-05"
  see_also: [Transfer function, Partial fractions]
- term: Unit impulse
  definition: δ(t), the idealized pulse of zero width and unit area (a generalized function); ∫ δ(t) f(t) dt = f(0), its transform is 1, and it models a sudden kick such as a charge dumped onto a capacitor.
  chapter: "02-05"
  see_also: [Unit step function, Impulse response]
- term: Transfer function
  definition: H(s) = Y(s)/X(s), the ratio of output to input transforms of a linear time-invariant system with zero initial conditions; it equals the transform of the impulse response, and H(jω) is the frequency response.
  chapter: "02-05"
  see_also: [Poles and zeros, Impulse response]
- term: Poles and zeros
  definition: The roots of a rational transfer function's denominator (poles) and numerator (zeros). Each pole p gives a natural mode e^(pt), so all poles in the left half-plane means stable; zeros set how much of each mode appears.
  chapter: "02-05"
  see_also: [Transfer function, Characteristic equation]
- term: Impulse response
  definition: h(t), a system's output when the input is δ(t) with zero initial conditions; its transform is the transfer function, and the output for any input is the convolution h * x.
  chapter: "02-05"
  see_also: [Convolution, Transfer function]
- term: Initial-value theorem
  definition: f(0⁺) = lim sF(s) as s → ∞, valid when F(s) is strictly proper; it checks an inverse transform's starting value without inverting.
  chapter: "02-05"
  see_also: [Final-value theorem]
- term: Final-value theorem
  definition: f(∞) = lim sF(s) as s → 0, valid only if f actually settles, that is, every pole of sF(s) lies in the open left half-plane; applied to an unstable or oscillating signal it gives a wrong answer.
  chapter: "02-05"
  see_also: [Initial-value theorem, DC gain]
- term: DC gain
  definition: H(0), the steady-state output per unit of constant input for a stable system; it is also the final value of the unit-step response.
  chapter: "02-05"
  see_also: [Transfer function, Final-value theorem]

# ---------------------------------------------------------------- 02-06
- term: Vector
  definition: An ordered list of n numbers, written as a column; pictured as an arrow in space, a set of related quantities (such as node voltages), or a sampled signal.
  chapter: "02-06"
  see_also: [Linear combination, Dot product]
- term: Linear combination
  definition: A sum c₁v₁ + … + c_kv_k of vectors times scalars. Every matrix–vector product Ax is the linear combination of A's columns with weights x.
  chapter: "02-06"
- term: Norm
  definition: The length of a vector, ‖v‖ = √(v·v); for a sampled signal, ‖v‖/√N is its RMS value. For complex vectors, ‖v‖² = Σ|vᵢ|².
  chapter: "02-06"
  see_also: [Dot product]
- term: Projection
  definition: The closest point to b on the line through a, p = (a·b / a·a) a, characterized by the error b − p being perpendicular to a; the basis of least squares.
  chapter: "02-06"
- term: Matrix
  definition: A rectangular m×n array of numbers; multiplying it by a vector is a linear map from n-component to m-component vectors.
  chapter: "02-06"
  see_also: [Matrix multiplication]
- term: Matrix multiplication
  definition: The product AB defined so that (AB)x = A(Bx); entry (i, j) is row i of A dotted with column j of B. It is associative but not commutative, and an n×n product costs n³ multiply–adds.
  chapter: "02-06"
- term: Transpose
  definition: Aᵀ, the matrix with rows and columns exchanged, (Aᵀ)ᵢⱼ = aⱼᵢ. The transpose of a product reverses the order, (AB)ᵀ = BᵀAᵀ; a matrix equal to its transpose is symmetric.
  chapter: "02-06"
- term: Singular matrix
  definition: A square matrix whose columns are dependent, so Ax = b has no solution for most b and infinitely many for the rest; elimination on it cannot produce a full set of nonzero pivots.
  chapter: "02-06"
- term: Gaussian elimination
  definition: Solving Ax = b by subtracting multiples of rows to reach an upper-triangular system, then back-substituting; it costs about (2/3)n³ flops for an n×n system.
  chapter: "02-06"
  see_also: [Pivot, LU factorization]
- term: Pivot
  definition: The diagonal entry used to eliminate the entries below it at each step of Gaussian elimination; it must be nonzero, and should not be small relative to the entries below it.
  chapter: "02-06"
- term: LU factorization
  definition: A = LU, with L lower triangular holding the elimination multipliers and U upper triangular holding the pivots (PA = LU with row exchanges). Factor once in O(n³), then solve each right-hand side in O(n²).
  chapter: "02-06"
- term: Partial pivoting
  definition: Exchanging rows at each elimination step so that the largest-magnitude entry in the column becomes the pivot; it keeps every multiplier at most 1 in magnitude and prevents roundoff from swamping the solution.
  chapter: "02-06"
- term: Conductance matrix
  definition: The matrix G of nodal analysis, G v = i. Diagonal entries are the total conductance at each node; off-diagonal entries are minus the conductance between two nodes. It is symmetric, sparse and, once a node is grounded, nonsingular.
  chapter: "02-06"
  see_also: [Stamp, Modified nodal analysis]
- term: Stamp
  definition: The fixed pattern of matrix entries one circuit element contributes to the nodal or MNA equations; a resistor of conductance g between nodes a and b adds +g at (a, a) and (b, b) and −g at (a, b) and (b, a).
  chapter: "02-06"
- term: Sparse matrix
  definition: A matrix whose entries are almost all zero, stored and factored by keeping only the nonzeros; circuit and power-grid matrices have a few nonzeros per row.
  chapter: "02-06"
- term: Arithmetic intensity
  definition: Operations performed per byte moved from memory. A workload whose intensity is below a machine's ridge point (peak operations per second ÷ memory bandwidth) is memory-bound; a matrix–vector product has about 1 flop per byte in 16-bit precision.
  chapter: "02-06"

# ---------------------------------------------------------------- 02-07
- term: Determinant
  definition: The number det A attached to a square matrix, fixed by three rules (det I = 1, a row exchange flips the sign, linearity in each row); it equals ± the product of the pivots, is zero exactly when A is singular, and |det A| is the volume scale factor of the map x → Ax.
  chapter: "02-07"
  see_also: [Cofactor, Inverse matrix]
- term: Cofactor
  definition: C_ij = (−1)^(i+j) times the determinant of the matrix with row i and column j deleted; expanding along a row, det A = Σ a_ij C_ij. Practical only for small matrices.
  chapter: "02-07"
- term: Inverse matrix
  definition: A⁻¹ with A⁻¹A = AA⁻¹ = I, existing exactly when det A ≠ 0. Computed by Gauss–Jordan elimination at about 2n³ flops; for solving systems, LU is cheaper and more accurate.
  chapter: "02-07"
- term: Cramer's rule
  definition: For a nonsingular system, xᵢ = det(Bᵢ)/det(A), where Bᵢ is A with column i replaced by b. Useful for small symbolic results, never for large numerical systems.
  chapter: "02-07"
- term: Vector space
  definition: A set closed under addition and scalar multiplication obeying the usual algebra rules, such as Rⁿ, polynomials, or the solutions of a homogeneous linear ODE.
  chapter: "02-07"
  see_also: [Subspace, Basis]
- term: Subspace
  definition: A subset of a vector space that contains 0 and is closed under addition and scalar multiplication, such as a line or plane through the origin, a column space or a null space.
  chapter: "02-07"
- term: Linear independence
  definition: Vectors are independent if the only combination of them equal to 0 has all weights zero; otherwise one of them is a combination of the others.
  chapter: "02-07"
- term: Basis
  definition: A set of independent vectors that spans a subspace; every vector in the subspace is then a unique combination of the basis vectors.
  chapter: "02-07"
- term: Dimension
  definition: The number of vectors in any basis of a subspace (all bases have the same number).
  chapter: "02-07"
- term: Rank
  definition: The number of pivots of a matrix, equal to the dimension of its column space (and of its row space). Numerically, the rank counts singular values above a stated tolerance.
  chapter: "02-07"
  see_also: [Column space, Null space, Rank–nullity theorem]
- term: Column space
  definition: C(A), the set of all combinations Ax of the columns of A; Ax = b is solvable exactly when b lies in it.
  chapter: "02-07"
- term: Null space
  definition: N(A), the set of all solutions of Ax = 0; every solution of Ax = b is one particular solution plus a vector in N(A).
  chapter: "02-07"
- term: Rank–nullity theorem
  definition: For an m×n matrix of rank r, dim C(A) + dim N(A) = r + (n − r) = n.
  chapter: "02-07"
- term: Least squares
  definition: Choosing x̂ to minimize ‖b − Ax‖² when Ax = b has no exact solution; geometrically, Ax̂ is the projection of b onto the column space, so the residual is orthogonal to every column.
  chapter: "02-07"
  see_also: [Normal equations, Projection]
- term: Normal equations
  definition: AᵀA x̂ = Aᵀb, the square system whose solution is the least-squares fit; uniquely solvable when A has independent columns. Software prefers QR or SVD, which avoid squaring the condition number.
  chapter: "02-07"
- term: Incidence matrix
  definition: The branch-by-node matrix of a circuit graph, with +1 at each branch's start node and −1 at its end node. Its rank is n − 1 for a connected graph, the conductance matrix is AᵀCA, and its left null space holds the loop currents.
  chapter: "02-07"
- term: Reciprocity
  definition: In a linear network of resistors (and other reciprocal elements), the response at node k to a current injected at node j equals the response at j to the same current injected at k; mathematically, the resistance matrix G⁻¹ is symmetric.
  chapter: "02-07"
- term: Driving-point resistance
  definition: The resistance seen looking into a node with respect to ground, equal to the diagonal entry R_jj of the resistance matrix G⁻¹; the voltage at node j per ampere injected there.
  chapter: "02-07"
  see_also: [Thevenin resistance]

# ---------------------------------------------------------------- 02-08
- term: Eigenvalue
  definition: A number λ for which Ax = λx has a nonzero solution x; the roots of det(A − λI) = 0. They sum to the trace and multiply to the determinant.
  chapter: "02-08"
  see_also: [Eigenvector, Characteristic polynomial]
- term: Eigenvector
  definition: A nonzero vector x that a matrix only scales, Ax = λx; any nonzero multiple is also an eigenvector. In eigenvector coordinates a diagonalizable matrix acts as independent scalings.
  chapter: "02-08"
- term: Characteristic polynomial
  definition: det(A − λI), a degree-n polynomial in λ whose roots are the eigenvalues; for 2×2 it is λ² − (trace)λ + det.
  chapter: "02-08"
  see_also: [Characteristic equation]
- term: Trace
  definition: The sum of a square matrix's diagonal entries, equal to the sum of its eigenvalues.
  chapter: "02-08"
- term: Diagonalization
  definition: Writing A = XΛX⁻¹ with eigenvectors in X and eigenvalues in Λ, possible when A has n independent eigenvectors; it gives powers as Aᵏ = XΛᵏX⁻¹.
  chapter: "02-08"
- term: Defective matrix
  definition: A square matrix with fewer independent eigenvectors than its size (a repeated eigenvalue short of eigenvectors); it cannot be diagonalized, and its powers and exponentials contain extra factors k or t.
  chapter: "02-08"
- term: Markov chain
  definition: A random process that moves between states with fixed transition probabilities; its distribution evolves as u_{k+1} = Pu_k, its steady state is the eigenvector for λ = 1, and its convergence rate is set by the second-largest |λ|.
  chapter: "02-08"
- term: Spectral theorem
  definition: Every real symmetric matrix has real eigenvalues and orthonormal eigenvectors, A = QΛQᵀ = Σ λᵢqᵢqᵢᵀ.
  chapter: "02-08"
- term: Orthogonal matrix
  definition: A square matrix Q with orthonormal columns, so QᵀQ = I and Q⁻¹ = Qᵀ; it is a rotation or reflection, preserves lengths and angles, and has all singular values equal to 1.
  chapter: "02-08"
- term: Positive definite matrix
  definition: A symmetric matrix with xᵀAx > 0 for every nonzero x; equivalently all eigenvalues positive, or all pivots positive. Grounded conductance matrices, nonsingular covariance matrices and Hessians at strict minima are examples.
  chapter: "02-08"
- term: Normal mode
  definition: A pattern of motion in which every part of a coupled linear system oscillates at the same frequency; mathematically an eigenvector of the system, such as the in-phase and out-of-phase modes of two coupled resonators.
  chapter: "02-08"
- term: Singular value decomposition
  definition: A = UΣVᵀ for any matrix, with orthogonal U and V and non-negative singular values on the diagonal of Σ; it maps the unit sphere to an ellipsoid with semi-axes σᵢ.
  chapter: "02-08"
  see_also: [Low-rank approximation, Condition number]
- term: Low-rank approximation
  definition: Keeping the first k terms of the SVD, A_k = Σ_{i≤k} σᵢuᵢvᵢᵀ, the closest rank-k matrix to A (Eckart–Young), with 2-norm error σ_{k+1}.
  chapter: "02-08"
- term: Condition number
  definition: κ = σ_max/σ_min for a square invertible matrix, the worst-case amplification of relative error when solving Ax = b; a large κ, not a small determinant, means nearly singular.
  chapter: "02-08"
- term: Principal component analysis
  definition: Finding the eigenvectors of a data set's covariance matrix (equivalently the singular vectors of the centered data), ordered by the variance they carry, to describe or compress the data with a few uncorrelated components.
  chapter: "02-08"

# ---------------------------------------------------------------- 02-09
- term: State-space model
  definition: The description x' = Ax + Bu, y = Cx + Du of a linear system, with state vector x (for circuits, capacitor voltages and inductor currents); the eigenvalues of A are the system's poles.
  chapter: "02-09"
  see_also: [State variable, Matrix exponential, Transfer function]
- term: Matrix exponential
  definition: e^{At} = I + At + (At)²/2! + …, the matrix that maps an initial state to the state at time t for x' = Ax; computed by diagonalization, by (sI − A)⁻¹, or numerically by scaling and squaring.
  chapter: "02-09"
- term: Phase portrait
  definition: The family of trajectories of a two-state system drawn in the state plane; for linear systems it is a node, saddle, spiral or center, set by the trace and determinant of A.
  chapter: "02-09"
- term: Saddle point
  definition: An equilibrium whose matrix has real eigenvalues of opposite sign (negative determinant); trajectories approach along one eigenvector and leave along the other, so it is unstable.
  chapter: "02-09"
- term: Zero-order hold
  definition: Holding a sampled input constant over each sample period; it gives the exact discretization A_d = e^{AT}, B_d = A⁻¹(e^{AT} − I)B of a state-space model, mapping poles as z = e^{sT}.
  chapter: "02-09"
- term: Thermal impedance
  definition: Z_th(t), the temperature rise per watt in response to a power step; it rises from near zero for very short pulses to the steady thermal resistance, and datasheets give it as a Foster RC network.
  chapter: "02-09"
  see_also: [Foster network, Cauer network, Thermal resistance]
- term: Foster network
  definition: An RC model written as a series chain of parallel R–C pairs, Z(t) = Σ Rᵢ(1 − e^(−t/τᵢ)); it is a modal (eigenvalue) expansion whose nodes have no physical meaning, so it cannot be cascaded with other stages.
  chapter: "02-09"
- term: Cauer network
  definition: An RC ladder model whose capacitors connect to a reference at each node, mirroring physical layers in series; unlike a Foster network it can be cascaded with models of further stages.
  chapter: "02-09"
- term: Kalman filter
  definition: The optimal linear estimator of a state-space system's state from noisy measurements (Kalman, 1960), alternating model-based prediction with measurement correction; widely used in navigation, tracking and sensor fusion.
  chapter: "02-09"

# ---------------------------------------------------------------- 02-10
- term: Unit roundoff
  definition: u = ε/2, the largest relative error of rounding one real number to the nearest floating-point number; 2⁻⁵³ ≈ 1.1×10⁻¹⁶ in double precision, so each basic operation satisfies fl(x∘y) = (x∘y)(1 + δ) with |δ| ≤ u.
  chapter: "02-10"
  see_also: [Machine epsilon]
- term: Companion model
  definition: The conductance-plus-current-source equivalent that SPICE substitutes for a nonlinear device at each Newton iteration (its tangent line) or for a capacitor or inductor at each time step (its discretized law), so the circuit can be solved by linear MNA.
  chapter: "02-10"
  see_also: [Newton–Raphson method, Modified nodal analysis]
- term: Junction voltage limiting
  definition: A Newton-iteration safeguard in SPICE device models that compresses large steps in a pn-junction voltage above a critical voltage to a logarithmic step, preventing the exponential current law from overflowing or stalling convergence.
  chapter: "02-10"
- term: Order of accuracy
  definition: The exponent p in a numerical method's global error ∝ hᵖ; halving the step divides the error by 2ᵖ (Euler 1, Heun 2, RK4 4).
  chapter: "02-10"
- term: Runge–Kutta method
  definition: An explicit one-step ODE integrator that combines several slope evaluations within each step; the classical RK4 method uses four and is fourth-order accurate.
  chapter: "02-10"
- term: A-stability
  definition: The property that a numerical integrator is stable for every decaying mode (Re hλ < 0) at any step size; backward Euler and the trapezoidal rule are A-stable, explicit methods never are.
  chapter: "02-10"
  see_also: [Stiff system]
- term: Trapezoidal ringing
  definition: A numerical artifact of the trapezoidal rule, whose amplification factor tends to −1 for very fast modes, so stiff components flip sign every step instead of decaying; it is damped by Gear methods or by mixing in backward Euler.
  chapter: "02-10"
- term: Iterative refinement
  definition: Improving a computed solution of Ax = b by computing the residual r = b − Ax in higher precision, solving A d = r with the existing (often low-precision) factors, and updating x ← x + d; it converges when κ·u_low is well below 1.
  chapter: "02-10"

# ---------------------------------------------------------------- 03-01
- term: Sample space
  definition: The set of all possible outcomes of a random experiment, such as every possible error pattern in a block of bits; events are subsets of it.
  chapter: "03-01"
- term: Union bound
  definition: "The inequality P(A1 ∪ … ∪ An) ≤ P(A1) + … + P(An), valid for any events: the probability that anything goes wrong is at most the sum of the individual probabilities; tight for rare, nearly disjoint events."
  chapter: "03-01"
  see_also: [Inclusion–exclusion principle]
- term: Inclusion–exclusion principle
  definition: P(A ∪ B) = P(A) + P(B) − P(A ∩ B), which corrects the double counting of outcomes in both events.
  chapter: "03-01"
- term: Conditional probability
  definition: P(A | B) = P(A ∩ B)/P(B), the probability of A among the outcomes where B occurred.
  chapter: "03-01"
  see_also: [Bayes' rule]
- term: Total probability theorem
  definition: For events B1, …, Bm that partition the sample space, P(A) = Σ P(Bi) P(A | Bi), a weighted average over the cases.
  chapter: "03-01"
- term: Bayes' rule
  definition: P(A | B) = P(A) P(B | A)/P(B), which turns the probability of an observation given a cause into the probability of the cause given the observation.
  chapter: "03-01"
  see_also: [Base-rate effect, Maximum a posteriori (MAP) detection]
- term: Base-rate effect
  definition: Even an accurate test produces mostly false positives when the condition it detects is rare, because its false-positive rate applies to the large unaffected majority.
  chapter: "03-01"
- term: Maximum a posteriori (MAP) detection
  definition: Choosing the hypothesis with the largest posterior probability given the observation, which minimizes the probability of error; with equal priors it reduces to maximum-likelihood detection.
  chapter: "03-01"
- term: Statistical independence
  definition: Events A and B are independent if P(A ∩ B) = P(A) P(B), so learning one tells nothing about the other; several events are independent only if every subcollection satisfies the product rule.
  chapter: "03-01"
- term: Conditional independence
  definition: Events that are independent once a third event (such as a die's true state) is known, even though they may be dependent unconditionally.
  chapter: "03-01"
- term: Bit error rate (BER)
  definition: The probability, or long-run fraction, that a transmitted bit is received in error; serial-link standards specify targets such as 1e-12.
  chapter: "03-01"
- term: Fault coverage
  definition: The fraction of modeled faults (for example stuck-at faults) that a set of test patterns detects.
  chapter: "03-01"
  see_also: [Defect level (DPPM)]
- term: Defect level (DPPM)
  definition: The fraction of shipped (test-passing) parts that are defective, usually in defective parts per million; the Williams–Brown model gives DL = 1 − Y^(1−T).
  chapter: "03-01"
- term: Overkill
  definition: Good parts wrongly rejected by a production test, the false positives of the test.
  chapter: "03-01"
- term: Triple modular redundancy (TMR)
  definition: Running three copies of a module with a majority voter, giving reliability 3R² − 2R³, better than one module only when R > 0.5.
  chapter: "03-01"
- term: Common-mode failure
  definition: A failure that takes down several redundant units at once through a shared cause (power feed, design bug, environment), defeating redundancy.
  chapter: "03-01"
- term: Lot tolerance percent defective (LTPD)
  definition: The defective percentage that a sampling plan rejects with high confidence (usually 90%); zero failures in 230 samples demonstrates LTPD 1.
  chapter: "03-01"

# ---------------------------------------------------------------- 03-02
- term: Random variable
  definition: A function that assigns a number to each outcome of a random experiment, such as the number of bit errors in a packet or the noise voltage at a sampling instant.
  chapter: "03-02"
- term: Probability mass function (PMF)
  definition: For a discrete random variable, p_X(k) = P(X = k); the values are non-negative and sum to 1.
  chapter: "03-02"
- term: Cumulative distribution function (CDF)
  definition: F_X(x) = P(X ≤ x), which rises from 0 to 1; any interval probability is a difference of CDF values, and the density is its derivative.
  chapter: "03-02"
- term: Binomial distribution
  definition: The number of successes in n independent trials each succeeding with probability p, with PMF C(n,k) p^k (1 − p)^(n − k).
  chapter: "03-02"
- term: Geometric distribution
  definition: The number of independent trials up to and including the first success, with PMF (1 − q)^(k−1) q; it is memoryless.
  chapter: "03-02"
- term: Poisson distribution
  definition: "The count of rare independent events with mean λ: P(k) = e^(−λ) λ^k/k!, the limit of the binomial as n grows with np = λ fixed."
  chapter: "03-02"
- term: Poisson process
  definition: Events occurring independently at a constant average rate; counts in an interval are Poisson and the gaps between events are exponential.
  chapter: "03-02"
- term: Exponential distribution
  definition: The waiting time to the first event of a Poisson process with rate r, P(T > t) = e^(−rt), with mean 1/r; the model behind constant failure rates.
  chapter: "03-02"
  see_also: [Memoryless property, FIT (failures in time)]
- term: Memoryless property
  definition: P(T > s + t | T > s) = P(T > t), so a surviving item is as good as new; only the exponential (continuous) and geometric (discrete) distributions have it.
  chapter: "03-02"
- term: FIT (failures in time)
  definition: A failure rate of one failure per 10^9 device-hours; soft-error rates of memories are quoted in FIT per megabit.
  chapter: "03-02"
- term: Gaussian distribution
  definition: The normal (bell-curve) distribution with density e^(−(x−μ)²/(2σ²))/(σ√(2π)); thermal noise and sums of many independent small effects follow it.
  chapter: "03-02"
  see_also: [Q-function]
- term: Jitter
  definition: The deviation of a signal's edges from their ideal times, split into unbounded Gaussian random jitter (RJ) and bounded deterministic jitter (DJ).
  chapter: "03-02"
  see_also: [Dual-Dirac model]
- term: Dual-Dirac model
  definition: "A model of jitter as two spikes DJ(δδ) apart blurred by Gaussian random jitter of rms σ, giving total jitter TJ(BER) = DJ(δδ) + 2·Q_BER·σ, where the industry convention defines Q(Q_BER) = BER (2Q_BER = 14.069 at 1e-12; the literal model gives 13.68)."
  chapter: "03-02"
- term: Bathtub curve
  definition: "A curve shaped like a bathtub, used in two senses: bit error rate against sampling instant across the unit interval, and failure rate against age (infant mortality, flat mid-life, wear-out)."
  chapter: "03-02"
- term: Soft error
  definition: A non-destructive change of a stored bit caused by a particle strike (neutrons or alpha particles); it is corrected by rewriting, and its rate is quoted in FIT per megabit.
  chapter: "03-02"

# ---------------------------------------------------------------- 03-03
- term: Expectation
  definition: The probability-weighted average of a random variable, Σ k·p(k) or ∫ x·f(x) dx; its long-run average over many independent trials, also called the mean.
  chapter: "03-03"
- term: Linearity of expectation
  definition: E[aX + bY + c] = aE[X] + bE[Y] + c for any random variables, independent or not; it gives expected counts as sums of probabilities.
  chapter: "03-03"
  see_also: [Indicator variable]
- term: Indicator variable
  definition: A random variable equal to 1 if an event occurs and 0 otherwise, so its expectation is the event's probability; counts are sums of indicators.
  chapter: "03-03"
- term: Variance
  definition: "The expected squared deviation from the mean, Var(X) = E[(X − μ)²] = E[X²] − μ²; for a zero-mean voltage in 1 Ω it is the AC power."
  chapter: "03-03"
  see_also: [Standard deviation]
- term: Standard deviation
  definition: The square root of the variance, σ, in the units of the random variable; for a signal it is the AC RMS value.
  chapter: "03-03"
- term: Moment
  definition: "E[Xⁿ], the nth moment of a random variable; the first is the mean, and central moments E[(X − μ)ⁿ] give variance (n = 2), skewness (3) and kurtosis (4) after standardizing."
  chapter: "03-03"
- term: Change of variables
  definition: The rule f_Y(y) = Σ f_X(xᵢ)/|g′(xᵢ)| over the points xᵢ with g(xᵢ) = y, giving the density of Y = g(X); probability is conserved as the axis is stretched or compressed.
  chapter: "03-03"
- term: Chi-square distribution
  definition: The distribution of a sum of squared independent standard normals; with one degree of freedom it describes the instantaneous power of Gaussian noise, whose standard deviation is √2 times its mean.
  chapter: "03-03"
- term: Log-normal distribution
  definition: The distribution of e^X for Gaussian X; skewed right, with median e^μ and mean e^(μ + σ_ℓ²/2), where σ_ℓ is the standard deviation of X. Subthreshold leakage across devices is approximately log-normal.
  chapter: "03-03"
- term: Rayleigh distribution
  definition: The distribution of the envelope R of a complex Gaussian signal, f(r) = (2r/P̄)e^(−r²/P̄), when the power R² is exponential with mean P̄; mean √(πP̄)/2.
  chapter: "03-03"
- term: Markov's inequality
  definition: For a nonnegative random variable, P(X ≥ a) ≤ E[X]/a.
  chapter: "03-03"
- term: Chebyshev's inequality
  definition: P(|X − μ| ≥ kσ) ≤ 1/k² for any distribution with finite variance; a guarantee that is loose for any particular distribution (11.1% at 3σ against 0.27% for a Gaussian).
  chapter: "03-03"
- term: Jensen's inequality
  definition: For a convex function g, E[g(X)] ≥ g(E[X]); averaging through an exponential or square law raises the result, so leakage or failure rate at the average input underestimates the average.
  chapter: "03-03"
- term: Peak-to-average power ratio (PAPR)
  definition: Peak power over average power, the square of the crest factor; for noise-like signals such as OFDM it must be quoted at a stated CCDF probability and convention. Instruments use envelope power, in which a constant-envelope carrier is 0 dB and a complex Gaussian is 9.64 dB at 1e-4; for real waveforms a sinusoid is 3.01 dB.
  chapter: "03-03"
  see_also: [Crest factor, CCDF]
- term: CCDF
  definition: Complementary cumulative distribution function, P(X > x) = 1 − F(x); for signals, the fraction of time the instantaneous power exceeds each level above average.
  chapter: "03-03"
- term: Loading factor
  definition: An ADC's full-scale amplitude divided by the RMS of a noise-like input, k = V_FS/σ; it trades clipping noise (small k) against granular quantization noise (large k).
  chapter: "03-03"

# ---------------------------------------------------------------- 03-04
- term: Joint distribution
  definition: The joint PMF p(x, y) or PDF f(x, y) of two or more random variables, giving the probability of any combination of values; marginals alone do not determine it.
  chapter: "03-04"
- term: Marginal distribution
  definition: The distribution of one variable obtained from a joint distribution by summing or integrating out the others.
  chapter: "03-04"
- term: Conditional distribution
  definition: The distribution of Y given X = x, the joint distribution divided by the marginal of X along that slice.
  chapter: "03-04"
- term: Conditional expectation
  definition: "E[Y | X = x], the mean of the conditional distribution of Y given X = x; evaluated at the random X, E[Y | X] is itself a random variable, the minimum mean-square-error predictor of Y, and E[E[Y | X]] = E[Y] (law of iterated expectations)."
  chapter: "03-04"
- term: Law of total variance
  definition: "Var(Y) = E[Var(Y | X)] + Var(E[Y | X]): the average spread within groups plus the spread of the group means. Explains why mixed wafers, lots or tools vary far more than any one group."
  chapter: "03-04"
- term: Covariance
  definition: "Cov(X, Y) = E[(X − μ_X)(Y − μ_Y)] = E[XY] − μ_Xμ_Y; zero for independent variables, and the cross term in the variance of a sum."
  chapter: "03-04"
- term: Correlation coefficient
  definition: ρ = Cov(X, Y)/(σ_X σ_Y), between −1 and 1; it measures only linear association, so uncorrelated variables can still be dependent.
  chapter: "03-04"
- term: Moment-generating function
  definition: M(s) = E[e^{sX}]; for independent variables the MGF of a sum is the product of their MGFs, which turns convolution into multiplication.
  chapter: "03-04"
- term: Law of large numbers
  definition: The sample mean of independent, identically distributed variables converges to their expectation as the sample grows; its standard error falls like σ/√n.
  chapter: "03-04"
- term: Standard error
  definition: The standard deviation of an estimate; for the mean of n independent samples, σ/√n.
  chapter: "03-04"
- term: Central limit theorem
  definition: The standardized sum of many independent terms with finite variance tends to a Gaussian, whatever their distribution; accurate near the center, unreliable far into the tails.
  chapter: "03-04"
- term: Cauchy distribution
  definition: "The density 1/(π(1 + x²)), the ratio of two independent standard Gaussians; its tails are so heavy that it has no mean or variance, so the CLT does not apply and an average of Cauchy samples is still Cauchy."
  chapter: "03-04"
- term: Jointly Gaussian
  definition: Variables whose joint density is the multivariate normal; their marginals and linear combinations are Gaussian, and for them uncorrelated means independent.
  chapter: "03-04"
- term: Regression line
  definition: "The conditional mean E[Y | X = x] = μ_Y + ρ(σ_Y/σ_X)(x − μ_X) of jointly Gaussian variables, the best prediction of Y from X; the remaining spread is σ_Y√(1 − ρ²)."
  chapter: "03-04"
- term: Differential signaling
  definition: Sending a signal as equal and opposite voltages on two wires and receiving their difference, which doubles the signal and cancels interference common to both wires.
  chapter: "03-04"
- term: Forward error correction (FEC)
  definition: Adding redundant symbols so the receiver can correct errors without retransmission; it lets links run at a raw BER near 1e-4 and still deliver 1e-13 or better.
  chapter: "03-04"
- term: Decision-feedback equalizer (DFE)
  definition: A receiver equalizer that subtracts the interference of earlier symbols computed from its own past decisions; one wrong decision can then cause a burst of errors, which transmitter precoding limits to about two bit errors.
  chapter: "03-04"
- term: Reed–Solomon code
  definition: A block code over m-bit symbols; RS(n, k) sends n symbols with k data symbols and corrects up to t = (n − k)/2 wrong symbols per codeword, as in Ethernet's RS(544,514).
  chapter: "03-04"
- term: Uncorrectable codeword ratio
  definition: The fraction of codewords with more wrong symbols than the code can correct; for independent errors, the binomial tail P(N > t).
  chapter: "03-04"

# ---------------------------------------------------------------- 03-05
- term: Estimator
  definition: A rule for computing a parameter's value from data, such as the sample mean; the result, an estimate, is itself a random variable with a sampling distribution.
  chapter: "03-05"
- term: Bias
  definition: The difference between an estimator's expected value and the true parameter; mean square error equals bias squared plus variance.
  chapter: "03-05"
- term: Sample variance
  definition: S² = Σ(Xᵢ − X̄)²/(n − 1), unbiased for σ² because one degree of freedom is used up estimating the mean.
  chapter: "03-05"
- term: Confidence interval
  definition: An interval computed from data by a procedure that covers the true parameter in a stated fraction (for example 95%) of repeated experiments; any single interval either contains the truth or not.
  chapter: "03-05"
- term: Student t distribution
  definition: The distribution of (X̄ − μ)/(S/√n) for Gaussian data, with n − 1 degrees of freedom; heavier-tailed than the Gaussian, so small-sample intervals use larger multipliers (2.776 for ν = 4 at 95%).
  chapter: "03-05"
- term: Rule of three
  definition: With zero failures in n independent trials, the 95% upper confidence bound on the failure probability is about 3/n.
  chapter: "03-05"
- term: Hypothesis test
  definition: A decision rule that rejects a null hypothesis when data would be sufficiently unlikely under it, with a stated significance level α (false-alarm probability).
  chapter: "03-05"
- term: p-value
  definition: The probability, if the null hypothesis is true, of a test statistic at least as extreme as the one observed; not the probability that the null hypothesis is true.
  chapter: "03-05"
- term: Type I and type II errors
  definition: Rejecting a true null hypothesis (false alarm, probability α) and failing to reject a false one (missed detection, probability β).
  chapter: "03-05"
- term: Statistical power
  definition: The probability that a test rejects the null hypothesis when a specified alternative is true, 1 − β; it grows with sample size and effect size.
  chapter: "03-05"
- term: Process capability (Cp, Cpk)
  definition: "Cp = (USL − LSL)/(6σ) compares the specification window with the process spread; Cpk = min(USL − μ, μ − LSL)/(3σ) also charges for an off-center mean. Automotive defaults (AIAG, 1995 manuals): Cpk ≥ 1.33 for stable ongoing production; preliminary studies and significant characteristics are judged on Ppk, expecting ≥ 1.67."
  chapter: "03-05"
- term: Ppk
  definition: The process performance index, Cpk's formula with the overall standard deviation of all the data (including drift and lot-to-lot shifts) instead of the within-subgroup σ; equal to Cpk only for a process in statistical control.
  chapter: "03-05"
- term: Statistical process control (SPC)
  definition: "Monitoring a process with control charts, plots of subgroup statistics against limits (typically ±3 standard errors around the grand mean), to detect drift or shifts; a process whose points stay inside the limits is \"in statistical control\"."
  chapter: "03-05"
- term: Welch t-test
  definition: A two-sample test of means that does not assume equal variances, using SE = √(s₁²/n₁ + s₂²/n₂) and an approximate degrees-of-freedom formula; for paired data, test the differences instead.
  chapter: "03-05"
- term: Part Average Testing (PAT)
  definition: An automotive outlier screen (AEC-Q001) that rejects parts passing specification but lying beyond the median ± 6 robust sigma (interquartile range/1.35) of their population.
  chapter: "03-05"
- term: Hazard rate
  definition: The failure rate among survivors, h(t) = f(t)/R(t); constant for the exponential, falling for infant mortality, rising for wear-out.
  chapter: "03-05"
- term: Weibull distribution
  definition: A lifetime model with R(t) = exp(−(t/α)^γ); characteristic life α (63.2% failed) and shape γ (< 1 infant mortality, 1 random, > 1 wear-out).
  chapter: "03-05"
- term: B10 life
  definition: The time by which 10% of a population has failed, α(−ln 0.9)^(1/γ) for a Weibull; percentile lives matter more than MTTF for wear-out.
  chapter: "03-05"
- term: Accelerated life test
  definition: A test at elevated stress (temperature, voltage, humidity) that makes failures occur sooner, with an acceleration model used to translate results to use conditions.
  chapter: "03-05"
- term: Arrhenius model
  definition: A thermally activated rate ∝ exp(−E_a/(kT)); the acceleration factor between temperatures is exp[(E_a/k)(1/T_use − 1/T_stress)], exponential in the often-uncertain activation energy.
  chapter: "03-05"
- term: HTOL
  definition: High-temperature operating life test; JEDEC JESD47G (2009) specifies at least 125 °C junction temperature for 1000 h on 3 lots of 77 units with zero failures (the HTOL row of the current revision, Rev N listed Aug 2026, was not checked).
  chapter: "03-05"

# ---------------------------------------------------------------- 03-06
- term: Random process
  definition: A rule assigning a waveform to each outcome of an experiment; at any fixed time its value is a random variable, and the collection of waveforms is the ensemble.
  chapter: "03-06"
- term: Sample function
  definition: One waveform of a random process, such as the noise recorded from one particular amplifier.
  chapter: "03-06"
- term: Autocorrelation function
  definition: R_X(t₁, t₂) = E[X(t₁)X(t₂)]; for a stationary process R_X(τ), whose value at τ = 0 is the average power and whose decay measures how long the process remembers.
  chapter: "03-06"
- term: Wide-sense stationary
  definition: A random process with constant mean and an autocorrelation that depends only on the time difference τ.
  chapter: "03-06"
- term: Ergodicity
  definition: The property that time averages along one sample function converge to ensemble averages; it licenses measuring a process with one long recording. Unit-to-unit offsets are not ergodic.
  chapter: "03-06"
- term: Correlation time
  definition: The time scale τ_c over which a process's autocorrelation decays (RC for RC-filtered noise); a record of length T holds about T/(2τ_c) independent samples.
  chapter: "03-06"
- term: Power spectral density
  definition: The distribution of a stationary process's average power over frequency, in power per hertz; the Fourier transform of the autocorrelation. Circuit noise densities are usually one-sided.
  chapter: "03-06"
- term: Wiener–Khinchin theorem
  definition: For a wide-sense stationary process, the power spectral density is the Fourier transform of the autocorrelation function.
  chapter: "03-06"
- term: White noise
  definition: Noise with a flat power spectral density, so that samples at different times are uncorrelated; an idealization valid within the bandwidth of interest.
  chapter: "03-06"
- term: Thermal noise
  definition: Johnson–Nyquist noise of a resistor at temperature T, white and Gaussian with one-sided density 4kTR (V²/Hz); 4.07 nV/√Hz for 1 kΩ at 300 K.
  chapter: "03-06"
- term: Noise figure
  definition: 10 log₁₀ of the noise factor F, the ratio of a system's total output noise to the part due to a source at 290 K; a receiver's noise floor is −174 dBm/Hz + 10 log₁₀B + NF.
  chapter: "03-06"
- term: Shot noise
  definition: Noise from the random, independent arrival of discrete charges across a barrier, with one-sided density 2qI; it follows from Poisson statistics.
  chapter: "03-06"
- term: Random walk
  definition: The running sum (integral) of white noise, whose spread grows as √t without bound; it models accumulated phase error in free-running oscillators.
  chapter: "03-06"
- term: Chopper stabilization
  definition: Modulating a low-frequency signal above an amplifier's 1/f corner, amplifying it there and demodulating it, which removes offset and 1/f noise at the cost of switching artifacts; the basis of zero-drift amplifiers.
  chapter: "03-06"

# ---------------------------------------------------------------- 04-01
- term: Newton's laws of motion
  definition: "(1) A body with no net force keeps a constant velocity; (2) the net force equals the rate of change of momentum, F = dp/dt = ma for constant mass; (3) forces come in equal and opposite pairs."
  chapter: "04-01"
- term: Work
  definition: The energy transferred by a force acting along a displacement, W = ∫F·dr (J); only the component of force along the motion does work.
  chapter: "04-01"
- term: Kinetic energy
  definition: The energy of motion, ½mv² for translation and ½Iω² for rotation; by the work–energy theorem, net work equals its change.
  chapter: "04-01"
- term: Potential energy
  definition: Energy stored by position against a conservative force, with F = −dU/dx; mgh for gravity near the Earth and ½k_s x² for a spring.
  chapter: "04-01"
- term: Momentum
  definition: The product p = mv (kg·m/s); conserved in an isolated system, and changed only by impulse.
  chapter: "04-01"
- term: Impulse
  definition: The time integral of force, J = ∫F dt (N·s), equal to the change in momentum; a short, violent impact and a longer, gentler stop can carry the same impulse.
  chapter: "04-01"
- term: Torque
  definition: The turning effect of a force, τ = rF⊥ (N·m); for rotation it plays the role of force, and mechanical power is P = τω.
  chapter: "04-01"
- term: Moment of inertia
  definition: Rotational inertia, I = Σ m r² (kg·m²); ½MR² for a uniform disk. It plays the role of mass in rotation.
  chapter: "04-01"
- term: Simple harmonic oscillator
  definition: A system whose restoring force is proportional to displacement, m ẍ = −k_s x, which oscillates sinusoidally at ω₀ = √(k_s/m) while energy sloshes between kinetic and potential stores.
  chapter: "04-01"
  see_also: [Quality factor, Force–voltage analogy]
- term: Force–voltage analogy
  definition: The mapping of a mass–spring–damper onto a series RLC circuit (force ↔ voltage, velocity ↔ current, mass ↔ L, damping ↔ R, compliance 1/k_s ↔ C); it turns mechanical systems into circuits that SPICE can simulate.
  chapter: "04-01"
- term: MEMS
  definition: Micro-electro-mechanical systems, mechanical structures (springs, masses, membranes, resonators) a few micrometers in size made with semiconductor processes and read out electrically; accelerometers, gyroscopes, microphones and timing resonators are MEMS.
  chapter: "04-01"
- term: Proof mass
  definition: The suspended mass in an accelerometer or gyroscope whose displacement relative to its package measures acceleration (deflection a/ω₀² below resonance) or rotation.
  chapter: "04-01"
- term: Thermomechanical noise
  definition: The random force 4kTb (N²/Hz) that the damping gas exerts on a mechanical structure, the twin of a resistor's 4kTR; it sets an accelerometer's noise floor √(4kTω₀/(mQ)).
  chapter: "04-01"

# ---------------------------------------------------------------- 04-02
- term: Electric charge
  definition: The property that makes matter feel electric forces; it comes in two signs, is conserved, and is quantized in multiples of the elementary charge. Measured in coulombs (1 C = 1 A·s).
  chapter: "04-02"
- term: Elementary charge
  definition: The charge of a proton, e = 1.602176634 × 10⁻¹⁹ C exactly (an electron carries −e); one coulomb is 6.242 × 10¹⁸ elementary charges.
  chapter: "04-02"
- term: Coulomb's law
  definition: The force between point charges, F = q₁q₂/(4πε₀r²) along the line joining them; repulsive for like signs, attractive for unlike, falling as the inverse square of distance.
  chapter: "04-02"
- term: Vacuum permittivity
  definition: The constant ε₀ = 8.854 × 10⁻¹² F/m that sets the strength of electric forces in vacuum (k_e = 1/(4πε₀) ≈ 8.988 × 10⁹ N·m²/C²); measured, not exact, since the 2019 SI redefinition.
  chapter: "04-02"
- term: Electric field
  definition: The force per unit charge a small test charge would feel at a point, E = F/q (V/m); a point charge's field is q/(4πε₀r²) pointing away from a positive charge.
  chapter: "04-02"
- term: Superposition (electrostatics)
  definition: The principle that the field (or force) of many charges is the vector sum of their individual fields; for continuous charge the sum becomes an integral.
  chapter: "04-02"
- term: Charge density
  definition: Charge per unit length (λ, C/m), area (σ, C/m²) or volume (ρ, C/m³), used to integrate the fields of continuous distributions.
  chapter: "04-02"
- term: Electric dipole
  definition: Charges ±q a distance d apart, with dipole moment p = qd pointing from − to +; its far field falls as 1/r³, and in a uniform field it feels torque pE sin θ but no net force.
  chapter: "04-02"
- term: Dielectric breakdown
  definition: The sudden failure of an insulator when the field is strong enough to tear electrons loose and start an avalanche; about 3 MV/m in air and above 10 MV/cm in thermal SiO₂.
  chapter: "04-02"
- term: Electrostatic discharge (ESD)
  definition: The sudden flow of charge between objects at different potentials, typically a spark from a charged person or device; ICs are protected on-chip and qualified against standard ESD models.
  chapter: "04-02"
- term: Human-body model (HBM)
  definition: The component ESD test of ANSI/ESDA/JEDEC JS-001, modeling a charged person as 100 pF discharged through 1.5 kΩ (peak current 0.667 A per kV); the industry-recommended qualification target is 1 kV.
  chapter: "04-02"
- term: Charged-device model (CDM)
  definition: The component ESD test of JS-002, modeling a charged device discharging quickly to ground through one pin; the industry-recommended target is 250 V, trending lower for high-speed parts.
  chapter: "04-02"

# ---------------------------------------------------------------- 04-03
- term: Electric flux
  definition: The surface integral of the electric field's normal component, Φ = ∬ E · n̂ dA (V·m); it counts field lines crossing a surface, and through a closed surface it equals the enclosed charge over ε₀.
  chapter: "04-03"
  see_also: [Flux, Gauss's law]
- term: Gaussian surface
  definition: An imaginary closed surface chosen to apply Gauss's law, ideally one on which the field is constant and perpendicular (or parallel, carrying no flux), such as a sphere, coaxial cylinder or pillbox.
  chapter: "04-03"
- term: Solid angle
  definition: The 3-D analogue of an angle, Ω = A/r², the area a cone cuts from a sphere over the radius squared, in steradians; a full sphere is 4π sr.
  chapter: "04-03"
- term: Electrostatic equilibrium
  definition: The state of a conductor whose free charges have stopped moving; the field inside the metal is zero, net charge sits on the surface, and the field just outside is perpendicular with magnitude σ/ε₀.
  chapter: "04-03"
- term: Surface charge density
  definition: Charge per unit area, σ (C/m²); on a conductor it is largest where the surface curves most sharply, and the field just outside is σ/ε₀.
  chapter: "04-03"
- term: Faraday cage
  definition: A closed conducting enclosure; its empty interior has zero electrostatic field whatever the outside charges, and it shields both ways only when grounded. Seams, apertures and low-frequency magnetic fields limit real shields.
  chapter: "04-03"
- term: Grounding
  definition: Connecting a conductor to a large charge reservoir (the earth or a circuit's ground plane) that can supply or absorb charge freely, fixing its potential and draining the charge induced on its outer surface.
  chapter: "04-03"
- term: Relative permittivity
  definition: The factor ε_r by which a material's polarization reduces the field of a given free charge, so that ε = ε_r ε₀; about 11.7 for silicon and 3.9 for thermal SiO₂.
  chapter: "04-03"
- term: Depletion region
  definition: The layer around a pn junction stripped of mobile carriers, leaving fixed ionized dopants (−qN_A on the p side, +qN_D on the n side); Gauss's law gives its triangular field, peaking at the junction.
  chapter: "04-03"
- term: Capacitive sensing
  definition: Detecting a finger or object by the change it makes in an electrode's capacitance; self-capacitance sensing sees a finger add C_F to the pad's parasitic C_P, mutual-capacitance sensing sees the transmit-receive coupling fall.
  chapter: "04-03"
- term: Coaxial line
  definition: An inner conductor inside a coaxial outer conductor carrying equal and opposite charge; the field λ/(2πε₀r) is confined between them, strongest at the inner conductor, and zero outside.
  chapter: "04-03"

# ---------------------------------------------------------------- 04-04
- term: Electric potential
  definition: Potential energy per unit charge, V = U/q (volts, J/C), defined because the electrostatic field is conservative; V_b − V_a = −∫ E · dl, a point charge gives k_e q/r, and potentials add as scalars.
  chapter: "04-04"
  see_also: [Conservative field, Equipotential]
- term: Equipotential
  definition: A surface (or line) of constant potential; moving along it takes no work, field lines cross it at right angles, and every conductor in equilibrium is one.
  chapter: "04-04"
- term: Capacitance
  definition: The charge a pair of conductors holds per volt of potential difference, C = Q/V (farads); it depends only on geometry and the insulator, e.g. ε A/d for parallel plates and 2πεℓ/ln(b/a) for a coax.
  chapter: "04-04"
- term: Dielectric
  definition: An insulator that polarizes in an electric field, reducing the field of a given free charge by its relative permittivity ε_r and raising a capacitor's capacitance by the same factor.
  chapter: "04-04"
  see_also: [Relative permittivity]
- term: Polarization (dielectric)
  definition: The dipole moment per unit volume P (C/m²) induced in a dielectric by electronic, ionic or orientational response; at the dielectric's faces it appears as bound surface charge σ_b = P.
  chapter: "04-04"
- term: Electric displacement
  definition: The field D = ε₀E + P = εE (C/m²), whose flux through a closed surface equals the enclosed free charge; its normal component is continuous across a boundary without free charge.
  chapter: "04-04"
- term: Equivalent oxide thickness (EOT)
  definition: The SiO₂ thickness giving the same capacitance per area as a gate stack, EOT = Σ t_i × 3.9/ε_r,i; a 2 nm HfO₂ layer (ε_r = 25) counts as 0.312 nm.
  chapter: "04-04"
- term: High-k dielectric
  definition: An insulator with permittivity well above SiO₂'s 3.9 (HfO₂ and ZrO₂ about 25), used in transistor gates and DRAM capacitors to get high capacitance from a physically thicker, less leaky film.
  chapter: "04-04"
- term: Low-k dielectric
  definition: An interconnect insulator with permittivity below SiO₂'s 3.9 (SiOF, carbon-doped SiOCH at 2.7–3.0, porous films below 2.5, air gaps at 1), used to cut wire capacitance, delay and power.
  chapter: "04-04"
- term: Multilayer ceramic capacitor (MLCC)
  definition: A capacitor of many thin ceramic layers interleaved with electrodes; class 1 (C0G) is stable, while class 2 (X5R, X7R) uses BaTiO₃ with ε_r in the thousands and loses capacitance with DC bias and temperature.
  chapter: "04-04"
- term: Electric energy density
  definition: The energy stored per unit volume in an electric field, u = ½εE² (J/m³); integrated over space it equals a capacitor's ½CV², and in a vacuum gap it equals the electrostatic pressure on the conductors.
  chapter: "04-04"
- term: Charge sharing
  definition: Connecting capacitors at different voltages so their charge redistributes to a common voltage; charge is conserved but energy is lost (half, for equal capacitors), and it is how a DRAM cell is read onto its bit line.
  chapter: "04-04"

# ---------------------------------------------------------------- 04-05
- term: Electric current
  definition: The rate at which charge crosses a surface, I = dQ/dt (amperes); conventional current points the way positive charge would move, opposite to electron motion in a metal.
  chapter: "04-05"
- term: Current density
  definition: Current per unit area as a vector field, J = nqv_d (A/m²); the current through a surface is the flux of J, and J = σE in an ohmic material.
  chapter: "04-05"
- term: Continuity equation
  definition: Charge conservation in local form, ∇ · J = −∂ρ/∂t; integrated over a node that stores no charge it becomes Kirchhoff's current law.
  chapter: "04-05"
- term: Drift velocity
  definition: The small average velocity carriers acquire from a field on top of their fast random motion; about 74 µm/s for 1 A in 1 mm² of copper.
  chapter: "04-05"
- term: Drude model
  definition: The classical picture of conduction in which carriers accelerate in a field and lose their momentum in random collisions every τ on average, giving σ = ne²τ/m and Ohm's law.
  chapter: "04-05"
- term: Mobility
  definition: Drift speed per unit field, µ = eτ/m (cm²/V·s); copper about 44, lightly doped silicon about 1400 for electrons and 470 for holes. Conductivity is neµ.
  chapter: "04-05"
- term: Resistivity
  definition: The material property ρ = 1/σ (Ω·m) that sets resistance R = ρL/A; copper is 1.68 µΩ·cm in bulk and rises with temperature and in wires narrower than its mean free path.
  chapter: "04-05"
- term: Ohm's law
  definition: Current proportional to voltage, V = IR, or locally J = σE; it holds for metals and doped semiconductors at moderate fields and fails at high fields, high frequencies, very short lengths and in junctions.
  chapter: "04-05"
- term: Mean free path
  definition: The average distance a carrier travels between scattering events, λ = v_F τ; about 39–40 nm for electrons in copper at room temperature, which is why narrower copper wires lose conductivity.
  chapter: "04-05"
- term: Sheet resistance
  definition: The resistance of a square of a thin film, R_s = ρ/t (Ω/□); a trace's resistance is R_s times its number of squares, L/W.
  chapter: "04-05"
- term: Temperature coefficient of resistance
  definition: The fractional change of resistance per degree, α in ρ = ρ₀[1 + α(T − T₀)]; 0.00393 /°C for annealed copper at 20 °C, negative for semiconductors and thermistors.
  chapter: "04-05"
- term: Joule heating
  definition: The conversion of electrical energy to heat in a resistance, P = I²R = V²/R, or locally p = J · E = ρJ² per unit volume.
  chapter: "04-05"
- term: Electromigration
  definition: The slow drift of metal atoms pushed by the electron current at high current density, forming voids and hillocks; it caps the DC current density in on-chip wires, especially power grids.
  chapter: "04-05"
- term: Distributed RC line
  definition: A wire whose resistance and capacitance are spread along its length; driven by a step, its far end reaches 50% at about 0.38 RC, so delay grows as length squared.
  chapter: "04-05"
- term: Backside power delivery
  definition: Routing a chip's power supply through thick wires on the back of the thinned wafer, freeing front-side wiring for signals and cutting IR drop; Intel ships it as PowerVia on 18A, and TSMC plans it for A16.
  chapter: "04-05"

# ---------------------------------------------------------------- 04-06
- term: Magnetic field
  definition: The field B (tesla; 1 T = 10⁴ gauss) that exerts force qv × B on moving charges; produced by currents and magnetic moments, with field lines that always close on themselves.
  chapter: "04-06"
- term: Lorentz force
  definition: The total electromagnetic force on a charge, F = q(E + v × B); the magnetic part is perpendicular to the velocity and does no work.
  chapter: "04-06"
- term: Cyclotron frequency
  definition: The orbital frequency of a charge in a uniform magnetic field, f_c = |q|B/(2πm), independent of speed; 28.0 GHz per tesla for an electron.
  chapter: "04-06"
- term: Magnetic dipole moment
  definition: m = NIA for a current loop (A·m²), pointing along the loop's normal; in a field it feels torque m × B and has energy −m · B, and far away it makes a 1/r³ dipole field.
  chapter: "04-06"
- term: Biot–Savart law
  definition: The field of a current element, dB = (µ₀/4π) I dl × r̂ / r²; integrated, it gives µ₀I/(2πr) for a long wire and µ₀I/(2R) at the center of a loop.
  chapter: "04-06"
- term: Vacuum permeability
  definition: The constant µ₀ = 1.25663706127 × 10⁻⁶ N/A² (CODATA 2022), measured since the 2019 SI redefinition and within a part in 10⁹ of 4π × 10⁻⁷.
  chapter: "04-06"
- term: Ampere's law
  definition: (Ampère's law.) For steady currents, ∮ B · dl = µ₀ I_enc around any closed loop; with symmetry it gives the fields of wires, solenoids (µ₀nI), toroids and coaxial cables (zero outside).
  chapter: "04-06"
- term: Solenoid
  definition: A long helical coil whose interior field is nearly uniform, B = µ₀nI with n turns per meter, and whose exterior field is small.
  chapter: "04-06"
- term: Hall effect
  definition: The transverse voltage V_H = IB/(nqt) across a current-carrying conductor in a magnetic field; its sign gives the carrier type and its size the carrier density, and semiconductor Hall plates make magnetic sensors.
  chapter: "04-06"
- term: Relative permeability
  definition: The factor µ_r in B = µ_r µ₀ H for a linear magnetic material; near 1 for most materials, hundreds to tens of thousands for ferromagnets below saturation.
  chapter: "04-06"
- term: Ferromagnetism
  definition: Strong, spontaneous alignment of atomic magnetic moments in domains (iron, nickel, cobalt, ferrites), giving high permeability, saturation and hysteresis.
  chapter: "04-06"
- term: Saturation flux density
  definition: The flux density B_s at which a ferromagnetic core is fully magnetized; beyond it the core adds nothing and inductance collapses. About 0.49 T for N87 ferrite at 25 °C (0.39 T at 100 °C), 1.5–1.8 T for silicon steel.
  chapter: "04-06"
- term: Hysteresis (magnetic)
  definition: The dependence of a ferromagnet's B on its magnetic history, traced as a B–H loop; soft materials (cores) have narrow loops, hard materials (permanent magnets) wide ones.
  chapter: "04-06"
- term: Magnetic tunnel junction
  definition: Two ferromagnetic layers separated by a nanometer-thin oxide whose tunneling resistance depends on whether their magnetizations are parallel; the storage element of MRAM.
  chapter: "04-06"

# ---------------------------------------------------------------- 04-07
- term: Magnetic flux
  definition: The surface integral of B, Φ = ∬ B · dA, in webers (1 Wb = 1 T·m² = 1 V·s); its rate of change induces EMF.
  chapter: "04-07"
- term: Faraday's law
  definition: The EMF around a closed loop equals minus the rate of change of magnetic flux through it, ℰ = −N dΦ/dt; changing flux makes the electric field non-conservative, so voltage then depends on the path.
  chapter: "04-07"
  see_also: [Lenz's law]
- term: Lenz's law
  definition: The induced current flows so as to oppose the change in flux that produced it (the minus sign in Faraday's law), a consequence of energy conservation.
  chapter: "04-07"
- term: Motional EMF
  definition: The EMF Bℓv across a conductor of length ℓ moving at speed v through a field B, the Lorentz force on its charges; the basis of generators.
  chapter: "04-07"
- term: Back-EMF
  definition: The EMF a running motor's rotating coil generates against its supply, proportional to speed; it limits running current, so a stalled motor draws far more current than a spinning one.
  chapter: "04-07"
- term: Eddy currents
  definition: Currents induced in bulk conductors by changing magnetic flux; they cause braking, heating and core loss, which laminated and ferrite cores reduce.
  chapter: "04-07"
- term: Inductance
  definition: Flux linkage per ampere, L = NΦ/i (henries), so that v = L di/dt; a long solenoid has µ₀N²A/ℓ, a core with reluctance R has N²/R. It scales as turns squared.
  chapter: "04-07"
- term: Reluctance
  definition: The magnetic-circuit analogue of resistance, R = l/(µ_r µ₀ A) (A/Wb); flux = NI/R, series reluctances add, and a small air gap often dominates a core's reluctance.
  chapter: "04-07"
- term: Mutual inductance
  definition: The flux linked in one coil per ampere in another, M (henries), so that v₂ = M di₁/dt; M = k√(L₁L₂).
  chapter: "04-07"
- term: Coupling coefficient
  definition: k = M/√(L₁L₂), from 0 (no shared flux) to 1 (all flux shared); near 1 for windings on a common core, much lower for separated coils such as a wireless charger's.
  chapter: "04-07"
- term: Magnetic energy density
  definition: The energy per unit volume in a magnetic field, u = B²/(2µ) (about 0.4 MJ/m³ at 1 T in air); in a gapped core most of the energy sits in the gap.
  chapter: "04-07"
- term: Transformer
  definition: Windings sharing a magnetic flux; ideally v₂/v₁ = N₂/N₁, i₂/i₁ = N₁/N₂ and impedances scale by (N₁/N₂)². It needs changing flux and provides galvanic isolation.
  chapter: "04-07"
- term: Self-resonant frequency
  definition: The frequency at which an inductor's winding capacitance resonates with its inductance; above it the part behaves as a capacitor, not an inductor.
  chapter: "04-07"

# ---------------------------------------------------------------- 04-08
- term: Displacement current
  definition: The term ε₀ dΦ_E/dt that Maxwell added to Ampère's law; a changing electric field makes a magnetic field as a current does, so a charging capacitor's gap carries a displacement current equal to its lead current.
  chapter: "04-08"
- term: Maxwell's equations
  definition: Gauss's law, Gauss's law for magnetism, Faraday's law and the Ampère–Maxwell law; with the Lorentz force they are all of classical electromagnetism and predict waves travelling at 1/√(µ₀ε₀) = c.
  chapter: "04-08"
- term: Electromagnetic wave
  definition: Self-sustaining oscillating E and B fields, perpendicular to each other and to the direction of travel, with E = cB; speed c/√ε_r in a dielectric. Radio, light and board signals are all such waves.
  chapter: "04-08"
- term: Impedance of free space
  definition: η₀ = √(µ₀/ε₀) ≈ 376.7 Ω, the ratio E/H in a plane wave in vacuum; η₀/√ε_r in a dielectric.
  chapter: "04-08"
- term: Poynting vector
  definition: S = E × B/µ₀ (W/m²), the power flow per unit area in an electromagnetic field; it shows energy entering resistors and capacitors through the surrounding fields, and gives a plane wave's intensity E₀²/(2η₀).
  chapter: "04-08"
- term: Loss tangent
  definition: tan δ, the ratio of a dielectric's lossy to stored response; it makes waves decay at about πf√ε_r tan δ / c nepers per meter, about 0.025 for FR-4-class laminates and 0.004 for low-loss ones at 10 GHz.
  chapter: "04-08"
- term: Specific absorption rate (SAR)
  definition: RF power absorbed per kilogram of tissue (W/kg); exposure limits include 1.6 W/kg averaged over 1 g (US FCC) and 2 W/kg over 10 g (ICNIRP), so limits must be compared with their averaging mass.
  chapter: "04-08"

# ---------------------------------------------------------------- 04-09
- term: Wave equation
  definition: ∂²y/∂x² = (1/v²)∂²y/∂t², satisfied by any shape travelling as f(x ∓ vt); v = √(T/µ) on a string, ≈ 343 m/s for sound in air, c/n for light.
  chapter: "04-09"
- term: Interference
  definition: The addition of waves arriving with different phases; constructive where path differences are whole wavelengths, destructive at half-wavelengths, redistributing (not destroying) energy.
  chapter: "04-09"
- term: Phased array
  definition: A row or grid of antennas fed with progressive phase steps so their waves add in a chosen direction, sin θ = Δφ/(kd); steers beams electronically and needs spacing near λ/2 to avoid grating lobes.
  chapter: "04-09"
- term: Standing wave
  definition: The sum of equal waves travelling in opposite directions, 2A cos(kx) cos(ωt), with fixed nodes half a wavelength apart; confined between reflectors it sets resonant modes such as f_n = nv/(2L).
  chapter: "04-09"
- term: Diffraction
  definition: The spreading of a wave through an aperture or around an edge by about λ/aperture radians; a slit's first zero is at sin θ = λ/a, a circular aperture's at 1.22λ/D.
  chapter: "04-09"
- term: Rayleigh criterion
  definition: Two point sources are just resolved when one's diffraction peak falls on the other's first dark ring, 1.22λ/D apart in angle; in lithography the analogous limit is CD = k₁λ/NA with k₁ ≥ 0.25.
  chapter: "04-09"
- term: Numerical aperture
  definition: NA = n sin θ_max, the half-angle of the cone of light a lens or fiber accepts; it sets lithography resolution (∝ 1/NA) and fiber acceptance (√(n₁² − n₂²)).
  chapter: "04-09"
- term: Snell's law
  definition: n₁ sin θ₁ = n₂ sin θ₂ for refraction at a boundary (angles from the normal), from requiring wavefronts to match along the surface.
  chapter: "04-09"
- term: Total internal reflection
  definition: Complete reflection of light going from higher to lower index at angles beyond the critical angle sin θ_c = n₂/n₁; it guides light in optical fibers and silicon waveguides.
  chapter: "04-09"
- term: Optical fiber
  definition: A glass core of slightly higher index than its cladding that guides light by total internal reflection; single-mode fiber (≈ 9 µm core) for long reach, multimode for short links at 850 nm.
  chapter: "04-09"
- term: Chromatic dispersion
  definition: The spreading of a light pulse because different wavelengths travel at different speeds; about 17 ps/(nm·km) at 1550 nm and near zero at 1310 nm in standard single-mode fiber.
  chapter: "04-09"
- term: Polarization (light)
  definition: The direction in which a transverse wave's electric field oscillates; a polarizer transmits I₀ cos²θ (Malus's law), and reflection at Brewster's angle tan θ_B = n₂/n₁ removes one polarization.
  chapter: "04-09"
- term: Co-packaged optics
  definition: Optical engines placed in the same package as a switch or processor chip, shortening the electrical path to cut power per bit; announced by NVIDIA and Broadcom for 2025–2026 switches (as of Nov 2026).
  chapter: "04-09"
# ---- 04-10
- term: Photon
  definition: The quantum of light, a packet of energy E = hf = hc/λ (1239.84 eV·nm divided by the wavelength) and momentum h/λ; light is emitted and absorbed one photon at a time.
  chapter: "04-10"
- term: Photoelectric effect
  definition: Ejection of electrons from a surface by light, which occurs only if each photon's energy exceeds the work function; the maximum kinetic energy hf − φ grows with frequency, not intensity.
  chapter: "04-10"
- term: Work function
  definition: The minimum energy φ needed to remove an electron from a material's surface into vacuum, typically 2–6 eV; it sets the photoelectric threshold and the tunneling barrier in field emission and STM.
  chapter: "04-10"
- term: Responsivity
  definition: A photodetector's output current per unit optical power, R = ηeλ/(hc) = ηλ[µm]/1.24 A/W, where η is the quantum efficiency (electrons per incident photon).
  chapter: "04-10"
- term: De Broglie wavelength
  definition: The wavelength λ = h/p associated with a particle of momentum p; about 0.12 nm for a 100 eV electron, comparable to atomic spacings, which is why electrons diffract from crystals.
  chapter: "04-10"
- term: Wavefunction
  definition: The complex amplitude ψ(x, t) that describes a quantum particle; |ψ|² is the probability density of finding it at x, and the total probability integrates to 1.
  chapter: "04-10"
- term: Uncertainty principle
  definition: Heisenberg's limit Δx·Δp ≥ ħ/2 on how sharply position and momentum can both be defined; confinement to a small region forces a momentum spread and hence a minimum kinetic energy.
  chapter: "04-10"
- term: Schrodinger equation
  definition: The wave equation of quantum mechanics, −(ħ²/2m)ψ″ + Vψ = Eψ in its time-independent 1-D form; its allowed solutions give the energy levels of wells, atoms and crystals. (Written Schrödinger in the text.)
  chapter: "04-10"
- term: Quantum confinement
  definition: The rise and spreading of energy levels when a particle is squeezed into a region comparable to its de Broglie wavelength, E_n = n²h²/(8mL²) for an infinite well; it tunes quantum-well lasers and quantum-dot colors.
  chapter: "04-10"
- term: Quantum tunneling
  definition: Passage of a particle through a barrier higher than its energy, with probability falling roughly as e^(−2κd), κ = √(2m(V₀ − E))/ħ; it causes gate-oxide leakage and enables flash memory, STM and tunnel diodes.
  chapter: "04-10"
- term: Fowler–Nordheim tunneling
  definition: Tunneling through a triangular barrier formed when a strong field tilts an insulator's band; the current rises steeply with field (about seven orders of magnitude from 7 to 10 MV/cm in SiO₂) and is used to program and erase flash.
  chapter: "04-10"
- term: Qubit
  definition: A two-level quantum system in a superposition α|0⟩ + β|1⟩ with |α|² + |β|² = 1; measurement returns 0 or 1 with probabilities |α|² and |β|², and n qubits need 2ⁿ amplitudes to describe classically.
  chapter: "04-10"
# ---- 04-11
- term: Crystal lattice
  definition: A periodic array of points in space at each of which an identical group of atoms (the basis) sits; silicon is a diamond lattice, two interpenetrating face-centered cubic lattices, with 8 atoms per cubic cell of side 0.5431 nm.
  chapter: "04-11"
- term: Fermi energy
  definition: The highest occupied electron energy at absolute zero, E_F = (ħ²/2m)(3π²n)^(2/3) for a free-electron gas (about 7 eV in copper); at finite temperature the Fermi level is the energy whose occupation probability is one half.
  chapter: "04-11"
- term: Fermi–Dirac distribution
  definition: The probability f(E) = 1/(1 + e^((E − E_F)/kT)) that an electron state of energy E is occupied in equilibrium; it falls from 0.9 to 0.1 over about 4.4 kT and reduces to the Boltzmann factor far above E_F.
  chapter: "04-11"
- term: Density of states
  definition: The number of electron states per unit energy (and per unit volume), g(E) ∝ √E for free electrons; multiplied by the occupation f(E) it gives how many electrons sit at each energy.
  chapter: "04-11"
- term: Phonon
  definition: A quantum of lattice vibration; phonons carry heat, scatter electrons (raising a metal's resistance with temperature) and supply the crystal momentum for light absorption or emission in indirect-gap semiconductors.
  chapter: "04-11"
- term: Energy band
  definition: A range of closely spaced allowed electron energies in a crystal, formed when each atomic level of N coupled atoms splits into N levels; each band holds two electrons per primitive cell.
  chapter: "04-11"
- term: Band gap
  definition: The range of energies with no allowed electron states between the top of the valence band and the bottom of the conduction band, E_g = E_c − E_v (1.12 eV in silicon); it sets intrinsic carrier density, absorption edge and breakdown strength.
  chapter: "04-11"
- term: Bloch's theorem
  definition: In a periodic potential the electron eigenstates are plane waves times a function with the lattice period, ψ_k(x) = e^(ikx) u_k(x); such waves travel through a perfect crystal without scattering.
  chapter: "04-11"
- term: Effective mass
  definition: The mass m* = ħ²/(d²E/dk²) with which an electron in a band responds to external forces, set by the band's curvature; light effective masses mean high mobility.
  chapter: "04-11"
- term: Hole
  definition: An empty state near the top of an otherwise full valence band, which carries current as a positive charge with positive effective mass; holes are the carriers of p-type silicon and PMOS transistors.
  chapter: "04-11"
- term: Intrinsic carrier concentration
  definition: The electron (and equal hole) density of a pure semiconductor, n_i = √(N_c N_v) e^(−E_g/2kT); about 9.65×10⁹ cm⁻³ for silicon at 300 K and rising several hundredfold by 400 K.
  chapter: "04-11"
- term: Direct band gap
  definition: A band gap whose conduction-band minimum lies at the same crystal momentum as the valence-band maximum (GaAs, GaN), so electrons and holes recombine by emitting light efficiently; indirect gaps (Si, Ge, SiC) need a phonon.
  chapter: "04-11"
- term: Wide-bandgap semiconductor
  definition: A semiconductor with a gap well above silicon's, chiefly SiC (about 3.2–3.26 eV) and GaN (3.4 eV), whose high breakdown field and negligible intrinsic carriers suit high-voltage, high-temperature and fast-switching power devices.
  chapter: "04-11"
# ---- 05-01
- term: Interpreter
  definition: A program that reads source code and executes it at run time (Python compiles it to bytecode first), with no separate build step; mistakes surface only when the offending line runs.
  chapter: "05-01"
- term: Virtual environment
  definition: A per-project folder holding a Python interpreter and its own installed packages, so library versions can be pinned per project (created with python -m venv and filled from requirements.txt).
  chapter: "05-01"
- term: Dynamic typing
  definition: Types belong to objects, not to names, so a name can refer to values of different types over time; checked at run time (type hints document intent but do not enforce it).
  chapter: "05-01"
- term: Floor division
  definition: Division that rounds the quotient down toward minus infinity (Python's //), paired with a remainder (%) that takes the divisor's sign; −7 // 2 is −4 in Python but C's integer division gives −3.
  chapter: "05-01"
- term: Floating-point number
  definition: A number stored as sign, exponent and fraction in binary; IEEE 754 binary64 (Python float, C double) has 53 significant bits (about 16 decimal digits), so most decimals such as 0.1 are approximated.
  chapter: "05-01"
- term: Mutable object
  definition: An object whose contents can change after creation (Python lists, dicts, sets); immutable objects (numbers, strings, tuples) cannot, which makes sharing them safe.
  chapter: "05-01"
- term: Aliasing (programming)
  definition: Two or more names referring to the same object, so a change made through one is visible through the others; assignment in Python never copies.
  chapter: "05-01"
- term: List comprehension
  definition: A one-expression loop that builds a list, such as [r * 1000 for r in values if r > 0]; dict and set comprehensions work the same way.
  chapter: "05-01"
- term: Exception
  definition: An object signalling an error that stops normal execution until handled by try/except; raising one with a clear message is how code refuses invalid input instead of returning a wrong value.
  chapter: "05-01"
- term: Traceback
  definition: The report Python prints when an exception is not handled, listing the chain of calls that led to the error and ending with the failing line and the exception message; read it from the bottom up.
  chapter: "05-01"
- term: Module (Python)
  definition: A .py file whose functions and names are loaded with import; a package is a folder of modules, and the standard library and pip-installed packages are both used this way.
  chapter: "05-01"
# ---- 05-02
- term: Vectorization
  definition: Writing a computation as operations on whole arrays so compiled library code does the looping, typically 10 to 100 times faster than an element-by-element Python loop.
  chapter: "05-02"
- term: dtype
  definition: The single element type of a NumPy array (int8, uint8, int64, float32, float64, complex128, bool), fixing its range, precision and memory use.
  chapter: "05-02"
- term: Broadcasting
  definition: NumPy's rule for combining arrays of different shapes; trailing axes must match or be 1, and size-1 axes are stretched without copying, so a column and a row combine into a full table.
  chapter: "05-02"
- term: View (NumPy)
  definition: An array that shares memory with another, as produced by basic slicing, reshaping and transposing; writing through a view changes the original, unlike a copy.
  chapter: "05-02"
- term: Boolean mask
  definition: An array of True/False values from an elementwise comparison, used to select elements (x[mask]) or count them (mask.sum()); combine masks with &, | and ~.
  chapter: "05-02"
- term: NaN
  definition: Not a Number, the IEEE 754 value produced by undefined operations such as 0/0; it propagates through arithmetic and compares unequal to everything, including itself.
  chapter: "05-02"
- term: Integer overflow
  definition: A result outside a fixed-width integer type's range; in NumPy arrays and C it wraps around modulo 2^n (uint8 200 + 100 = 44) rather than raising an error.
  chapter: "05-02"
- term: Random seed
  definition: The starting value of a pseudo-random generator (np.random.default_rng(seed)); the same seed reproduces the same numbers, making simulations and tests repeatable.
  chapter: "05-02"
- term: Root-finding
  definition: Solving f(x) = 0 numerically, the way a nonlinear circuit (a diode with a resistor) is solved; bracketing methods need an interval where f changes sign, while guess-based methods need a good starting point and can fail silently.
  chapter: "05-03"
  see_also: [Bisection method, Brent's method, Newton's method]
- term: Brent's method
  definition: A bracketing root-finder (SciPy's brentq) that combines bisection's guaranteed convergence with faster secant and inverse-quadratic steps; it never leaves the bracket and typically needs a few times fewer evaluations than bisection.
  chapter: "05-03"
  see_also: [Root-finding, Bisection method]
- term: Nonlinear least squares
  definition: Fitting a model whose parameters enter nonlinearly (such as a time constant in an exponential) by iteratively minimizing the sum of squared residuals from a starting guess, as SciPy's curve_fit does; it also estimates the parameters' standard errors.
  chapter: "05-03"
  see_also: [Least squares, Residual]
- term: Residual
  definition: The difference between a measured value and a model's prediction (or, in root-finding, the value f(x) at a claimed root); random residuals at the noise level mean the model is adequate, while a systematic pattern means physics is missing.
  chapter: "05-03"
- term: Symbolic computation
  definition: Manipulating formulas exactly, with symbols rather than numbers (SymPy solves, simplifies, differentiates and integrates); used to derive or check hand results and to keep exact rationals such as 470000/53.
  chapter: "05-03"
- term: Jupyter notebook
  definition: A document (.ipynb, stored as JSON) of Markdown and code cells whose code runs in a separate kernel process; it saves outputs with the code, so a saved notebook shows results that may not match a fresh run.
  chapter: "05-04"
  see_also: [Hidden state]
- term: Hidden state
  definition: Values held in a notebook kernel's memory that the visible code, read top to bottom, does not explain (from deleted, edited or out-of-order cells); cured by restarting the kernel and running all cells.
  chapter: "05-04"
- term: Version control
  definition: Recording every saved state of a project's files with author, date and reason, so changes can be compared, attributed and undone; git is the standard tool.
  chapter: "05-04"
  see_also: [Commit]
- term: Commit
  definition: In git, a permanent snapshot of the staged project plus its author, date, message and parent commit, named by a hash of its content; commits chain into the project's history.
  chapter: "05-04"
- term: Cryptographic hash
  definition: A function (SHA-1, SHA-256) mapping any data to a fixed-length fingerprint such that any change to the input changes about half the output bits and collisions are infeasible to find; git names files and commits by such hashes.
  chapter: "05-04"
- term: Unit test
  definition: A small automated check that runs one function or module on chosen inputs and asserts the result (a hand-worked case, a symmetry, a bound or an expected error); pytest is the standard Python runner.
  chapter: "05-04"
  see_also: [Regression test, Self-checking testbench]
- term: Regression test
  definition: A test kept permanently in a suite to make sure a fixed bug or a verified behavior does not silently return; in chip design, the nightly regression is the whole suite of such tests.
  chapter: "05-04"
- term: Assertion
  definition: A statement (assert condition) that stops the program if a condition the code relies on is false; used for internal invariants and tests, not for validating input, because python -O removes assertions.
  chapter: "05-04"
- term: Continuous integration
  definition: CI; automatically building and testing a project on a clean machine every time a change is pushed, so problems that depend on one person's setup are caught within minutes.
  chapter: "05-04"
- term: Reproducibility
  definition: The property that someone else can regenerate a result from the recorded code, data and environment and get the same numbers; achieved by scripting every step, pinning versions, seeding randomness and fingerprinting data.
  chapter: "05-04"
- term: Compiler
  definition: A program that translates source code (C, for example) into machine instructions ahead of time, checking types and syntax; its output is assembly or object code for one processor architecture.
  chapter: "05-05"
  see_also: [Linker, Preprocessor, Interpreter]
- term: Linker
  definition: The build stage that combines object files and libraries into one executable, connecting each use of a function or variable to its single definition; a missing definition gives an "undefined reference" error.
  chapter: "05-05"
- term: Preprocessor
  definition: The first stage of a C build, which rewrites source text according to lines starting with # (#include, #define, #if) before compilation; it substitutes text and knows nothing about C types.
  chapter: "05-05"
- term: Translation unit
  definition: One C source file after preprocessing (with its included headers pasted in), compiled on its own into an object file.
  chapter: "05-05"
- term: Function prototype
  definition: A C declaration giving a function's name, return type and parameter types without its body, so that other translation units can call it; usually placed in a header file.
  chapter: "05-05"
- term: Header file
  definition: A C file (.h) of declarations (prototypes, types, macros) that a module offers, included by its users; wrapped in an include guard so its contents are processed once per translation unit.
  chapter: "05-05"
- term: Integer promotion
  definition: C's rule that integer types narrower than int (char, short, int8_t, uint8_t, int16_t, uint16_t) are converted to int before arithmetic, so uint8_t 200 + 100 is the int 300.
  chapter: "05-05"
- term: Undefined behavior
  definition: In C, an operation (signed overflow, reading an uninitialized variable, out-of-bounds access, oversized shift) on which the standard imposes no requirements; compilers may assume it never happens, so results can be silently wrong.
  chapter: "05-05"
  see_also: [Sanitizer]
- term: Sanitizer
  definition: Compiler-inserted run-time checks (UndefinedBehaviorSanitizer, AddressSanitizer) that report undefined behavior and memory errors with the source line; used in testing, at roughly 2x run-time cost.
  chapter: "05-05"
- term: MISRA C
  definition: A widely used set of C coding guidelines for safety-critical embedded software, originating in the automotive industry; the current edition is MISRA C 2025, which targets C11/C18.
  chapter: "05-05"
- term: Two's complement
  definition: The standard binary representation of signed integers, in which an n-bit pattern with top bit set represents its unsigned value minus 2^n; range −2^(n−1) to 2^(n−1) − 1. Mandatory in C23.
  chapter: "05-05"
- term: Pointer
  definition: A variable holding a memory address, with a type saying what is stored there (int *p points to an int); &x gives an address and *p the object at it. Pointers let functions modify caller data and pass buffers without copying.
  chapter: "05-06"
  see_also: [Dereference, Null pointer, Pointer arithmetic]
- term: Dereference
  definition: To access the object a pointer points to (*p in C, or p->field for a struct); dereferencing an invalid or null pointer is undefined behavior.
  chapter: "05-06"
- term: Null pointer
  definition: A pointer value (NULL) that points to no object, used to signal "none" or failure (malloc returns NULL when out of memory); must be checked before dereferencing.
  chapter: "05-06"
- term: Pointer arithmetic
  definition: Adding an integer to a pointer advances it by whole elements (sizeof the pointed-to type), so a[i] is *(a + i); subtracting two pointers into one array gives the number of elements between them.
  chapter: "05-06"
- term: C string
  definition: An array of char terminated by a zero byte; it needs strlen + 1 bytes of storage, and functions find its end by scanning for the zero, so a missing terminator or a too-small buffer causes overflows.
  chapter: "05-06"
- term: Struct padding
  definition: Unused bytes a compiler inserts between and after struct fields so that each field is aligned to its size; field order changes a struct's size (uint8, uint32, uint16 is 12 bytes; uint32, uint16, uint8 is 8).
  chapter: "05-06"
- term: Stack (memory)
  definition: The region holding local variables and function call frames, allocated on function entry and released on return; fast but small (megabytes on desktops, kilobytes on MCUs), and a pointer to a returned function's local dangles.
  chapter: "05-06"
- term: Heap (memory)
  definition: The region for dynamic allocation (malloc, calloc, realloc, free), whose blocks live until freed; flexible in size but subject to leaks, fragmentation and unpredictable allocation time.
  chapter: "05-06"
- term: Buffer overflow
  definition: Reading or writing past the end (or before the start) of an array or buffer, corrupting or leaking neighboring memory; a leading cause of security vulnerabilities in C and C++.
  chapter: "05-06"
- term: Use after free
  definition: Accessing heap memory after it has been freed (or moved by realloc), through a dangling pointer; the memory may already belong to something else, so results are silently wrong or exploitable.
  chapter: "05-06"
- term: Memory leak
  definition: Heap memory that is never freed after its last pointer is lost; harmless in a short program, fatal in a long-running device that slowly exhausts its RAM.
  chapter: "05-06"
- term: Memory safety
  definition: The guarantee that a program cannot access memory outside the objects it is entitled to (no overflows, use after free or invalid pointers); C and C++ lack it, Rust, Python and Java provide it, and hardware such as Arm MTE and CHERI can enforce parts of it.
  chapter: "05-06"
- term: Sign extension
  definition: Widening a two's-complement value by copying its sign bit into the new high bits (8-bit 0xFB, −5, becomes 16-bit 0xFFFB); needed by hand for odd-width fields such as 12-bit sensor readings, e.g. (x XOR 2^(k−1)) − 2^(k−1).
  chapter: "05-07"
- term: Bit mask
  definition: A bit pattern with 1s at the positions of interest, used with AND to test or keep bits, OR to set them, AND-NOT to clear them and XOR to toggle them.
  chapter: "05-07"
- term: Bit field
  definition: A group of adjacent bits inside a register or word that holds one value (a 3-bit mode at bits 6:4); extracted with shift-and-mask and written by clearing the field and OR-ing in the shifted value.
  chapter: "05-07"
- term: Memory-mapped I/O
  definition: Accessing hardware peripheral registers at fixed memory addresses with ordinary loads and stores; in C, through volatile pointers to those addresses.
  chapter: "05-07"
- term: Volatile
  definition: A C type qualifier telling the compiler that every read and write of an object has effects it cannot see (hardware registers, variables shared with interrupts), so none may be removed, merged or reordered; it does not make operations atomic.
  chapter: "05-07"
- term: Endianness
  definition: The order of a multi-byte value's bytes in memory or on a wire; little-endian stores the least significant byte first (x86, most Arm MCUs), big-endian the most significant first (network byte order).
  chapter: "05-07"
- term: Fixed-point arithmetic
  definition: Representing fractions as integers with an agreed scale 2^−f, so integer hardware does the arithmetic; additions are direct, products must be rescaled, and rounding, overflow and saturation are managed by the programmer.
  chapter: "05-07"
  see_also: [Q format, Saturation arithmetic]
- term: Q format
  definition: Notation Qm.f for fixed-point numbers with m integer and f fractional bits; Q15 is a 16-bit signed fraction in [−1, 1 − 2^−15] with resolution 3.05×10^−5.
  chapter: "05-07"
- term: Saturation arithmetic
  definition: Arithmetic that clamps results to the largest or smallest representable value instead of wrapping around, so an overflowing signal clips rather than jumping to the opposite extreme.
  chapter: "05-07"
- term: Big-O notation
  definition: f(n) = O(g(n)) means f grows no faster than a constant multiple of g for large n; it keeps an algorithm's growth rate (constant, log n, n, n log n, n squared) and drops constant factors.
  chapter: "05-08"
- term: Amortized cost
  definition: The average cost per operation over a worst-case sequence of operations, in which rare expensive steps are paid for by many cheap ones; a doubling array's append is O(1) amortized.
  chapter: "05-08"
- term: Ring buffer
  definition: A fixed-size array used as a FIFO queue whose read and write positions wrap around; with free-running unsigned counters and a power-of-two size, the count is head − tail and the slot is counter AND (size − 1). Standard between interrupts and main loops.
  chapter: "05-08"
- term: Linked list
  definition: A sequence of separately allocated nodes, each pointing to the next; O(1) insertion and removal next to a known node, O(n) search, and poor cache behavior compared with arrays.
  chapter: "05-08"
- term: Stack (data structure)
  definition: A last-in-first-out collection with push and pop at one end, O(1) each; used for function calls, undo histories, expression evaluation and bracket matching.
  chapter: "05-08"
- term: Queue
  definition: A first-in-first-out collection with enqueue at the back and dequeue at the front, O(1) each; implemented with a ring buffer or a linked list. A priority queue instead removes the smallest key first.
  chapter: "05-08"
- term: Hash table
  definition: A key-value store that computes each key's array slot with a hash function, giving O(1) average lookup; collisions are resolved by chaining or open addressing, and the table resizes as its load factor grows.
  chapter: "05-08"
  see_also: [Load factor]
- term: Load factor
  definition: For a hash table, entries divided by slots (α = n/m); linear probing needs about ½(1 + 1/(1 − α)) probes per successful search and ½(1 + 1/(1 − α)²) per miss, so tables resize before α reaches about 0.75.
  chapter: "05-08"
- term: Binary search tree
  definition: A tree whose nodes keep smaller keys in the left subtree and larger keys in the right, so search, insertion and deletion cost O(height); self-balancing variants (red-black, AVL, B-trees) keep the height O(log n).
  chapter: "05-08"
- term: Binary heap
  definition: A complete binary tree stored in an array (children of i at 2i + 1 and 2i + 2) with every parent no larger than its children; supports a priority queue with O(log n) insertion and removal of the minimum.
  chapter: "05-08"
- term: Binary search
  definition: Searching a sorted array by comparing with the middle element and discarding half each step; at most floor(log2 n) + 1 comparisons (20 for a million items).
  chapter: "05-08"
- term: Merge sort
  definition: Sorting by recursively sorting two halves and merging them in linear time; n log2 n comparisons in every case, stable, needs O(n) extra memory, and within lower-order terms of the comparison-sort lower bound log2(n!).
  chapter: "05-08"
- term: Requirement
  definition: A statement of what a system must do (functional) or how well (non-functional, e.g. power, latency, reliability); good requirements are specific, measurable, testable, unambiguous and free of design.
  chapter: "05-09"
  see_also: [Traceability]
- term: Traceability
  definition: Two-way links from each requirement to the design elements that implement it and the tests that verify it, exposing untested requirements and orphan code or tests; mandatory in safety standards.
  chapter: "05-09"
- term: V-model
  definition: A development process in which each level of specification (requirements, architecture, module design) is paired with a matching level of verification (system, integration, unit tests); the backbone of automotive and avionics processes.
  chapter: "05-09"
- term: Agile development
  definition: Iterative development in short cycles (sprints) that each deliver working software, with continuous customer feedback and adaptation to changing requirements (Agile Manifesto, 2001).
  chapter: "05-09"
- term: Coupling and cohesion
  definition: Coupling is how much modules depend on each other; cohesion is how focused a module is on one purpose. Good designs have low coupling (narrow, stable interfaces) and high cohesion.
  chapter: "05-09"
- term: Cyclomatic complexity
  definition: McCabe's count of linearly independent paths through a function, M = E − N + 2 for its control-flow graph, equal to the number of decision points plus one; also the number of basis-path tests.
  chapter: "05-09"
- term: Boundary-value analysis
  definition: Black-box test design that places tests just below, at and just above each boundary of the input ranges, where off-by-one errors (< versus <=) live.
  chapter: "05-09"
- term: Code coverage
  definition: The fraction of code exercised by tests, by statement, branch (decision) or MC/DC criteria; it shows what was not tested, not that what ran was checked.
  chapter: "05-09"
  see_also: [MC/DC]
- term: MC/DC
  definition: Modified condition/decision coverage; each condition in a decision is shown to independently change the outcome by a pair of tests differing only in that condition; needs at least N + 1 tests for N conditions; required for DO-178C Level A.
  chapter: "05-09"
- term: Code review
  definition: Examination of every change by another engineer before it is merged, catching defects tests miss, spreading knowledge and enforcing standards; the software counterpart of segregation of duties.
  chapter: "05-09"
- term: Semantic versioning
  definition: MAJOR.MINOR.PATCH version numbers where MAJOR signals incompatible changes, MINOR compatible new features and PATCH compatible fixes.
  chapter: "05-09"

# ---------------------------------------------------------------- 06-01
- term: Voltage
  definition: The energy per unit charge gained in moving from one point to another (1 V = 1 J/C); it is always defined between two points, written v_AB = v_A − v_B.
  chapter: "06-01"
  see_also: [Reference node (ground), Passive sign convention]
- term: Reference direction
  definition: The arrow (for current) or the + and − marks (for voltage) chosen before solving a circuit; a negative result means the actual direction or polarity is opposite to the reference.
  chapter: "06-01"
- term: Reference node (ground)
  definition: The node chosen as zero volts, relative to which every other node voltage is quoted; a bookkeeping choice that need not be connected to the earth.
  chapter: "06-01"
  see_also: [Voltage, Grounding]
- term: Passive sign convention
  definition: Referencing an element's current into the terminal marked +, so that p = vi is the power the element absorbs (negative means it delivers power); SPICE applies it to sources as well.
  chapter: "06-01"
  see_also: [Electric power]
- term: Electric power
  definition: The rate of energy transfer, p = dw/dt = vi, in watts (1 W = 1 J/s = 1 V·A).
  chapter: "06-01"
  see_also: [Passive sign convention, Average power]
- term: Node
  definition: A point where two or more circuit elements connect, together with the ideal wire joining them; in the lumped model it stores no charge.
  chapter: "06-01"
  see_also: [Branch, Loop]
- term: Branch
  definition: A single element, or a path through one element, connecting two nodes of a circuit.
  chapter: "06-01"
- term: Loop
  definition: Any closed path through the branches of a circuit that visits no node more than once.
  chapter: "06-01"
- term: Kirchhoff's current law (KCL)
  definition: The algebraic sum of the currents entering a node is zero at every instant; it follows from charge conservation and the lumped assumption that nodes store no charge.
  chapter: "06-01"
  see_also: [Kirchhoff's voltage law (KVL), Lumped-matter discipline]
- term: Kirchhoff's voltage law (KVL)
  definition: The algebraic sum of the voltages around any loop is zero at every instant; it follows from Faraday's law when no changing magnetic flux links the loop outside the elements.
  chapter: "06-01"
  see_also: [Kirchhoff's current law (KCL), Lumped-matter discipline]
- term: Tellegen's theorem
  definition: In any lumped circuit the branch voltage–current products, with the passive sign convention, sum to zero; it follows from KCL and KVL alone, so it holds for nonlinear circuits and even across two circuits sharing a graph.
  chapter: "06-01"
- term: Average power
  definition: The energy delivered over an interval divided by its length, (1/T)∫p dt; for varying signals it is the average of v·i, not the product of the averages.
  chapter: "06-01"
- term: Duty cycle
  definition: The fraction of time a block or signal is active; a block drawing current I for duty cycle D contributes D·I to the average current.
  chapter: "06-01"
- term: Efficiency
  definition: The ratio of output power to input power, η = P_out/P_in, of a converter or distribution path; efficiencies of stages in series multiply.
  chapter: "06-01"

# ---------------------------------------------------------------- 06-02
- term: Element law
  definition: The relation between an element's terminal voltage and current (its constitutive relation), such as v = Ri; with KCL and KVL it determines every voltage and current in a circuit.
  chapter: "06-02"
  see_also: [i–v characteristic]
- term: i–v characteristic
  definition: The plot of all (voltage, current) pairs an element permits; a resistor's is a line through the origin, an ideal voltage source's a vertical line, an ideal current source's a horizontal line.
  chapter: "06-02"
- term: Linear element
  definition: An element whose i–v characteristic is a straight line through the origin (v = Ri); sources, whose lines miss the origin, and diodes are not linear in this sense.
  chapter: "06-02"
- term: Passive element
  definition: An element that can never deliver net energy to the rest of a circuit, such as a resistor; sources, which can, are active.
  chapter: "06-02"
- term: Resistance
  definition: The ratio of voltage to current for a resistor, R = v/i, in ohms (V/A); for a uniform conductor R = ρL/A.
  chapter: "06-02"
  see_also: [Conductance, Ohm's law]
- term: Conductance
  definition: The reciprocal of resistance, G = 1/R = i/v, in siemens (A/V); convenient for parallel elements and nodal analysis.
  chapter: "06-02"
  see_also: [Resistance]
- term: Short circuit
  definition: An element or connection with zero voltage across it whatever its current (R = 0); an ideal wire or a closed ideal switch.
  chapter: "06-02"
  see_also: [Open circuit]
- term: Open circuit
  definition: A break with zero current whatever the voltage across it (R = ∞); an unconnected terminal or an open ideal switch.
  chapter: "06-02"
  see_also: [Short circuit]
- term: Ideal voltage source
  definition: An element that maintains a specified voltage between its terminals regardless of the current through it; a 0 V source is a short circuit.
  chapter: "06-02"
  see_also: [Ideal current source, Internal resistance]
- term: Ideal current source
  definition: An element that maintains a specified current regardless of the voltage across it; a 0 A source is an open circuit.
  chapter: "06-02"
  see_also: [Ideal voltage source]
- term: Internal resistance
  definition: The series resistance in the model of a real source (an ideal source in series with R_int), which makes the terminal voltage fall as v = V_oc − i R_int under load.
  chapter: "06-02"
  see_also: [Open-circuit voltage, Short-circuit current]
- term: Open-circuit voltage
  definition: The terminal voltage of a source or network with no load connected (zero current), V_oc.
  chapter: "06-02"
- term: Short-circuit current
  definition: The current a source or network would deliver into a short circuit, I_sc = V_oc/R_int for a linear model; a model parameter, not a safe operating point.
  chapter: "06-02"
- term: E-series (preferred values)
  definition: The IEC 60063 series of standard component values with n values per decade spaced by about 10^(1/n), such as E12, E24 and E96, chosen so neighbouring values' tolerance bands roughly touch.
  chapter: "06-02"
  see_also: [Tolerance]
- term: Tolerance
  definition: For a component, the maximum allowed deviation of its value from nominal when made, such as ±5% (950 to 1050 Ω for 1 kΩ); temperature drift and ageing come on top.
  chapter: "06-02"
  see_also: [Worst-case analysis]
- term: Worst-case analysis
  definition: Evaluating a design at the combination of component tolerances and operating conditions that pushes each output furthest from nominal, to show it works in every case.
  chapter: "06-02"
- term: Power rating
  definition: The power a component can dissipate continuously at a stated ambient temperature, derated above it; designers usually run parts well below it.
  chapter: "06-02"
- term: Incremental resistance
  definition: The slope dv/di of a nonlinear element's i–v curve at an operating point, the resistance a small signal sees; for a diode it is about V_T/I.
  chapter: "06-02"

# ---------------------------------------------------------------- 06-03
- term: Spanning tree
  definition: A set of n − 1 branches that connects all n nodes of a circuit without forming a loop; each remaining branch (a link) closes one independent loop, giving b − n + 1 independent KVL equations.
  chapter: "06-03"
- term: Mesh
  definition: In a planar circuit, a loop that encloses no other branch (a window pane of the drawing); the meshes form a set of b − n + 1 independent loops.
  chapter: "06-03"
- term: Series connection
  definition: Elements joined end to end with nothing else connected at the nodes between them, so they carry the same current; series resistances add.
  chapter: "06-03"
  see_also: [Voltage divider]
- term: Parallel connection
  definition: Elements connected between the same two nodes, so they share the same voltage; parallel conductances add (R1 ∥ R2 = R1R2/(R1 + R2)).
  chapter: "06-03"
  see_also: [Current divider]
- term: Equivalent resistance
  definition: The single resistance that has the same voltage–current relation at a pair of terminals as a network of resistors; it says nothing about the network's internal currents.
  chapter: "06-03"
- term: Voltage divider
  definition: Series resistors sharing a voltage in proportion to their resistances, v_k = v R_k/ΣR; for two, v_out = v_in R2/(R1 + R2).
  chapter: "06-03"
  see_also: [Loading effect]
- term: Current divider
  definition: Parallel resistors sharing a current in proportion to their conductances; for two, i1 = i R2/(R1 + R2), so the smaller resistor takes the larger current.
  chapter: "06-03"
- term: Loading effect
  definition: The drop in a source's or divider's output when a load draws current from it; the relative error is about R_source/R_load when the load is much larger.
  chapter: "06-03"
- term: Wheatstone bridge
  definition: Two voltage dividers fed from one source with the output taken between their midpoints; balanced (zero output) when R1R4 = R2R3, and used to measure small resistance changes.
  chapter: "06-03"
  see_also: [Gauge factor]
- term: Gauge factor
  definition: The ratio of a strain gauge's fractional resistance change to the strain, GF = (ΔR/R)/ε; about 2 for metal-foil gauges.
  chapter: "06-03"
- term: Delta–wye transformation
  definition: Replacing three resistors in a triangle (delta) by three meeting at a node (wye), or the reverse, with equal behaviour at the three terminals; R_a = R_ab R_ca/(R_ab + R_bc + R_ca).
  chapter: "06-03"
- term: R–2R ladder
  definition: A resistor network of series R and shunt 2R sections in which each node sees R looking onward, so currents halve at every rung; the basis of many digital-to-analog converters.
  chapter: "06-03"

# ---------------------------------------------------------------- 06-04
- term: Nodal analysis
  definition: Solving a circuit with the voltages of its non-reference nodes as unknowns, writing KCL at each node so that KVL holds automatically; for resistors and current sources the result is G·v = i.
  chapter: "06-04"
  see_also: [Conductance matrix, Modified nodal analysis, Supernode]
- term: Node voltage
  definition: The voltage of a node relative to the reference node; every branch voltage is the difference of its two node voltages, so node voltages satisfy KVL by construction.
  chapter: "06-04"
  see_also: [Reference node (ground), Nodal analysis]
- term: Supernode
  definition: A closed surface around a floating voltage source and its two nodes; KCL holds for the surface as a whole (the source's unknown current cancels), and the source supplies the constraint v_a − v_b = V_s.
  chapter: "06-04"
  see_also: [Nodal analysis]
- term: Diagonally dominant matrix
  definition: A matrix in which each diagonal entry is at least the sum of the magnitudes of the other entries in its row; a nodal conductance matrix is, with strict inequality at nodes that have conductance to ground.
  chapter: "06-04"
  see_also: [Conductance matrix, Positive definite matrix]
- term: IR drop
  definition: The voltage lost along a power-distribution network by current flowing through its resistance, so circuits far from the supply connections see less than the nominal supply voltage.
  chapter: "06-04"
  see_also: [Electromigration]
- term: FastSPICE
  definition: A class of transistor-level circuit simulators that partition the circuit and use simplified or tabulated device models to gain speed and capacity, at some loss of accuracy relative to SPICE.
  chapter: "06-04"
  see_also: [SPICE]

# ---------------------------------------------------------------- 06-05
- term: Mesh analysis
  definition: Solving a planar circuit with circulating mesh currents as unknowns, writing KVL around each mesh so that KCL holds automatically; for resistors and voltage sources the result is R·i = v.
  chapter: "06-05"
  see_also: [Mesh current, Nodal analysis, Supermesh]
- term: Mesh current
  definition: A current assigned to circulate around one mesh of a planar circuit; an outer branch carries its mesh current and a shared branch the difference of two.
  chapter: "06-05"
  see_also: [Mesh, Mesh analysis]
- term: Supermesh
  definition: The loop around two meshes that share a current source, avoiding the source's branch; KVL around it does not involve the source's unknown voltage, and the source supplies the constraint i_a − i_b = ±I_s.
  chapter: "06-05"
  see_also: [Supernode, Mesh analysis]
- term: Planar circuit
  definition: A circuit that can be drawn on a plane with no crossing branches; only planar circuits have meshes. By Kuratowski's theorem a circuit is planar unless it contains a subdivision of K5 or K3,3.
  chapter: "06-05"
  see_also: [Mesh, Loop analysis]
- term: Loop analysis
  definition: The generalization of mesh analysis to any circuit; one loop current per link of a spanning tree (b − n + 1 fundamental loops), with KVL written around each loop.
  chapter: "06-05"
  see_also: [Spanning tree, Mesh analysis]
- term: Dual circuit
  definition: The circuit obtained from a planar one by turning meshes into nodes, resistances into equal-valued conductances, voltage sources into current sources and series into parallel; its node voltages equal the original's mesh currents.
  chapter: "06-05"
  see_also: [Mesh analysis, Nodal analysis]
- term: Common-impedance coupling
  definition: Interference between two circuits whose currents share a conductor; each circuit's current through the shared impedance produces a voltage in the other, as when a sensor and a motor share a ground return.
  chapter: "06-05"
  see_also: [Star ground, IR drop]
- term: Star ground
  definition: A grounding layout in which each circuit has its own return conductor to a single common point at the supply, so that no return impedance is shared between noisy and sensitive circuits.
  chapter: "06-05"
  see_also: [Common-impedance coupling]

# ---------------------------------------------------------------- 06-06
- term: Dependent source
  definition: An ideal voltage or current source whose value is a fixed multiple of a voltage or current elsewhere in the circuit (VCVS, VCCS, CCVS, CCCS); it models gain in transistors and amplifiers and stays in place when independent sources are turned off.
  chapter: "06-06"
  see_also: [VCVS, VCCS, CCVS, CCCS, Small-signal model]
- term: VCVS
  definition: Voltage-controlled voltage source, v = μ v_x, with dimensionless voltage gain μ; SPICE element E. The first-order model of an op-amp.
  chapter: "06-06"
  see_also: [Dependent source]
- term: VCCS
  definition: Voltage-controlled current source, i = g v_x, with transconductance g in siemens; SPICE element G. The core of a MOSFET's small-signal model.
  chapter: "06-06"
  see_also: [Dependent source, Transconductance]
- term: CCVS
  definition: Current-controlled voltage source, v = r i_x, with transresistance r in ohms; SPICE element H, controlled by the current through a named voltage source.
  chapter: "06-06"
  see_also: [Dependent source]
- term: CCCS
  definition: Current-controlled current source, i = β i_x, with dimensionless current gain β; SPICE element F. The core of a bipolar transistor's small-signal model and of a current mirror.
  chapter: "06-06"
  see_also: [Dependent source]
- term: Test source
  definition: A voltage or current source applied at a port, with all independent sources turned off but dependent sources left in place, to find the resistance seen there as v_t/i_t.
  chapter: "06-06"
  see_also: [Dependent source]
- term: Miller effect
  definition: An impedance connected between the input and output of an inverting amplifier of gain −A looks (1 + A) times smaller (for a capacitance, larger) from the input, because the amplifier multiplies the voltage across it.
  chapter: "06-06"
  see_also: [Test source]
- term: Negative resistance
  definition: A port whose current flows out when a positive voltage is applied (v/i < 0), so it delivers power; it requires an active element such as a dependent source with positive feedback, and is the basis of oscillators.
  chapter: "06-06"
  see_also: [Dependent source]
- term: Source degeneration
  definition: A resistor R_S in a transistor's source (or R_E in a bipolar emitter) that feeds back a voltage opposing the input, cutting the gain to about −R_D/(R_S + 1/g_m) but making it set by resistors rather than by the device.
  chapter: "06-06"
  see_also: [Transconductance]

# ---------------------------------------------------------------- 06-07
- term: Linearity
  definition: The property of a system whose response obeys homogeneity and additivity; circuits of resistors, dependent sources, capacitors and inductors are linear, diodes and transistors (beyond small signals) are not.
  chapter: "06-07"
  see_also: [Homogeneity, Superposition]
- term: Homogeneity
  definition: Scaling property of a linear system, f(a x) = a f(x); in a circuit with one source, every response is proportional to the source.
  chapter: "06-07"
  see_also: [Linearity, Unit-output method]
- term: Superposition
  definition: In a linear circuit, any response to several independent sources equals the sum of the responses to each source acting alone, with the others switched off (voltage sources shorted, current sources opened) and dependent sources left in place. It does not apply to power.
  chapter: "06-07"
  see_also: [Linearity, Dependent source]
- term: Source transformation
  definition: Replacing a voltage source V_s in series with R by a current source V_s/R in parallel with R, or the reverse; the two are equivalent at their terminals but not internally.
  chapter: "06-07"
  see_also: [Millman's theorem]
- term: Millman's theorem
  definition: Practical voltage sources V_k with series resistances R_k in parallel are equivalent to one source of voltage Σ(V_k/R_k)/Σ(1/R_k) with resistance (Σ 1/R_k)^−1.
  chapter: "06-07"
  see_also: [Source transformation]
- term: Unit-output method
  definition: For a single-source circuit, assume an output of 1 (volt or ampere), work backwards to the source value this requires, then scale by homogeneity; well suited to ladders.
  chapter: "06-07"
  see_also: [Homogeneity]
- term: Error budget
  definition: A table of every error source's contribution to a system's output (each source times its gain to the output), combined by worst case or by root-sum-square.
  chapter: "06-07"
  see_also: [Root-sum-square (RSS), Worst-case analysis]
- term: Root-sum-square (RSS)
  definition: Combining independent random contributions as the square root of the sum of their squares, because their variances add; it gives a total at a stated confidence level only if each input is given at that same level.
  chapter: "06-07"
  see_also: [Error budget, Worst-case analysis]
- term: Differential nonlinearity (DNL)
  definition: For a data converter, the deviation of each code step from the ideal 1 LSB, in LSBs; it is largest where many bits switch at once, such as the major carry.
  chapter: "06-07"
  see_also: [Superposition]

# ---------------------------------------------------------------- 06-08
- term: Thevenin equivalent
  definition: A voltage source V_th (the open-circuit voltage) in series with R_th, equivalent at two terminals to any linear network; R_th is found with independent sources switched off and dependent sources kept.
  chapter: "06-08"
  see_also: [Norton equivalent, Thevenin resistance, Open-circuit voltage]
- term: Norton equivalent
  definition: A current source I_N (the short-circuit current) in parallel with R_th, equivalent at two terminals to any linear network; V_th = R_th I_N.
  chapter: "06-08"
  see_also: [Thevenin equivalent, Short-circuit current]
- term: Output resistance
  definition: The Thévenin resistance seen looking into a circuit's output terminals; it sets how much the output voltage sags under load (load regulation) and forms a divider with the next stage's input resistance.
  chapter: "06-08"
  see_also: [Thevenin equivalent, Loading effect]
- term: Two-load method
  definition: Finding a source's Thévenin equivalent from its terminal voltage with two known loads, using 1/v = 1/V_th + (R_th/V_th)(1/R_L); a meter's input resistance is part of each load.
  chapter: "06-08"
  see_also: [Thevenin equivalent]
- term: Power over Ethernet (PoE)
  definition: Delivering DC power over Ethernet cabling (IEEE 802.3af, at and bt) at up to 57 V; the device receives the source's class power minus the cable's I²R loss (90 W at the source gives 71.3 W at the device for Type 4).
  chapter: "06-08"
  see_also: [Thevenin equivalent]

# ---------------------------------------------------------------- 06-09
- term: Matched load
  definition: A load equal to the source's Thévenin resistance (for AC, its complex conjugate), which draws the maximum power, at half the open-circuit voltage (and at 50% efficiency when the source resistance is physical); on a transmission line, a load equal to Z0, which reflects nothing.
  chapter: "06-09"
  see_also: [Maximum power transfer, Conjugate match]
- term: Conjugate match
  definition: The AC form of maximum power transfer, Z_L = Z_th*, in which the load's resistance equals the source's and its reactance cancels the source's.
  chapter: "06-09"
  see_also: [Matched load, Maximum power transfer]
- term: Maximum power point tracking (MPPT)
  definition: A converter control method that continually adjusts its input operating point (for example by perturb and observe) to extract the most power from a varying source such as a solar cell or thermoelectric generator.
  chapter: "06-09"
  see_also: [Maximum power transfer]

# ---------------------------------------------------------------- 06-10
- term: Operational amplifier
  definition: A high-gain differential amplifier, v_out = A(v+ − v−), with very high input resistance and low output resistance, used almost always with negative feedback so that the external components, not A, set the circuit's behavior.
  chapter: "06-10"
  see_also: [VCVS, Virtual short, Negative feedback]
- term: Virtual short
  definition: The ideal op-amp rule v+ = v− (with no input current), valid only while negative feedback is active and the output is inside its range; with the + input grounded it makes the − input a virtual ground.
  chapter: "06-10"
  see_also: [Operational amplifier, Negative feedback]
- term: Negative feedback
  definition: Returning a fraction of a system's output to subtract from its input, which trades excess gain for gains set by passive components, lower sensitivity to the amplifier's parameters and corrected errors.
  chapter: "06-10"
  see_also: [Loop gain, Virtual short]
- term: Noise gain
  definition: The gain 1 + R2/R1 from a signal at the op-amp's + input (offset voltage, input noise) to its output; it is the same for inverting and non-inverting stages and sets the finite-gain error, about (noise gain)/A.
  chapter: "06-10"
  see_also: [Input offset voltage, Loop gain]
- term: Common-mode rejection ratio (CMRR)
  definition: The ratio of differential gain to common-mode gain, A_d/A_cm, usually in dB; for a difference amplifier built from resistors of tolerance t it is at worst about (1 + G)/(4t).
  chapter: "06-10"
  see_also: [Instrumentation amplifier]
- term: Instrumentation amplifier
  definition: A differential amplifier with high input resistance on both inputs and gain set by one resistor, classically two non-inverting stages followed by a difference amplifier, G = (1 + 2R/R_G)(R2/R1); its first stage multiplies the CMRR by its gain.
  chapter: "06-10"
  see_also: [Common-mode rejection ratio (CMRR)]
- term: Transimpedance amplifier
  definition: A current-to-voltage converter, v_out = −R_f i_in, formed by feeding a current into an op-amp's virtual ground; it presents zero input resistance, and large R_f makes bias current a significant error.
  chapter: "06-10"
  see_also: [Input bias current]
- term: Input offset voltage
  definition: V_OS, the small DC voltage that, applied between an op-amp's inputs, would bring its output to zero; modeled as a source in series with the + input and amplified by the noise gain (OPA187 10 µV max, LM358 7 mV max at 25 °C).
  chapter: "06-10"
  see_also: [Noise gain, Input bias current]
- term: Input bias current
  definition: I_B, the small DC current flowing into (or, for PNP input stages, out of) each op-amp input; through a resistance R it produces an error I_B R that is amplified like a signal.
  chapter: "06-10"
  see_also: [Input offset current, Input offset voltage]
- term: Input offset current
  definition: I_OS, the difference between an op-amp's two input bias currents; it is the error that remains when the two inputs see equal resistances (a compensation resistor R1∥R2 at the + input).
  chapter: "06-10"
  see_also: [Input bias current]

# ---------------------------------------------------------------- 06-11
- term: Burden voltage
  definition: The voltage an ammeter drops across its internal resistance (shunt, fuse, leads) while measuring; it reduces the circuit's current by about R_A/R_th, the ammeter's counterpart of a voltmeter's loading error.
  chapter: "06-11"
  see_also: [Loading effect, Current-sense shunt]
- term: Meter accuracy specification
  definition: A bound on a reading's error, stated as ±(% of reading + counts) or ±(% of reading + % of range) for given conditions (temperature band, time since calibration); the fixed term dominates low on a range.
  chapter: "06-11"
  see_also: [Resolution (measurement), Worst-case analysis]
- term: Resolution (measurement)
  definition: The smallest change an instrument can display or report (one count of the least significant digit); it says nothing about accuracy, which the specification bounds separately.
  chapter: "06-11"
  see_also: [Meter accuracy specification]
- term: Four-terminal (Kelvin) measurement
  definition: Measuring a resistance or current with one pair of leads that forces the current and a separate pair, attached at the element itself, that senses the voltage while carrying almost no current, so lead, contact and copper resistances drop out.
  chapter: "06-11"
  see_also: [Current-sense shunt, Remote sensing]
- term: Current-sense shunt
  definition: A low-value resistor (milliohms) whose voltage, i R_sh, measures current; its value trades signal against I²R loss, and four-terminal parts with Kelvin layout keep copper's 0.39%/°C out of the measurement.
  chapter: "06-11"
  see_also: [Four-terminal (Kelvin) measurement, Burden voltage]
- term: Remote sensing
  definition: Connecting a supply's feedback (sense) inputs to the load's terminals with separate wires so that it regulates the voltage at the load, raising its own output by the drop in the current-carrying wires.
  chapter: "06-11"
  see_also: [Four-terminal (Kelvin) measurement, Negative feedback]
- term: Guard bits
  definition: Extra high-order bits in an accumulator that keep a sum of many terms from overflowing; a sum of N terms needs ceil(log2 N) of them beyond the width of one term.
  chapter: "08-01"
  see_also: [Fixed-point arithmetic, Integer overflow]
- term: bfloat16
  definition: A 16-bit floating-point format with 1 sign, 8 exponent and 7 fraction bits; it keeps FP32's range (about 3.4×10^38) at about 2.4 decimal digits of precision, and FP32 converts to it by rounding away the low 16 bits.
  chapter: "08-01"
  see_also: [Floating-point number, FP8]
- term: FP8
  definition: The two 8-bit floating-point formats used for AI, E4M3 (largest value 448, no infinities, one NaN code per sign) and E5M2 (largest value 57 344, IEEE-style specials), standardized by the Open Compute Project in 2023.
  chapter: "08-01"
  see_also: [bfloat16, Block floating point]
- term: Block floating point
  definition: Storing a block of numbers with one shared scale (exponent) and a few bits per element, so each block gets its own range; the OCP MX formats share one 8-bit power-of-two scale per 32 elements.
  chapter: "08-01"
  see_also: [FP8, Fixed-point arithmetic]
- term: Binary-coded decimal (BCD)
  definition: Storing each decimal digit in its own 4-bit group (97 is 1001 0111); it wastes 6 of 16 patterns per digit, and binary addition of BCD digits needs a +6 correction when a digit sum exceeds 9.
  chapter: "08-01"
- term: Gray code
  definition: An ordering of the 2^n bit patterns in which consecutive values differ in exactly one bit; the reflected binary Gray code is G = B XOR (B >> 1), used for encoders and for pointers that cross clock domains.
  chapter: "08-01"
- term: UTF-8
  definition: The variable-length encoding of Unicode code points in 1 to 4 bytes, identical to ASCII for U+0000 to U+007F; continuation bytes start with 10, so a receiver can find character boundaries from any point in a stream.
  chapter: "08-01"
- term: Parity bit
  definition: A bit appended so that the number of 1s in a word is even (or odd); it detects any odd number of bit errors and no even number.
  chapter: "08-01"
  see_also: [Hamming distance]
- term: Hamming distance
  definition: The number of bit positions in which two words differ; a code whose words are at least d_min apart detects up to d_min − 1 errors or corrects up to floor((d_min − 1)/2).
  chapter: "08-01"
  see_also: [Hamming code, Parity bit]
- term: Hamming code
  definition: A single-error-correcting code whose check bits sit at power-of-two positions, so the syndrome of a word with one flipped bit is that bit's position; Hamming(7,4) protects 4 data bits with 3 check bits.
  chapter: "08-01"
  see_also: [SEC-DED, Hamming distance]
- term: SEC-DED
  definition: Single-error-correcting, double-error-detecting; a Hamming code plus an overall parity bit (minimum distance 4), as in the (72,64) code of DDR4-generation server memory, which corrects one flipped bit per word and flags two; DDR5 ECC modules give each 32-bit subchannel 4 or 8 check bits.
  chapter: "08-01"
  see_also: [Hamming code]
- term: Cyclic redundancy check (CRC)
  definition: An error-detecting check formed as the remainder of the message polynomial divided by a generator polynomial over GF(2); a degree-r CRC catches every burst of length r or less, and Ethernet frames end in a 32-bit one.
  chapter: "08-01"
  see_also: [Hamming distance]
- term: Boolean algebra
  definition: The algebra of two values, 0 and 1, with AND, OR and NOT, defined by axioms such as Huntington's (identity, commutativity, both distributive laws, complement); it describes logic circuits exactly, and has no subtraction or division, so nothing may be cancelled.
  chapter: "08-02"
  see_also: [Duality principle, De Morgan's theorem]
- term: Truth table
  definition: A list of a function's output for every combination of its n inputs, 2^n rows; read as a binary number (row i's output as bit i) it is the integer that programs an FPGA lookup table.
  chapter: "08-02"
- term: Perfect induction
  definition: Proving a Boolean identity by evaluating both sides on every row of the truth table; complete because each variable has only two values, but the 2^n rows make it impractical beyond a few dozen inputs.
  chapter: "08-02"
- term: Duality principle
  definition: Swapping AND with OR and 0 with 1 throughout a Boolean identity gives another valid identity, because every axiom's dual is also an axiom.
  chapter: "08-02"
- term: De Morgan's theorem
  definition: The complement of an OR is the AND of the complements, and the complement of an AND is the OR of the complements; to complement an expression, swap AND and OR and complement every literal.
  chapter: "08-02"
  see_also: [Bubble pushing]
- term: Consensus theorem
  definition: AB + A'C + BC = AB + A'C; the term BC is redundant because one of the other two is 1 whenever it is. Removing consensus terms simplifies logic; adding them back removes glitches (hazards).
  chapter: "08-02"
- term: Minterm
  definition: A product containing every input variable exactly once, true or complemented, so that it is 1 in exactly one row of the truth table; m5 = AB'C for three inputs.
  chapter: "08-02"
  see_also: [Sum of products (SOP), Maxterm]
- term: Maxterm
  definition: A sum containing every input variable exactly once, so that it is 0 in exactly one row of the truth table; the complement of the minterm of the same row.
  chapter: "08-02"
  see_also: [Product of sums (POS), Minterm]
- term: Sum of products (SOP)
  definition: An OR of AND terms; the canonical SOP ORs the minterms of the rows where the function is 1, and it maps onto two-level AND-OR or NAND-NAND logic.
  chapter: "08-02"
- term: Product of sums (POS)
  definition: An AND of OR terms; the canonical POS ANDs the maxterms of the rows where the function is 0, and it maps onto two-level OR-AND or NOR-NOR logic.
  chapter: "08-02"
- term: Shannon expansion
  definition: F = A'·F(A=0) + A·F(A=1), splitting a function on one variable into two cofactors; it is the logic of a 2:1 multiplexer and the basis of decision diagrams and lookup tables.
  chapter: "08-02"
- term: Functional completeness
  definition: The property of a set of gates that every Boolean function can be built from it; {AND, OR, NOT} is complete, and so are NAND alone and NOR alone, while AND and OR together are not (they cannot make NOT).
  chapter: "08-02"
- term: NAND gate
  definition: A gate whose output is 0 only when all inputs are 1, the complement of AND; functionally complete on its own, and in static CMOS the cheapest multi-input gate (pMOS in parallel, nMOS in series).
  chapter: "08-02"
  see_also: [Functional completeness, Static CMOS]
- term: Bubble pushing
  definition: Redrawing a gate by De Morgan's theorem (an AND with an output bubble equals an OR with input bubbles) so that inversion bubbles meet in pairs and cancel, making a NAND or NOR circuit easy to read.
  chapter: "08-02"
- term: Static CMOS
  definition: The standard logic style in which each gate has a pMOS pull-up network and a dual nMOS pull-down network, exactly one conducting for every input, so the output is always driven to a rail and no current flows once it settles.
  chapter: "08-02"
  see_also: [Pull-up and pull-down networks]
- term: Pull-up and pull-down networks
  definition: The pMOS switch network connecting a CMOS gate's output to the supply and the nMOS network connecting it to ground; series connections in one are parallel in the other, the circuit form of De Morgan's theorem.
  chapter: "08-02"
- term: AND-OR-INVERT (AOI) gate
  definition: A single static CMOS compound gate computing the complement of a sum of products, such as AOI22 = NOT(AB + CD) with 8 transistors; its dual is the OR-AND-INVERT (OAI) gate.
  chapter: "08-02"
- term: Gate equivalent (GE)
  definition: A unit of logic area equal to one two-input NAND gate in a named cell library; a block's gate count is its area divided by the NAND2 area.
  chapter: "08-02"
- term: Karnaugh map
  definition: A truth table drawn as a grid whose rows and columns are labelled in Gray code, so that cells differing in one variable are adjacent (including across the edges); rectangles of 1, 2, 4, 8 or 16 cells are product terms.
  chapter: "08-03"
  see_also: [Prime implicant, Gray code]
- term: Implicant
  definition: A product term that is 1 only where the function is 1 (or don't care); geometrically, a subcube of the input cube lying inside the on-set.
  chapter: "08-03"
- term: Prime implicant
  definition: An implicant that cannot be enlarged by removing a literal without covering a 0 of the function; some minimal sum of products always consists of prime implicants only.
  chapter: "08-03"
  see_also: [Essential prime implicant, Implicant]
- term: Essential prime implicant
  definition: A prime implicant that covers at least one minterm no other prime implicant covers, so every cover must include it.
  chapter: "08-03"
- term: Don't-care condition
  definition: An input combination whose output does not matter (because it never occurs or is ignored), marked X; it may be treated as 1 or 0 to simplify logic, but the built circuit then has a definite, unrequested output there.
  chapter: "08-03"
- term: Quine–McCluskey method
  definition: A tabular algorithm for two-level minimization that merges terms differing in one bit (grouped by their number of 1s) to find all prime implicants, then selects a cover from a prime implicant chart.
  chapter: "08-03"
  see_also: [Petrick's method, Prime implicant]
- term: Petrick's method
  definition: An exact way to choose a minimum cover from a prime implicant chart, by writing for each minterm the sum of the primes covering it, multiplying the sums out and picking the cheapest product.
  chapter: "08-03"
- term: Set-cover problem
  definition: Choosing the fewest (or cheapest) sets from a collection so that their union covers every element; it is NP-hard, which is why exact logic minimization does not scale and tools use heuristics.
  chapter: "08-03"
- term: Espresso
  definition: The heuristic two-level logic minimizer developed at IBM and UC Berkeley (Brayton, Hachtel, McMullen and Sangiovanni-Vincentelli, 1984), iterating expand, irredundant and reduce steps to find near-minimal multiple-output covers.
  chapter: "08-03"
- term: And-inverter graph (AIG)
  definition: A logic network of two-input AND nodes with optional inversions on the edges, able to express any function; the internal representation of modern synthesis and verification engines such as ABC.
  chapter: "08-03"
  see_also: [Logic synthesis]
- term: Technology mapping
  definition: The synthesis step that covers an optimized logic network with the cells of a target library (or with FPGA lookup tables), choosing covers that minimize area subject to timing constraints.
  chapter: "08-03"
- term: Logic synthesis
  definition: Automatic translation of a register-transfer-level description into an optimized netlist of library cells, by elaboration, technology-independent optimization, technology mapping and timing-driven refinement.
  chapter: "08-03"
  see_also: [Technology mapping, And-inverter graph (AIG)]
- term: Multiplexer
  definition: A block that connects one of 2^k data inputs to its output, chosen by k select lines; a 2^(n-1)-input multiplexer with an inverter can implement any n-input function, which is how FPGA lookup tables work.
  chapter: "08-04"
  see_also: [Shannon expansion, Decoder]
- term: Decoder
  definition: A block with n inputs and 2^n outputs, exactly one of which is 1 (the minterm of the inputs); with an enable input it is also a demultiplexer, and it selects rows in memories and decodes instructions.
  chapter: "08-04"
- term: Priority encoder
  definition: A block that outputs the number of the highest-priority active input, plus a valid flag that is 0 when no input is active; used for interrupt arbitration and leading-one detection.
  chapter: "08-04"
- term: Tristate buffer
  definition: A buffer whose output is either driven to the input value or disconnected (high impedance, Z), so that several drivers can share one wire as long as exactly one is enabled.
  chapter: "08-04"
- term: Half adder
  definition: A block that adds two bits, giving sum S = A XOR B and carry C = AB.
  chapter: "08-04"
  see_also: [Full adder]
- term: Full adder
  definition: A block that adds two bits and a carry in, giving S = A XOR B XOR Cin (three-input parity) and Cout = majority(A, B, Cin) = G + P·Cin.
  chapter: "08-04"
  see_also: [Generate and propagate, Ripple-carry adder]
- term: Ripple-carry adder
  definition: An n-bit adder made of n full adders with each carry out feeding the next carry in; small, but its delay grows linearly with n because a carry may have to travel through every column.
  chapter: "08-04"
- term: Generate and propagate
  definition: In an adder column, generate G = AB means the column produces a carry by itself, and propagate P = A XOR B means it passes an incoming carry on, so Cout = G + P·Cin; the basis of all fast adders.
  chapter: "08-04"
- term: Arithmetic-logic unit (ALU)
  definition: A block that performs one of several arithmetic and logical operations on two words, chosen by an operation code, and reports status flags; the computational core of a processor datapath.
  chapter: "08-04"
  see_also: [Status flags]
- term: Status flags
  definition: The Z (zero), N (negative, the result's sign bit), C (carry out) and V (signed overflow) bits produced by an ALU; unsigned A < B is a borrow (C = 0 after A − B) and signed A < B is N XOR V.
  chapter: "08-04"
- term: Contamination delay
  definition: The shortest time from an input change until an output starts to change (t_cd); it bounds how soon a new input can disturb a downstream register and sets hold-time constraints.
  chapter: "08-04"
- term: Critical path
  definition: The slowest input-to-output path through a block of logic; its propagation delay limits the clock frequency of the design.
  chapter: "08-04"
- term: Hazard
  definition: The possibility of a momentary wrong output after an input change, caused by unequal path delays; a static-1 hazard dips to 0 when the output should stay 1, and is removed in two-level logic by adding consensus terms.
  chapter: "08-04"
  see_also: [Glitch, Consensus theorem]
- term: Glitch
  definition: A brief unintended pulse on a signal while logic settles; harmless on data sampled by flip-flops after settling, but dangerous on clocks, asynchronous resets and signals leaving the clock domain, and a waste of energy everywhere.
  chapter: "08-04"
- term: Verilog
  definition: A hardware description language created in 1984 and standardized as IEEE 1364 (1995, 2001, 2005); since 2009 it is formally part of SystemVerilog (IEEE 1800).
  chapter: "08-05"
  see_also: [SystemVerilog, Hardware description language (HDL)]
- term: SystemVerilog
  definition: The IEEE 1800 hardware design and verification language (current edition 1800-2023), a superset of Verilog adding the logic type, always_comb/always_ff, enums, assertions, classes, constrained randomization and coverage.
  chapter: "08-05"
- term: Synthesizable subset
  definition: The part of an HDL that synthesis tools turn into hardware (continuous assignments, combinational and clocked always blocks, case, constant-bound loops, parameters); delays, system tasks, file I/O and most initial blocks are simulation-only.
  chapter: "08-05"
- term: Continuous assignment
  definition: A Verilog assign statement, which drives a net with an expression that is re-evaluated whenever any operand changes; it describes combinational logic.
  chapter: "08-05"
- term: Blocking assignment
  definition: The Verilog assignment a = b inside a procedural block, which updates a immediately so that later statements see the new value; correct for combinational logic, a source of races in clocked blocks.
  chapter: "08-05"
  see_also: [Non-blocking assignment, Race condition]
- term: Non-blocking assignment
  definition: The Verilog assignment a <= b, whose right-hand side is evaluated immediately but whose update is deferred to the end of the time step, so all registers in a clocked block sample their inputs simultaneously like real flip-flops.
  chapter: "08-05"
  see_also: [Blocking assignment]
- term: Race condition
  definition: A situation in which a simulation result depends on the arbitrary order in which concurrent processes execute, typically from blocking assignments in clocked blocks that read each other's outputs.
  chapter: "08-05"
- term: Latch inference
  definition: Synthesis creating a latch because a combinational block leaves an output unassigned on some path, so the output must hold its previous value; prevented by default assignments, complete case/if statements or always_comb.
  chapter: "08-05"
- term: Four-valued logic
  definition: The simulation model in which each bit is 0, 1, X (unknown) or Z (undriven); 0 dominates AND and 1 dominates OR, other combinations with X or Z give X, and === compares the four values literally.
  chapter: "08-05"
- term: Design under test (DUT)
  definition: The design instantiated inside a testbench, whose outputs are driven, observed and checked against a reference model.
  chapter: "08-05"
  see_also: [Testbench]
- term: Linting
  definition: Static checking of source code for suspicious constructs (width mismatches, inferred latches, unused signals, incomplete sensitivity lists) without simulating it; Verilator's --lint-only mode is a widely used HDL linter.
  chapter: "08-05"
- term: Bistable circuit
  definition: A circuit with two stable states and an unstable balance point between them, such as two cross-coupled inverters; the rail states are stable because the loop gain there is below 1, the midpoint unstable because it is above 1.
  chapter: "08-06"
  see_also: [SR latch]
- term: SR latch
  definition: A bistable built from two cross-coupled NOR (or NAND) gates with set and reset inputs; it holds when both are inactive, and both active at once is forbidden because it forces equal outputs and an unpredictable release.
  chapter: "08-06"
- term: D latch
  definition: A level-sensitive storage element that is transparent (Q follows D) while its clock or enable is active and holds its value while it is inactive.
  chapter: "08-06"
  see_also: [D flip-flop]
- term: D flip-flop
  definition: An edge-triggered storage element whose output takes the value D had at the active clock edge and holds it until the next edge; the basic register cell of synchronous design.
  chapter: "08-06"
  see_also: [Master–slave flip-flop, Setup time, Hold time]
- term: Master–slave flip-flop
  definition: An edge-triggered flip-flop made of two latches on opposite clock phases; the master follows D while the clock is low and closes at the rising edge, as the slave opens and passes the captured value to Q.
  chapter: "08-06"
- term: Transmission gate
  definition: An nMOS and a pMOS transistor in parallel, driven by complementary control signals, that pass a signal in either direction without a threshold drop when on; the basic switch of CMOS latches and multiplexers.
  chapter: "08-06"
- term: Setup time
  definition: The minimum time a flip-flop's data input must be stable before the active clock edge; together with clock-to-Q and logic delay it sets the minimum clock period, t_pcq + t_pd + t_setup ≤ T_c.
  chapter: "08-06"
  see_also: [Hold time, Clock-to-Q delay]
- term: Hold time
  definition: The minimum time a flip-flop's data input must stay stable after the active clock edge; the hold constraint t_ccq + t_cd ≥ t_hold does not involve the clock period, so a violation cannot be fixed by slowing the clock.
  chapter: "08-06"
- term: Clock-to-Q delay
  definition: The delay from a flip-flop's active clock edge to its output changing; t_pcq is the longest (used for setup checks) and t_ccq the shortest (used for hold checks).
  chapter: "08-06"
- term: Synchronous reset
  definition: A reset that is sampled like data and takes effect at the next active clock edge; simple to time but requires a running clock.
  chapter: "08-06"
  see_also: [Asynchronous reset]
- term: Asynchronous reset
  definition: A reset that acts on a flip-flop immediately, without a clock; its release must meet a recovery time before the next clock edge, so it is usually asserted asynchronously and released through a reset synchronizer.
  chapter: "08-06"
  see_also: [Recovery time]
- term: Recovery time
  definition: The minimum time between the release of an asynchronous reset or set and the next active clock edge, the reset's analogue of setup time.
  chapter: "08-06"
- term: Synchronous design
  definition: A discipline in which all state is held in flip-flops clocked by a common clock, every feedback loop contains a register and asynchronous inputs are synchronized, so correctness reduces to setup and hold checks on each register-to-register path.
  chapter: "08-06"
- term: JK flip-flop
  definition: A flip-flop whose inputs J and K hold (00), reset (01), set (10) or toggle (11) the output at the clock edge, Q⁺ = JQ̄ + K̄Q; in standard-cell chips it is a D flip-flop with logic in front.
  chapter: "08-06"
  see_also: [T flip-flop, Excitation table]
- term: T flip-flop
  definition: A toggle flip-flop, Q⁺ = T ⊕ Q, which inverts its output at each clock edge when T = 1 and holds it when T = 0; a JK flip-flop with J = K = T behaves the same way.
  chapter: "08-06"
  see_also: [JK flip-flop]
- term: Excitation table
  definition: For each present-to-next transition of a flip-flop (0→0, 0→1, 1→0, 1→1), the inputs that produce it, with don't cares; used to design sequential circuits with JK, T or SR flip-flops.
  chapter: "08-06"
  see_also: [JK flip-flop, State table]
- term: Register
  definition: A group of flip-flops sharing a clock that stores a multi-bit word, usually with an enable that lets it hold its value instead of loading a new one.
  chapter: "08-07"
  see_also: [Shift register]
- term: Shift register
  definition: A chain of flip-flops in which each clock edge moves every bit one stage along; with parallel load and output it converts between parallel words and serial bit streams.
  chapter: "08-07"
  see_also: [Register, Serializer and deserializer]
- term: Serializer and deserializer
  definition: The circuits (SerDes) that convert a parallel word into a fast serial bit stream for transmission and back again at the receiver, built around shift registers and a clock multiplied or recovered to the bit rate.
  chapter: "08-07"
  see_also: [Shift register]
- term: Synchronous counter
  definition: A counter whose flip-flops all share one clock, each bit toggling when the bits below it say so (all 1s when counting up), so every output changes at the same edge.
  chapter: "08-07"
  see_also: [Ripple counter, Modulo-N counter]
- term: Ripple counter
  definition: A counter in which each flip-flop is clocked by the output of the previous one; it needs no counting logic but its outputs settle one clock-to-Q delay per stage after the clock, passing through transient states.
  chapter: "08-07"
  see_also: [Synchronous counter]
- term: Modulo-N counter
  definition: A counter that cycles through N states and then returns to 0, such as a decade (modulo-10) counter; it needs the smallest number of flip-flops n with 2^n at least N.
  chapter: "08-07"
  see_also: [Synchronous counter]
- term: Ring counter
  definition: A shift register whose output feeds its input, initialized with a single 1, so the 1 circulates through n states of n flip-flops with one-hot outputs.
  chapter: "08-07"
  see_also: [Johnson counter]
- term: Johnson counter
  definition: A twisted-ring counter that feeds the complement of its last stage back to its first, giving 2n states from n flip-flops with one bit changing per step.
  chapter: "08-07"
  see_also: [Ring counter]
- term: Linear-feedback shift register (LFSR)
  definition: A shift register whose input is the XOR of selected stages (the taps); with taps from a primitive polynomial it steps through all 2^n - 1 nonzero states before repeating.
  chapter: "08-07"
  see_also: [Primitive polynomial, Pseudo-random bit sequence (PRBS)]
- term: Primitive polynomial
  definition: An irreducible polynomial of degree n over GF(2) whose root generates all 2^n - 1 nonzero field elements; used as an LFSR's feedback, it gives maximal length.
  chapter: "08-07"
  see_also: [Linear-feedback shift register (LFSR)]
- term: Pseudo-random bit sequence (PRBS)
  definition: A deterministic, periodic bit stream with noise-like statistics, normally the output of a maximal-length LFSR, used as a standard test pattern for links (PRBS7, PRBS15, PRBS23, PRBS31).
  chapter: "08-07"
  see_also: [Linear-feedback shift register (LFSR), Scrambler]
- term: Scrambler
  definition: A circuit that XORs data with a pseudo-random sequence so that long runs of identical bits become unlikely, giving a receiver transitions to recover the clock from; the descrambler applies the same sequence to restore the data.
  chapter: "08-07"
  see_also: [Pseudo-random bit sequence (PRBS)]
- term: Finite state machine (FSM)
  definition: A sequential circuit described by a finite set of states, a next-state function of the present state and inputs, an output function and a reset state; implemented as a state register with next-state and output logic.
  chapter: "08-08"
  see_also: [Moore machine, Mealy machine, State diagram]
- term: Moore machine
  definition: An FSM whose outputs depend only on the present state, so they change only after a clock edge and respond to an input one cycle later.
  chapter: "08-08"
  see_also: [Mealy machine]
- term: Mealy machine
  definition: An FSM whose outputs depend on the present state and the present inputs, so they respond within the same cycle but carry a combinational path from input to output.
  chapter: "08-08"
  see_also: [Moore machine]
- term: State diagram
  definition: A drawing of an FSM with states as circles and transitions as arrows labeled with the input condition (and, for a Mealy machine, the output).
  chapter: "08-08"
  see_also: [State table]
- term: State table
  definition: A table listing, for each present state and input value, the next state and the output of an FSM; the starting point for deriving its logic.
  chapter: "08-08"
  see_also: [State diagram, State assignment]
- term: State assignment
  definition: The choice of binary code for each state of an FSM (binary, Gray-ordered, one-hot, output-encoded), which sets the number of flip-flops and strongly affects the size and speed of the next-state logic.
  chapter: "08-08"
  see_also: [One-hot encoding]
- term: One-hot encoding
  definition: A state assignment with one flip-flop per state, exactly one of which is 1; it gives shallow next-state logic and detects any single bit flip, at the cost of N flip-flops and many illegal codes.
  chapter: "08-08"
  see_also: [State assignment, Illegal state]
- term: Equivalent states
  definition: Two states of an FSM that produce the same output sequence for every input sequence; they can be merged without changing the machine's behavior.
  chapter: "08-08"
  see_also: [Partition refinement]
- term: Partition refinement
  definition: The state-minimization algorithm that groups states by output and repeatedly splits groups whose members' next states fall in different groups, until nothing changes; the final groups are the equivalence classes.
  chapter: "08-08"
  see_also: [Equivalent states]
- term: Illegal state
  definition: A code of an FSM's state register that corresponds to no state of the design; reachable only through faults such as missing reset, timing violations or upsets, and handled by reset or recovery logic.
  chapter: "08-08"
  see_also: [Single-event upset (SEU), One-hot encoding]
- term: Single-event upset (SEU)
  definition: A bit flipped in a storage element by the charge from a particle strike, without permanent damage; a concern for state registers in automotive, aerospace and large-fleet systems.
  chapter: "08-08"
  see_also: [Illegal state]
- term: Datapath and controller (FSMD)
  definition: The split of a design into a small FSM that sequences operations and a datapath of registers, counters and arithmetic that performs them, linked by control and status signals.
  chapter: "08-08"
  see_also: [Finite state machine (FSM)]
- term: Carry-lookahead adder
  definition: An adder that computes carries directly from the bits' generate and propagate signals in two-level logic, usually in hierarchical groups of about 4 bits, instead of rippling them bit by bit.
  chapter: "08-09"
  see_also: [Generate and propagate, Parallel-prefix adder]
- term: Parallel-prefix adder
  definition: An adder that computes every carry as a prefix of (generate, propagate) pairs combined by an associative operator in a tree, giving a delay that grows with log2 n; Kogge–Stone, Sklansky and Brent–Kung are classic networks.
  chapter: "08-09"
  see_also: [Kogge–Stone adder, Brent–Kung adder]
- term: Kogge–Stone adder
  definition: A parallel-prefix adder with the minimum log2 n levels and fan-out 1, at the cost of about n log2 n operators and many long wires.
  chapter: "08-09"
  see_also: [Parallel-prefix adder, Brent–Kung adder]
- term: Brent–Kung adder
  definition: A parallel-prefix adder with an up-sweep tree and a down-sweep, using about 2n operators and regular wiring at the cost of 2 log2 n - 1 levels.
  chapter: "08-09"
  see_also: [Parallel-prefix adder, Kogge–Stone adder]
- term: Carry-select adder
  definition: An adder that computes upper sum bits for both possible carry-ins in parallel and selects the right result with multiplexers once the real carry arrives, trading duplicated hardware for delay.
  chapter: "08-09"
- term: Partial product
  definition: One shifted row of a multiplication, the multiplicand ANDed with a single bit (or Booth digit) of the multiplier; a multiplier's job is to add all its partial products.
  chapter: "08-09"
  see_also: [Dadda tree, Booth recoding]
- term: Carry-save adder
  definition: A row of independent full adders that reduces three numbers to two (a sum word and a carry word) in one full-adder delay, with no carry propagation; the building block of multiplier trees.
  chapter: "08-09"
  see_also: [Dadda tree]
- term: Dadda tree
  definition: A multiplier reduction tree that brings the partial-product columns down to target heights 2, 3, 4, 6, 9, 13, ... using as few adders as possible, needing n^2 - 4n + 3 full adders for an n by n multiplier.
  chapter: "08-09"
  see_also: [Carry-save adder, Partial product]
- term: Booth recoding
  definition: Rewriting a two's-complement multiplier in signed digits (radix 4 uses -2 to +2) from overlapping bit triplets, which halves the number of partial products.
  chapter: "08-09"
  see_also: [Partial product]
- term: Barrel shifter
  definition: A shifter that shifts by any amount in one pass, built from log2 n stages of 2-to-1 multiplexers, stage k shifting by 2^k.
  chapter: "08-09"
- term: Multiply-accumulate (MAC)
  definition: The operation acc = acc + a·b, the inner loop of filters, matrix products and neural networks; its multiplier and accumulator widths set much of a DSP or AI chip's area and energy.
  chapter: "08-09"
  see_also: [Q format]
- term: Static timing analysis (STA)
  definition: Checking every timing path of a synchronous design against setup and hold constraints by propagating worst-case and best-case arrival times through the circuit graph, without simulating input vectors.
  chapter: "08-10"
  see_also: [Critical path, Slack]
- term: Slack
  definition: The margin by which a timing path meets its constraint, the required time minus the arrival time; negative slack is a violation.
  chapter: "08-10"
  see_also: [Static timing analysis (STA)]
- term: Clock skew
  definition: The difference between the arrival times of a clock edge at two flip-flops; skew that delays the capturing clock helps setup and hurts hold by the same amount.
  chapter: "08-10"
  see_also: [Jitter]
- term: Pipelining
  definition: Inserting registers to split long combinational paths into stages, raising the clock rate and throughput at the cost of latency and register overhead.
  chapter: "08-10"
- term: Metastability
  definition: The state of a bistable element left near its balance point by an input that changed within its setup-hold window; it resolves to 0 or 1 after a random time whose tail falls exponentially with time constant tau.
  chapter: "08-10"
  see_also: [Synchronizer]
- term: Synchronizer
  definition: A chain of flip-flops (usually two or three) with nothing between them that samples an asynchronous signal and gives any metastability a clock period per stage to resolve; its reliability is quantified by MTBF = e^(S/tau)/(T_W F_C F_D).
  chapter: "08-10"
  see_also: [Metastability, Mean time between failures (MTBF)]
- term: Clock-domain crossing (CDC)
  definition: Any signal passing between logic clocked by unrelated clocks; it needs a synchronizer for single bits and Gray coding, a handshake or an asynchronous FIFO for multi-bit values.
  chapter: "08-10"
  see_also: [Synchronizer, Asynchronous FIFO]
- term: Asynchronous FIFO
  definition: A dual-port memory written in one clock domain and read in another, whose Gray-coded read and write pointers cross the domains through synchronizers and produce conservative full and empty flags.
  chapter: "08-10"
  see_also: [Clock-domain crossing (CDC)]
- term: Reset synchronizer
  definition: Two flip-flops that assert a domain's reset asynchronously but release it on the domain's clock edge, so every flip-flop in the domain leaves reset in the same cycle.
  chapter: "08-10"
- term: Memory array
  definition: A grid of bit cells organized in rows and columns, with a row decoder that selects one wordline and column multiplexers that select the addressed word from the selected row.
  chapter: "08-11"
  see_also: [Wordline and bitline, Column multiplexer]
- term: Wordline and bitline
  definition: The row wire (wordline) that connects every cell of a memory row to its column wires, and the column wires (bitlines) that carry each cell's data to the sense amplifiers or bring write data in.
  chapter: "08-11"
  see_also: [Memory array]
- term: Column multiplexer
  definition: The multiplexer that selects one word out of the several held in a memory row, using the low-order address bits, so that the array can be kept roughly square.
  chapter: "08-11"
  see_also: [Memory array]
- term: Register file
  definition: A small, fast memory of a processor's registers with several read and write ports used in the same cycle; its area grows roughly as the square of the number of ports.
  chapter: "08-11"
- term: Read-only memory (ROM)
  definition: A memory whose contents are fixed at manufacture (or programmed once); as logic, a 2^n by m ROM implements any n-input, m-output function by storing its truth table.
  chapter: "08-11"
  see_also: [Lookup table (LUT)]
- term: Programmable logic array (PLA)
  definition: A two-level logic structure with a programmable AND plane forming product terms and a programmable OR plane summing them into outputs; its size grows with the number of products rather than with 2^n.
  chapter: "08-11"
- term: Lookup table (LUT)
  definition: A small memory of 2^k configuration bits selected by k inputs, able to implement any k-input function; the basic logic element of FPGAs (usually k = 4 or 6).
  chapter: "08-11"
  see_also: [Field-programmable gate array (FPGA), Shannon expansion]
- term: Field-programmable gate array (FPGA)
  definition: A chip of lookup tables, flip-flops, block RAMs, DSP blocks and I/O joined by programmable routing, configured after manufacture by loading a bitstream.
  chapter: "08-11"
  see_also: [Lookup table (LUT), Block RAM, Bitstream]
- term: Block RAM
  definition: A hard, synchronous memory block (typically a few to tens of kbit, often dual-ported) embedded in an FPGA's fabric; reads take one clock cycle.
  chapter: "08-11"
  see_also: [Field-programmable gate array (FPGA)]
- term: Bitstream
  definition: The configuration data that sets every LUT, routing switch and mode bit of an FPGA; SRAM-based FPGAs load it at every power-up, usually from flash.
  chapter: "08-11"
  see_also: [Field-programmable gate array (FPGA)]
- term: Placement
  definition: The implementation step that assigns every primitive of a synthesized netlist to a physical site on the chip, keeping connected and timing-critical cells close; often randomized, so results depend on a seed.
  chapter: "08-12"
  see_also: [Routing]
- term: Routing
  definition: The implementation step that connects every net through the available wires and switches (an FPGA's programmable interconnect, or an ASIC's metal layers), resolving competition for wires.
  chapter: "08-12"
  see_also: [Placement, Routing congestion]
- term: Routing congestion
  definition: Demand by more nets than the wiring in a region can carry; routers resolve it by pushing nets onto longer paths, which adds delay, and a congested design can fail to route at all.
  chapter: "08-12"
  see_also: [Routing]
- term: Timing closure
  definition: The iterative process of changing RTL, constraints, tool options or placement until every timing path in a design meets its constraints with non-negative slack.
  chapter: "08-12"
  see_also: [Timing constraint, Slack]
- term: Timing constraint
  definition: A statement to the implementation tools of a design's timing requirements, such as clock periods, I/O delays, and false or multicycle paths; the tools check only what the constraints describe.
  chapter: "08-12"
  see_also: [Timing closure]
- term: Carry chain
  definition: Dedicated, hard-wired carry logic between neighboring FPGA logic cells that makes adders and counters much faster than the same logic built from lookup tables and general routing.
  chapter: "08-12"
- term: Utilization
  definition: The fraction of a device's resources (logic cells, block RAMs, DSP blocks, I/O) that a design uses, as reported after synthesis or placement; high utilization makes routing harder.
  chapter: "08-12"
# ---- 09-01
- term: Diamond structure
  definition: The crystal structure of Si, Ge and diamond, a face-centered cubic lattice with a two-atom basis offset by (a/4)(1,1,1), giving 8 atoms per cubic cell and four tetrahedral bonds per atom.
  chapter: "09-01"
  see_also: [Crystal lattice, Zinc blende]
- term: Zinc blende
  definition: The diamond structure with its two basis sites occupied by different elements, as in GaAs and InP, so that each atom of one kind has four neighbors of the other.
  chapter: "09-01"
  see_also: [Diamond structure, Wurtzite]
- term: Wurtzite
  definition: A hexagonal crystal structure built from the same tetrahedral bonds as zinc blende but stacked differently, described by two lattice constants a and c; GaN, AlN and ZnO crystallize in it.
  chapter: "09-01"
- term: Miller indices
  definition: Three integers (hkl) naming a crystal plane, found by taking the reciprocals of its axis intercepts in units of the lattice constant and clearing fractions; [hkl] names a direction, which in cubic crystals is normal to (hkl).
  chapter: "09-01"
- term: Brillouin zone
  definition: The range of crystal wavevectors that describes every distinct Bloch state once, −π/d < k ≤ π/d in one dimension; band diagrams are plotted across it, and its boundaries are where Bragg reflection opens gaps.
  chapter: "09-01"
  see_also: [Bloch's theorem]
- term: Kronig–Penney model
  definition: An exactly solvable model of an electron in a one-dimensional periodic array of square barriers whose dispersion relation, cos kd = F(E), shows how allowed bands and forbidden gaps arise; energies with |F(E)| ≤ 1 are allowed.
  chapter: "09-01"
  see_also: [Bloch's theorem, Energy band]
- term: Conductivity effective mass
  definition: The effective mass that sets a carrier's acceleration, and hence mobility, averaged over equivalent valleys as a harmonic mean; for silicon electrons 1/m_c = (1/3)(1/m_l + 2/m_t), giving about 0.26 m0.
  chapter: "09-01"
  see_also: [Effective mass, Density-of-states effective mass]
- term: Density-of-states effective mass
  definition: The mass of a single spherical band that would hold as many states as the real, possibly anisotropic and multi-valley, band; for silicon electrons m_dn = 6^(2/3)(m_l m_t²)^(1/3), about 1.08 m0 at the band edge. It sets N_C and N_V.
  chapter: "09-01"
  see_also: [Conductivity effective mass]
- term: Indirect band gap
  definition: A band gap whose conduction-band minimum lies at a different crystal momentum from the valence-band maximum (Si, Ge, SiC), so radiative recombination needs a phonon and light emission is weak, although absorption above the gap remains strong.
  chapter: "09-01"
  see_also: [Direct band gap]
- term: Vacuum level
  definition: The energy of an electron at rest just outside a material, the reference from which electron affinity and work function are measured on a band diagram.
  chapter: "09-01"
- term: Electron affinity
  definition: The energy χ = E_0 − E_C needed to lift an electron from the conduction-band edge to the vacuum level; 4.05 eV for silicon. Unlike the work function, it does not depend on doping.
  chapter: "09-01"
  see_also: [Work function, Vacuum level]
- term: Vegard's law
  definition: The rule that an alloy's lattice constant varies linearly with composition between those of its end members, a(x) = (1 − x)a_A + x a_B; band gaps usually deviate from linearity (bowing).
  chapter: "09-01"
- term: Lattice mismatch
  definition: The fractional difference f = (a_layer − a_substrate)/a_substrate between the lattice constants of an epitaxial layer and its substrate; 4.2% for Ge on Si, 0.14% for AlAs on GaAs.
  chapter: "09-01"
  see_also: [Epitaxy]
- term: Epitaxy
  definition: Growth of a crystalline layer on a crystalline substrate so that the layer continues the substrate's lattice; a mismatched layer is strained until, beyond a critical thickness, misfit dislocations relax it.
  chapter: "09-01"
  see_also: [Lattice mismatch]
- term: Strained silicon
  definition: Silicon whose lattice is deliberately stretched or compressed, by a SiGe substrate or by local stressors, to reshape its bands and raise carrier mobility; introduced into production logic processes at the 90 nm generation.
  chapter: "09-01"
# ---- 09-02
- term: Effective density of states
  definition: The number of states per volume, N_C (or N_V), that a band would have if all its states sat at the band edge, chosen so that n = N_C e^(−(E_C − E_F)/kT); N_C = 2(2π m_dn kT/h²)^(3/2), about 3.2×10¹⁹ cm⁻³ in silicon at 300 K.
  chapter: "09-02"
  see_also: [Density of states, Density-of-states effective mass]
- term: Fermi level
  definition: The energy E_F at which a state would be occupied with probability one half; in equilibrium it is constant throughout a system, and its position relative to the band edges sets the electron and hole concentrations.
  chapter: "09-02"
  see_also: [Fermi–Dirac distribution, Intrinsic Fermi level]
- term: Boltzmann approximation
  definition: Replacing the Fermi–Dirac occupation by e^(−(E − E_F)/kT), valid to within 5% for states more than 3kT above E_F; it gives n = N_C e^(−(E_C − E_F)/kT) for non-degenerate semiconductors.
  chapter: "09-02"
  see_also: [Degenerate semiconductor]
- term: Degenerate semiconductor
  definition: A semiconductor so heavily doped that its Fermi level lies within a few kT of a band edge or inside a band, so that Boltzmann statistics fail and the Fermi–Dirac integral is needed; silicon becomes degenerate above roughly 10¹⁸–10¹⁹ cm⁻³.
  chapter: "09-02"
  see_also: [Fermi–Dirac integral, Band-gap narrowing]
- term: Fermi–Dirac integral
  definition: The function F_1/2(η) = (2/√π)∫₀^∞ √x dx/(1 + e^(x − η)) that gives the carrier density of a parabolic band with any Fermi level, n = N_C F_1/2((E_F − E_C)/kT); it reduces to e^η when η ≪ −1.
  chapter: "09-02"
- term: Intrinsic Fermi level
  definition: The Fermi level E_i of an undoped semiconductor, where n = p = n_i; it lies near mid-gap, offset by (kT/2)ln(N_V/N_C), and serves as the reference in n = n_i e^((E_F − E_i)/kT).
  chapter: "09-02"
  see_also: [Intrinsic carrier concentration]
- term: Law of mass action
  definition: In equilibrium, np = n_i², independent of doping, because thermal generation of electron–hole pairs balances their recombination, which is proportional to np; it fails under illumination or current.
  chapter: "09-02"
- term: Donor
  definition: An impurity with one more valence electron than the atom it replaces (P, As or Sb in silicon), whose extra electron is bound by only tens of meV and is freed into the conduction band at room temperature, making the material n-type.
  chapter: "09-02"
  see_also: [Acceptor, Ionization energy]
- term: Acceptor
  definition: An impurity with one fewer valence electron than the atom it replaces (B, Al, Ga or In in silicon), which captures an electron from the valence band, leaving a mobile hole and making the material p-type.
  chapter: "09-02"
  see_also: [Donor]
- term: Ionization energy
  definition: For a dopant, the energy needed to free its bound carrier into the band, E_C − E_D for donors and E_A − E_V for acceptors; 45 meV for phosphorus and boron in silicon, about twice the hydrogen-model estimate of 26 meV.
  chapter: "09-02"
- term: Majority carrier
  definition: The more numerous carrier type in a doped region, electrons in n-type and holes in p-type material; its density is approximately the net doping.
  chapter: "09-02"
  see_also: [Minority carrier]
- term: Minority carrier
  definition: The less numerous carrier type in a doped region, with density n_i² divided by the majority density in equilibrium; minority carriers govern junction leakage, diffusion currents and bipolar transistor action.
  chapter: "09-02"
  see_also: [Majority carrier, Law of mass action]
- term: Compensation
  definition: The presence of both donors and acceptors in one region, where the carrier densities depend on the net doping |N_D − N_A| while all the ions still scatter carriers; used to form regions of one type inside another.
  chapter: "09-02"
- term: Freeze-out
  definition: The recapture of carriers by their dopants at low temperature, when kT becomes small compared with the ionization energy; lightly doped silicon begins to lose carriers this way below about 100 K.
  chapter: "09-02"
- term: Band-gap narrowing
  definition: The reduction of a semiconductor's band gap at high doping, tens of meV near 10¹⁹ cm⁻³ in silicon, which raises the effective n_i² of the region exponentially and affects bipolar emitters and solar cells.
  chapter: "09-02"
- term: Random dopant fluctuation
  definition: The variation of transistor properties, chiefly threshold voltage, caused by the random number and placement of dopant atoms in a small channel; the count is Poisson-distributed, so a mean of N atoms varies by about √N.
  chapter: "09-02"
# ---- 09-03
- term: Drift
  definition: The net motion of carriers caused by an electric field, superimposed on their random thermal motion; the drift velocity is μ𝓔 at low fields, and drift current density is q(nμ_n + pμ_p)𝓔.
  chapter: "09-03"
  see_also: [Mobility, Diffusion]
- term: Thermal velocity
  definition: The root-mean-square speed of carriers from thermal energy, √(3kT/m*), about 2.3×10⁷ cm/s for electrons in silicon at 300 K; drift is a small bias on this random motion.
  chapter: "09-03"
- term: Matthiessen's rule
  definition: Independent scattering mechanisms add their rates, so 1/μ = 1/μ_lattice + 1/μ_impurity + …; the lowest mobility dominates, like resistors in series.
  chapter: "09-03"
  see_also: [Mobility]
- term: Four-point probe
  definition: A sheet-resistance measurement with four collinear probes, driving current through the outer pair and measuring voltage across the inner pair so that contact resistance drops out; for a thin film R_s = (π/ln 2)(V/I) ≈ 4.532 V/I.
  chapter: "09-03"
  see_also: [Sheet resistance]
- term: Velocity saturation
  definition: The levelling-off of carrier drift velocity at high fields (above about 10⁴ V/cm in silicon) near 10⁷ cm/s, because hot carriers lose energy by emitting optical phonons; it limits the current of short transistors.
  chapter: "09-03"
  see_also: [Optical phonon, Ballistic transport]
- term: Optical phonon
  definition: A high-energy lattice vibration (63 meV in silicon) in which neighboring atoms move against each other; emission of optical phonons by hot carriers is the main cause of velocity saturation.
  chapter: "09-03"
- term: Ballistic transport
  definition: Carrier motion across a region shorter than a few mean free paths, with few or no collisions, where mobility and velocity saturation lose their meaning; modern short-channel transistors are partly ballistic.
  chapter: "09-03"
- term: Diffusion
  definition: The net flow of carriers from regions of high to low concentration caused by random thermal motion alone, with flux −D dn/dx (Fick's law); the carrier spread grows as √(Dt).
  chapter: "09-03"
  see_also: [Diffusion coefficient, Fick's law]
- term: Diffusion coefficient
  definition: The constant D linking diffusion flux to concentration gradient (cm²/s); for silicon at 300 K about 35 cm²/s for electrons and 12 cm²/s for holes in lightly doped material, related to mobility by D = (kT/q)μ.
  chapter: "09-03"
  see_also: [Einstein relation]
- term: Fick's law
  definition: The statement that a diffusion flux is proportional to, and directed down, the concentration gradient, F = −D dn/dx; it follows from a random walk.
  chapter: "09-03"
- term: Einstein relation
  definition: D/μ = kT/q for non-degenerate carriers, derived from the requirement of zero current in equilibrium; 25.85 mV at 300 K.
  chapter: "09-03"
  see_also: [Diffusion coefficient, Mobility]
- term: Built-in field
  definition: The electric field present in equilibrium wherever doping varies, of just the size, (kT/q)(1/N)(dN/dx), needed for drift to cancel diffusion; graded doping uses it to speed minority carriers across bipolar bases.
  chapter: "09-03"
- term: Drift–diffusion equations
  definition: The transport model J_n = qnμ_n𝓔 + qD_n dn/dx and J_p = qpμ_p𝓔 − qD_p dp/dx which, with Poisson's equation and the continuity equations, describes semiconductor devices and is solved by device simulators.
  chapter: "09-03"
- term: Hall mobility
  definition: The mobility obtained from a Hall measurement, μ_H = |R_H|/ρ; it differs from the drift mobility by the Hall factor, which depends on the scattering mechanism.
  chapter: "09-03"
  see_also: [Hall effect]
# ---- 09-04
- term: Generation
  definition: The creation of electron–hole pairs, thermally (balanced by recombination in equilibrium) or by light or high fields; net generation occurs where np < n_i², as in a reverse-biased depletion region.
  chapter: "09-04"
  see_also: [Recombination]
- term: Recombination
  definition: The annihilation of an electron–hole pair, by emitting a photon (radiative), through a trap level (Shockley–Read–Hall) or by giving the energy to a third carrier (Auger); net recombination occurs where np > n_i².
  chapter: "09-04"
  see_also: [Generation, Minority-carrier lifetime]
- term: Minority-carrier lifetime
  definition: The average time an excess minority carrier survives before recombining; under low-level injection the net recombination rate is Δp/τ. In silicon it ranges from milliseconds in pure, lightly doped material to nanoseconds in heavily doped or contaminated regions.
  chapter: "09-04"
- term: Low-level injection
  definition: The condition that excess carrier densities are much smaller than the majority density, so the majority density is essentially unchanged and recombination is linear in the excess, U = Δp/τ.
  chapter: "09-04"
- term: Radiative recombination
  definition: Band-to-band recombination that emits a photon, at rate B(np − n_i²); weak in indirect-gap silicon (B = 1.1×10⁻¹⁴ cm³/s) and strong in direct-gap GaAs (7×10⁻¹⁰ cm³/s), where it powers LEDs and lasers.
  chapter: "09-04"
- term: Auger recombination
  definition: Recombination in which the released energy goes to a third carrier, at rate (C_n n + C_p p)(np − n_i²); it dominates at high doping, limiting the lifetime of heavily doped regions and the efficiency of silicon solar cells.
  chapter: "09-04"
- term: Shockley–Read–Hall recombination
  definition: Two-step recombination through a trap level in the gap, at net rate (np − n_i²)/[τ_p0(n + n_1) + τ_n0(p + p_1)]; the dominant mechanism in moderately doped silicon, most effective for traps near mid-gap.
  chapter: "09-04"
  see_also: [Trap, Capture cross section]
- term: Trap
  definition: A localized electron state in the band gap, from an impurity or crystal defect, that captures and emits carriers; deep (near mid-gap) traps act as recombination and generation centers.
  chapter: "09-04"
- term: Capture cross section
  definition: The effective target area σ (cm²) a trap presents to a passing carrier; the capture time is 1/(σ v_th N_t). Gold in silicon captures holes with σ_p ≈ 9×10⁻¹⁵ cm².
  chapter: "09-04"
- term: Quasi-Fermi level
  definition: A separate Fermi level for electrons (E_Fn) or holes (E_Fp) when a semiconductor is out of equilibrium but each carrier population is in equilibrium with itself; np = n_i² e^((E_Fn − E_Fp)/kT), and each current flows down its own quasi-Fermi-level gradient.
  chapter: "09-04"
- term: Minority-carrier diffusion equation
  definition: The continuity equation for minority carriers in a quasi-neutral region under low-level injection, ∂Δp/∂t = D_p ∂²Δp/∂x² − Δp/τ_p + G_L; it yields the currents of diodes, bipolar transistors and photodiodes.
  chapter: "09-04"
  see_also: [Continuity equation, Diffusion length]
- term: Diffusion length
  definition: The average distance a minority carrier diffuses before recombining, L = √(Dτ); regions much shorter than L transport carriers with little recombination, those much longer absorb them.
  chapter: "09-04"
- term: Surface recombination velocity
  definition: The parameter S (cm/s) that sets recombination at a surface through the boundary condition D dΔp/dx = SΔp; 10² to about 10⁵ cm/s for bare silicon surfaces, below 1 cm/s at a well-passivated oxide interface.
  chapter: "09-04"
- term: Photoconductive decay
  definition: A lifetime measurement that excites carriers with a light pulse and records the exponential decay of the excess conductivity; it reports an effective lifetime that includes surface recombination.
  chapter: "09-04"
- term: Lifetime killing
  definition: The deliberate shortening of minority-carrier lifetime, by deep-level impurities such as gold or platinum or by irradiation, to speed the turn-off of power diodes and IGBTs at the cost of higher leakage.
  chapter: "09-04"
- term: Dark current
  definition: The current an image-sensor pixel or photodiode collects with no light, mainly thermal generation through traps in depleted regions and at interfaces; it scales roughly with n_i and so grows rapidly with temperature.
  chapter: "09-04"
# ---- 09-05
- term: PN junction
  definition: The boundary between p-type and n-type regions of one crystal, where carrier diffusion leaves a depleted layer of fixed ions, an internal field and a built-in potential; the basis of diodes, bipolar transistors and the source and drain of MOSFETs.
  chapter: "09-05"
  see_also: [Depletion region, Built-in potential]
- term: Built-in potential
  definition: The electrostatic potential difference across a PN junction in equilibrium, V_bi = (kT/q) ln(N_A N_D/n_i²), equal to the difference of the two sides' Fermi levels before contact; about 0.6–0.9 V in silicon and not measurable with a voltmeter.
  chapter: "09-05"
- term: Depletion approximation
  definition: The model of a junction's space-charge region as completely empty of carriers between sharp edges and exactly neutral outside, which turns Poisson's equation into simple integrals; accurate to a few percent except near flat band.
  chapter: "09-05"
- term: Quasi-neutral region
  definition: The part of a doped region outside a depletion layer, where majority carriers balance the dopant charge and the field is small.
  chapter: "09-05"
- term: Poisson's equation
  definition: The relation d²V/dx² = −ρ/ε between electrostatic potential and charge density (or dE/dx = ρ/ε); solved across junctions and MOS structures to find fields and potentials.
  chapter: "09-05"
- term: Step junction
  definition: A PN junction whose doping changes abruptly from N_A to N_D, with depletion width W = √(2ε(V_bi − V_A)(1/N_A + 1/N_D)/q).
  chapter: "09-05"
  see_also: [One-sided junction, Linearly graded junction]
- term: One-sided junction
  definition: A strongly asymmetric junction (P⁺N or N⁺P) whose depletion region, capacitance and breakdown voltage are set by the lightly doped side, W ≈ √(2ε(V_bi − V_A)/(qN)).
  chapter: "09-05"
- term: Linearly graded junction
  definition: A junction whose net doping varies linearly through it, N_D − N_A = ax; its depletion width grows as the cube root of the voltage, W = (12ε(V_bi − V_A)/(qa))^(1/3).
  chapter: "09-05"
- term: Debye length
  definition: The screening length L_D = √(εkT/(q²N)) over which mobile carriers smooth out a charge disturbance; 41 nm at 10¹⁶ cm⁻³ in silicon, and the scale of the soft edges of a depletion region.
  chapter: "09-05"
- term: Junction capacitance
  definition: The small-signal capacitance of a reverse-biased junction, ε/W per unit area, from charge uncovered at the depletion edges; about 1 fF/µm² at W = 0.1 µm, falling with reverse bias.
  chapter: "09-05"
  see_also: [C–V profiling]
- term: C–V profiling
  definition: Extracting doping from capacitance–voltage data, using the slope of 1/C² against voltage (which gives the doping of the lightly doped side) and its intercept (which gives the built-in potential).
  chapter: "09-05"
- term: Critical field
  definition: The peak electric field at which a junction breaks down by avalanche, about 3×10⁵ V/cm in silicon (rising slowly with doping); with it, breakdown voltage scales as εE_c²/(2qN) and drift-region resistance as V²/E_c³.
  chapter: "09-05"
# ---- 09-06
- term: Law of the junction
  definition: The boundary condition that the minority-carrier density at each depletion edge equals its equilibrium value times e^(qV_A/kT), because the quasi-Fermi levels stay flat across the depletion region; the starting point of the diode equation.
  chapter: "09-06"
  see_also: [Quasi-Fermi level, Ideal diode equation]
- term: Ideal diode equation
  definition: The Shockley relation I = I_s(e^(qV_A/kT) − 1) derived from minority-carrier diffusion in the neutral regions, with I_s = Aqn_i²(D_p/(L_pN_D) + D_n/(L_nN_A)) for a long diode; the current rises tenfold per 59.5 mV at 300 K.
  chapter: "09-06"
  see_also: [Reverse saturation current, Law of the junction]
- term: Reverse saturation current
  definition: The constant I_s in the diode equation, the reverse current of an ideal diode, set by minority carriers generated within about a diffusion length of the junction; proportional to n_i² and so very small in silicon and steeply temperature dependent.
  chapter: "09-06"
- term: Short diode
  definition: A diode whose neutral region is much shorter than a diffusion length, so the excess-carrier profile is a straight line, the diffusion length in I_s is replaced by the region width, and the stored charge is set by the transit time W²/2D rather than the lifetime.
  chapter: "09-06"
- term: Injection efficiency
  definition: The fraction of a forward-biased junction's current carried by carriers injected into the lightly doped side; close to 1 for a strongly one-sided junction and the basis of a bipolar transistor's current gain.
  chapter: "09-06"
- term: Ideality factor
  definition: The factor η in I ∝ e^(qV/ηkT) that summarizes a measured diode characteristic; 1 for diffusion current, 2 for depletion-region recombination or high-level injection, with values between where mechanisms mix.
  chapter: "09-06"
- term: High-level injection
  definition: The regime in which injected minority carriers become comparable with the majority density, so quasi-neutrality raises the majority density too and the diode current rises only as e^(qV/2kT); in silicon it begins near 2V_T ln(N/n_i).
  chapter: "09-06"
  see_also: [Low-level injection]
- term: Recombination current
  definition: The extra forward current from electron–hole recombination inside the depletion region, about (qn_iW/2τ)(e^(qV/2kT) − 1), dominant at low forward bias in silicon; in reverse bias the same traps produce generation leakage.
  chapter: "09-06"
- term: PTAT voltage
  definition: A voltage proportional to absolute temperature, such as the difference (kT/q) ln(I_1/I_2) between two diodes or transistors at different current densities; the basis of on-chip temperature sensors and bandgap references.
  chapter: "09-06"
- term: Diffusion capacitance
  definition: The small-signal capacitance from minority charge stored in a forward-biased diode, proportional to bias current; τ_p g_d/2 for a long diode and W²g_d/(3D) for a short one, usually far larger than the junction capacitance in forward bias.
  chapter: "09-06"
  see_also: [Junction capacitance]
- term: Charge-control model
  definition: Describing a device by its stored charge Q, with i = dQ/dt + Q/τ for a diode; exact for the total charge but approximate for switching events that depend on the charge at the junction edge.
  chapter: "09-06"
- term: Reverse recovery
  definition: The transient when a conducting PN diode is switched to reverse bias, in which stored minority charge first sustains a reverse current set by the circuit (the storage phase) and then decays; it limits switching speed and causes loss in power converters.
  chapter: "09-06"
  see_also: [Storage time]
- term: Storage time
  definition: The duration of the storage phase of reverse recovery, until the excess density at the junction edge reaches zero; exactly τ_p times the solution of erf√(t_s/τ_p) = I_F/(I_F + I_R) for a long diode, shorter than the charge-control estimate τ_p ln(1 + I_F/I_R).
  chapter: "09-06"
- term: Impact ionization
  definition: The creation of an electron–hole pair by a carrier that has gained more than about the bandgap energy from a strong field; the multiplication process behind avalanche breakdown and avalanche photodiodes.
  chapter: "09-06"
- term: Ionization coefficient
  definition: The number of electron–hole pairs a carrier creates per unit distance in a given field, α = α_0 e^(−E_0/E); in silicon about 6.6×10³ cm⁻¹ for electrons and 2.8×10³ cm⁻¹ for holes at 3×10⁵ V/cm.
  chapter: "09-06"
- term: Avalanche multiplication
  definition: The growth of a reverse current by repeated impact ionization in a depletion region, measured by the multiplication factor M, where 1 − 1/M equals the ionization integral; M diverges at breakdown.
  chapter: "09-06"
- term: Avalanche breakdown
  definition: Reverse breakdown in which the ionization integral reaches 1 and multiplication becomes self-sustaining; it dominates in silicon above a few volts, its voltage falls roughly as N^(−0.6) to N^(−0.75) and rises with temperature.
  chapter: "09-06"
  see_also: [Critical field, Tunneling breakdown]
- term: Tunneling breakdown
  definition: Reverse breakdown of a junction heavily doped on both sides, in which electrons tunnel from the valence band to the conduction band across a gap of E_g/qE; it occurs at fields near 10⁶ V/cm in silicon, at low voltages, and its voltage falls with temperature.
  chapter: "09-06"
- term: Zener diode
  definition: A diode designed to operate in reverse breakdown at a specified voltage, by tunneling at low voltages and by avalanche at higher ones; the opposite temperature coefficients partly cancel near the crossover.
  chapter: "09-06"
- term: Schottky barrier
  definition: The energy barrier φ_B that carriers in a metal face to enter a semiconductor's band at a metal–semiconductor junction; ideally ψ_M − χ but pinned near 0.7 V on n-type silicon by interface states, with φ_Bn + φ_Bp ≈ E_g.
  chapter: "09-06"
  see_also: [Fermi-level pinning]
- term: Fermi-level pinning
  definition: The weak dependence of Schottky barrier height on metal work function, caused by interface states that hold the Fermi level near a fixed energy in the gap; for silicon Hu fits φ_Bn ≈ 0.7 V + 0.2(ψ_M − 4.75 V).
  chapter: "09-06"
- term: Thermionic emission
  definition: Current carried by carriers energetic enough to pass over a barrier, J = KT²e^(−qφ_B/kT)(e^(qV/kT) − 1) for a Schottky diode; it involves only majority carriers.
  chapter: "09-06"
  see_also: [Richardson constant]
- term: Richardson constant
  definition: The prefactor K = 4πqmk²/h³ of the thermionic-emission current, 120 A/(cm²·K²) for the free-electron mass and about 100 for silicon in Hu's usage.
  chapter: "09-06"
- term: Schottky diode
  definition: A metal–semiconductor rectifier whose current is thermionic emission of majority carriers; it has a saturation current 10³–10⁸ times a PN diode's, a lower forward drop and almost no stored charge, at the cost of higher leakage.
  chapter: "09-06"
- term: Ohmic contact
  definition: A metal–semiconductor contact with low resistance in both directions, made by doping the semiconductor so heavily that the barrier is only nanometers thick and carriers tunnel through it.
  chapter: "09-06"
- term: Specific contact resistivity
  definition: The resistance of a contact times its area, ρ_c in Ω·cm², which falls exponentially with √N and with barrier height; about 10⁻⁷ Ω·cm² for Hu's measured TiSi₂ contact, and much lower values are needed as contacts shrink.
  chapter: "09-06"
# ---- 09-07
- term: Bipolar junction transistor
  definition: A transistor of two back-to-back PN junctions sharing a thin base, in which a forward-biased emitter injects minority carriers that diffuse across the base and are collected by a reverse-biased collector; I_C ≈ I_S e^(V_BE/V_T).
  chapter: "09-07"
  see_also: [Heterojunction bipolar transistor]
- term: Forward-active mode
  definition: The amplifying region of a bipolar transistor, with the base–emitter junction forward biased and the base–collector junction reverse biased, where the collector current is set by V_BE and nearly independent of V_CE.
  chapter: "09-07"
- term: Gummel number
  definition: The base charge integral G_B = ∫(n_i²/n_iB²)(p/D_B) dx (s/cm⁴) that sets a bipolar transistor's saturation current, I_S = qA_E n_i²/G_B; for a uniform silicon base it is the base dopant count per area divided by D_B.
  chapter: "09-07"
- term: Gummel plot
  definition: A semilog plot of collector and base current against V_BE; its 60 mV/decade slopes, intercepts and the spacing between the curves give I_S, the Gummel numbers and the current gain, and show gain fall-off at low and high current.
  chapter: "09-07"
- term: Current gain
  definition: The common-emitter ratio β_F = I_C/I_B of a bipolar transistor, about 100 in typical devices; the common-base gain α_F = I_C/I_E = β_F/(1 + β_F) is just below 1.
  chapter: "09-07"
- term: Emitter injection efficiency
  definition: The fraction γ of a bipolar transistor's emitter current carried by majority carriers injected into the base; set by the ratio of emitter to base Gummel numbers and limited by band-gap narrowing in the emitter.
  chapter: "09-07"
- term: Base transport factor
  definition: The fraction α_T of carriers injected into the base that reach the collector without recombining, 1 − W_B²/2L_B²; essentially 1 in modern thin-base transistors.
  chapter: "09-07"
- term: Polysilicon emitter
  definition: A bipolar emitter made of a thick heavily doped polysilicon layer over a shallow single-crystal emitter, which raises the effective emitter Gummel number and current gain and avoids defects from deep emitter implants.
  chapter: "09-07"
- term: Heterojunction bipolar transistor
  definition: A bipolar transistor whose emitter and base are different semiconductors, such as a SiGe base on a silicon emitter; the narrower base gap raises n_iB² and the gain, which designers trade for heavier base doping and a graded drift field.
  chapter: "09-07"
- term: Early effect
  definition: The rise of a bipolar transistor's collector current with V_CE because the widening base–collector depletion region thins the neutral base; it gives the device a finite output resistance.
  chapter: "09-07"
  see_also: [Early voltage]
- term: Early voltage
  definition: The voltage V_A at which extrapolated I_C–V_CE characteristics meet the voltage axis, equal to Q'_B/C'_jC for a uniform base; the output resistance is V_A/I_C and the intrinsic gain V_A/V_T, typically tens of volts.
  chapter: "09-07"
- term: Ebers–Moll model
  definition: The superposition model of a bipolar transistor driven by both V_BE and V_BC, I_C = I_S(e^(V_BE/V_T) − 1) − I_S(1 + 1/β_R)(e^(V_BC/V_T) − 1), valid in all operating regions and the core of SPICE bipolar models.
  chapter: "09-07"
- term: Forward transit time
  definition: The ratio τ_F = Q_F/I_C of stored excess charge to collector current in a forward-active bipolar transistor, the sum of emitter, base (W_B²/2D_B for a uniform base) and collector delays; it sets the diffusion capacitance and limits f_T.
  chapter: "09-07"
- term: Kirk effect
  definition: Base push-out at high current density, when mobile electrons in the collector depletion region cancel its donor charge near J = qN_C v_sat; the effective base widens, the transit time rises and f_T and gain collapse.
  chapter: "09-07"
- term: Hybrid-π model
  definition: The small-signal model of a bipolar transistor with transconductance g_m = I_C/V_T, input resistance r_π = β/g_m, input capacitance C_π = τ_F g_m + C_jE, output resistance r_o = V_A/I_C, feedback capacitance C_μ and series resistances.
  chapter: "09-07"
- term: Cutoff frequency
  definition: The frequency f_T at which a transistor's short-circuit current gain falls to 1; for a bipolar transistor 1/(2π[τ_F + (C_jE + C_jC)V_T/I_C]), rising with current until the Kirk effect sets in.
  chapter: "09-07"
- term: Maximum oscillation frequency
  definition: The frequency f_max at which a transistor's power gain falls to 1, about √(f_T/(8π r_b C_jC)) for a bipolar transistor, so base resistance and base–collector capacitance matter as much as transit time.
  chapter: "09-07"
- term: BiCMOS
  definition: A process that integrates bipolar (often SiGe heterojunction) transistors with CMOS on one chip, for RF, mmWave and precision analog functions alongside digital logic, at the cost of extra process steps.
  chapter: "09-07"
# ---- 09-08
- term: MOS capacitor
  definition: A metal (or polysilicon) gate on a thin insulator on a semiconductor, whose surface can be driven into accumulation, depletion or inversion by the gate voltage; the control structure of every MOSFET.
  chapter: "09-08"
- term: Flat-band voltage
  definition: The gate voltage at which the semiconductor's bands are flat up to the surface, V_FB = ψ_g − ψ_s − Q_ox/C_ox; about −1 V for an n⁺ poly gate on p-type silicon.
  chapter: "09-08"
- term: Surface potential
  definition: The band bending φ_s at a semiconductor surface relative to the bulk, positive when the bands bend down; it is zero at flat band and reaches about 2φ_B at threshold in a MOS structure.
  chapter: "09-08"
- term: Accumulation
  definition: The MOS bias regime in which majority carriers crowd to the surface (gate below flat band for p-type), so the capacitor behaves like a simple parallel-plate capacitor, C ≈ C_ox.
  chapter: "09-08"
- term: Surface depletion
  definition: The MOS bias regime in which majority carriers are pushed from the surface, leaving ionized dopants to a depth W_dep that grows with gate voltage until threshold.
  chapter: "09-08"
- term: Inversion layer
  definition: A thin layer of minority carriers at a semiconductor surface, induced when the surface potential exceeds about 2φ_B; it inverts the surface's conductivity type and forms a MOSFET's channel.
  chapter: "09-08"
- term: Threshold voltage
  definition: The gate voltage at which a MOS surface becomes inverted, conventionally where the surface electron density equals the body doping, V_TH = V_FB + 2φ_B + √(2qN_Aε_s 2φ_B)/C_ox; foundries define it by a drain current.
  chapter: "09-08"
- term: Enhancement-mode transistor
  definition: A MOSFET with no channel at zero gate voltage, so it is off unless the gate is driven past a threshold of the right sign; standard logic transistors are enhancement mode.
  chapter: "09-08"
- term: Oxide capacitance
  definition: The gate-dielectric capacitance per area, C_ox = ε_ox/T_ox, 345 nF/cm² for 10 nm of SiO₂; it sets how much channel charge each volt of gate overdrive induces.
  chapter: "09-08"
- term: C–V characteristics
  definition: The small-signal capacitance of a MOS structure against gate voltage, C_ox in accumulation, falling through depletion, and either returning to C_ox (quasi-static, or in a transistor) or staying at C_min (high frequency) in inversion; used to extract oxide thickness, doping and oxide charge.
  chapter: "09-08"
  see_also: [C–V profiling]
- term: Deep depletion
  definition: The non-equilibrium state of a MOS capacitor swept into inversion faster than thermal generation can supply minority carriers, so the depletion region grows beyond its equilibrium maximum; CCD pixels collect photo-electrons in this state.
  chapter: "09-08"
- term: Oxide charge
  definition: Charge in or at the edge of a gate dielectric (fixed charge, mobile ions such as sodium, trapped charge) that shifts the flat-band and threshold voltages by −Q_ox/C_ox; about 10¹⁰ cm⁻² at a high-quality Si–SiO₂ interface.
  chapter: "09-08"
- term: Interface traps
  definition: Electronic states at the semiconductor–dielectric interface whose charge changes with surface potential; they stretch C–V curves, degrade subthreshold slope and add noise.
  chapter: "09-08"
- term: Poly-gate depletion
  definition: The depletion of a thin layer of a polysilicon gate at its oxide interface in inversion, W_dpoly = ε_ox E_ox/(qN_poly), which adds W_dpoly/3 to the electrical oxide thickness; eliminated by metal gates.
  chapter: "09-08"
- term: Electrical oxide thickness
  definition: The effective gate-dielectric thickness in inversion, T_oxe = T_ox + W_dpoly/3 + T_inv/3, including poly-gate depletion and the inversion-layer centroid; typically 6–10 Å more than the physical oxide.
  chapter: "09-08"
- term: Capacitive equivalent thickness
  definition: The SiO₂-equivalent thickness of a whole gate stack in inversion (interfacial layer, high-k film, dipole layers and inversion layer), the quantity that sets drive current; the IRDS 2024 roadmap gives 1.0 nm for 2024–2025 and 0.9 nm from 2027.
  chapter: "09-08"
  see_also: [Equivalent oxide thickness (EOT)]
- term: Metal gate
  definition: A metallic gate electrode, replacing doped polysilicon in advanced CMOS since about 2007, which removes poly depletion and works with high-k dielectrics; NFETs and PFETs need different work-function metals.
  chapter: "09-08"
- term: Time-dependent dielectric breakdown
  definition: The wear-out of a gate dielectric under prolonged field stress, which makes the breakdown field depend on stress time (about 15 MV/cm for 1 s on 10 nm SiO₂, lower for years); lifetimes are extrapolated from accelerated tests.
  chapter: "09-08"
- term: Charge-coupled device
  definition: An image sensor made of a dense array of MOS capacitors held in deep depletion, which collect photo-generated electrons in proportion to light and shift the charge packets to an output amplifier by sequencing the gate voltages.
  chapter: "09-08"
# ---- 09-09
- term: MOSFET
  definition: The metal–oxide–semiconductor field-effect transistor, a MOS capacitor with source and drain junctions, in which the gate voltage sets the inversion charge of a channel and the drain voltage drives it; the most widely used semiconductor device.
  chapter: "09-09"
- term: Gradual-channel approximation
  definition: The assumption that the potential along a MOSFET channel varies slowly compared with the vertical field, so each slice of channel behaves as a MOS capacitor biased by the local channel potential; it yields the long-channel I–V equations.
  chapter: "09-09"
- term: Linear region
  definition: The MOSFET operating region with V_DS below V_Dsat, where I_D = (W/L)μC_ox(V_GS − V_TH − mV_DS/2)V_DS and the device acts as a voltage-controlled resistor for small V_DS (also called the triode region).
  chapter: "09-09"
- term: Saturation region
  definition: The MOSFET operating region with V_DS above V_Dsat = (V_GS − V_TH)/m, where the channel is pinched off at the drain and the current is nearly independent of V_DS; not the same as a bipolar transistor's saturation.
  chapter: "09-09"
- term: Pinch-off
  definition: The vanishing of a MOSFET's inversion charge at the drain end of the channel when V_DS reaches V_Dsat; beyond it, the extra drain voltage drops across a short depleted region that carriers cross at high field.
  chapter: "09-09"
- term: Square law
  definition: The long-channel saturation current I_Dsat = (W/2mL)μC_ox(V_GS − V_TH)², with m = 1 in its simplest form; the first-order model of analog design and the basis of SPICE level 1.
  chapter: "09-09"
- term: Bulk-charge factor
  definition: The factor m = 1 + C_dep/C_ox = 1 + 3T_ox/W_dmax (typically about 1.2) by which raising the channel potential also deepens the depletion charge; it lowers V_Dsat and I_Dsat and sets the subthreshold swing m × 60 mV/decade.
  chapter: "09-09"
- term: Body effect
  definition: The rise of a MOSFET's threshold with source-to-body reverse bias, V_TH = V_TH0 + γ(√(2φ_B + V_SB) − √(2φ_B)); the body acts as a weak second gate.
  chapter: "09-09"
- term: Body-effect parameter
  definition: The coefficient γ = √(2qN_Aε_s)/C_ox (V^1/2) that sets how strongly source-to-body bias shifts a MOSFET's threshold.
  chapter: "09-09"
- term: Overdrive voltage
  definition: The amount by which the gate-source voltage exceeds threshold, V_ov = V_GS − V_TH; drive current, transconductance efficiency (2/V_ov) and V_Dsat all depend on it.
  chapter: "09-09"
- term: Surface mobility
  definition: The carrier mobility in a MOSFET inversion layer, several times below bulk mobility because of surface-roughness and phonon scattering, and falling as the vertical field rises.
  chapter: "09-09"
- term: Universal mobility
  definition: The observation that silicon MOSFET surface mobilities fall on one curve against the effective vertical field; Hu fits electrons with 540/[1 + (E_eff/0.9 MV/cm)^1.85] cm²/V·s.
  chapter: "09-09"
- term: Channel-length modulation
  definition: The shortening of a saturated MOSFET's effective channel as the pinch-off point moves toward the source with rising V_DS, which gives finite output resistance, often written I_D ∝ (1 + λV_DS).
  chapter: "09-09"
- term: Transconductance efficiency
  definition: The ratio g_m/I_D, the transconductance obtained per unit of bias current; 2/V_ov for a MOSFET in strong inversion, at most 1/(mV_T) in weak inversion, and 1/V_T for a bipolar transistor.
  chapter: "09-09"
- term: Subthreshold conduction
  definition: MOSFET current below threshold, carried by diffusion in a weak inversion layer and rising exponentially with gate voltage, I_D ∝ e^((V_GS − V_TH)/mV_T); it sets off-state leakage.
  chapter: "09-09"
- term: Subthreshold swing
  definition: The gate-voltage change per decade of subthreshold current, S = mV_T ln 10, which cannot fall below 59.5 mV/decade at 300 K for a conventional transistor.
  chapter: "09-09"
- term: Off-state current
  definition: The drain current I_off at V_GS = 0 and V_DS = V_DD, mainly subthreshold leakage, equal to the threshold-defining current times 10^(−V_TH/S); it sets standby power.
  chapter: "09-09"
- term: Retrograde doping
  definition: A channel doping profile with a lightly doped surface layer over a heavily doped region, which fixes the depletion width, makes the body effect nearly linear and reduces impurity scattering in the channel.
  chapter: "09-09"
- term: Velocity overshoot
  definition: Carrier velocities above the saturation velocity in channels so short that carriers cross before they can lose their energy to optical phonons; it relaxes the velocity-saturation limit in very short transistors.
  chapter: "09-10"
- term: Source injection velocity
  definition: The x-directed thermal velocity v_thx (about 1.6 × 10⁷ cm/s for electrons in silicon MOSFETs) with which carriers enter the channel from the source; it sets the ceiling I_Dsat = W B v_thx C_ox (V_GS − V_TH), where B is the fraction not scattered back.
  chapter: "09-10"
  see_also: [Ballistic transport, Velocity saturation]
- term: Parasitic series resistance
  definition: The source and drain resistance (extensions, silicide, contacts) in series with a MOSFET channel; the source part lowers the internal overdrive by I_D R_S and can cost 10% or more of drive current.
  chapter: "09-10"
- term: Short-channel effects
  definition: The departures of a small MOSFET from long-channel behavior caused by velocity saturation and by the source and drain sharing control of the channel with the gate, chiefly threshold roll-off, DIBL, degraded swing and higher output conductance.
  chapter: "09-10"
- term: Threshold roll-off
  definition: The fall of threshold voltage as channel length shrinks, because the source and drain help lower the channel barrier; in Hu's model ΔV_TH = (V_DS + 0.4 V) e^(−L/l_d).
  chapter: "09-10"
- term: Drain-induced barrier lowering
  definition: The lowering of the source–channel barrier, and so of the threshold voltage, by the drain voltage in a short-channel MOSFET (DIBL), quoted in mV/V; it raises off-current exponentially.
  chapter: "09-10"
  see_also: [Threshold roll-off, Characteristic length]
- term: Characteristic length
  definition: The length l_d ∝ (T_oxe W_dep X_j)^(1/3) over which the drain's electrostatic influence on the channel barrier decays; acceptable DIBL requires a gate length several times l_d, so oxide, depletion depth and junction depth must shrink with L.
  chapter: "09-10"
- term: Multi-threshold CMOS
  definition: The practice of offering several threshold-voltage flavors on one chip, using high-V_TH devices everywhere and low-V_TH devices only on speed-critical paths, to trade leakage against speed.
  chapter: "09-10"
- term: Steep-slope transistor
  definition: A proposed switch, such as a tunneling FET or negative-capacitance FET, designed to turn on more sharply than the 59.5 mV/decade Boltzmann limit at 300 K by changing how carriers are injected; not yet a mainstream logic technology.
  chapter: "09-10"
- term: Gate-induced drain leakage
  definition: Band-to-band tunneling current in the drain under the gate edge when the gate is low and the drain high (GIDL); it needs band bending beyond the gap and a surface field near 10⁶ V/cm, and grows steeply with drain-to-gate voltage and thinner oxides.
  chapter: "09-10"
- term: Matching coefficient
  definition: The constant A_Vt = σ(V_TH)√(WL) (mV·µm) that describes how random threshold mismatch shrinks with device area; for random dopant fluctuation it follows from Poisson statistics of the depletion charge.
  chapter: "09-10"
- term: CMOS
  definition: Complementary MOS, the logic family that pairs n-channel and p-channel MOSFETs so that in either steady state one device of each pair is off; it draws current mainly while switching.
  chapter: "09-11"
- term: CMOS inverter
  definition: A PMOS from the supply to the output and an NMOS from the output to ground, with gates tied to the input; the basic CMOS gate, regenerative and drawing only leakage in steady state.
  chapter: "09-11"
  see_also: [CMOS, Voltage transfer characteristic]
- term: Voltage transfer characteristic
  definition: The plot of a logic gate's static output voltage against its input voltage (VTC); its steep middle region and flat rails give noise margins and regeneration.
  chapter: "09-11"
- term: Switching threshold
  definition: The input voltage V_M at which a CMOS inverter's output equals its input; for square-law devices V_M = (V_TN√r + V_DD − |V_TP|)/(1 + √r) with r = k_n/k_p.
  chapter: "09-11"
- term: Ring oscillator
  definition: An odd number of inverters connected in a loop, which oscillates with period 2Nτ_d; foundries use it to measure gate delay.
  chapter: "09-11"
- term: Static power
  definition: The power a circuit draws when it is not switching, V_DD times the total leakage current; it dominates idle and standby energy.
  chapter: "09-11"
- term: Moore's law
  definition: Gordon Moore's observation that the number of components on the most cost-effective chip grows exponentially, doubling every year (1965) and, from his 1975 revision, about every two years.
  chapter: "09-11"
- term: Technology node
  definition: A generation of a fabrication process, historically shrinking features by about 0.7× (halving area) every two to three years; modern node names are labels, not physical lengths.
  chapter: "09-11"
- term: Constant-field scaling
  definition: Dennard's scaling rules (1974) in which dimensions and voltages shrink by 1/κ and doping rises by κ, so fields stay constant, delay falls by 1/κ and power density stays constant.
  chapter: "09-11"
- term: Power wall
  definition: The limit on clock frequency set by power density and cooling once supply voltages stopped scaling; processors reached it around 2004 and turned to multicore designs.
  chapter: "09-11"
- term: Dark silicon
  definition: The part of a power-limited chip that cannot switch at full speed at the same time as the rest, because running all of it would exceed the power or thermal budget.
  chapter: "09-11"
- term: Contacted poly pitch
  definition: The center-to-center spacing of transistor gates including room for the contacts between them (CPP); with cell height, the main physical measure of logic density.
  chapter: "09-11"
- term: Cell height
  definition: The height of a standard logic cell, set by the number of horizontal wiring tracks times the metal pitch; shorter cells raise logic density.
  chapter: "09-11"
- term: Ultra-thin-body transistor
  definition: A MOSFET built in a silicon film only a few nanometers thick on an insulator (UTB SOI); the thin body replaces the depletion and junction depths in the characteristic length, so short channels need no heavy doping.
  chapter: "09-12"
- term: Silicon-on-insulator
  definition: A wafer with a thin crystalline silicon layer on a buried oxide over a silicon substrate (SOI), made for example by hydrogen implantation, bonding and splitting; it removes junction capacitance and enables thin-body transistors.
  chapter: "09-12"
- term: Multigate transistor
  definition: A MOSFET whose thin body is gated from two or more sides (double-gate, FinFET, gate-all-around), so no leakage path is far from a gate and the subthreshold swing approaches its ideal value.
  chapter: "09-12"
- term: Scale length
  definition: The length λ over which a disturbance of the channel potential decays along a thin-body transistor; for a double gate λ² = (ε_s/2ε_ox)t_si t_ox + t_si²/8, and roll-off and DIBL scale as e^(−L/2λ).
  chapter: "09-12"
  see_also: [Characteristic length, Drain-induced barrier lowering]
- term: FinFET
  definition: A multigate MOSFET whose channel is a thin vertical silicon fin with the gate draped over its sidewalls and top; its width is 2H_fin + W_fin per fin and comes in whole fins.
  chapter: "09-12"
- term: Gate-all-around transistor
  definition: A MOSFET whose gate completely surrounds each channel (GAA), as a nanowire or a stack of nanosheets, giving the strongest electrostatic control of the channel.
  chapter: "09-12"
- term: Nanosheet
  definition: A thin, wide silicon channel layer, several of which are stacked and each wrapped by the gate in a gate-all-around transistor; its drawn width sets the device width continuously.
  chapter: "09-12"
- term: Width quantization
  definition: The restriction of a FinFET's channel width to whole multiples of one fin's width, which forces device sizing ratios to be ratios of integers.
  chapter: "09-12"
- term: Complementary FET
  definition: A stacked device (CFET) that places the n-channel transistor directly over the p-channel transistor in one footprint, shrinking CMOS cells; projected by the IRDS to follow gate-all-around devices from about 2031.
  chapter: "09-12"
- term: Two-dimensional channel material
  definition: An atomically thin semiconductor, such as a transition-metal dichalcogenide, proposed as a transistor channel for its ultimate thinness; the IRDS judges it not yet mature for manufacturing.
  chapter: "09-12"
- term: Compound semiconductor
  definition: A semiconductor made of two or more elements, such as GaAs, InP, GaN or SiC; III–V compounds offer light electrons and direct gaps, while SiC and GaN offer wide gaps and high critical fields.
  chapter: "09-13"
- term: Semi-insulating substrate
  definition: An undoped or compensated wafer (for example GaAs, with about 10⁸ Ω·cm intrinsic resistivity) that barely conducts, so microwave circuits built on it lose little signal to the substrate.
  chapter: "09-13"
- term: Drift layer
  definition: The thick, lightly doped region of a power device that holds the blocking voltage when off and carries the current when on; its thickness and doping set the breakdown voltage and much of the on-resistance.
  chapter: "09-13"
- term: Specific on-resistance
  definition: A power device's on-resistance multiplied by its active area (Ω·cm²), the area-independent figure for comparing technologies; Baliga's limit for a drift layer is 4V_B²/(εμE_c³).
  chapter: "09-13"
- term: Baliga's figure of merit
  definition: The material figure εμE_c³ that sets the lowest specific on-resistance of a unipolar power device at a given blocking voltage; the cube on the critical field gives wide-bandgap materials their advantage.
  chapter: "09-13"
  see_also: [Specific on-resistance, Critical field]
- term: Heterojunction
  definition: A junction between two different semiconductors, with steps in the conduction and valence bands at the interface; used to confine carriers, separate them from dopants and block unwanted injection.
  chapter: "09-13"
- term: Modulation doping
  definition: Placing donors in a wide-gap barrier so their electrons fall into an undoped narrow-gap channel next to it, separating the electrons from the ionized donors and keeping their mobility high.
  chapter: "09-13"
- term: Two-dimensional electron gas
  definition: A sheet of electrons confined in a thin quantum well at a heterojunction (2DEG), free to move along the interface; the channel of a HEMT, with densities of order 10¹³ cm⁻² in AlGaN/GaN.
  chapter: "09-13"
- term: High-electron-mobility transistor
  definition: A field-effect transistor whose channel is a two-dimensional electron gas at a heterojunction (HEMT), modulated by a gate on the barrier; used in RF amplifiers and, in GaN, in fast power switches.
  chapter: "09-13"
- term: Spontaneous polarization
  definition: The built-in electric polarization of an unstrained polar crystal such as wurtzite GaN or AlN along its c-axis; its change at a heterojunction leaves a fixed bound sheet charge.
  chapter: "09-13"
- term: Piezoelectric polarization
  definition: Electric polarization created by mechanical strain in a piezoelectric crystal; in AlGaN grown on GaN it adds to the spontaneous polarization and increases the 2DEG density.
  chapter: "09-13"
- term: Absorption coefficient
  definition: The rate α at which light intensity decays with depth in a material, I ∝ e^(−αx); 1/α is the penetration depth, and direct-gap materials have large α just above the gap.
  chapter: "09-14"
- term: Quantum efficiency
  definition: The number of electrons collected per incident photon (or, for an emitter, photons out per injected electron), combining reflection, absorption and collection or extraction losses.
  chapter: "09-14"
- term: Avalanche photodiode
  definition: A photodiode biased near breakdown so that photogenerated carriers are multiplied by impact ionization (APD), giving gain at the cost of extra noise.
  chapter: "09-14"
- term: Single-photon avalanche diode
  definition: A junction biased above breakdown so that one photogenerated carrier triggers a self-sustaining avalanche (SPAD, Geiger mode), giving a digital pulse per detected photon, followed by quenching and a dead time.
  chapter: "09-14"
  see_also: [Avalanche photodiode, Photon detection efficiency]
- term: Photon detection efficiency
  definition: The probability that a photon arriving at a single-photon detector produces a counted avalanche (PDE), including absorption, triggering probability and fill factor.
  chapter: "09-14"
- term: Direct time-of-flight
  definition: Ranging by timing the round trip of a light pulse to a target, d = ct/2 (dToF); timing jitter Δt sets the depth resolution cΔt/2.
  chapter: "09-14"
- term: CMOS image sensor
  definition: An array of pixels, each with a photodiode and transistors, that integrates photocharge and reads it out through a source follower; the dominant camera sensor.
  chapter: "09-14"
- term: Full-well capacity
  definition: The largest number of electrons a pixel can hold before saturating; it caps the maximum signal-to-noise ratio at its square root.
  chapter: "09-14"
- term: Conversion gain
  definition: The voltage change per collected electron at a pixel's sense node, q/C_FD, typically tens to hundreds of microvolts per electron.
  chapter: "09-14"
- term: Extraction efficiency
  definition: The fraction of photons generated inside an LED that escape the chip; limited by total internal reflection at the high-index surface and raised by shaping and texturing.
  chapter: "09-14"
- term: Wall-plug efficiency
  definition: Optical output power divided by electrical input power for a light source, the product of internal quantum efficiency, extraction efficiency and hν/qV.
  chapter: "09-14"
- term: Luminous efficacy
  definition: Light output in lumens (power weighted by the eye's sensitivity) per watt; 683 lm/W at 555 nm, and about 414 lm/W at most for white light with good color rendering.
  chapter: "09-14"
- term: Population inversion
  definition: A state in which more electrons occupy the upper energy states than the lower ones, so stimulated emission outweighs absorption and light is amplified; in a diode it needs E_Fn − E_Fp > E_g.
  chapter: "09-14"
- term: Threshold gain
  definition: The material gain at which a laser's round-trip gain equals its losses, g_th = α_i + (1/2L) ln(1/R₁R₂); above it the laser oscillates.
  chapter: "09-14"
- term: VCSEL
  definition: A vertical-cavity surface-emitting laser, whose cavity is formed by distributed Bragg reflector stacks above and below the active layer so that it emits from the wafer surface.
  chapter: "09-14"
- term: Fill factor
  definition: The ratio of a solar cell's maximum output power to the product V_oc I_sc, measuring how square its I–V curve is; about 0.75 is typical, and higher for an ideal cell.
  chapter: "09-14"
# ---------------------------------------------------------------- 10-01
- term: Load line
  definition: The straight line i = (V_Th − v)/R_Th that a linear network imposes on the device it drives; the operating point is where it crosses the device's characteristic.
  chapter: "10-01"
- term: Constant-drop diode model
  definition: A diode model that is an open circuit when off and a fixed voltage source (typically 0.7 V for silicon) when on; adequate when the circuit's voltages are several times the drop.
  chapter: "10-01"
- term: Piecewise-linear diode model
  definition: A diode model that is open when off and a voltage V_D0 in series with a resistance r_D when on, fitted to the exponential curve near the expected current.
  chapter: "10-01"
- term: Assumed-state method
  definition: Analyzing a circuit with diodes by guessing which conduct, replacing each with its on or off model, solving the linear circuit, and checking every guess for consistency.
  chapter: "10-01"
- term: Small-signal resistance
  definition: The inverse slope of a diode's exponential characteristic at its bias point, r_d = nV_T/I_D (25.9 Ω at 1 mA for n = 1), valid for signals much smaller than 2nV_T.
  chapter: "10-01"
  see_also: [Small-signal model]
- term: Rectifier
  definition: A circuit that converts alternating voltage to a voltage of one polarity, using diodes (or transistors switched as diodes) to pass one or both half-cycles.
  chapter: "10-01"
- term: Bridge rectifier
  definition: Four diodes arranged so that either polarity of a single winding drives the load the same way; current flows through two diodes in series, and each blocks about the winding's peak voltage.
  chapter: "10-01"
- term: Peak rectifier
  definition: A rectifier followed by a reservoir capacitor that charges to the peak of the waveform and supplies the load between peaks.
  chapter: "10-01"
- term: Ripple voltage
  definition: The peak-to-peak variation of a rectifier's smoothed output, about I_L/fC for a half-wave and I_L/2fC for a full-wave peak rectifier.
  chapter: "10-01"
- term: Conduction angle
  definition: The fraction of each cycle, expressed as an angle, during which a rectifier diode conducts; about the square root of 2V_r/V_p radians in a peak rectifier.
  chapter: "10-01"
- term: Peak inverse voltage
  definition: The largest reverse voltage a diode must block in a circuit, which sets its voltage rating; about twice the peak input in a half-wave peak rectifier or a center-tapped full-wave rectifier.
  chapter: "10-01"
- term: Line regulation
  definition: The change in a regulator's output per unit change in its input voltage; r_z/(R + r_z) for a Zener shunt regulator.
  chapter: "10-01"
- term: Load regulation
  definition: The change in a regulator's output per unit change in load current, equal to minus its output resistance; −(R ∥ r_z) for a Zener shunt regulator.
  chapter: "10-01"
- term: Limiter
  definition: A circuit, also called a clipper, that holds its output below (or above) a set level, typically with diodes from the signal to a reference; the limiting is soft because the diode is exponential.
  chapter: "10-01"
- term: Clamp circuit
  definition: A series capacitor and a diode that shift a waveform's DC level so that one of its extremes sits at a fixed voltage; also called a DC restorer.
  chapter: "10-01"
- term: Voltage doubler
  definition: A clamp followed by a peak rectifier, giving a DC output near twice the input's peak minus two diode drops; cascading stages multiplies further.
  chapter: "10-01"
- term: Ideal-diode controller
  definition: An integrated circuit that drives a MOSFET so that it conducts like a diode with a forward drop of tens of millivolts and blocks reverse current, replacing ORing and reverse-polarity diodes.
  chapter: "10-01"
# ---------------------------------------------------------------- 10-02
- term: Diode-connected transistor
  definition: A transistor with its gate tied to its drain (or base to collector), which is always saturated (active) and behaves as a two-terminal device whose voltage sets itself to carry the current fed to it; the input half of a current mirror.
  chapter: "10-02"
- term: Current mirror
  definition: Two or more transistors sharing a gate (base) voltage with one diode-connected, so that the others copy its current in the ratio of their sizes, independent of the threshold to first order.
  chapter: "10-02"
  see_also: [Diode-connected transistor]
- term: On-resistance
  definition: The drain-to-source resistance of a MOSFET switched fully on, about 1/[μC_ox(W/L)(V_GS − V_TH)] in deep triode; data sheets quote R_DS(on) at stated gate voltages and temperatures.
  chapter: "10-02"
- term: Load switch
  definition: An integrated MOSFET switch with its gate driver and controlled turn-on, used to connect or disconnect a power rail from a load while limiting inrush current.
  chapter: "10-02"
# ---------------------------------------------------------------- 10-03
- term: Forward-active region
  definition: The bipolar operating region with the base-emitter junction forward-biased and the base-collector junction reverse-biased, where I_C ≈ βI_B and the collector acts as a current source.
  chapter: "10-03"
- term: Four-resistor bias
  definition: The standard discrete BJT bias, a base divider with an emitter resistor (and a collector resistor), giving I_E = (V_Th − V_BE)/(R_E + R_Th/(β + 1)), nearly independent of β when R_Th is much less than (β + 1)R_E.
  chapter: "10-03"
- term: Forced beta
  definition: The ratio I_C/I_B imposed on a saturated bipolar transistor by its circuit, smaller than the device's β; switches are designed with a forced beta near 10 so every device saturates.
  chapter: "10-03"
- term: Emitter degeneration
  definition: A resistor in series with a bipolar transistor's emitter, which provides negative feedback that stabilizes the bias against β, V_BE and temperature, at the cost of headroom and gain.
  chapter: "10-03"
  see_also: [Source degeneration]
# ---------------------------------------------------------------- 10-04
- term: T model
  definition: A small-signal transistor model with the emitter (or source) resistance r_e = α/g_m (1/g_m for a MOSFET) in the emitter lead and a controlled source αi_e from collector to the internal base; equivalent to the hybrid-π model and convenient when the emitter has series resistance.
  chapter: "10-04"
  see_also: [Hybrid-π model]
- term: Body transconductance
  definition: g_mb = ∂i_D/∂v_BS, the MOSFET's response to its body voltage through the body effect; g_mb = χg_m with χ = γ/(2√(2φ_F + V_SB)), typically 0.1–0.3.
  chapter: "10-04"
  see_also: [Body effect]
- term: Weak inversion
  definition: MOSFET operation with the gate below or near threshold, where the drain current is exponential in V_GS and g_m/I_D approaches its limit 1/(nV_T); moderate inversion lies between it and strong inversion.
  chapter: "10-04"
  see_also: [Subthreshold conduction, Transconductance efficiency]
- term: Second-harmonic distortion
  definition: The ratio HD2 of a nonlinear device's output at twice the input frequency to its fundamental; v̂/(4V_T) for a bipolar transistor and v̂/(4V_ov) for a square-law MOSFET driven by a sine of amplitude v̂.
  chapter: "10-04"
  see_also: [Harmonic distortion]
# ---------------------------------------------------------------- 10-05
- term: Voltage amplifier
  definition: An amplifier that senses an input voltage and delivers an output voltage, modeled by its open-circuit voltage gain A_vo, input resistance R_i and output resistance R_o; ideally R_i → ∞ and R_o → 0.
  chapter: "10-05"
  see_also: [Unilateral amplifier]
- term: Current amplifier
  definition: An amplifier that senses an input current and delivers an output current, modeled by its short-circuit current gain A_is with R_i and R_o; ideally R_i → 0 and R_o → ∞.
  chapter: "10-05"
- term: Transconductance amplifier
  definition: An amplifier that senses a voltage and delivers a current, characterized by its short-circuit transconductance G_m (S); ideally both R_i and R_o are infinite.
  chapter: "10-05"
- term: Transresistance amplifier
  definition: An amplifier that senses a current and delivers a voltage, characterized by its open-circuit transresistance R_m (Ω); ideally both R_i and R_o are zero.
  chapter: "10-05"
  see_also: [Transimpedance amplifier]
- term: Input resistance
  definition: The resistance seen looking into an amplifier's input terminals; with the source resistance it forms the input divider that sets how much of the source signal reaches the amplifier.
  chapter: "10-05"
  see_also: [Output resistance, Loading effect]
- term: Unilateral amplifier
  definition: An amplifier with no reverse transmission (y_12 = 0), so its input resistance does not depend on its load; a single stage without a feedback element is approximately unilateral.
  chapter: "10-05"
  see_also: [Two-port network]
- term: Buffer amplifier
  definition: A stage with a gain near 1 used to transform impedance, presenting a high input resistance to its source and a low output resistance to its load.
  chapter: "10-05"
- term: Midband gain
  definition: An amplifier's gain in the frequency range where coupling and bypass capacitors act as short circuits and device capacitances as open circuits, between the low and high corner frequencies.
  chapter: "10-05"
- term: Conversion efficiency
  definition: The fraction η = P_L/P_DC of the supply power that an amplifier delivers to its load as signal power.
  chapter: "10-05"
- term: Class-A amplifier
  definition: An amplifier whose output transistor conducts for the whole signal cycle around a fixed bias current; with a resistive load its efficiency is at most 25% (50% with inductor or transformer coupling).
  chapter: "10-05"
  see_also: [Conversion efficiency]
- term: Class-D amplifier
  definition: A switching amplifier whose output transistors are driven fully on or off at a frequency well above the signal, with the signal recovered by filtering; practical efficiencies exceed 90% at high output.
  chapter: "10-05"
  see_also: [Conversion efficiency]
# ---------------------------------------------------------------- 10-06
- term: Common-source amplifier
  definition: The MOSFET gain stage with the input at the gate, the output at the drain and the source at signal ground (or through a degeneration resistor); its gain is −g_m(R_D ∥ r_o), and it inverts.
  chapter: "10-06"
- term: Common-gate amplifier
  definition: The MOSFET stage with the gate at signal ground, the input at the source and the output at the drain; a non-inverting current buffer with input resistance about 1/(g_m + g_mb) and gain about (g_m + g_mb)R_D.
  chapter: "10-06"
- term: Source follower
  definition: The common-drain MOSFET stage, with the input at the gate and the output at the source; a voltage buffer with gain g_mR_eq/(1 + g_mR_eq), below 1/(1 + χ) with the body effect, and output resistance about 1/(g_m + g_mb).
  chapter: "10-06"
  see_also: [Buffer amplifier, Body transconductance]
- term: Active load
  definition: A transistor current source used in place of a load resistor, giving a large small-signal resistance (its r_o) while consuming little DC headroom; a common-source stage with an active load approaches gain g_m(r_o1 ∥ r_o2).
  chapter: "10-06"
- term: Cascode
  definition: A common-source transistor followed by a common-gate transistor in series; the upper device multiplies the output resistance by about g_mr_o, raising the gain toward (g_mr_o)² at the cost of one more overdrive of headroom.
  chapter: "10-06"
  see_also: [Intrinsic gain, Source degeneration]
# ---------------------------------------------------------------- 10-07
- term: Common-emitter amplifier
  definition: The bipolar gain stage with the input at the base, the output at the collector and the emitter at signal ground (or through a degeneration resistor); its gain −g_m(R_C ∥ r_o) equals the DC voltage across R_C divided by V_T when r_o is negligible.
  chapter: "10-07"
- term: Common-base amplifier
  definition: The bipolar stage with the base at signal ground, the input at the emitter and the output at the collector; a non-inverting current buffer with input resistance about r_e = α/g_m and current gain α.
  chapter: "10-07"
- term: Emitter follower
  definition: The common-collector bipolar stage, with the input at the base and the output at the emitter; gain (β + 1)R_E'/(R_sig + r_π + (β + 1)R_E'), input resistance r_π + (β + 1)R_E' and output resistance about r_e + R_sig/(β + 1).
  chapter: "10-07"
  see_also: [Buffer amplifier, Source follower]
- term: Resistance reflection
  definition: The rule that a resistance in a bipolar transistor's emitter appears multiplied by β + 1 when seen from the base, and a resistance in the base appears divided by β + 1 when seen from the emitter.
  chapter: "10-07"
- term: Bypass capacitor
  definition: A capacitor placed across a bias element (typically an emitter or source resistor) so that it carries DC bias current but is a short circuit at signal frequencies, restoring the stage's full gain.
  chapter: "10-07"
# ---------------------------------------------------------------- 10-08
- term: Compliance voltage
  definition: The lowest output voltage at which a current source still delivers its intended current with its intended output resistance; V_ov for a basic MOS mirror, V_TN + 2V_ov for a simple cascode mirror.
  chapter: "10-08"
  see_also: [Current mirror]
- term: Cascode current mirror
  definition: A current mirror with a second stacked transistor on each side, which holds the output transistor's drain at the reference transistor's drain voltage and raises the output resistance to about g_mr_o², at the cost of extra compliance voltage.
  chapter: "10-08"
  see_also: [Cascode, Current mirror]
- term: Wilson current mirror
  definition: A three-transistor bipolar mirror with feedback that reduces the base-current error to 2/(β² + 2β + 2) and raises the output resistance to about βr_o/2.
  chapter: "10-08"
  see_also: [Current mirror]
- term: Beta helper
  definition: A transistor added to a bipolar current mirror to supply the mirror's base currents from the supply, cutting the reference's base-current loss by a factor of about β.
  chapter: "10-08"
- term: Pelgrom's law
  definition: The empirical rule that the random threshold difference between two closely spaced, identically drawn MOSFETs has a standard deviation A_VT/√(WL), falling with the square root of gate area; A_VT is a process constant.
  chapter: "10-08"
# ---------------------------------------------------------------- 10-09
- term: Gain-bandwidth product
  definition: For an op-amp with a single dominant pole, the constant product of open-loop gain and frequency above the pole, equal to the unity-gain frequency; a closed loop's bandwidth is the gain-bandwidth product divided by the noise gain.
  chapter: "10-09"
  see_also: [Noise gain]
- term: Full-power bandwidth
  definition: The highest frequency at which an amplifier can deliver a sine of a given peak amplitude V_p without slew-rate limiting, SR/(2πV_p).
  chapter: "10-09"
  see_also: [Slew rate]
- term: Offset drift
  definition: The change of an amplifier's input offset voltage with temperature, specified in µV/°C; unlike the room-temperature offset, it cannot be removed by a single calibration.
  chapter: "10-09"
  see_also: [Input offset voltage]
- term: Power-supply rejection ratio (PSRR)
  definition: The ratio of a change in supply voltage to the input-referred offset change it causes, in dB or µV/V; it falls with frequency, so supply ripple leaks through more at high frequency.
  chapter: "10-09"
- term: Rail-to-rail
  definition: Describes an op-amp input whose common-mode range includes both supply rails (usually with complementary input pairs and a crossover region), or an output that swings to within millivolts of the rails at light load.
  chapter: "10-09"
- term: Zero-drift amplifier
  definition: An op-amp that continuously measures and cancels its own offset (by autozeroing or chopping), achieving microvolt offset and near-zero drift at the cost of bandwidth, switching artifacts and higher current noise.
  chapter: "10-09"
  see_also: [Offset drift]
# ---------------------------------------------------------------- 10-10
- term: Precision rectifier
  definition: A rectifier with its diode inside an op-amp's feedback loop, so the diode's forward drop is divided by the loop gain; its accuracy at high frequency is limited by the op-amp's slew through about two diode drops at each zero crossing.
  chapter: "10-10"
- term: Comparator
  definition: An amplifier designed to switch between two output levels according to the sign of its differential input, uncompensated and with fast saturation recovery, often with a push-pull or open-drain logic output.
  chapter: "10-10"
  see_also: [Schmitt trigger]
- term: Schmitt trigger
  definition: A comparator with positive feedback that gives two switching thresholds, so a slowly varying, noisy input switches the output once instead of chattering; the threshold separation is its hysteresis.
  chapter: "10-10"
  see_also: [Hysteresis (switching)]
- term: Hysteresis (switching)
  definition: The difference between the input level at which a switching circuit changes state on a rising input and the level at which it changes back on a falling input; it should exceed the input noise's peak-to-peak value.
  chapter: "10-10"
- term: Open-drain output
  definition: An output stage that can only pull its pin low; a pull-up resistor supplies the high level, which allows wired-OR connections and level shifting at the cost of a resistor-capacitor rise time and static current when low.
  chapter: "10-10"
- term: Continuous-time signal
  definition: A signal x(t) defined at every real instant t, such as the voltage on a wire; the domain of analog front ends and of the Laplace and continuous-time Fourier transforms.
  chapter: "11-01"
  see_also: [Discrete-time signal]
- term: Discrete-time signal
  definition: A sequence x[n] defined only at integer indices n, often the samples x(nT_s) of a continuous-time signal; it is undefined, not zero, between samples.
  chapter: "11-01"
  see_also: [Continuous-time signal, Sampling rate]
- term: Digital signal
  definition: A signal that is discrete in time and takes values from a finite set, such as ADC output codes; quantization makes it digital, sampling only makes it discrete-time, and it need not be binary.
  chapter: "11-01"
  see_also: [Quantization noise, PAM4]
- term: Sampling rate
  definition: The number of samples taken per second, f_s = 1/T_s, in samples per second (SPS) or hertz; it sets the highest frequency a sampled signal can represent unambiguously, f_s/2.
  chapter: "11-01"
- term: Energy signal
  definition: A signal with finite, nonzero energy E = ∫|x|² dt (or Σ|x[n]|²), and hence zero average power; transients and pulses are energy signals.
  chapter: "11-01"
  see_also: [Power signal]
- term: Power signal
  definition: A signal with finite, nonzero average power P = lim (1/2T)∫|x|² dt over [−T, T], and hence infinite energy; periodic signals are power signals, with P equal to the average over one period.
  chapter: "11-01"
  see_also: [Energy signal, RMS value]
- term: Fundamental period
  definition: The smallest positive shift that leaves a periodic signal unchanged; a sum of continuous-time periodic signals is periodic only if their periods have a rational ratio, and a discrete-time sinusoid only if ω/2π is rational.
  chapter: "11-01"
- term: Even and odd signals
  definition: An even signal satisfies x(−t) = x(t) and an odd one x(−t) = −x(t); every signal splits uniquely into x_e = (x(t) + x(−t))/2 and x_o = (x(t) − x(−t))/2, whose energies add.
  chapter: "11-01"
- term: Time scaling
  definition: Replacing x(t) by x(at); a > 1 compresses the signal and divides its energy by a, 0 < a < 1 stretches it. Combined with a shift, x(at − b) is x(at) delayed by b/a, not by b.
  chapter: "11-01"
- term: Decimation
  definition: Keeping every M-th sample of a sequence, y[n] = x[Mn]; it discards samples, so unlike continuous-time compression it can lose information, and its effect on energy depends on which samples are kept.
  chapter: "11-01"
  see_also: [Zero-insertion interpolation]
- term: Zero-insertion interpolation
  definition: Upsampling by L by placing L − 1 zeros between samples, y[n] = x[n/L] for n a multiple of L and 0 otherwise; it loses nothing and keeps the energy, and a filter later fills in the zeros.
  chapter: "11-01"
  see_also: [Decimation]
- term: Sifting property
  definition: ∫ f(t) δ(t − t₀) dt = f(t₀) when t₀ lies inside the integration range (and 0 otherwise); in discrete time, Σ f[n] δ[n − n₀] = f[n₀]. It is the defining action of the impulse.
  chapter: "11-01"
  see_also: [Unit impulse]
- term: Unit sample
  definition: δ[n], equal to 1 at n = 0 and 0 elsewhere; the discrete-time impulse, an ordinary sequence with δ[n] = u[n] − u[n − 1], from which every sequence is built as x[n] = Σ x[k] δ[n − k].
  chapter: "11-01"
  see_also: [Unit impulse]
- term: Discrete-time frequency
  definition: The frequency ω of a sequence e^{jωn} or cos(ωn), in rad/sample; it is defined only modulo 2π, so ω and ω + 2π give the same sequence and the fastest oscillation is at ω = π. Sampling a tone of f hertz at f_s gives ω = 2πf/f_s.
  chapter: "11-01"
- term: PAM4
  definition: Four-level pulse-amplitude modulation, carrying two bits per symbol; it doubles a link's bit rate at the same symbol rate and Nyquist frequency as two-level signaling, at the cost of eyes a third as tall for the same swing (PCIe 6.0).
  chapter: "11-01"

# ---------------------------------------------------------------- 11-02
- term: System (signals and systems)
  definition: A rule y = T{x} that maps a whole input signal to a whole output signal, such as a circuit, a filter, a channel or an algorithm; its properties (memory, linearity, time invariance, causality, stability, invertibility) decide which analysis tools apply.
  chapter: "11-02"
  see_also: [LTI system]
- term: Memoryless system
  definition: A system whose output at each time depends only on the input at that same time, such as a resistor divider or a squarer; capacitors, inductors, delays and sums over past samples give memory.
  chapter: "11-02"
- term: Incrementally linear system
  definition: A system whose output is a linear system's output plus a fixed zero-input response, y = L{x} + y₀, such as an amplifier with offset or a linear circuit with initial stored energy; differences of outputs obey superposition.
  chapter: "11-02"
  see_also: [Linearity, Zero-input response]
- term: Time-invariant system
  definition: A system for which delaying the input by any t₀ only delays the output by t₀; tested by comparing "delay, then system" with "system, then delay" for every input.
  chapter: "11-02"
  see_also: [LTI system]
- term: Periodically time-varying system
  definition: A system that commutes with delays equal to multiples of a period but not with other delays, such as a mixer, a sampler, a chopper or a decimator; such linear systems create frequency-shifted outputs.
  chapter: "11-02"
  see_also: [Time-invariant system, Chopper stabilization]
- term: LTI system
  definition: A system that is both linear and time-invariant; it is completely described by its impulse response (convolution) and passes complex exponentials unchanged in shape, only scaled.
  chapter: "11-02"
- term: Causal system
  definition: A system whose output at any time depends only on present and past input values; every real-time system is causal, and a linear system is causal exactly when an input that starts at t₁ produces no output before t₁ (initial rest).
  chapter: "11-02"
  see_also: [Latency]
- term: Latency
  definition: The delay between an input event and the corresponding output; a filter that needs M future samples can only run in real time delayed by M samples, so a symmetric N-tap FIR filter has a latency of (N − 1)/2 samples.
  chapter: "11-02"
- term: BIBO stability
  definition: Bounded-input, bounded-output stability; every bounded input produces a bounded output. An LTI system is BIBO-stable exactly when its impulse response is absolutely summable (integrable); accumulators, integrators and lossless resonators are not.
  chapter: "11-02"
  see_also: [Stability (of a circuit)]
- term: Invertible system
  definition: A system for which distinct inputs give distinct outputs, so an inverse system can recover the input; the inverse may still be noncausal or unstable, as for an echo channel whose echo is stronger than its direct path.
  chapter: "11-02"
- term: Intermodulation distortion
  definition: Output at sums and differences of input frequencies produced by nonlinearity; with two tones, second-order products fall at f₁ ± f₂ and third-order products at 2f₁ − f₂ and 2f₂ − f₁, close to the signals themselves.
  chapter: "11-02"
  see_also: [Harmonic distortion]

# ---------------------------------------------------------------- 11-03
- term: Convolution sum
  definition: y[n] = Σₖ x[k] h[n − k], the output of a discrete-time LTI system with impulse response h; derived from x[n] = Σₖ x[k] δ[n − k], time invariance and linearity. Its length is the sum of the input and response lengths minus one.
  chapter: "11-03"
  see_also: [Convolution, Impulse response]
- term: Convolution integral
  definition: y(t) = ∫ x(τ) h(t − τ) dτ, the output of a continuous-time LTI system with impulse response h; the limit of a staircase of narrow pulses, each launching a scaled, shifted copy of h.
  chapter: "11-03"
  see_also: [Convolution, Graphical convolution]
- term: Graphical convolution
  definition: Evaluating a convolution integral by flipping one signal, sliding it across the other and integrating the product over the overlap, region by region between breakpoints at the sums of the signals' edges.
  chapter: "11-03"
- term: Absolute summability
  definition: The condition Σ|h[n]| < ∞ (or ∫|h(t)| dt < ∞) on an impulse response, necessary and sufficient for BIBO stability of an LTI system; the sum is also the system's worst-case gain for bounded inputs.
  chapter: "11-03"
  see_also: [BIBO stability]
- term: FIR filter
  definition: A finite impulse response filter, y[n] = Σ h[k] x[n − k] over finitely many taps; always BIBO-stable, it costs one multiply-accumulate per tap per sample and, if symmetric, has exactly linear phase.
  chapter: "11-03"
  see_also: [Multiply-accumulate (MAC), Latency]
- term: Toeplitz matrix
  definition: A matrix whose entries are constant along every diagonal; writing a convolution as y = Hx gives a Toeplitz H, which lets convolution be computed with matrix-multiplication hardware and libraries.
  chapter: "11-03"
- term: Cross-correlation
  definition: r_xy[n] = Σₖ x[k] y[k + n], a measure of how well y matches shifted copies of x; it equals convolution with x reversed in time. Deep-learning "convolution" layers compute cross-correlations.
  chapter: "11-03"
  see_also: [Matched filter]
- term: Matched filter
  definition: A filter whose impulse response is a known pattern reversed in time; its output is the correlation of the input with the pattern and peaks where the pattern occurs, adding the pattern's samples coherently against noise.
  chapter: "11-03"
  see_also: [Cross-correlation]

# ---------------------------------------------------------------- 11-04
- term: Difference equation
  definition: "A recursion relating a sequence's present and past values, y[n] + a₁y[n − 1] + … + a_N y[n − N] = b₀x[n] + … + b_M x[n − M]; with constant coefficients and initial rest it defines a causal LTI system, the discrete-time counterpart of a linear ODE."
  chapter: "11-04"
  see_also: [IIR filter, Characteristic equation]
- term: IIR filter
  definition: "An infinite impulse response (recursive) digital filter, whose output feeds back into future outputs; it achieves sharp responses with few multiply-accumulates but must be checked for stability, has nonlinear phase and is sensitive to coefficient rounding."
  chapter: "11-04"
  see_also: [FIR filter, Biquad]
- term: Initial rest
  definition: "The condition that a system's output is zero until its input becomes nonzero; with it, a constant-coefficient differential or difference equation defines a causal LTI system."
  chapter: "11-04"
- term: Jump conditions
  definition: "The values an impulse imposes at t = 0⁺ on an Nth-order differential equation's solution; only the highest derivative contains the impulse, so the next lower derivative jumps by the impulse weight over the leading coefficient and lower derivatives are continuous."
  chapter: "11-04"
- term: Direct form I and II
  definition: "Block-diagram realizations of a difference equation; direct form I uses separate delay lines for input and output (2N delays for order N), direct form II runs the recursive part first so one line serves both (N delays, canonical); transposed direct form II rearranges it for better floating-point behavior."
  chapter: "11-04"
  see_also: [Biquad]
- term: Eigenfunction of an LTI system
  definition: "A signal that passes through every LTI system unchanged in shape, multiplied only by a complex constant: zⁿ → H(z)zⁿ in discrete time and e^{st} → H(s)e^{st} in continuous time. Sinusoids are sums of two such signals."
  chapter: "11-04"
  see_also: [System function, Frequency response]
- term: System function
  definition: "The eigenvalue of an LTI system for the exponential input, H(z) = Σ h[k]z^{−k} or H(s) = ∫ h(τ)e^{−sτ} dτ; for a constant-coefficient equation it is a ratio of polynomials whose denominator roots are the poles."
  chapter: "11-04"
- term: Limit cycle
  definition: "A small sustained oscillation in a fixed-point recursive filter with zero or constant input, caused by rounding inside the feedback loop; it cannot occur in the exact linear system."
  chapter: "11-04"
  see_also: [IIR filter]

# ---------------------------------------------------------------- 11-05
- term: Fourier series
  definition: "The representation of a periodic signal as a sum of complex exponentials at multiples of its fundamental frequency, x(t) = Σ c_k e^{jkω₀t}, with c_k = (1/T₀)∫ x(t) e^{−jkω₀t} dt found by orthogonality."
  chapter: "11-05"
  see_also: [Fourier coefficient, Harmonic, Line spectrum]
- term: Harmonic
  definition: "A component of a periodic signal at an integer multiple k of its fundamental frequency; the k-th harmonic of a real signal is a sinusoid of amplitude 2|c_k|."
  chapter: "11-05"
- term: Fundamental frequency
  definition: "The reciprocal of a periodic signal's fundamental (smallest) period, f₀ = 1/T₀; all of the signal's harmonics lie at its integer multiples."
  chapter: "11-05"
- term: Line spectrum
  definition: "The plot of a periodic signal's Fourier coefficients (magnitude and phase) against frequency; it consists of lines at the harmonic frequencies only."
  chapter: "11-05"
- term: Half-wave symmetry
  definition: "The property x(t + T₀/2) = −x(t), under which every even harmonic, including DC, is zero; zero-mean square and triangle waves have it."
  chapter: "11-05"
- term: Parseval's relation
  definition: "For a periodic signal, average power equals the sum of the harmonic powers, (1/T₀)∫|x|² dt = Σ|c_k|²; RMS values of different harmonics therefore add in quadrature."
  chapter: "11-05"
  see_also: [Orthogonality, Total harmonic distortion (THD)]
- term: PWM DAC
  definition: "A digital-to-analog converter made from a pulse-width-modulated output and a low-pass filter; the filter keeps the average A·D and attenuates the switching harmonics, leaving a ripple set by the PWM frequency and filter order."
  chapter: "11-05"
  see_also: [Duty cycle]
- term: Spread-spectrum clocking
  definition: "Varying a clock's frequency slightly over time so that each harmonic is smeared over a band, lowering the peak that narrow-band emissions measurements report; the total harmonic energy is unchanged."
  chapter: "11-05"

# ---------------------------------------------------------------- 11-06
- term: Fourier transform
  definition: "X(jω) = ∫ x(t) e^{−jωt} dt, with inverse x(t) = (1/2π)∫ X(jω) e^{jωt} dω: the spectrum of an aperiodic signal, obtained as the limit of the Fourier series as the period grows; X(f) = X(j2πf) in hertz."
  chapter: "11-06"
  see_also: [Fourier series, Convolution theorem]
- term: Spectrum
  definition: "A signal's content as a function of frequency: lines at the harmonics for a periodic signal (Fourier series), a continuous function for an aperiodic one (Fourier transform)."
  chapter: "11-06"
- term: Duality (Fourier)
  definition: "The symmetry of the Fourier pair: if x(t) ↔ X(jω), then X(jt) ↔ 2π x(−ω); so a pulse transforms to a sinc and a sinc to a pulse."
  chapter: "11-06"
- term: Convolution theorem
  definition: "Convolution in time is multiplication in frequency, x * h ↔ X(jω)H(jω), and multiplication in time is convolution in frequency (divided by 2π); the frequency response of an LTI system is the transform of its impulse response."
  chapter: "11-06"
- term: Distortionless transmission
  definition: "Passing a signal with only a gain and a delay, y = Kx(t − t₀), which requires a constant magnitude response and a phase that is linear in frequency (constant group delay)."
  chapter: "11-06"
  see_also: [Group delay]
- term: Ideal low-pass filter
  definition: "A filter passing |ω| < W unchanged and removing all else; its impulse response sin(Wt)/(πt) is noncausal and not absolutely integrable, and its step response overshoots to 1.0895 (Gibbs)."
  chapter: "11-06"
- term: Energy spectral density
  definition: "|X(f)|², the energy per hertz of a finite-energy signal; by Parseval its integral over all frequency is the signal's energy."
  chapter: "11-06"
  see_also: [Parseval's relation]
- term: Bandwidth
  definition: "The frequency extent of a spectrum or a frequency response; it must be defined (−3 dB, null-to-null, fractional-energy such as 99%, or Nyquist frequency of a symbol stream), since the definitions can differ by large factors for one signal."
  chapter: "11-06"
- term: Time-bandwidth product
  definition: "The product of a signal's duration and bandwidth, independent of time scaling and fixed by its shape; for RMS widths σ_t σ_ω ≥ 1/2, with equality only for the Gaussian (the uncertainty principle)."
  chapter: "11-06"
- term: Nyquist frequency
  definition: "Half the symbol (or sample) rate: the highest frequency in a symbol pattern alternating every symbol, the reference frequency at which link channels are specified, and the limit of unambiguous frequency for sampled signals."
  chapter: "11-06"
# ---------------------------------------------------------------- 11-07
- term: Discrete-time Fourier transform (DTFT)
  definition: "X(e^{jω}) = Σ x[n] e^{−jωn}, with inverse x[n] = (1/2π)∫ over one period of X(e^{jω}) e^{jωn} dω: the spectrum of a sequence, a continuous function of ω that is periodic with period 2π."
  chapter: "11-07"
  see_also: [Fourier transform, Discrete-time frequency]
- term: Dirichlet kernel
  definition: "The DTFT of a length-N rectangular sequence, e^{−jω(N−1)/2} sin(Nω/2)/sin(ω/2): a main lobe of null-to-null width 4π/N with sidelobes about 13 dB down; it is what truncation convolves every spectrum with."
  chapter: "11-07"
  see_also: [Window function]
- term: Linear phase
  definition: "A frequency response whose phase is −ωτ (plus a constant or sign flips at zeros), so every frequency is delayed by the same τ; a real FIR filter with symmetric or antisymmetric taps has it exactly, with τ = (N − 1)/2 samples."
  chapter: "11-07"
  see_also: [Group delay, Distortionless transmission]
- term: Window function
  definition: "A taper w[n] multiplying a sequence before it is truncated or transformed (rectangular, Hamming, Hann, Kaiser, ...); tapering lowers the sidelobes of the spectrum at the price of a wider main lobe."
  chapter: "11-07"
  see_also: [Dirichlet kernel, Frequency resolution]
- term: Transition band
  definition: "The frequency range between a filter's passband and stopband; in a windowed FIR design its width shrinks in proportion to 1/N, while the ripple is set by the window's shape."
  chapter: "11-07"
- term: Frequency resolution
  definition: "The smallest separation at which two spectral components appear as distinct peaks; for a record of duration T it is about 1/T hertz with a rectangular window, and roughly twice that with a Hamming window."
  chapter: "11-07"
  see_also: [Window function, Zero-padding]
- term: Discrete Fourier transform (DFT)
  definition: "X[k] = Σ_{n=0}^{N−1} x[n] e^{−j2πkn/N}: N equally spaced samples of the DTFT of a length-N sequence, computed in N log N operations by the FFT."
  chapter: "11-07"
  see_also: [Discrete-time Fourier transform (DTFT), Zero-padding]
- term: Zero-padding
  definition: "Appending zeros to a sequence before a DFT, which samples the same DTFT more finely; it interpolates the spectrum but does not improve frequency resolution, which only a longer record does."
  chapter: "11-07"
  see_also: [Frequency resolution]
# ---------------------------------------------------------------- 11-08
- term: Bilateral Laplace transform
  definition: "X(s) = ∫ x(t) e^{−st} dt over all t, with s = σ + jω: the Fourier transform of x(t)e^{−σt}; it describes signals and systems for all time and is meaningful only together with its region of convergence."
  chapter: "11-08"
  see_also: [Laplace transform, Region of convergence (ROC)]
- term: Region of convergence (ROC)
  definition: "The set of s for which a Laplace (or z-) transform's integral converges absolutely; for the Laplace transform a vertical strip bounded by poles, a right half-plane for right-sided signals and a left half-plane for left-sided ones. The same algebraic X(s) with different ROCs describes different signals."
  chapter: "11-08"
  see_also: [Bilateral Laplace transform]
- term: s-plane
  definition: "The complex plane of the Laplace variable s = σ + jω: the horizontal axis is the growth or decay rate (s⁻¹), the vertical axis the oscillation frequency (rad/s); the imaginary axis carries the frequency response."
  chapter: "11-08"
  see_also: [Poles and zeros]
- term: Geometric evaluation
  definition: "Reading a frequency response from a pole–zero plot: |H(jω)| is the product of the distances from jω to the zeros divided by the product of the distances to the poles, and the phase is the sum of the zero angles minus the sum of the pole angles."
  chapter: "11-08"
  see_also: [Poles and zeros, Frequency response]
- term: Continuous-time linear equalizer (CTLE)
  definition: "An analog filter in a high-speed receiver that boosts high frequencies relative to low ones with a zero placed below its poles, to undo the channel's frequency-dependent loss; its boost comes mostly from lowering the low-frequency gain."
  chapter: "11-08"
  see_also: [Poles and zeros]
# ---------------------------------------------------------------- 11-09
- term: z-transform
  definition: "X(z) = Σ x[n] z^{−n}, the DT counterpart of the Laplace transform: the DTFT of x[n]r^{−n} for z = re^{jω}; meaningful only with its region of convergence, an annulus centered on the origin."
  chapter: "11-09"
  see_also: [Region of convergence (ROC), Discrete-time Fourier transform (DTFT)]
- term: z-plane
  definition: "The complex plane of the variable z = re^{jω}: each point is the geometric sequence zⁿ, decaying inside the unit circle, growing outside, with the angle as DT frequency."
  chapter: "11-09"
  see_also: [Unit circle, s-plane]
- term: Unit circle
  definition: "|z| = 1 in the z-plane, where z = e^{jω} and the system function becomes the frequency response; DC is z = 1, f_s/4 is z = j and half the sample rate is z = −1. A causal system is stable exactly when all its poles lie inside it."
  chapter: "11-09"
- term: Stability triangle
  definition: "The region |a₂| < 1, |a₁| < 1 + a₂ of the coefficient plane in which a second-order denominator 1 + a₁z^{−1} + a₂z^{−2} has both poles inside the unit circle; poles are complex above the parabola a₁² = 4a₂."
  chapter: "11-09"
  see_also: [Biquad]
- term: Bilinear transform
  definition: "The s-to-z map s = (2/T)(1 − z^{−1})/(1 + z^{−1}), from the trapezoidal rule: it maps the left half-plane into the unit disk and the whole jω axis onto the unit circle once, so stability is kept and there is no aliasing, at the cost of frequency warping."
  chapter: "11-09"
  see_also: [Frequency warping, Impulse invariance]
- term: Frequency warping
  definition: "The nonlinear frequency map of the bilinear transform, Ω = (2/T) tan(ω/2): nearly linear well below the sample rate, compressing the whole analog axis into ω < π; corrected at one chosen frequency by prewarping."
  chapter: "11-09"
  see_also: [Bilinear transform]
- term: Impulse invariance
  definition: "Converting a CT system to DT by sampling its impulse response, h[n] = T h(nT), which maps each pole s to z = e^{sT}; it preserves the impulse response's shape but aliases the frequency response."
  chapter: "11-09"
  see_also: [Bilinear transform]
# ---------------------------------------------------------------- 11-10
- term: Sampling theorem
  definition: "A signal band-limited to f_M is uniquely determined by its samples taken at f_s > 2f_M and can be rebuilt from them by ideal low-pass filtering (sinc interpolation); sampling copies the spectrum at every multiple of f_s, and the condition keeps the copies apart."
  chapter: "11-10"
  see_also: [Nyquist rate, Aliasing (sampling)]
- term: Nyquist rate
  definition: "Twice the highest frequency in a band-limited signal: the sample rate the sampling theorem requires to be exceeded (compare the Nyquist frequency, half the sample rate actually used)."
  chapter: "11-10"
  see_also: [Nyquist frequency, Sampling theorem]
- term: Aliasing (sampling)
  definition: "The folding of frequencies above half the sample rate onto lower ones, because tones differing by a multiple of f_s give identical samples; a tone at f₀ appears at |f₀ − kf_s| ≤ f_s/2, and aliased signal or noise cannot be separated after sampling."
  chapter: "11-10"
  see_also: [Anti-aliasing filter, Sampling theorem]
- term: Anti-aliasing filter
  definition: "The analog low-pass (or band-pass) filter before a sampler that attenuates everything that would fold into the band of interest; its requirement is set at the first alias frequency f_s − f_B, and oversampling relaxes it."
  chapter: "11-10"
  see_also: [Aliasing (sampling), Oversampling]
- term: Sinc interpolation
  definition: "Ideal reconstruction of a band-limited signal from its samples, x(t) = Σ x[n] sinc((t − nT)/T): each sample launches a sinc pulse that passes through its own sample and through zero at all the others."
  chapter: "11-10"
  see_also: [Sampling theorem, Zero-order hold]
- term: Oversampling
  definition: "Sampling far above the Nyquist rate, which relaxes the analog anti-aliasing filter and spreads quantization noise thinly (10 log₁₀ OSR dB less in band after digital filtering), followed by digital filtering and decimation."
  chapter: "11-10"
  see_also: [Decimation, Anti-aliasing filter]
- term: Aperture jitter
  definition: "Random variation of a sampler's timing; it turns into noise proportional to the input's slope, limiting SNR to −20 log₁₀(2πf₀σ_t) for a sine at f₀ and RMS jitter σ_t, independent of the sample rate."
  chapter: "11-10"
  see_also: [Jitter]
- term: Band-pass sampling
  definition: "Sampling a band f_L–f_H below twice its highest frequency by placing it inside one Nyquist zone: 2f_H/n ≤ f_s ≤ 2f_L/(n − 1); the band reappears between 0 and f_s/2, inverted when n is even."
  chapter: "11-10"
  see_also: [Nyquist zone, Aliasing (sampling)]
- term: Nyquist zone
  definition: "One of the frequency intervals [(n − 1)f_s/2, nf_s/2] into which sampling at f_s divides the axis; every zone folds onto the first, with even zones spectrally inverted."
  chapter: "11-10"
  see_also: [Band-pass sampling]
# ---------------------------------------------------------------- 11-11
- term: Amplitude modulation (AM)
  definition: "Carrying a message in a carrier's amplitude, A[1 + m x(t)] cos(2πf_c t); its spectrum is the carrier plus the message's spectrum shifted to ±f_c as two sidebands, occupying twice the message bandwidth."
  chapter: "11-11"
  see_also: [DSB-SC modulation, Modulation index, Envelope detector]
- term: DSB-SC modulation
  definition: "Double-sideband suppressed-carrier AM, x(t) cos(2πf_c t): the message multiplied by the carrier, with no carrier line; efficient, but it needs coherent demodulation with the carrier's frequency and phase."
  chapter: "11-11"
  see_also: [Coherent demodulation]
- term: Modulation index
  definition: "In conventional AM, the depth m of the envelope variation A[1 + m x(t)] with |x| ≤ 1; m ≤ 1 keeps the envelope equal to the message, and the sideband share of power is m²P_x/(1 + m²P_x)."
  chapter: "11-11"
  see_also: [Amplitude modulation (AM)]
- term: Envelope detector
  definition: "A diode charging a capacitor that discharges through a resistor, which tracks the peaks of an AM signal; its time constant must be much longer than the carrier period but at most √(1 − m²)/(mω_m) to avoid diagonal clipping."
  chapter: "11-11"
  see_also: [Amplitude modulation (AM)]
- term: Coherent demodulation
  definition: "Recovering a modulated message by multiplying by a local copy of the carrier and low-pass filtering; a phase error φ scales the output by cos φ and a frequency error makes it beat."
  chapter: "11-11"
  see_also: [DSB-SC modulation]
- term: Mixer
  definition: "A circuit that multiplies two signals, producing their sum and difference frequencies; it shifts a band from one frequency to another in every radio transmitter and receiver."
  chapter: "11-11"
  see_also: [Superheterodyne receiver, Image frequency]
- term: Superheterodyne receiver
  definition: "A receiver that mixes the wanted signal with a tunable local oscillator to a fixed intermediate frequency (IF), where a fixed, sharp filter selects it; it must reject the image frequency before the mixer."
  chapter: "11-11"
  see_also: [Mixer, Image frequency]
- term: Image frequency
  definition: "The input frequency on the other side of the local oscillator that mixes to the same IF as the wanted signal: f_RF + 2f_IF for a high-side LO; it must be filtered before mixing, because afterward it is inseparable."
  chapter: "11-11"
  see_also: [Superheterodyne receiver]
- term: Frequency-division multiplexing (FDM)
  definition: "Sharing a medium by giving each message its own carrier frequency slot, separated by guard bands sized for the selection filters' transition width; OFDM is its digital form."
  chapter: "11-11"
- term: Elliptic filter
  definition: "A filter with equiripple passband and stopband, obtained by placing zeros on the jω axis just beyond the passband; it meets a magnitude specification with the lowest order of the classical families, at the cost of large group-delay variation."
  chapter: "11-11"
  see_also: [Butterworth response, Bessel filter]
- term: Bessel filter
  definition: "A filter whose poles are chosen for maximally flat group delay, preserving pulse shapes with almost no overshoot, at the cost of a gentle magnitude roll-off."
  chapter: "11-11"
  see_also: [Group delay, Elliptic filter]
# ---------------------------------------------------------------- 12-01
- term: Differential pair
  definition: "Two matched transistors whose emitters or sources share a tail current source, so that the tail fixes their total current and the input difference decides how it splits; the input stage of op-amps, comparators and CML buffers."
  chapter: "12-01"
  see_also: [Tail current source, Half-circuit, Common-mode rejection ratio (CMRR)]
- term: Differential-mode gain
  definition: The gain from the difference of a differential stage's two inputs to its output, g_mR_D for a resistor-loaded pair with a differential output and half that for one output.
  chapter: "12-01"
  see_also: [Common-mode gain, Differential pair]
- term: Common-mode gain
  definition: The gain from the average of a differential stage's two inputs to its output; for one output of a resistor-loaded pair it is about R_D/(2R_SS), set by the tail's output resistance R_SS.
  chapter: "12-01"
  see_also: [Differential-mode gain, Common-mode rejection ratio (CMRR)]
- term: Half-circuit
  definition: One half of a symmetric circuit analyzed alone, using the fact that for differential signals the symmetry plane (such as a pair's tail node) is a virtual ground, and for common-mode signals each half sees twice the shared impedance.
  chapter: "12-01"
  see_also: [Differential pair]
- term: Input common-mode range
  definition: The range of common-mode input voltage over which every transistor of a differential stage, including its tail source, stays in its active (saturation) region, so that gain and CMRR hold.
  chapter: "12-01"
  see_also: [Differential pair, Rail-to-rail]
- term: Current-mode logic (CML)
  definition: Logic or buffering built from differential pairs that steer a constant tail current fully to one side, giving small differential swings across resistor loads, high speed and nearly constant supply current; standard in high-speed serial links.
  chapter: "12-01"
  see_also: [Differential pair, Differential signaling]
- term: Tail current source
  definition: The current source feeding a differential pair's shared emitter or source node; its value sets the pair's total current and its output resistance sets the single-ended common-mode rejection.
  chapter: "12-01"
  see_also: [Differential pair, Common-mode gain]
# ---------------------------------------------------------------- 12-02
- term: Current-mirror load
  definition: A current mirror used as the load of a differential pair, which copies one side's signal current to the other so that both halves' currents reach a single-ended output, doubling its transconductance to g_m.
  chapter: "12-02"
  see_also: [Active load, Five-transistor OTA, Differential pair]
- term: Five-transistor OTA
  definition: The simplest operational transconductance amplifier, a differential pair with a current-mirror load and a tail source; gain g_m(r_o2 ∥ r_o4), small common-mode gain about 1/(2g_m3R_SS), and the first stage of the classic two-stage op-amp.
  chapter: "12-02"
  see_also: [Current-mirror load, Common-mode rejection ratio (CMRR)]
- term: Telescopic cascode amplifier
  definition: A differential pair with cascode transistors stacked on its drains and cascode current-source loads, giving gain near (g_mr_o)²/2 in one stage at the cost of output swing, about V_DD minus five overdrives per side.
  chapter: "12-02"
  see_also: [Cascode, Multistage amplifier]
- term: Multistage amplifier
  definition: A cascade of gain stages whose gains multiply, reduced by loading where one stage's output resistance meets the next stage's input resistance; offsets of later stages refer to the input divided by the gain before them.
  chapter: "12-02"
  see_also: [Telescopic cascode amplifier, Systematic offset]
- term: Systematic offset
  definition: An offset that results from the design rather than from random mismatch, such as unequal drain voltages or a second stage whose current does not match its width ratio; it is the same on every chip and is removed by design, not by device area.
  chapter: "12-02"
  see_also: [Input offset voltage, Multistage amplifier]
- term: DC level shifting
  definition: Moving a signal's DC level between directly coupled stages, by alternating NMOS and PMOS stages, by a source or emitter follower (a shift of V_GS or V_BE), or by a fixed drop across diodes or resistors carrying a set current.
  chapter: "12-02"
  see_also: [Multistage amplifier, Level shifter]
# ---------------------------------------------------------------- 12-03
- term: Miller theorem
  definition: An impedance Z bridging two nodes whose voltages satisfy V_2 = AV_1 can be replaced by Z/(1 − A) from node 1 to ground and Z/(1 − 1/A) from node 2 to ground; for a capacitor across an inverting gain −A_v it gives the input capacitance C(1 + A_v).
  chapter: "12-03"
  see_also: [Miller effect]
- term: Overlap capacitance
  definition: The capacitance between a MOSFET's gate and the source or drain diffusion it slightly overlaps, proportional to the device width; it is essentially all of C_gd in saturation, the capacitance the Miller effect multiplies.
  chapter: "12-03"
  see_also: [Miller effect, Junction capacitance]
- term: Dominant-pole approximation
  definition: For a transfer function whose denominator is 1 + b_1s + b_2s² + …, with one pole far below the others, the low pole is about 1/b_1 and the next about b_1/b_2; it errs low when the poles are less than about a decade apart.
  chapter: "12-03"
  see_also: [Gain-bandwidth product, Miller effect]
# ---------------------------------------------------------------- 12-04
- term: Open-circuit time constants
  definition: The products R_i0C_i of each capacitor and the resistance it sees with every other capacitor open; their sum is exactly the coefficient b_1 of the circuit's denominator, and 1/Σ R_i0C_i is a conservative estimate of the upper −3 dB frequency.
  chapter: "12-04"
  see_also: [Zero-value time constants, Dominant-pole approximation]
- term: Zero-value time constants
  definition: The resistances seen by one capacitor with another shorted, used in pairs to give the second denominator coefficient b_2 = Σ R_i0C_iR_j^iC_j and from it the second pole, about b_1/b_2.
  chapter: "12-04"
  see_also: [Open-circuit time constants]
- term: Short-circuit time constants
  definition: The time constants R_isC_i of coupling and bypass capacitors, each found with the other low-frequency capacitors shorted; the sum Σ 1/(R_isC_i) is a conservative estimate of the lower −3 dB frequency.
  chapter: "12-04"
  see_also: [Open-circuit time constants]
- term: Pole splitting
  definition: "The separation of a two-stage amplifier's two poles by a capacitor bridging the inverting second stage: Miller multiplication pushes the lower pole down to about 1/(g_m2R_1R_2C_c), and the capacitor's shorting of the second stage at high frequency pushes the upper pole up to about g_m2/(C_1 + C_2)."
  chapter: "12-04"
  see_also: [Miller effect, Right-half-plane zero]
- term: Desensitivity factor
  definition: The factor 1 + T by which negative feedback divides the fractional sensitivity of the closed-loop gain to the forward gain, dA_f/A_f = (dA/A)/(1 + T); the feedback network's own errors are not divided.
  chapter: "12-05"
  see_also: [Loop gain, Negative feedback]
- term: Feedback topology
  definition: The way a feedback amplifier mixes the fed-back signal at its input (series, as a voltage, or shunt, as a current) and samples its output (shunt, the voltage, or series, the current); series connections raise an impedance by 1 + T and shunt connections lower it.
  chapter: "12-05"
  see_also: [Return ratio]
- term: Return ratio
  definition: The loop gain measured at one controlled source, without splitting the circuit into A and β, by replacing the source with an independent one of value s_c and finding the value P·x_r its controlling variable would call for, T = −P·x_r/s_c.
  chapter: "12-05"
  see_also: [Asymptotic-gain formula, Loop gain]
- term: Asymptotic-gain formula
  definition: The exact closed-loop gain of a circuit with one controlled source, A_f = A∞·T/(1 + T) + A0/(1 + T), where A∞ is the gain with the controlling variable forced to zero, A0 the gain with the source set to zero, and T the return ratio.
  chapter: "12-05"
  see_also: [Return ratio]
- term: Blackman's impedance formula
  definition: The impedance at any port of a feedback circuit, Z = Z0(1 + T_sc)/(1 + T_oc), with Z0 the impedance when the controlled source is zero and T_sc, T_oc the return ratios with the port shorted and open.
  chapter: "12-05"
  see_also: [Return ratio, Feedback topology]
- term: Two-port loading method
  definition: The classical way to analyse a feedback amplifier by absorbing the feedback network's loading into the amplifier (its input-port resistance with the other port shorted for shunt or opened for series connections) and then applying A/(1 + Aβ); it neglects forward transmission through the network and reverse transmission through the amplifier.
  chapter: "12-05"
  see_also: [Return ratio, Feedback topology]
- term: Bootstrapping
  definition: Driving the far end of an element with a copy of the voltage at its near end, so that little voltage appears across it and its effective impedance rises by 1/(1 − A_v); used to raise a follower's input resistance or to cancel cable capacitance with a driven guard.
  chapter: "12-05"
  see_also: [Blackman's impedance formula]
- term: Gain margin
  definition: How far a loop gain's magnitude is below one, in decibels, at the frequency where its phase reaches −180°, −20·log|T(jω180)|; the extra loop gain the loop could tolerate before oscillating. A typical target is at least 10 dB.
  chapter: "12-06"
  see_also: [Phase margin, Crossover frequency]
- term: Crossover frequency
  definition: The frequency at which a loop gain's magnitude falls to one; the phase margin is read there, and for a well-compensated loop it is close to the closed-loop bandwidth.
  chapter: "12-06"
  see_also: [Phase margin, Loop gain]
- term: Dominant-pole compensation
  definition: Stabilizing a multi-pole feedback amplifier by making one pole so low that the loop gain falls to one before the other poles add much phase lag; lowering an existing pole costs less bandwidth than adding a new one.
  chapter: "12-06"
  see_also: [Miller compensation, Phase margin]
- term: Miller compensation
  definition: Compensation of a two-stage amplifier by a capacitor C_c across the inverting second stage, which splits the two poles; the gain-bandwidth product becomes g_m1/C_c, the second pole is about g_m2/C_L, and a right-half-plane zero appears at g_m2/C_c.
  chapter: "12-06"
  see_also: [Pole splitting, Nulling resistor, Right-half-plane zero]
- term: Nulling resistor
  definition: A resistor R_z in series with a Miller compensation capacitor; R_z = 1/g_m2 moves the right-half-plane zero to infinity, and a larger value turns it into a left-half-plane zero that can cancel the second pole, at the cost of a new pole near 1/(R_zC_1).
  chapter: "12-06"
  see_also: [Miller compensation, Right-half-plane zero]
- term: Unity-gain stable
  definition: Said of an op-amp whose compensation keeps it stable with 100% feedback (a buffer), the case of largest loop gain; a decompensated op-amp trades this for a higher gain-bandwidth product and a minimum stable closed-loop gain.
  chapter: "12-06"
  see_also: [Dominant-pole compensation, Phase margin]
- term: Class-B amplifier
  definition: A push-pull output stage in which each of two complementary transistors conducts for half of each cycle, with no idle current; efficiency (π/4)·V_op/V_CC, at most 78.5%, but with crossover distortion near zero output.
  chapter: "12-07"
  see_also: [Class-AB amplifier, Crossover distortion, Class-A amplifier]
- term: Class-AB amplifier
  definition: A push-pull output stage biased so both transistors conduct a small quiescent current at idle, removing the crossover dead band at the cost of some idle power; the two currents obey i_N·i_P = I_Q² in a bipolar stage.
  chapter: "12-07"
  see_also: [Class-B amplifier, VBE multiplier]
- term: Crossover distortion
  definition: Distortion of a class B stage near zero output, where neither transistor conducts until its base–emitter voltage reaches about 0.6 V; it is worst for small signals and is removed by class AB bias.
  chapter: "12-07"
  see_also: [Class-B amplifier, Class-AB amplifier]
- term: Safe operating area
  definition: The region of collector-emitter voltage and current (for a given case temperature and pulse length) in which a power transistor may operate, bounded by maximum current, maximum voltage, the power hyperbola and, for bipolar devices, the second-breakdown limit. Abbreviated SOA.
  chapter: "12-07"
  see_also: [Second breakdown, Thermal runaway]
- term: Second breakdown
  definition: Failure of a bipolar power transistor at high collector-emitter voltage when current concentrates in a hot spot that heats and draws still more current, a local thermal runaway; it limits the safe operating area below the average-power hyperbola.
  chapter: "12-07"
  see_also: [Safe operating area, Thermal runaway]
- term: Darlington pair
  definition: Two bipolar transistors with the first one's emitter driving the second one's base, giving a current gain of about the product of the two betas at the cost of two base-emitter drops and slower turn-off; the Sziklai pair uses a complementary driver to keep a single drop.
  chapter: "12-07"
  see_also: [Class-AB amplifier]
- term: Foldback current limiting
  definition: Output short-circuit protection whose current limit falls as the voltage across the output device rises, so that a short circuit, which puts the full supply across the device, draws much less current than a normal peak and stays inside the safe operating area.
  chapter: "12-07"
  see_also: [Safe operating area]
- term: VBE multiplier
  definition: A transistor with a resistor divider across its collector–base and base–emitter junctions that produces V_BE(1 + R1/R2); used to bias class AB output stages, and mounted on their heat sink so the bias falls as they heat.
  chapter: "12-07"
  see_also: [Class-AB amplifier, Thermal runaway]
- term: Bridge-tied load
  definition: Driving a load between two amplifier outputs in antiphase instead of from one output to ground, which doubles the voltage swing and quadruples the power from a single supply; the usual arrangement in class D audio amplifiers.
  chapter: "12-07"
  see_also: [Class-D amplifier]
- term: Two-stage op-amp
  definition: The standard CMOS operational amplifier, a differential pair with a current-mirror load followed by a common-source second stage, Miller-compensated by a capacitor across the second stage; gain g_m1R_1·g_m6R_2 and gain-bandwidth product g_m1/(2πC_c).
  chapter: "12-08"
  see_also: [Miller compensation, Slew rate, Folded cascode]
- term: Folded cascode
  definition: A single-stage op-amp in which the input pair's signal currents are folded into common-gate cascode devices of the opposite type, giving cascode output resistance with more headroom than a telescopic cascode; its load capacitance sets the dominant pole, so GBW = g_m1/(2πC_L).
  chapter: "12-08"
  see_also: [Two-stage op-amp, Telescopic cascode amplifier]
- term: Fully differential amplifier
  definition: An amplifier with differential inputs and differential outputs, which doubles the output swing, rejects common-mode noise and even-order distortion, and needs common-mode feedback to set its output common-mode level.
  chapter: "12-08"
  see_also: [Common-mode feedback]
- term: Common-mode feedback
  definition: A loop in a fully differential amplifier that senses the average of the two outputs, compares it with a reference and adjusts a bias current, dividing the common-mode error (current mismatch times output resistance) by 1 + g_m,cm·R_out.
  chapter: "12-08"
  see_also: [Fully differential amplifier]
- term: Rail-to-rail input
  definition: An input stage whose common-mode range reaches both supply rails, usually by placing NMOS and PMOS differential pairs in parallel so one pair works near each rail; its transconductance, offset and CMRR change where the pairs hand over.
  chapter: "12-08"
  see_also: [Constant-gm input stage, Input common-mode range]
- term: Constant-gm input stage
  definition: A complementary rail-to-rail input stage whose bias control keeps the total transconductance constant across the common-mode range, for square-law devices by giving each pair a quarter of its current where both conduct.
  chapter: "12-08"
  see_also: [Rail-to-rail input]
- term: Barkhausen criterion
  definition: The condition for a sustained oscillation in a positive-feedback loop, loop gain exactly 1 with zero phase at the oscillation frequency; practical oscillators start with loop gain above 1 and rely on a nonlinearity to bring it to 1.
  chapter: "12-09"
  see_also: [Describing function, Loop gain]
- term: Colpitts oscillator
  definition: An LC oscillator whose tank uses a capacitive divider (C1 and C2 in series with the inductor's resonance) to feed back part of the transistor's output; it oscillates at the resonance of L with C1 and C2 in series and starts if g_m·R exceeds C2/C1.
  chapter: "12-09"
  see_also: [Negative resistance, Crystal oscillator]
- term: Crystal oscillator
  definition: An oscillator whose frequency is set by a quartz crystal, modelled as a motional L_m, C_m, R_m branch in parallel with C_0; its quality factor of 10⁴ to 10⁶ makes the frequency nearly independent of the amplifier, and the load capacitance pulls it by parts per million.
  chapter: "12-09"
  see_also: [Colpitts oscillator]
- term: Relaxation oscillator
  definition: An oscillator without a resonator, in which a capacitor charges until a threshold, a comparator switches, and the capacitor discharges to a second threshold; its period is set by an RC time constant and the thresholds (an op-amp astable, the 555 timer).
  chapter: "12-09"
  see_also: [Schmitt trigger]
- term: Pierce oscillator
  definition: The standard crystal-oscillator circuit, an inverting amplifier with the crystal from output to input and a capacitor from each end to ground; it presents the crystal with a load capacitance and a negative resistance -g_m/(omega^2 C1 C2) that must exceed the crystal's ESR by a safety factor.
  chapter: "12-09"
  see_also: [Negative resistance, Barkhausen criterion]
- term: Signal-to-noise ratio
  definition: The ratio of a signal's power to the noise power in the same bandwidth, usually in decibels, 10 log(P_s/P_n) = 20 log(V_s,rms/v_n,rms); a noise density alone does not fix it until the bandwidth is stated.
  chapter: "12-10"
  see_also: [Noise figure, Thermal noise]
- term: Describing function
  definition: The effective gain of a memoryless nonlinearity for a sinusoidal input, the fundamental of its output divided by the input amplitude; an oscillator's amplitude settles where the describing-function loop gain equals one.
  chapter: "12-09"
  see_also: [Barkhausen criterion]
- term: Voltage-controlled oscillator
  definition: An oscillator whose frequency is tuned by a control voltage, typically through a varactor in an LC tank or the bias of a ring oscillator's stages; the controlled element of a phase-locked loop.
  chapter: "12-09"
  see_also: [Ring oscillator, Negative resistance]
- term: Flicker noise
  definition: Noise whose power spectral density rises as 1/f toward low frequency, from carriers trapped and released at interfaces; strong in MOSFETs, it contributes equal power in every decade and is characterized by its corner frequency with the white floor.
  chapter: "12-10"
  see_also: [Thermal noise, Input-referred noise]
- term: Input-referred noise
  definition: An amplifier's output noise divided by its gain, expressed as an equivalent noise source at the input so it can be compared directly with the signal; in a chain, each later stage's contribution is divided by the gain ahead of it.
  chapter: "12-10"
  see_also: [Equivalent noise resistance, Noise figure]
- term: Equivalent noise resistance
  definition: The resistance whose thermal noise 4kTR equals a device's or amplifier's input-referred noise power density; γ/g_m for a MOSFET and 1/(2g_m) for a bipolar transistor.
  chapter: "12-10"
  see_also: [Input-referred noise, Thermal noise]
- term: Laplacian
  definition: The divergence of the gradient, ∇²V; in Cartesian coordinates the sum of second partial derivatives. Laplace's equation ∇²V = 0 governs potential in charge-free regions; the vector Laplacian is ∇(∇·A) − ∇×∇×A.
  chapter: "13-01"
  see_also: [Gradient, Divergence]
- term: Scale factor
  definition: In an orthogonal coordinate system, the factor h_i that converts a step du_i in a coordinate into a distance h_i·du_i; (1, ρ, 1) for cylindrical and (1, r, r·sinθ) for spherical coordinates. It appears inside the derivatives of the divergence and curl.
  chapter: "13-01"
  see_also: [Divergence, Curl]
- term: Helmholtz theorem
  definition: A smooth vector field that decays fast enough at infinity is determined uniquely by its divergence and its curl, and is the sum of a gradient and a curl; the reason Maxwell's equations specify both for each field.
  chapter: "13-01"
  see_also: [Divergence, Curl]
- term: Boundary condition
  definition: A rule linking fields on the two sides of an interface, derived from the integral laws on vanishing loops and pillboxes; in electrostatics the tangential E is continuous and the normal D jumps by the surface charge, and at a conductor E is normal with D_n equal to the surface charge.
  chapter: "13-02"
  see_also: [Gauss's law]
- term: Laplace's equation
  definition: The equation del-squared V = 0 obeyed by the electrostatic potential in a charge-free uniform region; its solutions have no interior maxima or minima, each point being the average of its surroundings.
  chapter: "13-02"
  see_also: [Poisson's equation, Uniqueness theorem]
- term: Uniqueness theorem
  definition: Poisson's equation with the potential (or the normal field) given on every boundary has only one solution, so any function satisfying the equation and the boundary conditions, however found, is the solution.
  chapter: "13-02"
  see_also: [Laplace's equation, Method of images]
- term: Separation of variables
  definition: Solving a partial differential equation by trying products of one-variable functions; each factor satisfies an ordinary differential equation with a separation constant, and boundary conditions select a series of such products.
  chapter: "13-02"
  see_also: [Laplace's equation, Fourier series]
- term: Method of images
  definition: Replacing a grounded conductor by fictitious charges outside the region of interest that make the conductor's surface an equipotential; by uniqueness, the real charges plus the images give the true field in the region.
  chapter: "13-02"
  see_also: [Uniqueness theorem]
- term: Finite-difference method
  definition: Approximating derivatives by differences on a grid; for Laplace's equation each grid potential equals the average of its four neighbours to second order in the spacing, giving linear equations that a computer, or a grid of equal resistors, solves.
  chapter: "13-02"
  see_also: [Laplace's equation]
- term: Capacitance per unit length
  definition: The charge per metre on a long two-conductor structure divided by the voltage between the conductors, C' in F/m, such as 2 pi epsilon/ln(b/a) for a coaxial line; with the inductance per length it sets a transmission line's impedance and delay.
  chapter: "13-02"
  see_also: [Characteristic impedance]
- term: Magnetic vector potential
  definition: The field A whose curl is the magnetic flux density, B = ∇ × A; it points along the currents that produce it, obeys ∇²A = −µJ in the Coulomb gauge, and its circulation around a loop is the flux through the loop.
  chapter: "13-03"
  see_also: [Biot–Savart law, Magnetic flux]
- term: Magnetization
  definition: The magnetic dipole moment per unit volume of a material, M (A/m), produced by electron spins and orbits; H = B/µ₀ − M, and in a linear material M = χ_m H, so that B = µ_r µ₀ H.
  chapter: "13-03"
  see_also: [Relative permeability, Ferromagnetism]
- term: Partial inductance
  definition: The share of a closed loop's inductance assigned to one segment of it, so that the loop inductance is the signed sum of the segments' partial self- and mutual inductances; the only meaningful inductance of an isolated wire such as a bond wire, about 1 nH/mm.
  chapter: "13-03"
  see_also: [Inductance, Mutual inductance]
- term: Internal inductance
  definition: The part of a conductor's inductance due to magnetic energy stored inside the conductor itself; µ₀/8π = 50 nH/m for a round nonmagnetic wire with uniform current, whatever its radius, and vanishing at high frequency as the skin effect pushes the current to the surface.
  chapter: "13-03"
  see_also: [Inductance]
- term: Nagaoka coefficient
  definition: The factor K ≤ 1 by which a finite solenoid's inductance falls below the long-solenoid formula µ₀N²A/ℓ, because the field spreads out near the ends; about 0.92 for a coil five diameters long and 0.82 for one two diameters long.
  chapter: "13-03"
  see_also: [Solenoid, Inductance]
- term: Magnetic circuit
  definition: A path of high-permeability material that guides magnetic flux, analysed like a resistive circuit with magnetomotive force as the source, flux as the current and reluctance as the resistance; an air gap usually dominates its reluctance.
  chapter: "13-03"
  see_also: [Reluctance, Magnetomotive force]
- term: Magnetomotive force
  definition: The ampere-turns NI that drive flux around a magnetic circuit, the analogue of voltage; equal to the line integral of H around the circuit, and to flux times total reluctance.
  chapter: "13-03"
  see_also: [Magnetic circuit, Reluctance]
- term: Charge relaxation time
  definition: The time constant τ = ε/σ with which free charge placed inside a conducting material decays away to its surface; about 10⁻¹⁹ s for copper and 0.18 ns for seawater. A material conducts at frequencies well below 1/(2πτ) and behaves as a dielectric well above it.
  chapter: "13-04"
  see_also: [Continuity equation]
- term: Complex permittivity
  definition: ε_c = ε′ − jε″, which folds a material's loss (conduction or polarization lag) into its permittivity for time-harmonic fields; ε″ = σ/ω for pure conduction, and ε″/ε′ is the loss tangent.
  chapter: "13-04"
  see_also: [Loss tangent]
- term: Helmholtz equation
  definition: The phasor wave equation ∇²E + k²E = 0 with k = ω√(µε), obtained by combining Maxwell's two curl equations in a source-free uniform region; its solutions are waves travelling at 1/√(µε).
  chapter: "13-04"
  see_also: [Maxwell's equations]
- term: Quasi-static approximation
  definition: Treating time-varying fields as if static at each instant, valid when the structure is much smaller than a wavelength (a common rule is below λ/10); it is the assumption behind lumped circuit theory.
  chapter: "13-04"
  see_also: [Maxwell's equations]
- term: Uniform plane wave
  definition: An electromagnetic wave whose fields are uniform over planes perpendicular to its direction of travel, with E, H and the direction mutually perpendicular and E/H equal to the medium's intrinsic impedance; the far-field model of every radiated wave.
  chapter: "13-05"
  see_also: [Intrinsic impedance, Helmholtz equation]
- term: Intrinsic impedance
  definition: The ratio of electric to magnetic field in a uniform plane wave, η = √(jωµ/(σ + jωε)); √(µ/ε) for a lossless medium (376.7 Ω in free space), and small and at 45° for a good conductor.
  chapter: "13-05"
  see_also: [Impedance of free space, Uniform plane wave]
- term: Phase velocity
  definition: The speed ω/β at which points of constant phase move; 1/√(µε) in a lossless medium, and frequency-dependent (dispersive) in conductors, waveguides and real dielectrics.
  chapter: "13-05"
  see_also: [Group velocity]
- term: Group velocity
  definition: The speed dω/dβ at which a narrowband signal's envelope, and its energy and information, travel; equal to the phase velocity only in a non-dispersive medium.
  chapter: "13-05"
  see_also: [Phase velocity]
- term: Propagation constant
  definition: γ = α + jβ, with a wave varying as e^(−γz); α (Np/m) is the attenuation and β (rad/m) the phase constant. For a plane wave γ = √(jωµ(σ + jωε)); for a transmission line γ = √((R + jωL)(G + jωC)).
  chapter: "13-05"
  see_also: [Neper]
- term: Axial ratio
  definition: The ratio of the major to the minor axis of the ellipse traced by a wave's electric field; 1 for circular polarization and infinite for linear. A linear antenna on an axial-ratio-r wave captures between 1/(1 + r²) and r²/(1 + r²) of the power.
  chapter: "13-05"
  see_also: [Polarization (light)]
- term: Skin depth
  definition: The depth δ = 1/√(πfµσ) at which a field entering a good conductor falls by a factor e; 2.1 µm in copper at 1 GHz. The current flows mostly within a few skin depths of the surface.
  chapter: "13-05"
  see_also: [Skin effect, Surface resistance]
- term: Surface resistance
  definition: R_s = 1/(σδ) = √(πfµ/σ), the resistance per square of a conductor at high frequency (8.25 mΩ for copper at 1 GHz); the loss per area is ½R_s|H_t|², and it rises as √f.
  chapter: "13-05"
  see_also: [Skin depth]
- term: Transmission coefficient
  definition: The ratio τ of the transmitted to the incident electric field at an interface; 1 + Γ = 2η₂/(η₁ + η₂) at normal incidence. The transmitted power fraction is (η₁/η₂)|τ|², not |τ|².
  chapter: "13-06"
  see_also: [Reflection coefficient]
- term: Critical angle
  definition: The angle of incidence, θc = arcsin(n₂/n₁), above which a wave going from a denser to a less dense medium is totally reflected; 41.8° from glass (n = 1.5) into air.
  chapter: "13-06"
  see_also: [Total internal reflection, Snell's law]
- term: Brewster angle
  definition: The angle of incidence, tan θB = n₂/n₁ for nonmagnetic media, at which a wave polarized in the plane of incidence (TM) is fully transmitted; 56.3° from air into glass. Reflected light near it is mostly TE polarized.
  chapter: "13-06"
  see_also: [Fresnel equations]
- term: Fresnel equations
  definition: The reflection and transmission coefficients of a plane wave at a planar interface as functions of angle, separately for TE (perpendicular) and TM (parallel) polarization; they follow from continuity of the tangential fields.
  chapter: "13-06"
  see_also: [Brewster angle, Snell's law]
- term: Evanescent wave
  definition: A field that decays exponentially away from an interface instead of propagating, as on the far side of a totally reflecting boundary; it carries no average power across the interface but can couple to a nearby structure.
  chapter: "13-06"
  see_also: [Total internal reflection]
- term: Quarter-wave transformer
  definition: A layer (or transmission-line section) a quarter wavelength thick whose impedance is the geometric mean of those on either side, √(η₁η₃); it cancels reflection at its design frequency, as in antireflection coatings.
  chapter: "13-06"
  see_also: [Reflection coefficient]
- term: Shielding effectiveness
  definition: The reduction, in dB, of a field by a barrier; for a solid conducting sheet roughly the absorption loss 8.686 t/δ plus the reflection loss 20 log₁₀(η₀/4|η_c|). Real enclosures are usually limited by seams and apertures instead.
  chapter: "13-06"
  see_also: [Skin depth]
- term: Telegrapher's equations
  definition: The pair ∂v/∂z = −L′∂i/∂t − R′i and ∂i/∂z = −C′∂v/∂t − G′v for voltage and current on a transmission line, from the distributed model; for a TEM line they are Faraday's and Ampère–Maxwell's laws integrated across the cross-section.
  chapter: "13-07"
  see_also: [Characteristic impedance, Transmission line]
- term: Bounce diagram
  definition: (Lattice diagram.) A plot of position against time that tracks each wave launched on a transmission line and its reflections at both ends; the voltage at a point is the sum of all the waves that have passed it.
  chapter: "13-07"
  see_also: [Reflection coefficient]
- term: Series termination
  definition: A resistor at a driver that brings its output resistance up to the line's Z₀, so that the reflection from an open receiver is absorbed at the source; the receiver sees one clean edge and no DC power is spent.
  chapter: "13-07"
  see_also: [Parallel termination]
- term: Parallel termination
  definition: A resistor equal to Z₀ at the receiver end of a line (to ground, a supply or a mid-rail), which absorbs the incident wave so nothing reflects, at the cost of DC current whenever the line is driven away from the termination voltage.
  chapter: "13-07"
  see_also: [Series termination]
- term: Critical length
  definition: The interconnect length beyond which reflections matter and a net must be treated as a transmission line; a common guideline sets it where the one-way delay reaches about one sixth of the signal's rise time (about 2.5 mm on FR-4-like board at 100 ps).
  chapter: "13-07"
  see_also: [Rise time]
- term: Time-domain reflectometry
  definition: (TDR.) Measuring a line's impedance profile by launching a fast step and recording the reflections at the input; the round-trip time locates each discontinuity, the reflection's height gives its impedance, and a dip's or bump's area gives a shunt capacitance or series inductance.
  chapter: "13-07"
  see_also: [Reflection coefficient]
- term: Input impedance
  definition: The impedance seen looking into a transmission line of length ℓ terminated in Z_L, Z₀(Z_L + jZ₀ tan βℓ)/(Z₀ + jZ_L tan βℓ) for a lossless line; it repeats every half wavelength and inverts (Z₀²/Z_L) at a quarter wavelength.
  chapter: "13-08"
  see_also: [Characteristic impedance, Quarter-wave transformer]
- term: Stub
  definition: A short- or open-circuited length of transmission line used as a reactance, jZ₀ tan βℓ or −jZ₀ cot βℓ; short stubs act as inductors or capacitors at microwave frequencies where lumped parts misbehave.
  chapter: "13-08"
  see_also: [Input impedance]
- term: Distortionless line
  definition: A transmission line satisfying Heaviside's condition R′/L′ = G′/C′, for which the attenuation and velocity are independent of frequency and Z₀ is real, so pulses arrive attenuated but undistorted.
  chapter: "13-08"
  see_also: [Propagation constant, Telegrapher's equations]
- term: Smith chart
  definition: The unit disc of the reflection coefficient Γ with circles of constant normalized resistance and reactance drawn on it, so that impedance transformations along lines and by series or shunt elements become rotations and moves along circles.
  chapter: "13-09"
  see_also: [Reflection coefficient, Normalized impedance]
- term: Normalized impedance
  definition: z = Z/Z₀, an impedance divided by the reference (characteristic) impedance; Γ = (z − 1)/(z + 1), and admittance is normalized as y = Y·Z₀.
  chapter: "13-09"
  see_also: [Smith chart]
- term: Impedance matching
  definition: Inserting a lossless network between a source and a load so that each sees the impedance that transfers maximum power (or minimizes reflection, or noise); exact at one frequency with two elements, over a band with more.
  chapter: "13-09"
  see_also: [L-network, Bode–Fano limit]
- term: L-network
  definition: A two-element matching network with one series and one shunt reactance; matching R_high to R_low needs Q = √(R_high/R_low − 1), X = Q·R_low and B = Q/R_high, with low-pass and high-pass forms.
  chapter: "13-09"
  see_also: [Impedance matching, Quality factor]
- term: Single-stub matching
  definition: Matching with a length of line that brings the load's admittance onto the unit-conductance circle, followed by a shunt stub that cancels the remaining susceptance; there are two solutions per half wavelength.
  chapter: "13-09"
  see_also: [Stub, Smith chart]
- term: Bode–Fano limit
  definition: The bound on matching a reactive load with any lossless network; for a parallel RC load, the integral of ln(1/|Γ|) over angular frequency cannot exceed π/(RC), so a better match is possible only over a narrower band.
  chapter: "13-09"
  see_also: [Impedance matching]
- term: Waveguide
  definition: A structure that guides electromagnetic waves, especially a hollow metal pipe, which supports only TE and TM modes above their cutoff frequencies (no TEM mode, since it has a single conductor); dielectric waveguides such as optical fibre guide by total internal reflection.
  chapter: "13-10"
  see_also: [Cutoff frequency, Optical fiber]
- term: Waveguide mode
  definition: A field pattern that propagates along a guide unchanged except for phase and attenuation; TE (transverse electric) modes have no axial E, TM modes no axial H, labelled by integers (TE₁₀, TM₁₁) counting half-wave variations across the guide.
  chapter: "13-10"
  see_also: [Waveguide]
- term: Dominant mode
  definition: The mode with the lowest cutoff frequency in a waveguide, TE₁₀ in a rectangular guide (f_c = c/2a); operating between its cutoff and the next mode's keeps the guide single-mode.
  chapter: "13-10"
  see_also: [Waveguide mode]
- term: Guide wavelength
  definition: The wavelength of a mode along a waveguide, λ_g = 2π/β = λ/√(1 − (f_c/f)²), longer than the free-space wavelength and growing without limit as the frequency approaches cutoff.
  chapter: "13-10"
  see_also: [Waveguide mode]
- term: Cavity resonator
  definition: A closed conducting box (or dielectric body) that stores electromagnetic energy in standing-wave modes at discrete resonant frequencies, with quality factors of thousands from wall loss; the microwave counterpart of an LC tank.
  chapter: "13-10"
  see_also: [Quality factor]
- term: V-number
  definition: The normalized frequency of a step-index fibre, V = (2πa/λ)·NA; the fibre is single-mode when V < 2.405, the first zero of the Bessel function J₀.
  chapter: "13-10"
  see_also: [Numerical aperture, Mode field diameter]
- term: Mode field diameter
  definition: The diameter of the (approximately Gaussian) light spot of a single-mode fibre's guided mode, larger than the core; about 9 µm at 1310 nm for standard single-mode fibre, and it sets splice and connector losses.
  chapter: "13-10"
  see_also: [V-number]
- term: Antenna
  definition: A structure that converts guided electromagnetic energy into radiated waves and back; by reciprocity its pattern, gain and impedance are the same for transmitting and receiving.
  chapter: "13-11"
  see_also: [Radiation pattern, Antenna gain]
- term: Hertzian dipole
  definition: An infinitesimal current element I·ℓ (ℓ ≪ λ), the building block of radiation; its far field varies as sin θ, it has directivity 1.5 (1.76 dBi) and radiation resistance (2π/3)η(ℓ/λ)².
  chapter: "13-11"
  see_also: [Radiation resistance]
- term: Radiation resistance
  definition: The resistance that, carrying the antenna's terminal current, would dissipate the power it radiates, R_rad = 2P_rad/|I₀|²; about 73 Ω for a half-wave dipole and well under 1 Ω for electrically small antennas.
  chapter: "13-11"
  see_also: [Hertzian dipole, Radiation efficiency]
- term: Radiation pattern
  definition: The angular distribution of an antenna's radiated power (or field) in the far field, usually normalized to its maximum and characterized by its half-power beamwidth, nulls and sidelobes.
  chapter: "13-11"
  see_also: [Directivity]
- term: Directivity
  definition: The ratio of an antenna's maximum radiation intensity to the average over all directions, D = 4πU_max/P_rad; 1.5 for a Hertzian dipole, 1.64 (2.15 dBi) for a half-wave dipole.
  chapter: "13-11"
  see_also: [Antenna gain, Radiation pattern]
- term: Radiation efficiency
  definition: The fraction of the power accepted by an antenna that it radiates, R_rad/(R_rad + R_loss); small antennas have low radiation resistance and hence often low efficiency.
  chapter: "13-11"
  see_also: [Radiation resistance, Antenna gain]
- term: Antenna gain
  definition: Directivity times radiation efficiency, G = e_r·D, usually quoted in dBi (relative to an isotropic radiator); EIRP = P_t·G_t.
  chapter: "13-11"
  see_also: [Directivity, Effective aperture]
- term: Effective aperture
  definition: The area A_e = Gλ²/(4π) from which a receiving antenna collects power, P_r = S·A_e; for a fixed gain it shrinks as λ², for a fixed physical area the gain grows as 1/λ².
  chapter: "13-11"
  see_also: [Antenna gain, Friis transmission equation]
- term: Friis transmission equation
  definition: P_r/P_t = G_t·G_r·(λ/4πR)² for antennas in each other's far field in free space; the free-space path loss is 20 log₁₀(4πR/λ) dB.
  chapter: "13-11"
  see_also: [Effective aperture, EIRP]
- term: EIRP
  definition: (Effective isotropic radiated power.) The transmitter power times the antenna gain in a given direction, P_t·G_t, the power an isotropic antenna would need to produce the same peak power density; regulators set limits in EIRP.
  chapter: "13-11"
  see_also: [Antenna gain]
- term: Array factor
  definition: The pattern of an array of identical isotropic elements, set by their spacing and relative phases; the array's pattern is the element pattern times the array factor, and a progressive phase steers the beam.
  chapter: "13-11"
  see_also: [Phased array]
- term: Far field
  definition: The region far enough from an antenna (r ≫ λ and r > 2D²/λ for an antenna of size D) that the fields fall as 1/r, are transverse to the radial direction, and have a pattern independent of distance.
  chapter: "13-11"
  see_also: [Radiation pattern]

# ---------------------------------------------------------------- 14-01
- term: Iron law of performance
  definition: Execution time equals instruction count times average cycles per instruction times clock period, T = IC × CPI / f; each factor is owned by a different part of the design (compiler and ISA, microarchitecture, circuits and process).
  chapter: "14-01"
  see_also: [CPI]
- term: CPI
  definition: (Cycles per instruction.) The average number of clock cycles per executed instruction, the frequency-weighted average of each instruction class's cycles; its reciprocal is IPC.
  chapter: "14-01"
  see_also: [IPC]
- term: IPC
  definition: (Instructions per cycle.) The reciprocal of CPI; the measure quoted for processors that complete more than one instruction per cycle.
  chapter: "14-01"
- term: Speedup
  definition: The ratio of old to new execution time for the same work; "30% faster" means a speedup of 1.3, so the new time is 77% of the old.
  chapter: "14-01"
- term: Gustafson's law
  definition: The scaled speedup σ + N(1 − σ) obtained when the problem grows with the number of processors N and σ is the serial fraction of the parallel run; it grows linearly with N, unlike Amdahl's fixed-problem speedup.
  chapter: "14-01"
  see_also: [Amdahl's law]
- term: Geometric mean
  definition: The nth root of the product of n numbers; used to summarize benchmark speed ratios because the ratio of two machines' geometric means does not depend on the reference machine.
  chapter: "14-01"
- term: Race to idle
  definition: Running a task at full speed and then power-gating the hardware, instead of running it slowly; it uses less energy when leakage or the power of the rest of the system is large.
  chapter: "14-01"
  see_also: [Dynamic voltage and frequency scaling (DVFS)]
- term: Energy-delay product
  definition: Energy per task times execution time (EDP), or times its square (ED²P); ED²P is roughly unchanged by voltage scaling, so it compares architectures independently of their operating points.
  chapter: "14-01"
- term: Throughput
  definition: The amount of work completed per unit time (tasks per second, operations per second), as distinct from latency, the time one task takes.
  chapter: "14-01"
  see_also: [Latency]
# ---------------------------------------------------------------- 14-02
- term: Microarchitecture
  definition: One implementation of an ISA — its pipeline, caches, branch predictors and execution units — which determines speed and power but not what a program computes.
  chapter: "14-02"
  see_also: [Instruction-set architecture (ISA)]
- term: Load–store architecture
  definition: An ISA in which arithmetic operates only on registers and memory is accessed only by explicit load and store instructions (RISC-V, Arm), in contrast to ISAs such as x86 whose arithmetic can read or write memory directly.
  chapter: "14-02"
- term: RISC-V
  definition: An open, royalty-free ISA maintained by RISC-V International, built as a small base integer set (RV32I, RV64I) plus optional standard extensions (M, A, F, D, C, V and others) and bundled into profiles such as RVA23.
  chapter: "14-02"
- term: Instruction format
  definition: The layout of an instruction's bits into fields (opcode, registers, function codes, immediate); RV32I has six (R, I, S, B, U, J), with the register fields in the same positions in all of them.
  chapter: "14-02"
- term: Immediate
  definition: A constant encoded inside an instruction, such as ADDI's 12-bit signed value or a branch's offset; in RISC-V every immediate is sign-extended from instruction bit 31.
  chapter: "14-02"
  see_also: [Sign extension]
- term: Compressed instructions
  definition: Shorter encodings of common instructions (RISC-V's 16-bit C extension, Arm's Thumb) that restrict operands to save code size; RISC-V reports typical whole-program savings of 25–30%.
  chapter: "14-02"
  see_also: [Code density]
- term: Condition codes
  definition: Status flags (zero, negative, carry, overflow) set as a side effect of arithmetic or compare instructions and tested by later branches, as in x86 and Arm; RISC-V has none and branches compare registers directly.
  chapter: "14-02"
- term: Code density
  definition: How few bytes an ISA needs to express a program; denser code fits better in instruction caches and small memories.
  chapter: "14-02"
  see_also: [Compressed instructions]
- term: Architecture license
  definition: A licence to design one's own processor cores that comply with a licensed ISA, as opposed to using the licensor's core designs; Arm's architecture licensees also pay a per-chip royalty.
  chapter: "14-02"
  see_also: [Core license]
- term: Core license
  definition: A licence to build a licensor's ready-made processor design into one's chips, for a licence fee plus a per-chip royalty (Arm calls it a technology licence agreement).
  chapter: "14-02"
  see_also: [Architecture license]
# ---------------------------------------------------------------- 14-03
- term: Assembler
  definition: The tool that translates assembly language, instruction by instruction, into machine code in an object file, leaving addresses it cannot know as relocations for the linker.
  chapter: "14-03"
  see_also: [Object file, Linker]
- term: Loader
  definition: The part of the operating system that maps an executable's code and data into a process's memory, sets up its stack and jumps to its entry point; on a bare microcontroller, start-up code plays this role.
  chapter: "14-03"
- term: Object file
  definition: The output of an assembler or compiler for one source file — machine code and data in sections (.text, .data, .rodata, .bss), a symbol table, and relocations — in a format such as ELF.
  chapter: "14-03"
  see_also: [Relocation]
- term: Relocation
  definition: A note in an object file saying that an instruction or data word depends on a symbol's final address; the linker computes the address and patches the field.
  chapter: "14-03"
- term: Linker relaxation
  definition: A RISC-V linker optimization that shrinks long instruction sequences once final addresses are known, such as replacing an AUIPC + JALR call with a single JAL when the target is within ±1 MiB.
  chapter: "14-03"
- term: Calling convention
  definition: The part of an ABI that fixes how functions call each other — which registers carry arguments and return values, which must be preserved across calls, and how the stack is used.
  chapter: "14-03"
  see_also: [Caller-saved register, Callee-saved register]
- term: Caller-saved register
  definition: A register a called function may overwrite freely (RISC-V t0–t6, a0–a7, ra); a caller that needs its value after a call must save it first.
  chapter: "14-03"
  see_also: [Callee-saved register]
- term: Callee-saved register
  definition: A register whose value must survive a call (RISC-V s0–s11 and sp); a function that uses one must save it on entry and restore it before returning.
  chapter: "14-03"
  see_also: [Caller-saved register]
- term: Stack frame
  definition: The block of stack memory a function reserves on entry, by moving the stack pointer down, for its saved registers, return address and local data; RISC-V frames are multiples of 16 bytes.
  chapter: "14-03"
- term: Application binary interface (ABI)
  definition: The binary-level contract that lets separately compiled code work together — calling convention, data type sizes and alignment, structure layout and object-file conventions; RISC-V's are ILP32 and LP64 families.
  chapter: "14-03"
  see_also: [Calling convention]
- term: Pseudo-instruction
  definition: An assembler mnemonic that expands into one or more real instructions, such as li, mv, j, ret and call in RISC-V.
  chapter: "14-03"
- term: Structure padding
  definition: Unused bytes a compiler inserts between or after structure members so that each member sits at a multiple of its alignment; member order changes how much padding is needed.
  chapter: "14-03"
# ---------------------------------------------------------------- 14-04
- term: Wraparound
  definition: The behaviour of fixed-width integer arithmetic, which keeps only the low n bits of a result, so that results wrap modulo 2^n (the largest 32-bit value plus 1 becomes the smallest).
  chapter: "14-04"
- term: Multiply-high
  definition: An instruction that returns the upper half of a double-width product (RISC-V MULH, MULHU, MULHSU); used for full-width products and for dividing by constants.
  chapter: "14-04"
- term: Unit in the last place (ulp)
  definition: The gap between a floating-point number and the next representable number of the same binade; for FP32 values in [1, 2) it is 2⁻²³.
  chapter: "14-04"
  see_also: [Unit roundoff]
- term: Round to nearest, ties to even
  definition: IEEE 754's default rounding rule — round to the nearer representable number, and on an exact tie to the one whose last bit is 0 — which avoids the systematic drift of always rounding halves up (banker's rounding).
  chapter: "14-04"
- term: Guard, round and sticky bits
  definition: The three bits a floating-point adder keeps below the significand when aligning operands — the first two shifted-out bits plus an OR of all the rest — which suffice for correct rounding.
  chapter: "14-04"
- term: Fused multiply-add (FMA)
  definition: An operation that computes a × b + c with a single rounding, more accurate than a separate multiply and add and the building block of dot products.
  chapter: "14-04"
- term: Pairwise summation
  definition: Adding numbers in a balanced binary tree, so that each value passes through about log₂ n roundings instead of up to n; the shape of parallel reductions.
  chapter: "14-04"
  see_also: [Kahan summation]
- term: Kahan summation
  definition: Compensated summation that carries each addition's rounding error forward in a correction variable, giving an error bound independent of the number of terms at four operations per element.
  chapter: "14-04"
  see_also: [Pairwise summation]
- term: Quantization (neural networks)
  definition: Representing a model's weights or activations in a narrow format (INT8, FP8, FP4) with scale factors, x ≈ s(q − z), to cut memory, bandwidth and arithmetic cost at some loss of accuracy.
  chapter: "14-04"
  see_also: [Block floating point, Requantization]
- term: Requantization
  definition: Converting a wide integer accumulator result back to a narrow format by multiplying by the combined scale factors (usually a fixed-point multiply and shift) and rounding.
  chapter: "14-04"
# ---------------------------------------------------------------- 14-05
- term: Datapath
  definition: The part of a processor that holds and transforms data — program counter, memories, register file, ALU, adders and multiplexers — steered by the control unit.
  chapter: "14-05"
  see_also: [Control unit]
- term: Control unit
  definition: The combinational (or sequential) logic that decodes each instruction and sets the datapath's multiplexer selects and write enables; in RISC-V, a main decoder on the opcode plus an ALU decoder.
  chapter: "14-05"
  see_also: [Main decoder, Datapath]
- term: Program counter (PC)
  definition: The register holding the address of the instruction being executed; it advances by 4 or is loaded with a branch or jump target each instruction.
  chapter: "14-05"
- term: Harvard architecture
  definition: An organization with separate instruction and data memories (or caches), so that an instruction can be fetched in the same cycle as a data access.
  chapter: "14-05"
- term: Immediate generator
  definition: The datapath block that reassembles an instruction's scattered immediate bits for its format and sign-extends them to 32 bits.
  chapter: "14-05"
- term: Main decoder
  definition: The part of the control unit that maps the 7-bit opcode to the datapath's control signals (register write, multiplexer selects, memory write, branch, jump).
  chapter: "14-05"
  see_also: [Control unit]
- term: Single-cycle processor
  definition: A processor that completes every instruction in one clock cycle (CPI = 1), so its clock period is set by the slowest instruction, typically a load.
  chapter: "14-05"
  see_also: [Multi-cycle processor]
- term: Multi-cycle processor
  definition: A processor that breaks each instruction into short steps of one clock cycle each, letting instructions take different numbers of cycles and reusing one ALU and memory across steps.
  chapter: "14-05"
  see_also: [Single-cycle processor]
- term: Reference model
  definition: An executable model of the ISA that runs one instruction at a time, used to check a processor design by comparing their results instruction by instruction.
  chapter: "14-05"
# ---------------------------------------------------------------- 14-06
- term: Pipeline register
  definition: The register between two pipeline stages that holds an instruction's data and control signals from one clock edge to the next; its clock-to-Q and setup time are the pipeline's per-stage overhead.
  chapter: "14-06"
  see_also: [Pipelining]
- term: Pipeline hazard
  definition: A situation in which the next instruction cannot execute in the following cycle without giving a wrong result — a data, control or structural hazard — resolved by forwarding, stalling or flushing (distinct from a logic hazard, a glitch).
  chapter: "14-06"
  see_also: [Data hazard, Control hazard, Structural hazard]
- term: Data hazard
  definition: A pipeline hazard in which an instruction needs a result that an earlier instruction has not yet written back (a read-after-write dependence).
  chapter: "14-06"
  see_also: [Forwarding (bypassing), Load-use hazard]
- term: Forwarding (bypassing)
  definition: Routing a result from a later pipeline register (EX/MEM or MEM/WB) directly to the inputs of an instruction that needs it, instead of waiting for it to be written to the register file.
  chapter: "14-06"
- term: Load-use hazard
  definition: A data hazard in which an instruction uses the result of the load just before it; the data arrives too late even for forwarding, so the pipeline stalls one cycle unless the compiler schedules an independent instruction in between.
  chapter: "14-06"
- term: Stall
  definition: Holding an instruction (and those behind it) in its pipeline stage for a cycle while a bubble moves ahead, to wait out a hazard.
  chapter: "14-06"
  see_also: [Bubble]
- term: Bubble
  definition: An empty slot (a no-op) inserted into a pipeline stage by a stall or a flush; it moves through the pipeline doing nothing.
  chapter: "14-06"
- term: Control hazard
  definition: A pipeline hazard caused by a branch or jump whose outcome or target is not known when the next instructions must be fetched.
  chapter: "14-06"
  see_also: [Flush, Branch penalty]
- term: Flush
  definition: Discarding instructions fetched down a wrong path (after a taken branch, under predict-not-taken) by turning them into bubbles before they change any state.
  chapter: "14-06"
- term: Branch penalty
  definition: The cycles lost each time a branch or jump redirects fetch away from the predicted path; two cycles in the five-stage pipeline that resolves branches in EX.
  chapter: "14-06"
- term: Structural hazard
  definition: A pipeline hazard in which two instructions need the same hardware resource (a memory port, a register-file port, an unpipelined unit) in the same cycle.
  chapter: "14-06"
# ---------------------------------------------------------------- 14-07
- term: Branch prediction
  definition: Guessing a branch's direction and target when it is fetched, so that the pipeline keeps fetching down the predicted path; a wrong guess costs a flush of the work done since.
  chapter: "14-07"
  see_also: [Speculative execution]
- term: Branch history table (BHT)
  definition: An untagged table of 1-bit flags or 2-bit counters, indexed by low bits of the branch address, that records how branches behaved recently and predicts their direction.
  chapter: "14-07"
- term: Two-bit saturating counter
  definition: A predictor entry with four states, predicting taken in the upper two; it needs two consecutive wrong outcomes to change its prediction, so a loop branch is mispredicted only at the exit.
  chapter: "14-07"
- term: Global history
  definition: A shift register of the outcomes of the most recent conditional branches, used by correlating predictors such as gshare to give the same branch different predictions in different contexts.
  chapter: "14-07"
- term: gshare
  definition: A correlating branch predictor that indexes a table of 2-bit counters by the XOR of the branch address and the global history.
  chapter: "14-07"
  see_also: [Global history]
- term: Branch target buffer (BTB)
  definition: A tagged cache, looked up with the fetch address, that identifies control-transfer instructions before decode and supplies their last target so that fetch can redirect in the next cycle.
  chapter: "14-07"
- term: Return-address stack (RAS)
  definition: A small hardware stack that pushes the return address at each call and pops it to predict each return's target, which a BTB alone predicts poorly.
  chapter: "14-07"
- term: Aliasing (predictor)
  definition: Two branches sharing a predictor entry because their indexes coincide; usually destructive when their behaviour differs.
  chapter: "14-07"
- term: Speculative execution
  definition: Executing instructions beyond an unresolved branch (or other prediction) before it is known that they should run, discarding their results without trace in architectural state if the prediction was wrong.
  chapter: "14-07"
  see_also: [Branch prediction, Spectre]
- term: Spectre
  definition: A family of attacks, disclosed in January 2018, that use speculatively executed instructions to leave secret-dependent traces in caches and other microarchitectural state, read back by timing (CVE-2017-5753 and CVE-2017-5715).
  chapter: "14-07"
  see_also: [Side channel, Speculative execution]
- term: Instruction-level parallelism (ILP)
  definition: The parallelism among the instructions of a single sequential program, the number that could execute at once if only true dependences constrained them; superscalar and out-of-order hardware extract it without help from the programmer.
  chapter: "14-08"
  see_also: [Dataflow limit, Superscalar]
- term: Superscalar
  definition: A processor that fetches, decodes, issues and retires more than one instruction per cycle; its width is the maximum per cycle.
  chapter: "14-08"
  see_also: [Out-of-order execution]
- term: Out-of-order execution
  definition: Executing instructions in the order their operands become ready rather than in program order, within a window of upcoming instructions, while retiring them in program order so that software sees sequential behaviour.
  chapter: "14-08"
  see_also: [Reorder buffer (ROB), Register renaming]
- term: True dependence
  definition: A read-after-write (RAW) dependence, in which a later instruction needs the value an earlier one produces; it carries data and cannot be removed, only waited for.
  chapter: "14-08"
  see_also: [Name dependence, Data hazard]
- term: Name dependence
  definition: A write-after-read (WAR, anti-) or write-after-write (WAW, output) dependence, which exists only because two values share a register name and is removed by register renaming.
  chapter: "14-08"
  see_also: [True dependence, Register renaming]
- term: Register renaming
  definition: Mapping each architectural register written by an instruction to a new physical register from a free list, recorded in a register alias (map) table, so that only true dependences remain between instructions.
  chapter: "14-08"
  see_also: [Name dependence, Out-of-order execution]
- term: Reorder buffer (ROB)
  definition: A queue holding every in-flight instruction in program order; instructions finish in any order but retire from its head in order, which makes speculation and exceptions precise. Its size bounds the instruction window.
  chapter: "14-08"
  see_also: [Precise exception, Out-of-order execution]
- term: Reservation station
  definition: An issue-queue entry, introduced in Tomasulo's algorithm, where a dispatched instruction waits for its source operands and from which it issues to an execution unit once they are ready.
  chapter: "14-08"
  see_also: [Out-of-order execution]
- term: Precise exception
  definition: An exception taken so that the architectural state is exactly as if every instruction before the faulting one had completed and none after it had started, which lets the operating system handle it and resume the program.
  chapter: "14-08"
  see_also: [Reorder buffer (ROB)]
- term: Dataflow limit
  definition: The execution time with unlimited resources and perfect prediction, set by the longest latency-weighted chain of true dependences (the critical path); no machine can be faster.
  chapter: "14-08"
  see_also: [Instruction-level parallelism (ILP), True dependence]
- term: Little's law
  definition: For any stable queueing system, average occupancy = throughput × average time in the system; it sizes a processor's window (about width × latency to hide) and the outstanding requests a memory system needs.
  chapter: "14-08"
- term: Locality
  definition: The tendency of programs to reuse data and instructions they accessed recently (temporal locality) and to access addresses near recent ones (spatial locality); the property every cache relies on.
  chapter: "14-09"
  see_also: [Cache block]
- term: Cache block
  definition: The unit of data a cache stores and moves, also called a line, typically 32 to 128 bytes; a miss brings in the whole block containing the requested address.
  chapter: "14-09"
  see_also: [Locality, Tag (cache)]
- term: Direct-mapped cache
  definition: A cache in which each memory block can be placed in exactly one line, chosen by the index bits of its address; simple and fast but prone to conflict misses.
  chapter: "14-09"
  see_also: [Set-associative cache]
- term: Set-associative cache
  definition: A cache divided into sets of A lines (ways); a block may be placed in any way of the one set its index selects, and a replacement policy picks the victim within the set.
  chapter: "14-09"
  see_also: [Direct-mapped cache, Fully associative cache]
- term: Fully associative cache
  definition: A cache with a single set, in which any block may occupy any line; it has no conflict misses but needs a tag comparator per line.
  chapter: "14-09"
  see_also: [Set-associative cache]
- term: Tag (cache)
  definition: The high-order address bits stored with each cache line, compared on a lookup to tell which of the memory blocks that map to the set is present.
  chapter: "14-09"
  see_also: [Cache block]
- term: Average memory access time (AMAT)
  definition: Hit time plus miss rate times miss penalty, nested for each level of the hierarchy; the average latency a memory access sees.
  chapter: "14-09"
  see_also: [Miss rate]
- term: Miss rate
  definition: The fraction of accesses to a cache that miss. The local miss rate counts only the accesses that reach a level; the global miss rate counts all accesses issued by the core.
  chapter: "14-09"
  see_also: [Average memory access time (AMAT)]
- term: Three Cs (compulsory, capacity, conflict)
  definition: A classification of cache misses into compulsory (first access to a block), capacity (the working set exceeds the cache, so a fully associative cache of the same size also misses) and conflict (too many blocks map to one set).
  chapter: "14-09"
  see_also: [Miss rate]
- term: Least recently used (LRU)
  definition: A replacement policy that evicts the block in the set that has gone longest without being accessed; real caches often approximate it (pseudo-LRU).
  chapter: "14-09"
  see_also: [Set-associative cache]
- term: Write-back
  definition: A write policy in which a store updates only the cache and marks the line dirty; the block is written to the next level once, when it is evicted.
  chapter: "14-09"
  see_also: [Write-through, Write-allocate]
- term: Write-through
  definition: A write policy in which every store updates both the cache and the next level, usually through a write buffer, so lines are never dirty.
  chapter: "14-09"
  see_also: [Write-back]
- term: Write-allocate
  definition: A policy for store misses that first fetches the block into the cache and then writes it; its opposite, no-write-allocate, sends the store to the next level without fetching.
  chapter: "14-09"
  see_also: [Write-back]
- term: Prefetching
  definition: Fetching blocks into a cache before they are requested, by hardware that predicts the access pattern (next-line, stride) or by software hints; judged by coverage, accuracy and timeliness.
  chapter: "14-09"
  see_also: [Memory-level parallelism (MLP)]
- term: Memory-level parallelism (MLP)
  definition: The number of cache misses outstanding at once; by Little's law, delivered bandwidth equals outstanding misses times block size divided by latency.
  chapter: "14-09"
  see_also: [Little's law, Prefetching]
- term: Loop tiling
  definition: Restructuring loops to work on blocks (tiles) of data small enough to stay in a cache while they are reused, also called blocking; the key optimization of dense linear algebra.
  chapter: "14-09"
  see_also: [Locality]
- term: High Bandwidth Memory (HBM)
  definition: DRAM built as a stack of dies joined by through-silicon vias and connected to a processor over a very wide interface on a silicon interposer (1024 bits per stack in HBM3, 2048 in HBM4), giving bandwidths of about 1–2 TB/s per stack.
  chapter: "14-09"
- term: Virtual memory
  definition: The mechanism, shared by hardware and operating system, that gives each process its own address space by translating virtual addresses to physical ones page by page, providing isolation, protection, relocation and demand paging.
  chapter: "14-10"
  see_also: [Page table, Translation lookaside buffer (TLB)]
- term: Page (memory)
  definition: The fixed-size unit (typically 4 KiB) in which virtual memory maps addresses; a virtual page number is translated to a physical page (frame) number while the page offset passes through unchanged.
  chapter: "14-10"
  see_also: [Virtual memory, Huge page]
- term: Page table
  definition: The per-process data structure, usually a multilevel radix tree, that maps virtual page numbers to physical page numbers and permissions; the hardware walks it on a TLB miss.
  chapter: "14-10"
  see_also: [Page-table entry (PTE), Translation lookaside buffer (TLB)]
- term: Page-table entry (PTE)
  definition: One entry of a page table, holding a physical page number and flag bits (valid, read, write, execute, user, global, accessed, dirty); a PTE with no read, write or execute permission points to the next level.
  chapter: "14-10"
  see_also: [Page table]
- term: Translation lookaside buffer (TLB)
  definition: A small cache of recent virtual-to-physical page translations and their permissions, consulted on every memory access; a miss triggers a page-table walk.
  chapter: "14-10"
  see_also: [TLB reach, Page table]
- term: TLB reach
  definition: The amount of memory a TLB can map without missing, equal to its number of entries times the page size.
  chapter: "14-10"
  see_also: [Huge page]
- term: Huge page
  definition: A page much larger than the base page (such as RISC-V's 4 MiB Sv32 megapages or 2 MiB and 1 GiB Sv39 superpages), mapped by a leaf entry at a higher page-table level to increase TLB reach.
  chapter: "14-10"
  see_also: [TLB reach]
- term: Page fault
  definition: The exception raised when a translation finds no valid mapping or a forbidden access; the operating system's handler may fix the cause (demand paging, copy-on-write) and re-execute the instruction.
  chapter: "14-10"
  see_also: [Demand paging, Trap (processor)]
- term: Demand paging
  definition: Mapping a page only when it is first accessed, by servicing the resulting page fault, so that memory is allocated or loaded lazily.
  chapter: "14-10"
  see_also: [Page fault, Thrashing]
- term: Thrashing
  definition: The collapse in performance when a program's working set exceeds the available physical frames, so that nearly every access causes a page fault.
  chapter: "14-10"
  see_also: [Demand paging]
- term: Trap (processor)
  definition: A transfer of control to a more privileged handler caused by an exception, a system call (ecall) or an interrupt; the hardware saves the PC and cause, and an xRET instruction returns.
  chapter: "14-10"
  see_also: [Precise exception, Privilege mode, Page fault]
- term: Privilege mode
  definition: The level of authority at which code runs (RISC-V machine, supervisor and user modes), determining which instructions, registers and pages it may use.
  chapter: "14-10"
  see_also: [Trap (processor)]
- term: Virtually indexed, physically tagged (VIPT) cache
  definition: A cache whose set index comes from untranslated page-offset bits, so it can be read in parallel with the TLB lookup and then compared against the physical tag; it requires size divided by associativity to be at most the page size.
  chapter: "14-10"
  see_also: [Translation lookaside buffer (TLB), Set-associative cache]
- term: Polling
  definition: Checking a device's status register repeatedly in software to learn whether it needs service; simple and fast to respond, but every unproductive check wastes CPU time.
  chapter: "14-11"
  see_also: [Interrupt]
- term: Interrupt
  definition: An asynchronous signal from a device or timer that makes the processor trap to a handler between instructions, so software need not poll; each one costs a fixed overhead for the trap and the handler.
  chapter: "14-11"
  see_also: [Polling, Interrupt coalescing, Trap (processor)]
- term: Interrupt coalescing
  definition: Raising one interrupt for several device events, after a count or a timeout, to cut the CPU cost of interrupts at high event rates at the price of added latency.
  chapter: "14-11"
  see_also: [Interrupt]
- term: Direct memory access (DMA)
  definition: Data transfer between a device and memory performed by a DMA engine acting as a bus manager, following descriptors set up by software and interrupting on completion, so the CPU need not move the data itself.
  chapter: "14-11"
  see_also: [Interrupt]
- term: Valid/ready handshake
  definition: "The flow-control rule of AXI and similar interfaces: the sender asserts VALID with the data, the receiver asserts READY when it can accept, and a transfer happens on each clock edge where both are high; a sender may not wait for READY before asserting VALID."
  chapter: "14-11"
  see_also: [AXI]
- term: AXI
  definition: Arm's AMBA Advanced eXtensible Interface, a royalty-free on-chip bus protocol with five independent valid/ready channels (write address, write data, write response, read address, read data), bursts and multiple outstanding transactions; AXI-Lite is its simple register-access subset.
  chapter: "14-11"
  see_also: [Valid/ready handshake]
- term: Network-on-chip (NoC)
  definition: An on-chip interconnect of routers and point-to-point links, often a 2D mesh, that carries packets between cores, caches, memory controllers and accelerators, scaling better than a shared bus or a crossbar.
  chapter: "14-11"
  see_also: [Bisection bandwidth]
- term: Bisection bandwidth
  definition: The total bandwidth of the links crossing the narrowest cut that divides a network into two equal halves; for a k × k mesh it is k links in each direction.
  chapter: "14-11"
  see_also: [Network-on-chip (NoC)]
- term: PCI Express (PCIe)
  definition: The serial, packet-based expansion interconnect of PCs and servers, built from lanes of differential pairs; each generation has roughly doubled the per-lane rate, from 2.5 GT/s in 1.0 to 128 GT/s in 7.0.
  chapter: "14-11"
  see_also: [Lane (serial link), Compute Express Link (CXL)]
- term: Lane (serial link)
  definition: One pair of differential signal pairs (transmit and receive) of a serial link such as PCIe; links bundle 1 to 16 lanes, and bandwidth scales with the lane count.
  chapter: "14-11"
  see_also: [PCI Express (PCIe)]
- term: Compute Express Link (CXL)
  definition: An interconnect standard that runs on the PCIe physical layer and adds cache-coherent protocols for accelerators and attached memory, enabling memory expansion and pooling; CXL 4.0 (Nov 2025) runs at 128 GT/s.
  chapter: "14-11"
  see_also: [PCI Express (PCIe)]
- term: Cache coherence
  definition: The guarantee that all cores see a single, consistent sequence of values for each memory location despite private caches, maintained by a protocol enforcing the single-writer/multiple-reader and data-value invariants.
  chapter: "14-12"
  see_also: [MESI protocol, Memory consistency model]
- term: MESI protocol
  definition: A write-invalidate cache-coherence protocol whose block states are Modified, Exclusive, Shared and Invalid; the Exclusive state lets a core write data no other core holds without a bus transaction.
  chapter: "14-12"
  see_also: [Cache coherence, Snooping]
- term: Snooping
  definition: Cache coherence by broadcast, in which every cache observes all requests on a shared bus or broadcast network and updates or supplies its copies accordingly; simple and fast, but limited in scalability.
  chapter: "14-12"
  see_also: [Directory protocol]
- term: Directory protocol
  definition: Cache coherence in which a directory at each block's home node records which caches hold the block, so requests and invalidations go only to those caches; scales to many cores at the cost of directory storage and extra hops.
  chapter: "14-12"
  see_also: [Snooping]
- term: Coherence miss
  definition: A cache miss on a block the core held earlier but lost to another core's invalidation; the fourth C beside compulsory, capacity and conflict misses.
  chapter: "14-12"
  see_also: [False sharing, "Three Cs (compulsory, capacity, conflict)"]
- term: False sharing
  definition: Coherence misses caused by different cores writing different data that happen to share a cache block, so the block moves between caches although no variable is shared; fixed by padding or aligning data to blocks.
  chapter: "14-12"
  see_also: [Coherence miss]
- term: Memory consistency model
  definition: The part of an ISA's contract that specifies the order in which a core's loads and stores to different addresses may appear to other cores, such as sequential consistency, TSO or RISC-V's RVWMO.
  chapter: "14-12"
  see_also: [Sequential consistency, Total store ordering (TSO), Fence]
- term: Sequential consistency
  definition: The memory model (Lamport, 1979) in which every execution behaves as if all cores' operations occurred in one global order that respects each core's program order.
  chapter: "14-12"
  see_also: [Memory consistency model]
- term: Total store ordering (TSO)
  definition: A memory model, like that of x86, in which each core's stores pass through a FIFO store buffer, so a later load may overtake an earlier store to a different address while stores stay in order.
  chapter: "14-12"
  see_also: [Store buffer, Memory consistency model]
- term: Store buffer
  definition: A queue that holds a core's retired stores until they are written to the cache, letting the core continue; its contents are visible to the core's own loads but not yet to other cores.
  chapter: "14-12"
  see_also: [Total store ordering (TSO)]
- term: Fence
  definition: An instruction that orders memory operations, preventing specified earlier accesses from being reordered after specified later ones (for example RISC-V FENCE, x86 MFENCE).
  chapter: "14-12"
  see_also: [Memory consistency model]
- term: Litmus test
  definition: A tiny multithreaded program, such as store buffering or message passing, whose allowed final outcomes characterize a memory consistency model.
  chapter: "14-12"
  see_also: [Memory consistency model]
- term: Load-reserved/store-conditional (LR/SC)
  definition: "A pair of atomic instructions: LR loads a word and registers a reservation, and SC stores only if the reservation is still valid, reporting success or failure, so that a short retry loop implements any atomic update."
  chapter: "14-12"
  see_also: [Spin lock]
- term: Spin lock
  definition: A lock acquired by repeatedly attempting an atomic operation until it succeeds; spinning on ordinary reads first (test-and-test-and-set) avoids flooding the interconnect with coherence traffic.
  chapter: "14-12"
  see_also: [Load-reserved/store-conditional (LR/SC)]
- term: Graphics processing unit (GPU)
  definition: A throughput-oriented processor with many simple cores grouped into streaming multiprocessors, which hides memory latency by running tens of thousands of threads; used for graphics, scientific computing and AI.
  chapter: "14-13"
  see_also: [SIMT, Streaming multiprocessor (SM)]
- term: SIMT
  definition: Single instruction, multiple threads; the GPU execution model in which scalar per-thread programs are grouped into warps that share one instruction stream, with an active mask handling divergence.
  chapter: "14-13"
  see_also: [Warp, Branch divergence]
- term: Warp
  definition: A group of 32 threads (on NVIDIA GPUs) that execute in lockstep, sharing one program counter and issuing one instruction for all their lanes at a time.
  chapter: "14-13"
  see_also: [SIMT]
- term: Streaming multiprocessor (SM)
  definition: The repeated core of an NVIDIA GPU, containing warp schedulers, arithmetic lanes, tensor cores, a large register file and shared memory; H100 has 132.
  chapter: "14-13"
  see_also: [Graphics processing unit (GPU), Occupancy]
- term: Kernel (GPU)
  definition: A function launched on a GPU over a grid of thread blocks, each thread running the same code on its own data.
  chapter: "14-13"
  see_also: [SIMT]
- term: Branch divergence
  definition: Threads of one warp taking different paths at a branch, which forces the warp to execute each path in turn with the other lanes masked off and lowers SIMD efficiency.
  chapter: "14-13"
  see_also: [Warp]
- term: Memory coalescing
  definition: The combining of a warp's memory accesses into as few sectors or cache lines as possible, achieved when consecutive threads access consecutive addresses.
  chapter: "14-13"
  see_also: [Warp]
- term: Shared memory (GPU)
  definition: A software-managed on-chip scratchpad in each SM, shared by the threads of a block and divided into banks, used to stage data for reuse.
  chapter: "14-13"
  see_also: [Bank conflict]
- term: Bank conflict
  definition: Several lanes of a warp accessing different words in the same shared-memory bank, which serializes the access; for a word stride s with 32 banks, the conflict degree is gcd(s, 32).
  chapter: "14-13"
  see_also: [Shared memory (GPU)]
- term: Occupancy
  definition: The number of warps resident on an SM as a fraction of the maximum, limited by registers, shared memory and block slots; it determines how much memory latency the SM can hide.
  chapter: "14-13"
  see_also: [Streaming multiprocessor (SM)]
- term: Tensor core
  definition: A GPU execution unit that performs a small matrix multiply-accumulate per instruction in low-precision formats, giving an order of magnitude more throughput than ordinary arithmetic lanes on matrix math.
  chapter: "14-13"
  see_also: [Structured sparsity]
- term: Structured sparsity
  definition: A pruning pattern (such as 2:4, two zeros in every four weights) that tensor cores can exploit to skip zeros, doubling peak throughput; vendors' headline figures often assume it.
  chapter: "14-13"
  see_also: [Tensor core]
- term: Domain-specific accelerator
  definition: A processor specialized for one class of workloads, such as neural networks, trading generality for much higher throughput and efficiency through dedicated datapaths, local memories and narrow number formats.
  chapter: "14-14"
  see_also: [Systolic array]
- term: Systolic array
  definition: A grid of simple processing elements that pass operands to their neighbours each cycle, so that every value fetched at the edge is reused by a whole row or column; used for matrix multiplication in accelerators.
  chapter: "14-14"
  see_also: [Processing element (PE), Dataflow (accelerator)]
- term: Processing element (PE)
  definition: One cell of an accelerator array, typically a multiply-accumulate unit with a few registers, connected to its neighbours.
  chapter: "14-14"
  see_also: [Systolic array, Multiply-accumulate (MAC)]
- term: Dataflow (accelerator)
  definition: The choice of which operand an accelerator array keeps in place while the others move (weights, outputs or inputs), which determines the data reuse the hardware exploits.
  chapter: "14-14"
  see_also: [Weight-stationary, Output-stationary]
- term: Weight-stationary
  definition: A dataflow in which each processing element holds a weight while inputs stream past and partial sums move on, so each weight fetched is reused across a whole batch.
  chapter: "14-14"
  see_also: [Dataflow (accelerator)]
- term: Output-stationary
  definition: A dataflow in which each processing element holds one output's accumulator while inputs and weights stream past, suiting long accumulations.
  chapter: "14-14"
  see_also: [Dataflow (accelerator)]
- term: Ridge point
  definition: The arithmetic intensity (FLOP per byte) at which a machine's peak compute equals its memory bandwidth times the intensity; below it a workload is memory-bound, above it compute-bound.
  chapter: "14-14"
  see_also: [Arithmetic intensity]
- term: Roofline model
  definition: A performance bound that plots attainable throughput against arithmetic intensity as the lesser of peak compute and memory bandwidth times intensity, showing at a glance whether a kernel is compute- or memory-bound.
  chapter: "14-15"
  see_also: [Arithmetic intensity, Ridge point]
- term: Benchmark
  definition: A fixed workload with rules for how it is run and reported, used to compare systems; its rules (fixed code, accuracy targets, mandatory baselines) are what make results comparable.
  chapter: "14-15"
  see_also: [SPEC CPU, MLPerf]
- term: SPEC CPU
  definition: The Standard Performance Evaluation Corporation's processor benchmark suites (SPECspeed and SPECrate, integer and floating point), scored as the geometric mean of reference-time ratios, with mandatory base and optional peak results; SPEC CPU 2026 replaced SPEC CPU 2017 in 2026.
  chapter: "14-15"
  see_also: [Benchmark, Geometric mean]
- term: MLPerf
  definition: MLCommons' machine-learning training and inference benchmarks, with a Closed division (reference models, comparable systems) and an Open division, and inference scenarios from single-stream latency to offline throughput.
  chapter: "14-15"
  see_also: [Benchmark]

# ---------------------------------------------------------------- 15-01
- term: Plant
  definition: In control engineering, the system being controlled (a motor, a heater, a converter, a chip's thermal path), described by a model of how its outputs respond to its inputs.
  chapter: "15-01"
  see_also: [State-space model]
- term: Force–current analogy
  definition: The mapping of a mechanical system onto a circuit with force ↔ current and velocity ↔ voltage (mass ↔ C to ground, damping ↔ conductance, stiffness ↔ 1/L); elements sharing a velocity become parallel elements, so the circuit keeps the mechanism's topology.
  chapter: "15-01"
  see_also: [Force–voltage analogy]
- term: Torque constant
  definition: The ratio K_t of a DC motor's torque to its current (N·m/A); by energy conservation it equals the back-EMF constant K_e (V·s/rad) in SI units.
  chapter: "15-01"
  see_also: [Back-EMF]
- term: Mechanical time constant
  definition: The time constant RJ/(RB + K²) of a DC motor's speed response when its inductance is neglected; the back-EMF term K²/R usually dominates the damping.
  chapter: "15-01"
- term: Model reduction
  definition: Simplifying a model by dropping states whose dynamics are much faster (or much less important) than those of interest, such as a motor's electrical time constant beside its mechanical one.
  chapter: "15-01"
- term: Thermal capacitance
  definition: The heat a body stores per kelvin of temperature rise, C_th = mc (J/K); the thermal analogue of a capacitor to ground.
  chapter: "15-01"
  see_also: [Thermal resistance]
- term: Junction temperature
  definition: The temperature of a chip's active devices (T_J), the quantity reliability and performance limits are set on; it exceeds the case and ambient temperatures by the heat flow times the thermal resistances in between.
  chapter: "15-01"


# ---------------------------------------------------------------- 15-02
- term: Relative degree
  definition: The number of poles minus the number of zeros of a transfer function, n − m; the gain falls as 1/ωⁿ⁻ᵐ at high frequency, and physical systems have relative degree of at least 1.
  chapter: "15-02"
  see_also: [Transfer function, Poles and zeros]
- term: Block diagram
  definition: A drawing of a system as blocks (transfer functions) joined by signal arrows, summing junctions and pickoff points; series blocks multiply, parallel blocks add, and a feedback loop reduces to G/(1 + GH).
  chapter: "15-02"
  see_also: [Signal-flow graph, Loop gain]
- term: Sensitivity function
  definition: S(s) = 1/(1 + L(s)), the transfer function from reference to error in a unity-feedback loop; it scales how much of a disturbance reaches the output and how strongly plant variations affect the closed loop. Small |S| means good tracking and rejection.
  chapter: "15-02"
  see_also: [Complementary sensitivity, Desensitivity factor]
- term: Complementary sensitivity
  definition: T(s) = L(s)/(1 + L(s)), the closed-loop transfer function from reference to output (and, with a minus sign, from sensor noise to output); S + T = 1 at every frequency, so a loop cannot make both small at once.
  chapter: "15-02"
  see_also: [Sensitivity function]
- term: Signal-flow graph
  definition: A graph whose nodes are signals and whose directed branches carry gains; each node equals the sum of its incoming branch gains times their source nodes. It is the input form for Mason's gain formula.
  chapter: "15-02"
  see_also: [Mason's gain formula, Block diagram]
- term: Mason's gain formula
  definition: T = Σ PₖΔₖ / Δ, the transfer function of a signal-flow graph, where Pₖ are the forward-path gains, Δ = 1 − Σ loops + Σ products of non-touching pairs − Σ non-touching triples + …, and Δₖ is Δ computed from the loops that do not touch path k.
  chapter: "15-02"
  see_also: [Signal-flow graph]
- term: Pole–zero cancellation
  definition: A zero that coincides with a pole, removing that mode from one transfer function; the mode still exists inside the system, so cancelling an unstable pole leaves a hidden instability that disturbances or initial conditions excite.
  chapter: "15-02"
  see_also: [Poles and zeros]
