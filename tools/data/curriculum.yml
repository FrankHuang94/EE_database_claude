  - id: "18"
    slug: embedded-systems-and-microcontrollers
    title: Embedded Systems and Microcontrollers
    term: 5
    review_hours: 5
    overview: >-
      Building products around microcontrollers: MCU architecture (Arm Cortex-M, RISC-V),
      bare-metal C, interrupts, timers and DMA, serial buses and analog interfaces, RTOS
      concepts, boot and firmware update, ultra-low-power design, sensors and hardware security.
    equivalents:
      - "Embedded Systems / Microcontrollers (junior/senior)"
      - "Berkeley EECS149; UT Austin EE319K"
    textbooks:
      - "Valvano, *Embedded Systems* series (Cortex-M)"
      - "Yiu, *The Definitive Guide to Arm Cortex-M3 and Cortex-M4 Processors*"
      - "White, *Making Embedded Systems*"
      - "Lee & Seshia, *Introduction to Embedded Systems* (free online)"
    free_courses:
      - "Berkeley EECS149 (Lee & Seshia materials)"
      - "UT Austin 'Embedded Systems — Shape the World' (edX)"
    prerequisites: ["05", "08", "10", "14"]
    fe: [computer_systems, digital_systems, software_engineering]
    objectives:
      - Describe MCU architectures (core, bus matrix, memory map, peripherals) and choose an MCU for a requirement.
      - Write bare-metal C that configures peripherals through registers, with correct use of volatile and interrupts.
      - Use timers, DMA and serial buses (UART, SPI, I²C) and analog interfaces (ADC, DAC, PWM).
      - Explain RTOS scheduling, synchronization and priority inversion.
      - Compute power budgets and battery life for duty-cycled sensor nodes.
      - Explain secure boot, roots of trust, TEEs and side-channel threats.
    chapters:
      - {id: "18-01", slug: microcontroller-architecture, title: "Microcontroller Architecture", hours: 7, topics: "Cortex-M and RISC-V MCU cores, memory map, buses, flash/SRAM, clocks and resets, MCU selection"}
      - {id: "18-02", slug: bare-metal-c-and-toolchain, title: "Bare-Metal C and the Build Toolchain", hours: 8, topics: "Startup code, vector table, linker scripts, volatile, register access, HALs vs bare metal"}
      - {id: "18-03", slug: interrupts-exceptions-timers, title: "Interrupts, Exceptions and Timers", hours: 8, topics: "NVIC, priorities, latency, ISR design, timers, capture/compare, PWM generation, watchdogs"}
      - {id: "18-04", slug: dma-and-data-movement, title: "DMA and Data Movement", hours: 5, topics: "DMA controllers, double buffering, peripheral-to-memory streaming, bus contention"}
      - {id: "18-05", slug: gpio-uart-spi-i2c, title: "Peripherals and Serial Buses: GPIO, UART, SPI, I²C", hours: 8, topics: "GPIO electrical characteristics, UART framing, SPI modes, I²C protocol and addressing, I3C preview"}
      - {id: "18-06", slug: adc-dac-pwm, title: "Analog Interfaces: ADC, DAC and PWM", hours: 6, topics: "MCU ADC specs, sampling and reference, oversampling, DAC, PWM as a DAC"}
      - {id: "18-07", slug: rtos-concepts, title: "RTOS Concepts", hours: 8, topics: "Tasks, scheduling (rate-monotonic), semaphores, mutexes, queues, priority inversion, FreeRTOS/Zephyr"}
      - {id: "18-08", slug: boot-and-firmware-update, title: "Boot, Bootloaders and Firmware Update", hours: 5, topics: "Boot sequence, bootloaders, OTA/DFU, A/B images, rollback"}
      - {id: "18-09", slug: ultra-low-power-design, title: "Ultra-Low-Power Design", hours: 9, topics: "Power modes, duty cycling, always-on domains, sensor hubs, energy per operation, battery-life budgets"}
      - {id: "18-10", slug: sensors, title: "Sensors: IMU, PPG, MEMS and Audio", hours: 7, topics: "MEMS accelerometers/gyros, PPG optical front ends, MEMS microphones, environmental sensors, sensor fusion"}
      - {id: "18-11", slug: hardware-security, title: "Hardware Security", hours: 7, topics: "Root of trust, secure boot, TEE/TrustZone, key storage, PUFs, side-channel and fault attacks, certifications"}

  # ---------------------------------------------------------------------------
  - id: "19"
    slug: digital-vlsi-design
    title: Digital VLSI Design
    term: 6
    review_hours: 6
    overview: >-
      Designing digital chips: the CMOS inverter, logic families, sizing and logical effort,
      interconnect, power, SRAM, timing and clocking, and the full ASIC flow (synthesis, place
      and route, static timing, signoff) using open-source Yosys/OpenROAD/OpenLane on the
      SkyWater 130 nm PDK, plus design-for-test and verification.
    equivalents:
      - "Digital VLSI / Digital Integrated Circuits (senior)"
      - "MIT 6.374; Berkeley EECS151/251A; Stanford EE271"
    textbooks:
      - "Weste & Harris, *CMOS VLSI Design: A Circuits and Systems Perspective*"
      - "Rabaey, Chandrakasan & Nikolić, *Digital Integrated Circuits: A Design Perspective*"
      - "Sutherland, Sproull & Harris, *Logical Effort*"
    free_courses:
      - "MIT OCW 6.374 Analysis and Design of Digital Integrated Circuits"
      - "Berkeley EECS151 (public lecture materials)"
    prerequisites: ["08", "09", "10", "14"]
    fe: [digital_systems, electronics]
    objectives:
      - Analyze the static and dynamic behavior of the CMOS inverter and of static CMOS gates.
      - Size logic paths with logical effort and estimate interconnect delay with Elmore models and repeaters.
      - Estimate and reduce dynamic and leakage power.
      - Analyze sequential timing (setup/hold, skew, jitter) and SRAM cell stability.
      - Run an RTL-to-GDS flow with open-source tools and interpret synthesis, timing and power reports.
      - Explain scan-based DFT, BIST and ATPG, and modern verification methods (UVM, formal, emulation).
    chapters:
      - {id: "19-01", slug: cmos-inverter-static, title: "The CMOS Inverter: Static Characteristics", hours: 8, topics: "VTC, switching threshold, noise margins, sizing for symmetry"}
      - {id: "19-02", slug: cmos-inverter-dynamic, title: "The CMOS Inverter: Dynamic Behavior and Delay", hours: 8, topics: "Load capacitance, RC delay model, propagation delay, rise/fall, FO4"}
      - {id: "19-03", slug: logic-families, title: "Combinational Logic Families", hours: 8, topics: "Static CMOS, ratioed logic, pass-transistor and transmission gates, dynamic and domino logic"}
      - {id: "19-04", slug: sizing-and-logical-effort, title: "Transistor Sizing and Logical Effort", hours: 9, topics: "Logical/electrical/branching effort, optimal stage count, path optimization"}
      - {id: "19-05", slug: interconnect, title: "Interconnect", hours: 8, topics: "Wire R and C, Elmore delay, distributed RC, repeaters, crosstalk, scaling of wires"}
      - {id: "19-06", slug: power-and-low-power-design, title: "Power and Low-Power Design", hours: 9, topics: "P = αCV²f, short-circuit and leakage power, DVFS, clock gating, power gating, multi-Vt, energy-delay tradeoffs"}
      - {id: "19-07", slug: sequential-timing-and-clocking, title: "Sequential Circuits, Timing and Clocking", hours: 9, topics: "Flip-flop and latch timing, setup/hold, skew and jitter, clock distribution, time borrowing"}
      - {id: "19-08", slug: sram-design, title: "SRAM Design", hours: 8, topics: "6T cell, read/write stability, sense amplifiers, array organization, assist techniques, register files"}
      - {id: "19-09", slug: layout-and-standard-cells, title: "Layout, Design Rules and Standard Cells", hours: 6, topics: "Layers, design rules, stick diagrams, standard-cell libraries, DRC/LVS"}
      - {id: "19-10", slug: synthesis-and-sta, title: "The ASIC Flow I: Synthesis and Static Timing Analysis", hours: 9, topics: "Logic synthesis, constraints (SDC), STA, timing corners, OCV, Yosys/OpenSTA"}
      - {id: "19-11", slug: place-route-signoff, title: "The ASIC Flow II: Floorplan, Place and Route, Signoff", hours: 10, topics: "Floorplanning, placement, CTS, routing, parasitic extraction, signoff, OpenLane/OpenROAD on Sky130"}
      - {id: "19-12", slug: design-for-test, title: "Design for Test: Scan, BIST and ATPG", hours: 6, topics: "Fault models, scan chains, ATPG, MBIST/LBIST, test compression, JTAG"}
      - {id: "19-13", slug: verification-methods, title: "Verification: Simulation, UVM, Formal and Emulation", hours: 8, topics: "Verification planning, coverage, UVM concepts, assertions, formal equivalence and property checking, emulation and prototyping"}

  # ---------------------------------------------------------------------------
  - id: "20"
    slug: analog-and-mixed-signal-ic-design
    title: Analog and Mixed-Signal IC Design
    term: 6
    review_hours: 6
    overview: >-
      Designing analog and mixed-signal blocks in CMOS: gm/ID methodology, two-stage op-amps,
      bandgap references, LDOs, comparators, data converters (SAR, pipeline, sigma-delta,
      flash, DACs), PLLs and jitter, layout and matching, and why analog does not scale like digital.
    equivalents:
      - "Analog IC Design + Data Converters (senior/first-year graduate)"
      - "Berkeley EE140/240A; Stanford EE214A"
    textbooks:
      - "Razavi, *Design of Analog CMOS Integrated Circuits*"
      - "Carusone, Johns & Martin, *Analog Integrated Circuit Design*"
      - "Pelgrom, *Analog-to-Digital Conversion*"
    free_courses:
      - "Razavi's analog design lectures (UCLA, public video)"
      - "NPTEL analog IC design courses"
    prerequisites: ["12", "09"]
    fe: [electronics]
    objectives:
      - Size transistors with the gm/ID methodology to meet gain, bandwidth and power targets.
      - Design and compensate a two-stage op-amp to a specification and verify it in simulation.
      - Analyze bandgap references, LDOs and comparators.
      - Explain data-converter specifications and compare SAR, pipeline, sigma-delta and flash ADCs and DAC architectures.
      - Analyze PLL loop dynamics and jitter.
      - Explain matching, PVT variation and layout techniques, and why analog area and power do not shrink with digital scaling.
    chapters:
      - {id: "20-01", slug: analog-design-fundamentals-gm-id, title: "Analog Design Fundamentals in Nanometer CMOS", hours: 8, topics: "gm/ID methodology, intrinsic gain, f_T, design space exploration, corners"}
      - {id: "20-02", slug: two-stage-op-amp-design, title: "Two-Stage Op-Amp Design", hours: 12, topics: "Specifications, topology, Miller compensation design, slew, CMRR/PSRR, design procedure, simulation verification"}
      - {id: "20-03", slug: bandgap-references, title: "Bandgap and Voltage References", hours: 8, topics: "PTAT/CTAT, bandgap derivation, curvature, sub-1V references, startup"}
      - {id: "20-04", slug: ldo-regulators, title: "Low-Dropout Regulators", hours: 8, topics: "LDO architecture, dropout, load/line regulation, PSRR, stability, capless LDOs"}
      - {id: "20-05", slug: comparators-and-sample-and-hold, title: "Comparators and Sample-and-Hold Circuits", hours: 8, topics: "Latched comparators, offset, kickback, metastability, bootstrapped switches, kT/C"}
      - {id: "20-06", slug: data-converter-fundamentals, title: "Data Converter Fundamentals", hours: 7, topics: "Quantization, INL/DNL, SNR/SNDR/SFDR/ENOB, figures of merit (Walden, Schreier)"}
      - {id: "20-07", slug: nyquist-adcs, title: "Nyquist ADCs: Flash, SAR and Pipeline", hours: 10, topics: "Flash, SAR (capacitive DAC), pipeline, time-interleaving, calibration"}
      - {id: "20-08", slug: sigma-delta-converters, title: "Oversampling and Sigma-Delta Converters", hours: 9, topics: "Oversampling, noise shaping, loop order, continuous-time ΣΔ, decimation filters"}
      - {id: "20-09", slug: dacs, title: "DACs", hours: 6, topics: "Resistor, current-steering and capacitive DACs, segmentation, dynamic errors"}
      - {id: "20-10", slug: plls-and-jitter, title: "PLLs and Jitter", hours: 10, topics: "Charge-pump PLL, loop dynamics, phase noise and jitter, fractional-N, all-digital PLLs"}
      - {id: "20-11", slug: layout-matching-pvt, title: "Layout, Matching and PVT Variation", hours: 7, topics: "Pelgrom mismatch, common-centroid, guard rings, parasitics, Monte Carlo, corners"}
      - {id: "20-12", slug: why-analog-does-not-scale, title: "Why Analog Does Not Scale Like Digital", hours: 5, topics: "Headroom, intrinsic gain, matching vs area, kT/C, digitally assisted analog"}

  # ---------------------------------------------------------------------------
  - id: "21"
    slug: rf-and-microwave-engineering
    title: RF and Microwave Engineering
    term: 6
    review_hours: 5
    overview: >-
      Radio hardware from S-parameters to standards: matching, noise figure and linearity,
      LNAs, mixers, VCOs and power amplifiers, transceiver architectures, the RF front end,
      antennas and beamforming, link budgets, modem baseband architecture and today's wireless standards.
    equivalents:
      - "RF/Microwave Engineering + RF IC Design (senior/first-year graduate)"
      - "Berkeley EE142; Stanford EE314A; MIT 6.776"
    textbooks:
      - "Pozar, *Microwave Engineering*"
      - "Razavi, *RF Microelectronics*"
      - "Lee, *The Design of CMOS Radio-Frequency Integrated Circuits*"
    free_courses:
      - "MIT OCW 6.776 High Speed Communication Circuits"
      - "Berkeley EE142 (public materials)"
    prerequisites: ["12", "13", "17"]
    fe: [electromagnetics, communications, electronics]
    objectives:
      - Use S-parameters and design lumped and distributed matching networks.
      - Compute cascaded noise figure, P1dB, IP3 and dynamic range of a receiver chain.
      - Analyze LNAs, mixers, VCOs and PAs and the efficiency–linearity tradeoff (including envelope tracking and DPD).
      - Compare transceiver architectures and front-end components (filters, switches, duplexers).
      - Compute link budgets and explain antenna arrays, beamforming and mmWave constraints.
      - Map modem architecture and wireless standards (cellular, Wi-Fi, BLE, UWB, GNSS, NTN) to the underlying RF and comms concepts.
    chapters:
      - {id: "21-01", slug: s-parameters, title: "S-Parameters and Network Analysis", hours: 8, topics: "Wave variables, S-parameters, conversions, VNA measurement, de-embedding, stability circles"}
      - {id: "21-02", slug: impedance-matching-networks, title: "Impedance Matching Networks", hours: 7, topics: "L, π and T networks, Q and bandwidth, distributed matching, broadband matching limits"}
      - {id: "21-03", slug: noise-figure-and-linearity, title: "Noise Figure and Linearity", hours: 8, topics: "Noise figure, Friis cascade, P1dB, IP2/IP3, intermodulation, dynamic range, blocking"}
      - {id: "21-04", slug: low-noise-amplifiers, title: "Low-Noise Amplifiers", hours: 7, topics: "Inductively degenerated CS LNA, noise matching, gain/NF/linearity tradeoffs"}
      - {id: "21-05", slug: mixers, title: "Mixers", hours: 6, topics: "Active/passive mixers, conversion gain, image problem, LO leakage, harmonic mixing"}
      - {id: "21-06", slug: oscillators-and-vcos, title: "Oscillators and VCOs", hours: 6, topics: "LC VCOs, phase noise (Leeson), tuning range, quadrature generation"}
      - {id: "21-07", slug: power-amplifiers, title: "Power Amplifiers", hours: 9, topics: "Classes A–F, efficiency vs linearity, PAPR, back-off, Doherty, envelope tracking, DPD"}
      - {id: "21-08", slug: transceiver-architectures, title: "Transceiver Architectures", hours: 7, topics: "Superheterodyne, zero-IF, low-IF, direct RF sampling, software-defined radio"}
      - {id: "21-09", slug: rf-front-end, title: "The RF Front End: Filters, Switches and Modules", hours: 6, topics: "SAW/BAW filters, duplexers, switches, tuners, front-end modules, carrier aggregation complexity"}
      - {id: "21-10", slug: antennas-arrays-mmwave, title: "Antennas, Arrays, Beamforming and mmWave", hours: 8, topics: "Antenna parameters, phased arrays, analog/digital/hybrid beamforming, mmWave path loss and packaging"}
      - {id: "21-11", slug: link-budgets, title: "Link Budgets", hours: 5, topics: "Friis, sensitivity, fade margin, BLE/Wi-Fi/cellular link budgets"}
      - {id: "21-12", slug: modem-baseband-and-standards, title: "Modem Baseband Architecture and Wireless Standards", hours: 9, topics: "Modem datapath, cellular (4G/5G/NTN), Wi-Fi generations, BLE/LE Audio, UWB, GNSS"}

  # ---------------------------------------------------------------------------
  - id: "22"
    slug: power-electronics-and-energy-conversion
    title: Power Electronics and Energy Conversion
    term: 6
    review_hours: 5
    overview: >-
      Converting and delivering power efficiently, from wearables to AI racks: switching
      converters and magnetics, converter control, LDO vs switcher tradeoffs, PMICs, batteries,
      datacenter power delivery, wide-bandgap devices, plus the machines and power-system
      fundamentals the FE exam expects.
    equivalents:
      - "Power Electronics (senior) + Electric Machines and Power Systems (intro)"
      - "MIT 6.334; Berkeley EE113; Berkeley EE137A"
    textbooks:
      - "Erickson & Maksimović, *Fundamentals of Power Electronics*"
      - "Mohan, Undeland & Robbins, *Power Electronics: Converters, Applications, and Design*"
      - "Glover, Overbye & Sarma, *Power System Analysis and Design* (power-systems chapters)"
      - "Chapman, *Electric Machinery Fundamentals* (machines chapter)"
    free_courses:
      - "MIT OCW 6.334 Power Electronics"
      - "University of Colorado Boulder power electronics specialization (Coursera, Erickson)"
    prerequisites: ["07", "10", "15"]
    fe: [power_systems, electronics]
    objectives:
      - Analyze buck, boost, buck-boost and flyback converters in steady state with volt-second and charge balance.
      - Design inductors and transformers for converters and estimate losses.
      - Model converter dynamics and design voltage- and current-mode control loops.
      - Compare LDOs and switching regulators, and explain PMIC, battery-charging and fuel-gauge architecture.
      - Analyze datacenter power delivery (48 V distribution, VRMs, PDN impedance, IR drop) and the role of GaN and SiC.
      - Solve FE-level machines and power-systems problems (three-phase, per-unit, transformers, transmission, power flow, faults).
    chapters:
      - {id: "22-01", slug: power-conversion-principles, title: "Power Conversion Principles", hours: 6, topics: "Efficiency, linear vs switching conversion, LDO vs switcher, energy flow, power density"}
      - {id: "22-02", slug: buck-converter-steady-state, title: "Steady-State Analysis and the Buck Converter", hours: 9, topics: "Volt-second balance, charge balance, small-ripple approximation, CCM/DCM, buck design"}
      - {id: "22-03", slug: boost-buck-boost-topologies, title: "Boost, Buck-Boost and Other Topologies", hours: 7, topics: "Boost, buck-boost, Ćuk/SEPIC, conversion ratios, non-idealities"}
      - {id: "22-04", slug: isolated-converters, title: "Isolated Converters: Flyback and Forward", hours: 6, topics: "Transformer models, flyback, forward, bridge converters, isolation requirements"}
      - {id: "22-05", slug: magnetics-design, title: "Magnetics Design", hours: 7, topics: "Magnetic circuits, core loss, saturation, inductor and transformer design, integrated magnetics"}
      - {id: "22-06", slug: converter-losses-and-wide-bandgap, title: "Converter Losses and Wide-Bandgap Switches", hours: 7, topics: "Conduction and switching losses, Si vs GaN vs SiC, figures of merit, soft switching"}
      - {id: "22-07", slug: converter-dynamics-and-control, title: "Converter Dynamics and Control", hours: 9, topics: "Averaged models, small-signal transfer functions, voltage-mode and current-mode control, compensation"}
      - {id: "22-08", slug: pmics, title: "PMICs and Power Management for SoCs", hours: 6, topics: "Multi-rail PMIC architecture, sequencing, DVFS support, power domains, efficiency at light load"}
      - {id: "22-09", slug: batteries-charging-fuel-gauging, title: "Batteries, Charging and Fuel Gauging", hours: 8, topics: "Li-ion chemistry basics, CC/CV charging, fuel gauging, wearable battery-life engineering"}
      - {id: "22-10", slug: datacenter-power-delivery, title: "Datacenter Power Delivery", hours: 8, topics: "Grid to chip, 48 V distribution, VRMs, vertical/integrated power delivery, PDN impedance, IR drop"}
      - {id: "22-11", slug: electric-machines, title: "Electric Machines and Drives", hours: 6, topics: "DC machines, induction and synchronous machines, torque–speed, inverters and motor drives (FE level)"}
      - {id: "22-12", slug: power-systems-fundamentals, title: "Power Systems Fundamentals", hours: 8, topics: "Per-unit system, transformers in power systems, transmission-line models, power flow basics, faults and protection, grid integration of renewables and storage"}

  # ---------------------------------------------------------------------------
  - id: "23"
    slug: memory-and-storage-technology
    title: Memory and Storage Technology
    term: 6
    review_hours: 3
    overview: >-
      The technologies that hold data: SRAM, DRAM and its interfaces (DDR, LPDDR, GDDR), HBM
      in depth, NAND flash and SSD controllers, emerging memories, compute-in-memory, and the
      memory wall that shapes AI system design.
    equivalents:
      - "Memory Systems / Semiconductor Memory (senior elective)"
    textbooks:
      - "Jacob, Ng & Wang, *Memory Systems: Cache, DRAM, Disk*"
      - "Weste & Harris, *CMOS VLSI Design* (SRAM/DRAM chapters)"
      - "JEDEC standards (public summaries) for DDR/LPDDR/HBM"
    free_courses:
      - "ETH Zürich Computer Architecture lectures (Mutlu) — memory systems lectures"
    prerequisites: ["14", "19"]
    fe: [computer_systems, electrical_materials]
    companion: "LLM inference engineering"
    objectives:
      - Quantify the memory wall with bandwidth, latency and energy-per-bit numbers.
      - Explain DRAM cell, array and refresh operation and the DDR/LPDDR/GDDR/HBM interface tradeoffs.
      - Explain HBM architecture (stacking, TSVs, base die, interposer) and its cost and supply constraints.
      - Explain NAND flash cells, 3D NAND scaling and SSD controller functions.
      - Evaluate emerging memories and compute-in-memory claims against their physics.
    chapters:
      - {id: "23-01", slug: memory-hierarchy-and-memory-wall, title: "The Memory Hierarchy and the Memory Wall", hours: 4, topics: "Bandwidth, latency, energy per bit across the hierarchy, why AI is memory-bound"}
      - {id: "23-02", slug: sram-technology, title: "SRAM Technology", hours: 4, topics: "Bitcell scaling, density trends, assist circuits, SRAM in advanced nodes"}
      - {id: "23-03", slug: dram-cells-arrays-refresh, title: "DRAM Cells, Arrays and Refresh", hours: 7, topics: "1T1C cell, sense amplifiers, banks, refresh, timing parameters, row hammer, DRAM scaling"}
      - {id: "23-04", slug: dram-interfaces, title: "DRAM Interfaces: DDR, LPDDR and GDDR", hours: 6, topics: "Interface evolution, prefetch, signaling, power tradeoffs, where each is used"}
      - {id: "23-05", slug: hbm-in-depth, title: "HBM in Depth", hours: 7, topics: "Stacked dies, TSVs, base die, wide interface, interposers, generations, cost, yield and supply"}
      - {id: "23-06", slug: nand-flash-and-3d-nand, title: "NAND Flash and 3D NAND", hours: 7, topics: "Floating gate vs charge trap, SLC/MLC/TLC/QLC, 3D stacking, endurance and retention"}
      - {id: "23-07", slug: ssd-controllers, title: "SSD Controllers and Storage Systems", hours: 5, topics: "FTL, wear leveling, ECC (LDPC), NVMe, write amplification"}
      - {id: "23-08", slug: emerging-memories, title: "Emerging Memories: MRAM, ReRAM, PCM, FeRAM", hours: 5, topics: "Physics, embedded NVM, density/endurance/speed tradeoffs, adoption status"}
      - {id: "23-09", slug: compute-in-memory, title: "Compute-in-Memory and Near-Memory Computing", hours: 5, topics: "Analog and digital CIM, processing-in-memory, claims vs reality"}

