  - id: "24"
    slug: high-speed-io-signal-integrity-and-photonics
    title: High-Speed I/O, Signal Integrity and Photonics
    term: 6
    review_hours: 3
    overview: >-
      Moving bits between chips at hundreds of gigabits per second: loss, reflection and
      crosstalk; eye diagrams and jitter; SerDes architecture and equalization; PCIe, CXL,
      Ethernet, UCIe and NVLink/UALink; and the photonics (lasers, modulators, silicon
      photonics, linear-drive and co-packaged optics) that take over when copper runs out.
    equivalents:
      - "High-Speed Digital Design / Signal Integrity + Optoelectronics (senior/graduate elective)"
      - "Stanford EE273 (historical); Berkeley EE290 high-speed links"
    textbooks:
      - "Bogatin, *Signal and Power Integrity — Simplified*"
      - "Hall & Heck, *Advanced Signal Integrity for High-Speed Digital Designs*"
      - "Dally & Poulton, *Digital Systems Engineering*"
      - "Saleh & Teich, *Fundamentals of Photonics*"
    free_courses:
      - "MIT OCW 6.776 (links material)"
      - "Texas A&M ECEN 720 High-Speed Links (public lecture notes, Palermo)"
    prerequisites: ["13", "17", "12"]
    fe: [electromagnetics, communications, digital_systems]
    companion: "datacenter networking"
    objectives:
      - Compute channel loss, reflections and crosstalk and read eye diagrams and BER bathtubs.
      - Explain SerDes architecture (NRZ/PAM4, CTLE/FFE/DFE equalization, CDR, DSP-based receivers, FEC).
      - Compare interconnect standards (PCIe, CXL, Ethernet, UCIe, NVLink/UALink) by reach, bandwidth, latency and energy per bit.
      - Explain photonic components (lasers, modulators, photodetectors, fiber) and silicon photonics.
      - Evaluate linear-drive and co-packaged optics against pluggable optics.
    chapters:
      - {id: "24-01", slug: signal-integrity-fundamentals, title: "Signal Integrity Fundamentals", hours: 7, topics: "Insertion loss, skin effect and dielectric loss, reflections, crosstalk, return paths, power integrity link"}
      - {id: "24-02", slug: eye-diagrams-jitter-ber, title: "Eye Diagrams, Jitter and BER", hours: 6, topics: "Eye diagrams, jitter decomposition, bathtub curves, BER targets"}
      - {id: "24-03", slug: serdes-architecture, title: "SerDes Architecture and Equalization", hours: 8, topics: "NRZ vs PAM4, TX FFE, CTLE, DFE, CDR, PLL/clocking, energy per bit"}
      - {id: "24-04", slug: dsp-serdes-and-fec, title: "DSP-Based SerDes and FEC", hours: 5, topics: "ADC-based receivers, digital equalization, FEC and latency, MLSD"}
      - {id: "24-05", slug: pcie-cxl-ethernet, title: "Interconnect Standards: PCIe, CXL and Ethernet", hours: 6, topics: "Generations, rates, encodings, reach, CXL memory semantics, Ethernet SerDes lanes"}
      - {id: "24-06", slug: d2d-memory-phys-scale-up, title: "Die-to-Die Links, Memory PHYs and Scale-Up Fabrics", hours: 6, topics: "UCIe, BoW, memory PHYs, NVLink and UALink, energy/bit and bandwidth density"}
      - {id: "24-07", slug: photonics-fundamentals, title: "Photonics Fundamentals", hours: 8, topics: "Lasers, modulators (EML, MZM, ring), photodetectors, fiber, WDM, link budgets"}
      - {id: "24-08", slug: silicon-photonics, title: "Silicon Photonics and Optical Transceivers", hours: 6, topics: "Si photonics platforms, integration, pluggable transceivers, DSP in optics"}
      - {id: "24-09", slug: lpo-and-cpo, title: "Linear-Drive and Co-Packaged Optics", hours: 4, topics: "LPO/LRO, CPO, power and reliability tradeoffs, ecosystem status"}

