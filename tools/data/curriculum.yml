  - id: "25"
    slug: fabrication-packaging-test-and-reliability
    title: Semiconductor Fabrication, Packaging, Test and Reliability
    term: 6
    review_hours: 5
    overview: >-
      How chips are made, packaged, tested and qualified: process flow, lithography through
      High-NA EUV, deposition/etch/CMP/implant/metrology, yield and die cost, foundries and
      PDKs, advanced packaging and chiplets, thermal engineering, reliability physics,
      qualification standards, test and post-silicon validation.
    equivalents:
      - "Microfabrication / IC Process Technology + Packaging and Reliability (senior elective)"
      - "Berkeley EE143; MIT 6.152J"
    textbooks:
      - "Plummer, Deal & Griffin, *Silicon VLSI Technology*"
      - "May & Spanos, *Fundamentals of Semiconductor Manufacturing and Process Control*"
      - "Tummala, *Fundamentals of Microsystems Packaging*"
      - "Bushnell & Agrawal, *Essentials of Electronic Testing*"
    free_courses:
      - "MIT OCW 6.152J Micro/Nano Processing Technology"
      - "Berkeley EE143 (public materials)"
    prerequisites: ["09", "19"]
    fe: [electrical_materials, ethics_professional_practice]
    companion: "semiconductor capital equipment"
    objectives:
      - Describe a CMOS process flow (FEOL, MOL, BEOL) and the role of each unit process.
      - Explain lithography resolution limits and the economics of multipatterning, EUV and High-NA EUV.
      - Compute die cost from wafer cost, die area and yield models.
      - Compare packaging options (flip-chip, 2.5D, 3D, hybrid bonding, chiplets) and their thermal and cost implications.
      - Explain reliability mechanisms (EM, TDDB, BTI, HCI, ESD, latch-up) and qualification standards.
      - Describe the test flow (wafer sort, final test, burn-in, binning) and post-silicon validation.
    chapters:
      - {id: "25-01", slug: process-flow-overview, title: "Process Flow Overview: FEOL, MOL and BEOL", hours: 7, topics: "Wafer start to finished wafer, CMOS process modules, interconnect stacks"}
      - {id: "25-02", slug: lithography, title: "Lithography: DUV, Multipatterning, EUV and High-NA", hours: 8, topics: "Rayleigh criterion, immersion, multipatterning, EUV sources and masks, High-NA, OPC, cost per layer"}
      - {id: "25-03", slug: deposition-etch-cmp-implant-metrology, title: "Deposition, Etch, CMP, Implant and Metrology", hours: 8, topics: "CVD/ALD/PVD, epitaxy, plasma etch, ALE, CMP, ion implantation, anneal, metrology and inspection"}
      - {id: "25-04", slug: yield-and-die-cost, title: "Yield Models and Die Cost", hours: 7, topics: "Defect density, Poisson/Murphy/negative-binomial yield, die per wafer, die cost, cost per transistor trends"}
      - {id: "25-05", slug: foundries-pdks-specialty-processes, title: "Foundries, PDKs and Specialty Processes", hours: 6, topics: "Foundry model, PDK contents, MPW shuttles, RF-SOI, BCD, FD-SOI, embedded NVM"}
      - {id: "25-06", slug: packaging-fundamentals, title: "Packaging I: Wire Bond, Flip-Chip, Substrates, SiP and PoP", hours: 6, topics: "Package functions, wire bond, flip-chip bumps, substrates, fan-out, SiP, PoP"}
      - {id: "25-07", slug: advanced-packaging-and-chiplets, title: "Packaging II: 2.5D, 3D, Hybrid Bonding and Chiplets", hours: 7, topics: "Silicon interposers, bridges, TSVs, hybrid bonding, chiplet economics, known-good die"}
      - {id: "25-08", slug: thermal-engineering, title: "Thermal Engineering", hours: 6, topics: "Thermal resistance networks, junction temperature, heat spreading, cooling (air, liquid, immersion), hotspots"}
      - {id: "25-09", slug: reliability-physics, title: "Reliability Physics", hours: 8, topics: "Electromigration, TDDB, BTI, HCI, ESD, latch-up, acceleration models, FIT and MTTF"}
      - {id: "25-10", slug: qualification-and-functional-safety, title: "Qualification and Functional Safety", hours: 5, topics: "JEDEC qualification, AEC-Q100, ISO 26262 and ASIL, safety mechanisms"}
      - {id: "25-11", slug: test-ate-sort-burn-in, title: "Test: ATE, Wafer Sort, Burn-In and Binning", hours: 6, topics: "Test flow, ATE, probe cards, test time and cost, burn-in, speed binning, yield learning"}
      - {id: "25-12", slug: post-silicon-validation, title: "Post-Silicon Validation and Bring-Up", hours: 4, topics: "First silicon, bring-up, debug infrastructure, characterization, respin decisions"}

