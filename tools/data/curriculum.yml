  - id: "28"
    slug: technical-diligence-and-leadership-fluency
    title: Technical Diligence and Engineering Leadership Fluency
    term: 7
    review_hours: 2
    overview: >-
      The practitioner's course: a framework for evaluating a chip company's technology,
      validating claims, silicon maturity scales, domain question banks, red and green flags,
      evaluating engineering teams, integration risk, a business↔engineering translation
      table, and 25+ realistic conversation scenarios with annotated debriefs.
    equivalents:
      - "No university equivalent. Draws on industry diligence practice."
    textbooks:
      - "Curriculum courses 09–27 (this repo)"
      - "Public company filings, conference papers and technical documentation (cited per chapter)"
    free_courses: []
    prerequisites: ["26", "27"]
    fe: []
    companion: "semiconductor capital equipment; datacenter networking; LLM inference engineering; quantum computing"
    objectives:
      - Apply a structured framework to evaluate a chip company's technology and roadmap.
      - Validate performance, efficiency and maturity claims using first-principles checks.
      - Ask domain-specific diagnostic questions and distinguish strong from evasive answers.
      - Assess engineering-team quality and post-acquisition integration risk.
      - Translate between business metrics and engineering metrics in conversation.
    chapters:
      - {id: "28-01", slug: technology-evaluation-framework, title: "A Framework for Evaluating a Chip Company's Technology", hours: 6, topics: "Architecture, implementation, IP position, team, roadmap, ecosystem, manufacturing"}
      - {id: "28-02", slug: validating-claims, title: "Validating Claims: TOPS/W, Benchmarks, Tapeout Status", hours: 6, topics: "Peak vs delivered, test conditions, MPW vs production silicon, sanity checks from first principles"}
      - {id: "28-03", slug: silicon-maturity-scales, title: "Maturity Scales for Silicon", hours: 4, topics: "Concept to production, steppings, ES/QS/production, qualification status, software maturity"}
      - {id: "28-04", slug: question-banks-digital-ai-memory-interconnect, title: "Domain Question Banks I: Digital/CPU, AI Accelerators, Memory, Interconnect and Optics", hours: 6, topics: "Diagnostic questions with strong/evasive answer patterns"}
      - {id: "28-05", slug: question-banks-analog-rf-power-packaging-embedded, title: "Domain Question Banks II: Analog/Mixed-Signal, RF, Power, Packaging, Embedded", hours: 6, topics: "Diagnostic questions with strong/evasive answer patterns"}
      - {id: "28-06", slug: red-and-green-flags, title: "Red Flags and Green Flags", hours: 4, topics: "Technical, organizational and commercial signals"}
      - {id: "28-07", slug: evaluating-engineering-teams, title: "Evaluating Engineering Teams", hours: 5, topics: "Team composition, track record, tapeout history, tooling, culture, key-person risk"}
      - {id: "28-08", slug: integration-risk, title: "Post-Acquisition Integration Risk", hours: 5, topics: "Tool/flow/process migration, roadmap overlap, retention, IP and licensing issues"}
      - {id: "28-09", slug: business-engineering-translation, title: "The Business ↔ Engineering Translation Table", hours: 3, topics: "Mapping margin, cost, schedule and risk to engineering metrics and back"}
      - {id: "28-10", slug: conversation-scenarios, title: "Conversation Scenarios", hours: 15, topics: "25+ dialogues with VPs of Engineering and chief architects, with annotated debriefs"}

