# Glossary source. One entry per term; see tools/build_glossary.py for the schema.
# Keep definitions to one or two sentences; the chapter carries the full treatment.

# ---------------------------------------------------------------- 02-01
- term: Complex number
  definition: A number z = x + jy with real part x and imaginary part y (both real numbers), drawn as a point or arrow in the complex plane.
  chapter: "02-01"
  see_also: [Imaginary unit, Complex plane]
- term: Imaginary unit
  definition: The number j defined by j² = −1 (written i in mathematics; EE uses j because i denotes current). Multiplying by j rotates a complex number 90° counterclockwise.
  chapter: "02-01"
- term: Complex plane
  definition: The plane in which a complex number x + jy is plotted at horizontal coordinate x (real axis) and vertical coordinate y (imaginary axis).
  chapter: "02-01"
- term: Rectangular form
  definition: Writing a complex number by its components, z = x + jy. Convenient for addition and subtraction.
  chapter: "02-01"
  see_also: [Polar form]
- term: Polar form
  definition: Writing a complex number by its magnitude and angle, z = r∠θ = r(cos θ + j sin θ) = re^{jθ}. Convenient for multiplication, division, powers and roots.
  chapter: "02-01"
  see_also: [Rectangular form, Euler's formula]
- term: Magnitude
  definition: The length |z| = √(x² + y²) of a complex number's arrow (also called modulus or absolute value).
  chapter: "02-01"
- term: Angle (argument)
  definition: The direction ∠z of a complex number's arrow, measured counterclockwise from the positive real axis; computed with the quadrant-aware atan2(y, x). This curriculum reports principal values in (−180°, 180°].
  chapter: "02-01"
- term: Complex conjugate
  definition: For z = x + jy, the number z* = x − jy, its mirror image across the real axis. z z* = |z|², which is why conjugates are used to divide complex numbers.
  chapter: "02-01"
- term: De Moivre's theorem
  definition: (r∠θ)ⁿ = rⁿ∠nθ. Raising a complex number to a power raises its magnitude to that power and multiplies its angle.
  chapter: "02-01"
- term: Roots of unity
  definition: The N complex numbers e^{j2πk/N} (k = 0 … N−1) whose N-th power is 1, equally spaced on the unit circle. They are the twiddle factors of the FFT.
  chapter: "02-01"
- term: Euler's formula
  definition: e^{jθ} = cos θ + j sin θ for real θ. It connects exponentials and sinusoids and makes r∠θ and re^{jθ} the same number.
  chapter: "02-01"
- term: Complex exponential
  definition: A signal e^{st} with complex s = σ + jω. It rotates at ω rad/s while its magnitude grows (σ > 0), decays (σ < 0) or stays constant (σ = 0); its real part is a growing, decaying or steady sinusoid.
  chapter: "02-01"
- term: Sinusoid
  definition: A signal of the form A cos(ωt + φ), with amplitude A, angular frequency ω and phase φ. This curriculum always uses the cosine as the reference form.
  chapter: "02-01"
- term: Angular frequency
  definition: ω = 2πf, the rate of a sinusoid's phase advance in rad/s, where f is the frequency in hertz.
  chapter: "02-01"
- term: Phase
  definition: The angle φ in A cos(ωt + φ), fixing where in its cycle a sinusoid is at t = 0. A time delay t_d is a phase lag of ωt_d.
  chapter: "02-01"
- term: RMS value
  definition: Root-mean-square value, √(average of v²). For a sinusoid of amplitude V_m it is V_m/√2; it is the value that delivers the same average power to a resistor as a DC voltage of that size.
  chapter: "02-01"
- term: Phasor
  definition: The complex number V = V_m∠φ representing the sinusoid V_m cos(ωt + φ) at a known frequency ω, so that v(t) = Re{V e^{jωt}}. This curriculum uses peak-amplitude, cosine-reference phasors.
  chapter: "02-01"
  see_also: [Sinusoidal steady state, Impedance]
- term: Sinusoidal steady state
  definition: The response of a stable linear system to a sinusoidal input after transients have died out, a sinusoid at the input frequency whose amplitude and phase follow from phasor analysis.
  chapter: "02-01"
- term: Frequency response
  definition: The complex gain H(jω) of a linear system at angular frequency ω. Its magnitude scales a sinusoid's amplitude and its angle shifts the sinusoid's phase.
  chapter: "02-01"
  see_also: [Corner frequency]
- term: Corner frequency
  definition: For a single-pole response H = 1/(1 + jωτ), the frequency ω = 1/τ where |H| = 1/√2 (−3 dB) and the phase is −45°; commonly used to define bandwidth.
  chapter: "02-01"
- term: Impedance
  definition: The ratio Z = V/I of voltage phasor to current phasor for an element or network, in ohms. Resistor R, inductor jωL, capacitor 1/(jωC).
  chapter: "02-01"
  see_also: [Reactance, Phasor]
- term: Reactance
  definition: The imaginary part X of an impedance Z = R + jX, in ohms. Positive for inductors (ωL), negative for capacitors (−1/(ωC)).
  chapter: "02-01"
- term: Resonance
  definition: The condition in an LC-containing circuit where inductive and capacitive reactances cancel (ω₀ = 1/√(LC) in a series RLC), making the impedance purely resistive and the response peak.
  chapter: "02-01"
- term: I/Q (in-phase/quadrature)
  anchor: iq
  definition: Representation of a bandpass signal by two baseband components, in-phase (I) and quadrature (Q), which together form one complex sample stream I + jQ; the native signal format of modern radios.
  chapter: "02-01"
  see_also: [Error vector magnitude]
- term: Error vector magnitude
  definition: EVM, the RMS distance between transmitted (or received) constellation points and their ideal positions, relative to the signal, often quoted in dB. It sets the highest usable QAM order.
  chapter: "02-01"

# ---------------------------------------------------------------- 07-02
- term: Transient
  definition: The part of a circuit's response that dies out after a disturbance (such as a switching event), as the circuit moves from one steady state to another.
  chapter: "07-02"
  see_also: [Time constant]
- term: Natural response
  definition: The response of a circuit with no sources acting, driven only by the energy initially stored in its capacitors and inductors; for a first-order circuit, an exponential decay.
  chapter: "07-02"
- term: Step response
  definition: The response of a circuit to a source that switches from one constant value to another; for a first-order circuit, an exponential approach to the new final value.
  chapter: "07-02"
- term: Time constant
  definition: τ, the characteristic time of a first-order exponential response e^{−t/τ}; τ = R_Th·C for an RC circuit and τ = L/R_Th for an RL circuit. After one τ, 63.2 % of the change is complete.
  chapter: "07-02"
  see_also: [Thevenin resistance, Settling time]
- term: First-order circuit
  definition: A circuit whose behavior is described by a first-order differential equation, typically one with a single (equivalent) capacitor or inductor.
  chapter: "07-02"
- term: Continuity of capacitor voltage and inductor current
  definition: The rule that v_C and i_L cannot change instantaneously (it would take infinite current or voltage, and infinite power). Other circuit variables can jump at switching instants.
  chapter: "07-02"
- term: State variable
  definition: A variable that fully captures a circuit's stored energy and memory, namely capacitor voltages and inductor currents. Knowing them at one instant (plus the inputs) determines the future response.
  chapter: "07-02"
- term: Thevenin resistance
  definition: R_Th, the resistance seen looking into two terminals of a linear circuit with its independent sources turned off; it sets the time constant seen by a capacitor or inductor connected there.
  chapter: "07-02"
- term: Rise time
  definition: The time a response takes to go from 10 % to 90 % of its total change; τ·ln 9 ≈ 2.2τ for a single pole, so t_r ≈ 0.35/f_3dB.
  chapter: "07-02"
- term: Settling time
  definition: The time a response takes to come and stay within a specified error band of its final value; τ·ln(1/ε) for a first-order system, and (N+1)·ln 2 · τ to reach ½ LSB of an N-bit converter.
  chapter: "07-02"
- term: Propagation delay
  definition: The time from an input transition to the output crossing 50 % of its swing; for an RC model, τ·ln 2 ≈ 0.69τ.
  chapter: "07-02"
- term: Dynamic power
  definition: Power consumed by charging and discharging capacitances in switching circuits, P = αCV²f, independent of the resistance of the charging path.
  chapter: "07-02"
  see_also: [Activity factor]
- term: Activity factor
  definition: α, the fraction of clock cycles in which a node makes a 0→1 transition; it scales the dynamic power αCV²f.
  chapter: "07-02"
- term: Adiabatic charging
  definition: Charging a capacitor with a slowly ramped or stepped source so that the voltage across the series resistance stays small, reducing the loss below ½CV² (to CV²/2N for N equal steps).
  chapter: "07-02"
- term: Inductive kick
  definition: The large voltage an inductor develops (v = L di/dt) when its current is interrupted abruptly; it can arc switch contacts or break down transistors unless a flyback path is provided.
  chapter: "07-02"
  see_also: [Flyback diode]
- term: Flyback diode
  definition: A diode placed across an inductive load so that, when the driving switch opens, the inductor's current circulates through the diode, clamping the switch voltage to about one diode drop above the supply. Also called a freewheeling diode.
  chapter: "07-02"
- term: Integrating factor
  definition: A multiplier (e^{t/τ} for τ x' + x = u) that turns the left side of a first-order linear ODE into an exact derivative, giving the general solution as an integral of the input.
  chapter: "07-02"
- term: Convolution
  definition: The operation y(t) = ∫ h(t−λ) u(λ) dλ that gives a linear time-invariant system's output from its input and impulse response; for a first-order low-pass, an exponentially weighted average of past inputs.
  chapter: "07-02"
- term: Integrator (op-amp)
  definition: An op-amp circuit with a capacitor in the feedback path and a resistor at the input, giving v_out = −(1/RC)∫v_in dt; a resistor across the capacitor makes it a "leaky" integrator (a first-order low-pass).
  chapter: "07-02"
- term: Sample-and-hold
  definition: A circuit that connects a capacitor to a signal through a switch (sample), then disconnects it to hold the voltage while it is converted; its settling and kT/C noise limit ADC accuracy.
  chapter: "07-02"
- term: Least significant bit (LSB)
  definition: The smallest step an N-bit converter resolves, full scale / 2^N; errors and noise are often expressed in LSBs.
  chapter: "07-02"
- term: kT/C noise
  anchor: ktc-noise
  definition: The thermal noise sampled onto a capacitor through any resistance, with RMS value √(kT/C), about 64 µV for 1 pF at 300 K; independent of the resistance.
  chapter: "07-02"
- term: Repeater
  definition: A buffer inserted along a long on-chip wire to break it into shorter segments, converting delay that grows with the square of length into delay that grows linearly.
  chapter: "07-02"

# ---------------------------------------------------------------- 00-02
- term: Abstraction
  definition: A simplified description of a system level that exposes a contract (inputs, outputs, assumptions) and hides internal detail, so that the level above can be designed without the detail.
  chapter: "00-02"
- term: Lumped-matter discipline
  definition: The conditions under which fields can be replaced by voltages and currents in lumped elements obeying KVL and KCL, chiefly that the circuit is small compared with the signal wavelength (or line delay is short compared with edge time).
  chapter: "00-02"
  see_also: [Transmission line, Wavelength]
- term: Wavelength
  definition: The distance λ = v/f a wave travels in one period, where v is the propagation speed and f the frequency.
  chapter: "00-02"
- term: Transmission line
  definition: A pair of conductors along which signals travel as waves with finite speed, so that voltage and current vary with position and reflections occur at impedance changes.
  chapter: "00-02"
  see_also: [Characteristic impedance, Reflection coefficient]
- term: Characteristic impedance
  definition: Z0, the ratio of voltage to current for a single wave traveling along a transmission line (typically 50 Ω for coaxial cable and RF systems).
  chapter: "00-02"
- term: Reflection coefficient
  definition: Γ = (R − Z0)/(R + Z0), the ratio of reflected to incident wave voltage at a termination R on a line of characteristic impedance Z0; +1 for an open, −1 for a short, 0 for a matched load.
  chapter: "00-02"
- term: Static discipline
  definition: The rule defining valid digital levels with separate output (V_OL, V_OH) and input (V_IL, V_IH) thresholds, so that every gate restores clean levels and leaves noise margins.
  chapter: "00-02"
  see_also: [Noise margin]
- term: Noise margin
  definition: The amount of noise a digital connection can tolerate, NM_L = V_IL − V_OL and NM_H = V_OH − V_IH.
  chapter: "00-02"
- term: Regeneration
  definition: Restoring a signal to clean logic levels at each stage, so that noise does not accumulate along a chain; the key advantage of digital over analog processing.
  chapter: "00-02"
- term: Q-function
  definition: Q(x), the probability that a standard normal random variable exceeds x; it gives error probabilities for decisions in Gaussian noise and falls off extremely fast (Q(6) ≈ 1e-9).
  chapter: "00-02"
- term: Level shifter
  definition: A circuit that translates logic levels between two voltage domains so that families with incompatible thresholds can communicate.
  chapter: "00-02"
- term: Instruction-set architecture (ISA)
  definition: The contract between hardware and software, namely the instructions, registers, memory model and exceptions a program can rely on, independent of how a processor implements them.
  chapter: "00-02"
- term: Process design kit (PDK)
  definition: The files a foundry gives designers to use its process, including device models, design rules, layer definitions and often standard-cell libraries, abstracting the fab's recipes.
  chapter: "00-02"
- term: Reticle limit
  definition: The largest area one lithography exposure can print, 26 mm × 33 mm ≈ 858 mm² on standard scanners (half that with High-NA EUV); it caps the size of a single die without stitching.
  chapter: "00-02"
  see_also: [Chiplet]
- term: Chiplet
  definition: A die designed to be combined with other dies inside one package, so that a system can exceed the reticle limit or mix processes; chiplets communicate over die-to-die links.
  chapter: "00-02"
- term: Side channel
  definition: An unintended leak of information through physical behavior such as timing, power consumption or electromagnetic emission, which can reveal secrets that the logical abstraction hides.
  chapter: "00-02"

# ---------------------------------------------------------------- 00-04
- term: SPICE
  definition: Simulation Program with Integrated Circuit Emphasis, the standard family of circuit simulators that solve a netlist's nodal equations for DC, AC and transient behavior; ngspice is an open-source version.
  chapter: "00-04"
  see_also: [Netlist, Modified nodal analysis]
- term: Netlist
  definition: A text description of a circuit listing each element, its value and the nodes it connects; the input to a circuit simulator (node 0 is ground).
  chapter: "00-04"
- term: Operating point
  definition: The DC voltages and currents of a circuit with its sources at their DC values (capacitors open, inductors shorted); also called the bias point.
  chapter: "00-04"
- term: AC analysis
  definition: A simulation of a circuit's small-signal sinusoidal response versus frequency, computed with phasors after linearizing around the operating point.
  chapter: "00-04"
- term: Transient analysis
  definition: A simulation of a circuit's voltages and currents versus time for arbitrary input waveforms, computed step by step with numerical integration.
  chapter: "00-04"
- term: Modified nodal analysis
  definition: The formulation SPICE uses, namely KCL at every node plus extra equations for voltage sources, giving a linear system G·v = i (re-linearized each iteration for nonlinear devices).
  chapter: "00-04"
- term: Newton–Raphson method
  definition: An iterative root-finding method, x_{k+1} = x_k − g(x_k)/g′(x_k), that circuit simulators use to solve nonlinear equations; it converges quadratically near a solution but can overshoot far from it.
  chapter: "00-04"
- term: Hardware description language (HDL)
  definition: A language such as Verilog, SystemVerilog or VHDL for describing digital hardware structure and behavior, used for simulation and synthesis.
  chapter: "00-04"
- term: Testbench
  definition: Simulation-only code that instantiates a design, applies inputs and checks outputs; the executable form of a design's specification.
  chapter: "00-04"
  see_also: [Self-checking testbench]
- term: Self-checking testbench
  definition: A testbench that compares the design's outputs with independently computed expected values and reports pass or fail automatically, rather than relying on a human reading waveforms.
  chapter: "00-04"
- term: Functional coverage
  definition: A measure of which specified behaviors, input combinations or corner cases a verification run has actually exercised; used to decide when verification is complete.
  chapter: "00-04"
- term: Formal verification
  definition: Using mathematical proof (model checking, equivalence checking) to show that a design satisfies a property for all possible inputs, instead of testing examples.
  chapter: "00-04"
- term: Machine epsilon
  definition: The gap between 1 and the next representable floating-point number, 2^−52 ≈ 2.22×10^−16 for IEEE 754 double precision; the relative precision of a computation.
  chapter: "00-04"
- term: Catastrophic cancellation
  definition: The loss of significant digits when subtracting two nearly equal floating-point numbers; avoided by algebraic rearrangement or series expansion.
  chapter: "00-04"
- term: Electronic design automation (EDA)
  definition: The software used to design and verify chips and boards, covering simulation, synthesis, place-and-route, timing and verification; dominated commercially by Synopsys, Cadence and Siemens EDA.
  chapter: "00-04"

# ---------------------------------------------------------------- 00-03
- term: Retrieval practice
  definition: Learning by actively recalling information (self-testing, solving problems) rather than re-reading it; the "testing effect" is among the most robust findings in learning science.
  chapter: "00-03"
- term: Spacing effect
  definition: The finding that practice distributed over time produces more durable learning than the same practice massed together; the best gap grows with how long the material must be retained.
  chapter: "00-03"
  see_also: [Spaced repetition]
- term: Interleaving
  definition: Mixing different problem types within a practice session, which forces choosing the method and improves later performance even though it feels harder during practice.
  chapter: "00-03"
- term: Illusion of competence
  definition: The mistaken feeling of mastery produced by recognizing familiar material (for example, while re-reading a solution), as opposed to being able to recall and apply it unaided.
  chapter: "00-03"
- term: Spaced repetition
  definition: A review method, often implemented in flashcard software such as Anki, that schedules each item at expanding intervals just before it would be forgotten.
  chapter: "00-03"
- term: Dimensional analysis
  definition: Checking that every term of an equation has the same physical units (and that arguments of exp, log and trig functions are dimensionless) to catch errors and derive relationships.
  chapter: "00-03"
- term: SI base units
  definition: The seven base units of the International System of Units (kg, m, s, A, K, mol, cd), from which all others, including V, Ω, F and H, are derived.
  chapter: "00-03"
- term: Fermi estimate
  definition: An order-of-magnitude estimate built from rounded assumptions and simple multiplication, used to sanity-check calculations and claims.
  chapter: "00-03"
- term: Error log
  definition: A running record of every mistake, its cause and the rule that prevents it, used to target review and to avoid repeating errors.
  chapter: "00-03"

# ---------------------------------------------------------------- 00-01
- term: Electrical engineering
  definition: The discipline of using electricity and electromagnetism to move and convert energy and to sense, move, store and process information.
  chapter: "00-01"
- term: Energy per bit
  definition: The energy (typically pJ/bit) consumed to move, store or process one bit; power = energy per bit × data rate. A key efficiency metric for links, memories and accelerators.
  chapter: "00-01"
- term: Watt-hour
  definition: A unit of energy equal to one watt for one hour, 3600 J; battery energy in Wh = capacity in Ah × voltage.
  chapter: "00-01"
- term: Performance, power, area (PPA)
  definition: The three primary metrics traded off in chip design, almost always considered together with cost and schedule.
  chapter: "00-01"
- term: Landauer limit
  definition: The minimum energy to erase one bit of information, kT ln 2 (about 2.9×10^−21 J at 300 K); practical logic uses orders of magnitude more.
  chapter: "00-01"
- term: Shannon capacity
  definition: The maximum error-free data rate of a channel with bandwidth B and signal-to-noise ratio SNR, C = B log2(1 + SNR).
  chapter: "00-01"
- term: Decibel
  definition: A logarithmic ratio, 10·log10 of a power ratio (or 20·log10 of an amplitude ratio for equal impedances); 3 dB ≈ 2× power, 10 dB = 10× power.
  chapter: "00-01"
- term: Fabless
  definition: A chip company that designs chips but outsources manufacturing to foundries (and assembly and test to OSATs).
  chapter: "00-01"
  see_also: [Foundry]
- term: Foundry
  definition: A company that manufactures chips designed by its customers, supplying them with a process and its PDK.
  chapter: "00-01"
- term: Integrated device manufacturer (IDM)
  definition: A chip company that both designs and manufactures its own chips in its own fabs.
  chapter: "00-01"
- term: OSAT
  definition: Outsourced semiconductor assembly and test, a company that packages and tests chips for others.
  chapter: "00-01"
- term: Total addressable market (TAM)
  definition: The total revenue opportunity for a product if it won every possible customer; credible only when rebuilt bottom-up from units, attach rates and prices.
  chapter: "00-01"

# ---------------------------------------------------------------- 00-05
- term: Tapeout
  definition: The milestone at which a chip's final design database is sent to manufacturing to make masks; after it, design changes require new masks and another fab cycle.
  chapter: "00-05"
  see_also: [Respin]
- term: RTL
  definition: Register-transfer level, the description of digital logic in an HDL (Verilog/SystemVerilog) as registers and the logic between them, from which synthesis produces gates.
  chapter: "00-05"
- term: Design verification
  definition: The engineering function (and activity) of demonstrating, before tapeout, that a design's RTL implements its specification, using simulation, coverage, formal methods and emulation.
  chapter: "00-05"
- term: Physical design
  definition: Converting synthesized logic into a manufacturable layout (floorplanning, placement, clock-tree synthesis, routing) and closing timing, power and design-rule signoff.
  chapter: "00-05"
- term: Design for test (DFT)
  definition: Design features (scan chains, built-in self-test, test access) that make manufactured chips testable for defects at low cost.
  chapter: "00-05"
- term: Stepping
  definition: A silicon revision of a chip (e.g., A0, A1, B0); commonly the number changes for metal-only revisions and the letter for full-layer revisions, though conventions vary.
  chapter: "00-05"
- term: Respin
  definition: A new manufacturing pass of a chip with corrected masks after a bug or shortfall is found in silicon, either metal-only or full-layer.
  chapter: "00-05"
- term: Engineering change order (ECO)
  definition: A late design change made with minimal disruption, often by rewiring spare gates through metal-layer changes only.
  chapter: "00-05"
- term: First-silicon success
  definition: A chip's first manufactured version (A0) being functionally correct and shippable without a respin; reported for a minority of IC/ASIC projects in industry surveys.
  chapter: "00-05"
- term: Wafer cycle time
  definition: The time a wafer spends in the fab from start to finish, roughly 1–1.5 days per mask layer and 14–20 weeks for advanced processes.
  chapter: "00-05"
- term: Non-recurring engineering (NRE)
  definition: One-time costs of developing a product (design labor, EDA tools, IP licenses, masks, prototypes), as opposed to per-unit manufacturing cost.
  chapter: "00-05"
- term: Emulation
  definition: Running a chip design on specialized hardware (emulators or FPGA prototypes) thousands to millions of times faster than simulation, so software can run before tapeout.
  chapter: "00-05"
- term: Triangular distribution
  definition: A probability distribution defined by a minimum, most-likely and maximum value, with mean (a + m + b)/3; a simple model of skewed task-duration risk.
  chapter: "00-05"

# ---------------------------------------------------------------- 01-01
- term: Function
  definition: A rule that assigns exactly one output to each allowed input; in engineering both input and output usually carry units (for example voltage as a function of time).
  chapter: "01-01"
  see_also: [Domain and range, Inverse function]
- term: Domain and range
  definition: The domain is the set of allowed inputs of a function; the range is the set of outputs it can produce.
  chapter: "01-01"
- term: Inverse function
  definition: The function that undoes a one-to-one function, so that f⁻¹(f(x)) = x; for example ln undoes exp. Solving an equation for a variable applies an inverse.
  chapter: "01-01"
- term: Power law
  definition: A relation y = kxⁿ; doubling x multiplies y by 2ⁿ, and on log-log axes it is a straight line with slope n.
  chapter: "01-01"
  see_also: [Log-log plot]
- term: Exponential function
  definition: The function eˣ (e ≈ 2.71828), whose rate of change equals its value; physical decays are written y₀e^(−t/τ) with time constant τ.
  chapter: "01-01"
  see_also: [Natural logarithm, Half-life]
- term: Natural logarithm
  definition: ln y, the inverse of eˣ, defined for y > 0; it turns products into sums, ln(ab) = ln a + ln b.
  chapter: "01-01"
- term: Half-life
  definition: The time for an exponentially decaying quantity to halve, τ ln 2 ≈ 0.693τ; for growth the same expression is the doubling time.
  chapter: "01-01"
- term: dBm
  definition: Power expressed in decibels relative to 1 mW, 10·log10(P / 1 mW); 0 dBm = 1 mW and 30 dBm = 1 W.
  chapter: "01-01"
  see_also: [Decibel]
- term: Radian
  definition: The angle that subtends an arc equal to the radius; 2π rad = 360° and 1 rad ≈ 57.30°. Calculus formulas for sin and cos hold only in radians.
  chapter: "01-01"
- term: Semilog plot
  definition: A graph with one logarithmic axis (usually the vertical); an exponential function plots as a straight line on it.
  chapter: "01-01"
- term: Log-log plot
  definition: A graph with both axes logarithmic; a power law y = kxⁿ plots as a straight line of slope n.
  chapter: "01-01"
- term: Thermal voltage
  definition: V_T = kT/q, the voltage scale of thermal energy per unit charge; about 25.85 mV at 300 K. It sets the ~60 mV/decade slope of diode and subthreshold transistor currents.
  chapter: "01-01"
- term: Dynamic voltage and frequency scaling (DVFS)
  definition: Lowering supply voltage and clock frequency together when full performance is not needed; because dynamic power scales roughly as V²f, power falls roughly as the cube of voltage.
  chapter: "01-01"
- term: Link margin
  definition: Received power minus receiver sensitivity, in dB; the extra loss a radio link can tolerate before it fails.
  chapter: "01-01"

# ---------------------------------------------------------------- 01-02
- term: Limit
  definition: The value L that f(x) approaches as x approaches a (without equaling a), written lim_{x→a} f(x) = L; the value f(a) itself plays no role.
  chapter: "01-02"
  see_also: [One-sided limit, Continuity]
- term: One-sided limit
  definition: A limit taken from one side only, x → a⁻ (from below) or x → a⁺ (from above). Circuit analysis writes v(0⁻) and v(0⁺) for the values just before and just after a switching instant.
  chapter: "01-02"
- term: Indeterminate form
  definition: An expression such as 0/0, ∞/∞ or ∞ − ∞ whose form alone does not determine a limit; it must be resolved by algebra, standard limits or L'Hôpital's rule.
  chapter: "01-02"
- term: Squeeze theorem
  definition: If g(x) ≤ f(x) ≤ h(x) near a and g and h share the limit L, then f also tends to L. Used to prove sin θ/θ → 1.
  chapter: "01-02"
- term: Continuity
  definition: f is continuous at a if f(a) is defined, the limit at a exists, and the two are equal; informally, the graph can be drawn without lifting the pen.
  chapter: "01-02"
- term: Removable discontinuity
  definition: A point where a function's limit exists but its value is missing or different; redefining the value as the limit removes it (for example sin x/x at 0).
  chapter: "01-02"
- term: Jump discontinuity
  definition: A point where both one-sided limits exist but differ, as for the unit step at t = 0 or a capacitor's current at a switching instant.
  chapter: "01-02"
- term: Intermediate value theorem
  definition: A continuous function on [a, b] takes every value between f(a) and f(b); in particular, a sign change guarantees a root in between.
  chapter: "01-02"
  see_also: [Bisection method]
- term: Bisection method
  definition: Root finding by repeatedly halving a bracket that contains a sign change; after n steps the bracket width is (b − a)/2ⁿ, about 3.3 steps per decimal digit, and it cannot fail once a bracket is found.
  chapter: "01-02"
- term: Asymptote
  definition: A line that a curve approaches in a limit, horizontal (x → ∞), vertical (f → ±∞ at a finite x) or slanted; Bode-plot straight lines are asymptotes of a frequency response.
  chapter: "01-02"
- term: Difference quotient
  definition: The slope (f(a + h) − f(a))/h of the secant line through two nearby points; its limit as h → 0 is the derivative.
  chapter: "01-02"
- term: Unit step function
  definition: u(t), equal to 0 for t < 0 and 1 for t ≥ 0; it models a switch closing at t = 0 and has a jump discontinuity there.
  chapter: "01-02"
- term: Sinc function
  definition: sin(x)/x (sometimes normalized as sin(πx)/(πx)); its removable discontinuity at 0 is filled with the limit 1. It appears throughout sampling and Fourier analysis.
  chapter: "01-02"
- term: Amdahl's law
  definition: Speedup on N processors is 1/((1 − p) + p/N) when a fraction p of the work parallelizes; as N → ∞ it approaches 1/(1 − p), so the serial fraction caps scaling.
  chapter: "01-02"

# ---------------------------------------------------------------- 01-03
- term: Derivative
  definition: The instantaneous rate of change f'(a) = lim_{h→0} (f(a + h) − f(a))/h, the slope of the tangent line; its units are the output's units per input unit.
  chapter: "01-03"
  see_also: [Difference quotient, Differentiable]
- term: Differentiable
  definition: Having a derivative at a point; differentiability implies continuity, but not conversely (|x| is continuous with a corner at 0).
  chapter: "01-03"
- term: Power rule
  definition: d/dx xⁿ = n xⁿ⁻¹, valid for every real exponent n (for x > 0).
  chapter: "01-03"
- term: Product rule
  definition: (fg)' = f'g + fg'; the derivative of a product has one term for each factor's change.
  chapter: "01-03"
- term: Quotient rule
  definition: (f/g)' = (f'g − fg')/g², valid where g ≠ 0.
  chapter: "01-03"
- term: Chain rule
  definition: (f(g(x)))' = f'(g(x))·g'(x); rates of nested quantities multiply, as in d/dt sin(ωt) = ω cos(ωt).
  chapter: "01-03"
- term: Implicit differentiation
  definition: Differentiating both sides of an equation that defines y in terms of x, treating y as a function of x; used to differentiate ln x, arctan x and curves such as circles.
  chapter: "01-03"
- term: Second derivative
  definition: The derivative of the derivative, f''(x) or d²y/dx²; it measures curvature (concavity) and, for position, acceleration.
  chapter: "01-03"
- term: Elasticity (sensitivity)
  definition: The dimensionless ratio of relative changes, S = d ln y / d ln x = (x/y)(dy/dx); for y = kxⁿ it equals n. Engineers call it sensitivity, economists elasticity.
  chapter: "01-03"
- term: Slew rate
  definition: The maximum rate of change dv/dt an amplifier's output can produce, usually in V/µs; it limits the full-power bandwidth to SR/(2πV_p).
  chapter: "01-03"
- term: Small-signal conductance
  definition: The slope dI/dV of a nonlinear device's I–V curve at its operating point; for a diode g_d ≈ I/V_T, so r_d = V_T/I ≈ 26 Ω at 1 mA.
  chapter: "01-03"
- term: Central difference
  definition: The numerical derivative (f(x + h) − f(x − h))/(2h), whose truncation error falls as h² rather than h.
  chapter: "01-03"

# ---------------------------------------------------------------- 01-04
- term: Critical point
  definition: A point where f'(x) = 0 or f' does not exist; interior maxima and minima occur only at critical points (Fermat's theorem).
  chapter: "01-04"
- term: Second derivative test
  definition: At a critical point, f'' < 0 indicates a local maximum and f'' > 0 a local minimum; f'' = 0 is inconclusive. The size of f'' measures how sharp the optimum is.
  chapter: "01-04"
- term: Mean value theorem
  definition: For f continuous on [a, b] and differentiable inside, f'(c) = (f(b) − f(a))/(b − a) for some c in (a, b); hence a bound on |f'| bounds the change of f.
  chapter: "01-04"
- term: Maximum power transfer
  definition: A source of resistance R_s delivers the most power to a load R_L = R_s, namely V_s²/(4R_s), at only 50 % efficiency; used for weak signals (RF, sensors), never for power delivery.
  chapter: "01-04"
- term: Linearization
  definition: Replacing a function near a point by its tangent line, L(x) = f(a) + f'(a)(x − a); the error grows as the square of the distance from a.
  chapter: "01-04"
  see_also: [Small-signal model]
- term: Small-signal model
  definition: A linear model of a nonlinear device valid for small deviations about a DC operating point, built from slopes such as g_d = dI/dV or a transistor's g_m.
  chapter: "01-04"
- term: Root sum of squares (RSS)
  definition: Combining independent error contributions as the square root of the sum of their squares; less pessimistic than adding them worst-case.
  chapter: "01-04"
- term: Newton's method
  definition: Root finding by repeatedly solving the tangent-line approximation, x_{k+1} = x_k − f(x_k)/f'(x_k); converges quadratically near a simple root but can diverge from a poor start.
  chapter: "01-04"
  see_also: [Newton–Raphson method, Quadratic convergence]
- term: Quadratic convergence
  definition: Convergence in which each error is proportional to the square of the previous one, so the number of correct digits roughly doubles per step.
  chapter: "01-04"
- term: Related rates
  definition: Rates of change linked by differentiating a relationship among quantities with respect to time, for example i = V dC/dt for a moving-plate capacitor.
  chapter: "01-04"
- term: L'Hopital's rule
  definition: For 0/0 or ∞/∞ forms, lim f/g = lim f'/g' when the latter exists (named for L'Hôpital); other indeterminate forms are first rewritten as quotients.
  chapter: "01-04"
- term: Minimum-energy point
  definition: The supply voltage at which a digital circuit's energy per operation is smallest, where falling switching energy balances rising leakage energy; typically a few hundred millivolts in subthreshold CMOS.
  chapter: "01-04"
