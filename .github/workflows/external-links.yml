name: External links

# External URLs rot. This scheduled job reports dead external links without
# blocking pushes. Internal links are checked strictly in ci.yml.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --exclude-path site --exclude-path docs
            --accept 200,206,403,429
            "**/*.md"
          fail: false
